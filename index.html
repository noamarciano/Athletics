/* ============================== app shell ============================== */
function App(){
  const [state, setState] = useState(load);
  const stateRef = useRef(state); stateRef.current = state;
  const [tab, setTab] = useState('home');
  const [week, setWeek] = useState(() => weekStartISO(new Date()));
  const [openTpl, setOpenTpl] = useState(null);
  const [sync, setSync] = useState({ status: localStorage.getItem(TOKEN_KEY) ? 'ok' : 'off', msg:'', at:0 });
  const [stravaUi, setStravaUi] = useState({ status:'idle', msg:'' });
  const pushTimer = useRef(null);
  const syncingRef = useRef(false);
  const lastSyncRef = useRef(0);

  const schedulePush = useCallback(() => {
    if (!localStorage.getItem(TOKEN_KEY)) return;
    setSync(s => (s.status === 'syncing' ? s : { ...s, status:'pending' }));
    clearTimeout(pushTimer.current);
    pushTimer.current = setTimeout(() => syncNow(true), 2500);
  }, []);

  const mutate = useCallback((fn, stamp) => {
    const d = clone(stateRef.current);
    fn(d);
    const t = Date.now();
    if (stamp === 'templates') d.stamps.templates = t;
    else if (stamp === 'meals') d.stamps.meals = t;
    else if (stamp === 'settings') d.stamps.settings = t;
    else if (Array.isArray(stamp) && stamp[0] === 'week') d.stamps.weeks[stamp[1]] = t;
    stateRef.current = d; persist(d); setState(d); schedulePush();
  }, [schedulePush]);

  const replaceState = useCallback(d => {
    d = normalize(clone(d));
    const t = Date.now();
    d.stamps.templates = t; d.stamps.meals = t; d.stamps.settings = t;
    stateRef.current = d; persist(d); setState(d); schedulePush();
  }, [schedulePush]);

  /* ---------- github gist sync ---------- */
  async function gh(path, opts){
    opts = opts || {};
    const token = localStorage.getItem(TOKEN_KEY);
    const headers = { 'Authorization':'Bearer ' + token, 'Accept':'application/vnd.github+json' };
    if (opts.body) headers['Content-Type'] = 'application/json';
    const res = await fetch('https://api.github.com' + path, { method: opts.method || 'GET', headers, body: opts.body });
    if (!res.ok) {
      let t = ''; try { t = (await res.json()).message || ''; } catch (e) {}
      throw new Error('GitHub ' + res.status + (t ? ' · ' + t : ''));
    }
    return res.status === 204 ? null : res.json();
  }

  async function uploadPendingPhotos(st){
    for (const p of st.photos) {
      if (p.gistId) continue;
      try {
        const full = await idb.get(p.id);
        if (!full) continue;
        const created = await gh('/gists', { method:'POST', body: JSON.stringify({ description:'ATHLETICS_PHOTO ' + p.id, public:false, files:{ [PHOTO_FILE]:{ content: full } } }) });
        p.gistId = created.id;
        p.updatedAt = Date.now();
      } catch (e) {}
    }
  }

  async function syncNow(silent){
    const token = localStorage.getItem(TOKEN_KEY);
    if (!token) { setSync({ status:'off', msg:'', at:0 }); return; }
    if (syncingRef.current) return;
    syncingRef.current = true;
    setSync(s => ({ ...s, status:'syncing' }));
    try {
      let st = stateRef.current;
      let gid = st.settings.gistId;
      if (!gid) {
        const gists = await gh('/gists?per_page=100');
        const found = gists.find(g => g.description === GIST_DESC || (g.files && g.files[GIST_FILE]));
        if (found) gid = found.id;
      }
      if (!gid) {
        const withPhotos = clone(stateRef.current);
        await uploadPendingPhotos(withPhotos);
        const created = await gh('/gists', { method:'POST', body: JSON.stringify({ description: GIST_DESC, public:false, files:{ [GIST_FILE]:{ content: JSON.stringify(withPhotos) } } }) });
        withPhotos.settings.gistId = created.id;
        stateRef.current = withPhotos; persist(withPhotos); setState(withPhotos);
      } else {
        const g = await gh('/gists/' + gid);
        let remote = null;
        const file = g.files && g.files[GIST_FILE];
        if (file) {
          let content = file.content;
          if (file.truncated) content = await (await fetch(file.raw_url)).text();
          try { remote = JSON.parse(content); } catch (e) {}
        }
        let merged = remote ? mergeStates(stateRef.current, remote) : clone(stateRef.current);
        merged.settings.gistId = gid;
        await uploadPendingPhotos(merged);
        stateRef.current = merged; persist(merged); setState(merged);
        await gh('/gists/' + gid, { method:'PATCH', body: JSON.stringify({ files:{ [GIST_FILE]:{ content: JSON.stringify(merged) } } }) });
      }
      lastSyncRef.current = Date.now();
      setSync({ status:'ok', msg:'', at: Date.now() });
    } catch (e) {
      setSync({ status:'error', msg: String(e.message || e).slice(0, 200), at: Date.now() });
    } finally {
      syncingRef.current = false;
    }
  }

  /* ---------- photos ---------- */
  async function addPhoto(file){
    try {
      const full = await fileToDataUrl(file, 1000, .72);
      const thumb = await shrinkDataUrl(full, 260, .6);
      const id = uid();
      await idb.set(id, full).catch(() => {});
      mutate(d => { d.photos.push({ id, date: toISO(new Date()), thumb, gistId: null, updatedAt: Date.now() }); });
    } catch (e) { alert('שגיאה בטעינת התמונה'); }
  }
  async function loadPhoto(p){
    const local = await idb.get(p.id).catch(() => null);
    if (local) return local;
    if (p.gistId && localStorage.getItem(TOKEN_KEY)) {
      const g = await gh('/gists/' + p.gistId);
      const f = g.files && g.files[PHOTO_FILE];
      if (f) {
        let c = f.content;
        if (f.truncated) c = await (await fetch(f.raw_url)).text();
        idb.set(p.id, c).catch(() => {});
        return c;
      }
    }
    return null;
  }
  function delPhoto(p){
    if (!confirm('למחוק את התמונה?')) return;
    mutate(d => { d.photos = d.photos.filter(x => x.id !== p.id); if (d.deletedPhotos.indexOf(p.id) < 0) d.deletedPhotos.push(p.id); });
    idb.del(p.id).catch(() => {});
    if (p.gistId && localStorage.getItem(TOKEN_KEY)) gh('/gists/' + p.gistId, { method:'DELETE' }).catch(() => {});
  }

  /* ---------- strava ---------- */
  async function stravaTokenReq(body){
    const r = await fetch('https://www.strava.com/api/v3/oauth/token', { method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify(body) });
    if (!r.ok) { let m = ''; try { m = JSON.stringify(await r.json()).slice(0, 120); } catch (e) {} throw new Error('Strava ' + r.status + ' ' + m); }
    return r.json();
  }
  function stravaConnect(){
    const sv = stateRef.current.settings.strava || {};
    if (!sv.clientId || !sv.clientSecret) { alert('מלא Client ID ו-Client Secret'); return; }
    const redirect = location.origin + location.pathname;
    localStorage.setItem('athletics.strava.pending', '1');
    location.href = 'https://www.strava.com/oauth/authorize?client_id=' + encodeURIComponent(sv.clientId)
      + '&redirect_uri=' + encodeURIComponent(redirect)
      + '&response_type=code&approval_prompt=auto&scope=activity:read_all';
  }
  function stravaDisconnect(){
    if (!confirm('לנתק את סטרבה? (הריצות שכבר יובאו יישארו)')) return;
    mutate(d => { d.settings.strava = { clientId: (d.settings.strava || {}).clientId || '', clientSecret: (d.settings.strava || {}).clientSecret || '' }; }, 'settings');
    setStravaUi({ status:'idle', msg:'' });
  }
  async function ensureStravaToken(){
    const sv = stateRef.current.settings.strava;
    if (!sv || !sv.refreshToken) return null;
    if ((sv.expiresAt || 0) * 1000 - 60000 > Date.now()) return sv.accessToken;
    const j = await stravaTokenReq({ client_id: sv.clientId, client_secret: sv.clientSecret, grant_type:'refresh_token', refresh_token: sv.refreshToken });
    mutate(d => { d.settings.strava = Object.assign({}, d.settings.strava, { accessToken: j.access_token, refreshToken: j.refresh_token || sv.refreshToken, expiresAt: j.expires_at }); }, 'settings');
    return j.access_token;
  }
  async function stravaImport(silent){
    if (!silent) setStravaUi({ status:'syncing', msg:'מייבא ריצות מסטרבה...' });
    try {
      const at = await ensureStravaToken();
      if (!at) { if (!silent) setStravaUi({ status:'error', msg:'לא מחובר לסטרבה' }); return; }
      const dead = new Set(stateRef.current.deletedRuns);
      const have = new Set(stateRef.current.runs.map(r => r.id));
      const news = [];
      let page = 1;
      while (page <= 3) {
        const r = await fetch('https://www.strava.com/api/v3/athlete/activities?per_page=100&page=' + page, { headers:{ Authorization:'Bearer ' + at } });
        if (!r.ok) throw new Error('Strava ' + r.status);
        const acts = await r.json();
        acts.forEach(a => {
          const t = String(a.sport_type || a.type || '');
          if (!/run/i.test(t)) return;
          const id = 'sv' + a.id;
          if (have.has(id) || dead.has(id)) return;
          const date = String(a.start_date_local || a.start_date || '').slice(0, 10);
          if (!date) return;
          news.push({ id, date, title: a.name || 'Strava Run', km: Math.round(a.distance / 10) / 100, sec: Math.round(a.moving_time || 0), src:'strava', updatedAt: Date.now() });
        });
        if (acts.length < 100) break;
        page++;
      }
      if (news.length) mutate(d => { d.runs = news.concat(d.runs); });
      localStorage.setItem('athletics.strava.last', String(Date.now()));
      setStravaUi({ status:'ok', msg: news.length ? ('יובאו ' + news.length + ' ריצות חדשות ✓') : 'הכל מעודכן — אין ריצות חדשות ✓' });
    } catch (e) {
      setStravaUi({ status:'error', msg: String(e.message || e).slice(0, 160) });
    }
  }

  /* ---------- lifecycle ---------- */
  useEffect(() => {
    /* one-tap token handoff: opening the app with #gh=<token> stores the sync
       token on this device and immediately cleans it out of the address bar.
       The token itself never lives in this file or in the repo. */
    try {
      if (location.hash && location.hash.indexOf('gh=') !== -1) {
        const m = location.hash.match(/gh=([A-Za-z0-9_-]+)/);
        if (m) {
          localStorage.setItem(TOKEN_KEY, m[1]);
          history.replaceState({}, '', location.pathname + location.search);
        }
      }
    } catch (e) {}
    if (localStorage.getItem(TOKEN_KEY)) syncNow(true);
    const q = new URLSearchParams(location.search);
    const code = q.get('code');
    if (code && localStorage.getItem('athletics.strava.pending')) {
      localStorage.removeItem('athletics.strava.pending');
      history.replaceState({}, '', location.pathname);
      setTab('settings');
      (async () => {
        try {
          const sv = stateRef.current.settings.strava || {};
          const j = await stravaTokenReq({ client_id: sv.clientId, client_secret: sv.clientSecret, code, grant_type:'authorization_code' });
          mutate(d => {
            d.settings.strava = Object.assign({}, d.settings.strava, {
              accessToken: j.access_token, refreshToken: j.refresh_token, expiresAt: j.expires_at,
              athlete: j.athlete ? ((j.athlete.firstname || '') + ' ' + (j.athlete.lastname || '')).trim() : ''
            });
          }, 'settings');
          setStravaUi({ status:'ok', msg:'סטרבה חוברה בהצלחה ✓ מייבא ריצות...' });
          stravaImport(false);
        } catch (e) {
          setStravaUi({ status:'error', msg:'החיבור נכשל: ' + String(e.message || e).slice(0, 120) });
        }
      })();
    } else if (code) {
      history.replaceState({}, '', location.pathname);
    } else {
      const sv = stateRef.current.settings.strava;
      const last = Number(localStorage.getItem('athletics.strava.last') || 0);
      if (sv && sv.refreshToken && Date.now() - last > 6 * 3600 * 1000) stravaImport(true);
    }
    const onVis = () => {
      if (document.visibilityState === 'visible' && localStorage.getItem(TOKEN_KEY) && Date.now() - lastSyncRef.current > 15000) syncNow(true);
    };
    document.addEventListener('visibilitychange', onVis);
    return () => document.removeEventListener('visibilitychange', onVis);
  }, []);

  const isCur = week === weekStartISO(new Date());
  const dotColor = { off:'bg-white/20', pending:'bg-ember', syncing:'bg-ember', ok:'bg-volt', error:'bg-red-500' }[sync.status] || 'bg-white/20';
  const showWeekBar = tab === 'workouts' || tab === 'runs' || tab === 'food';

  const TABS = [
    { id:'home',     label:'בית',      icon:I.home },
    { id:'food',     label:'תזונה',    icon:I.clipboard },
    { id:'workouts', label:'אימונים',  icon:I.dumbbell },
    { id:'runs',     label:'ריצה',     icon:I.activity },
    { id:'progress', label:'התקדמות', icon:I.trend },
    { id:'calendar', label:'יומן',     icon:I.calendar },
  ];

  const goTo = (iso, t, tplId) => {
    setWeek(weekStartISO(fromISO(iso)));
    setOpenTpl(tplId || null);
    setTab(t);
  };

  return (
    <div className="min-h-screen">
      <div className="fixed inset-0 pointer-events-none overflow-hidden" style={{ zIndex:-1 }}>
        <div className="absolute -top-32 -end-32 w-96 h-96 rounded-full" style={{ background:'radial-gradient(circle,#CCFF00,transparent 70%)', opacity:.07 }}></div>
        <div className="absolute top-1/2 -start-40 w-96 h-96 rounded-full" style={{ background:'radial-gradient(circle,#FF5A1F,transparent 70%)', opacity:.05 }}></div>
      </div>

      <header className="sticky top-0 z-40 bg-obsidian/85 border-b border-white/5" style={{ paddingTop:'env(safe-area-inset-top)', backdropFilter:'blur(24px)', WebkitBackdropFilter:'blur(24px)' }}>
        <div className="max-w-xl mx-auto px-4 pt-3 pb-2.5">
          <div className="flex items-center justify-between">
            <button onClick={() => setTab('home')} className="flex items-center gap-2.5 active:scale-[.98] transition">
              <div className="w-9 h-9 rounded-xl bg-volt flex items-center justify-center glow-volt">
                <Icon d={I.bolt} className="w-5 h-5 text-obsidian" filled/>
              </div>
              <div className="text-start">
                <div className="font-black italic text-xl tracking-tight leading-none">ATHLETICS</div>
                <div className="text-[9px] text-white/35 tracking-[.35em] font-bold mt-0.5">LEAN BULK ENGINE</div>
              </div>
            </button>
            <button onClick={() => setTab('settings')} className="relative w-10 h-10 rounded-2xl bg-white/5 border border-white/10 flex items-center justify-center active:scale-90 transition">
              <Icon d={I.gear} className={'w-5 h-5 ' + (tab === 'settings' ? 'text-volt' : 'text-white/50')}/>
              <span className={'absolute top-1 end-1 w-2 h-2 rounded-full ' + dotColor + (sync.status === 'syncing' || sync.status === 'pending' ? ' animate-pulse' : '')}></span>
            </button>
          </div>

          {showWeekBar && (
            <div className="mt-3 flex items-center justify-between glass rounded-2xl px-2 py-1.5">
              <button onClick={() => setWeek(addDays(week, -7))} className="w-10 h-10 rounded-xl bg-white/5 active:scale-90 transition flex items-center justify-center">
                <Icon d={I.chevR} className="w-5 h-5 text-white/60"/>
              </button>
              <button onClick={() => setWeek(weekStartISO(new Date()))} className="text-center active:scale-95 transition px-2">
                <div className="font-black text-lg leading-none">
                  שבוע {weekNum(week)}
                  {!isCur && <span className="text-ember text-xs font-bold ms-1.5">· ארכיון</span>}
                </div>
                <div className="text-[10px] text-white/40 mt-1">
                  {weekRangeLabel(week)}{!isCur && ' · לחץ לחזרה להיום'}
                </div>
              </button>
              <button onClick={() => setWeek(addDays(week, 7))} className="w-10 h-10 rounded-xl bg-white/5 active:scale-90 transition flex items-center justify-center">
                <Icon d={I.chevL} className="w-5 h-5 text-white/60"/>
              </button>
            </div>
          )}
        </div>
      </header>

      <main className="max-w-xl mx-auto px-4 pt-4" style={{ paddingBottom:'calc(110px + env(safe-area-inset-bottom))' }}>
        {tab === 'home' && <Dashboard state={state} setTab={setTab} setOpenTpl={setOpenTpl} setWeek={setWeek}/>}
        {tab === 'workouts' && <WorkoutsTab state={state} week={week} mutate={mutate} openTpl={openTpl} setOpenTpl={setOpenTpl}/>}
        {tab === 'runs' && <RunsTab state={state} week={week} mutate={mutate} stravaConnected={!!(state.settings.strava && state.settings.strava.refreshToken)} onOpenSettings={() => setTab('settings')}/>}
        {tab === 'food' && <NutritionTab state={state} week={week} mutate={mutate}/>}
        {tab === 'progress' && <ProgressTab state={state} mutate={mutate} loadPhoto={loadPhoto} addPhoto={addPhoto} delPhoto={delPhoto}/>}
        {tab === 'calendar' && <CalendarTab state={state} goTo={goTo}/>}
        {tab === 'settings' && <SettingsTab state={state} sync={sync} syncNow={syncNow} replaceState={replaceState} mutate={mutate}
                                            stravaUi={stravaUi} stravaConnect={stravaConnect} stravaDisconnect={stravaDisconnect} stravaImport={stravaImport}
                                            onBack={() => setTab('home')}/>}
      </main>

      <nav className="fixed bottom-0 inset-x-0 z-40 bg-obsidian/90 border-t border-white/5" style={{ backdropFilter:'blur(24px)', WebkitBackdropFilter:'blur(24px)' }}>
        <div className="max-w-xl mx-auto grid grid-cols-6 px-1 pt-1.5" style={{ paddingBottom:'max(env(safe-area-inset-bottom), 10px)' }}>
          {TABS.map(t => {
            const active = tab === t.id;
            return (
              <button key={t.id} onClick={() => { setTab(t.id); if (t.id !== 'workouts') setOpenTpl(null); }}
                      className="flex flex-col items-center gap-0.5 py-1 select-none active:scale-95 transition">
                <div className={active ? 'text-volt' : 'text-white/35'}>
                  <Icon d={t.icon} className="w-6 h-6"/>
                </div>
                <span className={'text-[10px] font-bold ' + (active ? 'text-volt' : 'text-white/35')}>{t.label}</span>
                <span className={'w-1 h-1 rounded-full ' + (active ? 'bg-volt glow-volt' : 'bg-transparent')}></span>
              </button>
            );
          })}
        </div>
      </nav>
    </div>
  );
}

class ErrorBoundary extends React.Component {
  constructor(p){ super(p); this.state = { err:null }; }
  static getDerivedStateFromError(e){ return { err:e }; }
  render(){
    if (this.state.err) return (
      <div style={{ padding:24, direction:'ltr', fontFamily:'monospace', fontSize:12, color:'#f87171' }}>
        App error: {String(this.state.err && this.state.err.message || this.state.err)}
      </div>
    );
    return this.props.children;
  }
}

ReactDOM.createRoot(document.getElementById('root')).render(<ErrorBoundary><App/></ErrorBoundary>);
</script>
</body>
</html>
