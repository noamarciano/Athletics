const clone = o => (typeof structuredClone === 'function' ? structuredClone(o) : JSON.parse(JSON.stringify(o)));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const pad2 = n => String(n).padStart(2, '0');
const numOr0 = v => { const n = parseFloat(v); return isNaN(n) ? 0 : n; };

function toISO(d){ return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate()); }
function fromISO(s){ const p = s.split('-').map(Number); return new Date(p[0], p[1]-1, p[2]); }
function weekStartISO(d){ const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - x.getDay()); return toISO(x); }
function addDays(iso, n){ const d = fromISO(iso); d.setDate(d.getDate() + n); return toISO(d); }
function weekNum(ws){
  const d = fromISO(ws);
  const mid = new Date(d); mid.setDate(mid.getDate() + 3);
  const jan1 = new Date(mid.getFullYear(), 0, 1);
  const firstSun = new Date(jan1); firstSun.setDate(jan1.getDate() - jan1.getDay());
  return Math.round((d - firstSun) / (7 * DAY)) + 1;
}
function weekRangeLabel(ws){
  const a = fromISO(ws), b = fromISO(addDays(ws, 6));
  const f = d => d.getDate() + '.' + (d.getMonth() + 1);
  return f(a) + ' – ' + f(b) + ' · ' + b.getFullYear();
}
function heDate(iso){ const d = fromISO(iso); return DAYS_FULL[d.getDay()] + ' · ' + d.getDate() + '.' + (d.getMonth()+1) + '.' + d.getFullYear(); }
function fmtPace(spk){
  if (!isFinite(spk) || spk <= 0) return '—';
  let m = Math.floor(spk / 60), s = Math.round(spk % 60);
  if (s === 60) { m++; s = 0; }
  return m + ':' + pad2(s);
}
function fmtDur(sec){
  sec = Math.round(sec);
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
  return h ? h + ':' + pad2(m) + ':' + pad2(s) : m + ':' + pad2(s);
}
function parseDur(str){
  if (!str) return 0;
  const p = String(str).trim().split(':').map(x => parseFloat(x));
  if (p.some(isNaN)) return 0;
  if (p.length === 1) return Math.round(p[0] * 60);
  if (p.length === 2) return Math.round(p[0] * 60 + p[1]);
  return Math.round(p[0] * 3600 + p[1] * 60 + p[2]);
}

/* ============================== state ============================== */
function seed(){
  return { version:1, templates:clone(DEFAULT_TEMPLATES), meals:clone(DEFAULT_MEALS),
           logs:{}, runs:[], deletedRuns:[], stamps:{ templates:0, meals:0, weeks:{} }, settings:{ gistId:'' } };
}
function normalize(s){
  const base = seed();
  const out = Object.assign(base, s);
  out.stamps = Object.assign({ templates:0, meals:0, weeks:{} }, s.stamps || {});
  out.stamps.weeks = (s.stamps && s.stamps.weeks) || {};
  out.settings = Object.assign({ gistId:'' }, s.settings || {});
  out.logs = s.logs || {}; out.runs = s.runs || []; out.deletedRuns = s.deletedRuns || [];
  return out;
}
function load(){
  try {
    const s = JSON.parse(localStorage.getItem(LS_KEY));
    if (s && s.version === 1) return normalize(s);
  } catch (e) {}
  return seed();
}
function persist(d){ try { localStorage.setItem(LS_KEY, JSON.stringify(d)); } catch (e) {} }

function mergeStates(local, remote){
  const out = clone(local);
  remote = normalize(clone(remote));
  if ((remote.stamps.templates || 0) > (out.stamps.templates || 0)) { out.templates = remote.templates; out.stamps.templates = remote.stamps.templates; }
  if ((remote.stamps.meals || 0) > (out.stamps.meals || 0)) { out.meals = remote.meals; out.stamps.meals = remote.stamps.meals; }
  const weeks = new Set(Object.keys(out.logs).concat(Object.keys(remote.logs)));
  weeks.forEach(k => {
    const lt = out.stamps.weeks[k] || 0, rt = remote.stamps.weeks[k] || 0;
    if (rt > lt || (!out.logs[k] && remote.logs[k])) { out.logs[k] = remote.logs[k]; out.stamps.weeks[k] = rt; }
  });
  const dead = new Set((out.deletedRuns || []).concat(remote.deletedRuns || []));
  const byId = {};
  (remote.runs || []).concat(out.runs || []).forEach(r => {
    if (!r || dead.has(r.id)) return;
    const prev = byId[r.id];
    if (!prev || (r.updatedAt || 0) > (prev.updatedAt || 0)) byId[r.id] = r;
  });
  out.runs = Object.values(byId).sort((a, b) => a.date < b.date ? 1 : -1);
  out.deletedRuns = Array.from(dead).slice(-300);
  out.settings.gistId = out.settings.gistId || remote.settings.gistId || '';
  return out;
}

/* ============================== log getters ============================== */
function getSets(state, week, tplId, ex){
  const wk = state.logs[week] || {};
  const arr = ((wk.workouts || {})[tplId] || {})[ex.id] || [];
  const n = Math.max(ex.sets, arr.length);
  return Array.from({ length: n }, (_, i) => arr[i] || { w:'', r:'', done:false });
}
function prevSets(state, week, tplId, exId){
  const keys = Object.keys(state.logs).filter(k => k < week).sort();
  for (let i = keys.length - 1; i >= 0; i--) {
    const a = (((state.logs[keys[i]] || {}).workouts || {})[tplId] || {})[exId];
    if (a && a.some(s => (s.w !== '' && s.w != null) || (s.r !== '' && s.r != null))) return { week: keys[i], sets: a };
  }
  return null;
}
function tplProgress(state, week, tpl){
  let done = 0, total = 0;
  tpl.exercises.forEach(ex => { const sets = getSets(state, week, tpl.id, ex); total += sets.length; done += sets.filter(s => s.done).length; });
  return { done, total };
}
function tonnage(state, week, tpl){
  let t = 0;
  tpl.exercises.forEach(ex => { getSets(state, week, tpl.id, ex).forEach(s => { t += numOr0(s.w) * numOr0(s.r); }); });
  return Math.round(t);
}

function Icon({ d, className, filled }){
  return (
    <svg className={className || 'w-6 h-6'} viewBox="0 0 24 24" fill={filled ? 'currentColor' : 'none'}
         stroke="currentColor" strokeWidth={filled ? 0 : 2} strokeLinecap="round" strokeLinejoin="round">

function Ring({ pct, size = 44, stroke = 4, color = '#CCFF00' }){

    <svg width={size} height={size} style={{ transform:'rotate(-90deg)' }}>
      <circle cx={size/2} cy={size/2} r={r} stroke="rgba(255,255,255,.08)" strokeWidth={stroke} fill="none"/>
      <circle cx={size/2} cy={size/2} r={r} stroke={color} strokeWidth={stroke} fill="none"
              strokeDasharray={c} strokeDashoffset={c * (1 - Math.min(1, pct || 0))}
              strokeLinecap="round" style={{ transition:'stroke-dashoffset .45s' }}/>
    </svg>
  );
}

/* ============================== rest timer ============================== */
function RestTimer(){
  const [total, setTotal] = useState(0);
  const [left, setLeft] = useState(0);
  useEffect(() => {
    if (left <= 0) return;
    const t = setTimeout(() => {
      const nl = left - 1;
      setLeft(nl);
      if (nl === 0) chime();
    }, 1000);
    return () => clearTimeout(t);
  }, [left]);
  function chime(){
    try {
      if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const beep = (t, f) => {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.connect(g); g.connect(ctx.destination); o.frequency.value = f;
        g.gain.setValueAtTime(.35, ctx.currentTime + t);
        g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + t + .25);
        o.start(ctx.currentTime + t); o.stop(ctx.currentTime + t + .3);
      };
      beep(0, 880); beep(.3, 880); beep(.6, 1318);
    } catch (e) {}
  }
  return (
    <React.Fragment>
      <div className="glass rounded-2xl p-2.5 flex items-center gap-2">
        <span className="text-[11px] font-bold text-white/40 flex items-center gap-1 ps-1 shrink-0">
          <Icon d={I.timer} className="w-4 h-4 text-ember"/> מנוחה
        </span>
        {[60, 90, 120, 180].map(s => (
          <button key={s} onClick={() => { setTotal(s); setLeft(s); }}
                  className="flex-1 py-1.5 rounded-xl bg-white/5 text-sm font-bold active:scale-95 transition select-none">
            {fmtDur(s)}
          </button>
        ))}
      </div>
      {left > 0 && (
        <div className="fixed bottom-24 inset-x-0 z-50 flex justify-center pointer-events-none">
          <div className="pointer-events-auto flex items-center gap-3 rounded-full ps-5 pe-3 py-2.5 bg-gradient-to-l from-ember to-orange-600 shadow-2xl shadow-ember/40 fadein">
            <span className="font-black text-2xl tabular-nums text-white" style={{ fontVariantNumeric:'tabular-nums' }}>{fmtDur(left)}</span>
            <div className="w-24 h-1.5 bg-black/30 rounded-full overflow-hidden" dir="ltr">
              <div className="h-full bg-white rounded-full" style={{ width:(left / total * 100) + '%', transition:'width 1s linear' }}/>
            </div>
            <button onClick={() => setLeft(0)} className="w-7 h-7 rounded-full bg-black/25 flex items-center justify-center text-white">
              <Icon d={I.x} className="w-4 h-4"/>
            </button>
          </div>
        </div>
      )}
    </React.Fragment>
  );
}

function SetRow({ s, i, prev, onField, onToggle }){
  const ph = f => (prev && prev.sets[i] && prev.sets[i][f] !== '' && prev.sets[i][f] != null) ? String(prev.sets[i][f]) : (f === 'w' ? 'ק"ג' : 'חזרות');
  return (
    <div className={'flex items-center gap-2 rounded-2xl ps-2 pe-1.5 py-1.5 border transition ' + (s.done ? 'bg-volt/10 border-volt/25' : 'bg-black/25 border-white/5')}>
      <span className={'w-6 h-6 rounded-lg text-[11px] font-bold flex items-center justify-center shrink-0 ' + (s.done ? 'bg-volt text-obsidian' : 'bg-white/10 text-white/50')}>{i + 1}</span>
      <input className="setinp" inputMode="decimal" placeholder={ph('w')} value={s.w}
             onChange={e => onField(i, 'w', e.target.value)}/>
      <span className="text-white/25 text-xs shrink-0">×</span>
      <input className="setinp" inputMode="numeric" placeholder={ph('r')} value={s.r}
             onChange={e => onField(i, 'r', e.target.value)}/>
      <button onClick={() => onToggle(i)}
              className={'w-9 h-8 rounded-xl flex items-center justify-center transition active:scale-90 shrink-0 ' + (s.done ? 'bg-volt text-obsidian glow-volt' : 'bg-white/5 text-white/30')}>
        <Icon d={I.check} className="w-4 h-4"/>
      </button>
    </div>
  );
}

/* ============================== runs ============================== */
function RunChart({ runs }){
  const data = useMemo(() => runs.slice().sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0).slice(-24), [runs]);
  const [sel, setSel] = useState(null);
  useEffect(() => { setSel(data.length ? data.length - 1 : null); }, [data.length]);
  if (data.length === 0) return (
    <div className="text-center py-10 text-white/30 text-sm">אין ריצות עדיין — רשום את הריצה הראשונה שלך 🏃</div>
  );
  const W = 640, H = 250, L = 40, R = 46, T = 16, B = 30;
  const kmMax = Math.max.apply(null, data.map(r => r.km).concat([1])) * 1.2;
  const paceOf = r => r.sec / Math.max(r.km, .01);
  const paces = data.map(paceOf);
  let pMin = Math.min.apply(null, paces), pMax = Math.max.apply(null, paces);
  const padP = Math.max((pMax - pMin) * .25, 20); pMin -= padP; pMax += padP;
  const X = i => data.length === 1 ? (L + (W - L - R) / 2) : L + i * (W - L - R) / (data.length - 1);
  const Ykm = v => H - B - (v / kmMax) * (H - T - B);
  const Yp = v => T + ((v - pMin) / (pMax - pMin)) * (H - T - B);
  const kmPts = data.map((r, i) => X(i) + ',' + Ykm(r.km)).join(' ');
  const pPts = data.map((r, i) => X(i) + ',' + Yp(paceOf(r))).join(' ');
  const area = data.length > 1
    ? 'M' + X(0) + ',' + (H - B) + ' L' + data.map((r, i) => X(i) + ',' + Ykm(r.km)).join(' L') + ' L' + X(data.length - 1) + ',' + (H - B) + ' Z'
    : '';
  const xLabelStep = Math.max(1, Math.ceil(data.length / 6));
  const selRun = sel != null ? data[sel] : null;
  return (
    <div dir="ltr">
      <svg viewBox={'0 0 ' + W + ' ' + H} className="w-full select-none">
        <defs>
          <linearGradient id="gkm" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stopColor="#CCFF00" stopOpacity=".26"/>
            <stop offset="100%" stopColor="#CCFF00" stopOpacity="0"/>
          </linearGradient>
        </defs>
        {[.25, .5, .75, 1].map(f => {
          const v = kmMax * f, y = Ykm(v);
          return (
            <g key={f}>
              <line x1={L} x2={W - R} y1={y} y2={y} stroke="rgba(255,255,255,.05)"/>
              <text x={L - 7} y={y + 3} textAnchor="end" fontSize="9" fill="rgba(204,255,0,.45)">{v.toFixed(1)}</text>
            </g>
          );
        })}
        {[.15, .5, .85].map(f => {
          const v = pMin + (pMax - pMin) * f;
          return <text key={f} x={W - R + 7} y={Yp(v) + 3} fontSize="9" fill="rgba(255,90,31,.6)">{fmtPace(v)}</text>;
        })}
        {area && <path d={area} fill="url(#gkm)"/>}
        {data.length > 1 && <polyline points={pPts} fill="none" stroke="#FF5A1F" strokeWidth="2" strokeDasharray="5 4" strokeLinejoin="round" opacity=".85"/>}
        {data.length > 1 && <polyline points={kmPts} fill="none" stroke="#CCFF00" strokeWidth="2.5" strokeLinejoin="round" style={{ filter:'drop-shadow(0 0 6px rgba(204,255,0,.5))' }}/>}
        {data.map((r, i) => (
          <g key={r.id}>
            {sel === i && <line x1={X(i)} x2={X(i)} y1={T} y2={H - B} stroke="rgba(255,255,255,.15)" strokeDasharray="3 3"/>}
            <circle cx={X(i)} cy={Ykm(r.km)} r={sel === i ? 5 : 3.5} fill={sel === i ? '#CCFF00' : '#0B0B0C'} stroke="#CCFF00" strokeWidth="2"/>
            <circle cx={X(i)} cy={Yp(paceOf(r))} r={sel === i ? 4 : 3} fill={sel === i ? '#FF5A1F' : '#0B0B0C'} stroke="#FF5A1F" strokeWidth="1.5"/>
            <rect x={X(i) - 14} y={T} width="28" height={H - T - B} fill="transparent" onClick={() => setSel(i)} style={{ cursor:'pointer' }}/>
          </g>
        ))}
        {data.map((r, i) => ((i % xLabelStep === 0 || i === data.length - 1)
          ? <text key={'x' + r.id} x={X(i)} y={H - 8} textAnchor="middle" fontSize="9" fill="rgba(255,255,255,.35)">
              {fromISO(r.date).getDate() + '.' + (fromISO(r.date).getMonth() + 1)}
            </text>
          : null))}
      </svg>
      {selRun && (
        <div dir="rtl" className="mt-2 bg-black/30 rounded-2xl px-4 py-2.5 flex items-center justify-between gap-2 fadein border border-white/5">
          <div className="min-w-0">
            <div className="font-bold text-sm truncate">{selRun.title}</div>
            <div className="text-[10px] text-white/40">{heDate(selRun.date)}</div>
          </div>
          <div className="flex gap-4 text-center shrink-0">
            <div><div className="font-black text-volt">{selRun.km}</div><div className="text-[9px] text-white/40">ק"מ</div></div>
            <div><div className="font-black text-ember">{fmtPace(paceOf(selRun))}</div><div className="text-[9px] text-white/40">קצב</div></div>
            <div><div className="font-black">{fmtDur(selRun.sec)}</div><div className="text-[9px] text-white/40">זמן</div></div>
          </div>
        </div>
      )}
    </div>
  );
}

function RunsTab({ state, week, mutate }){
  const todayISO = toISO(new Date());
  const inWeek = todayISO >= week && todayISO <= addDays(week, 6);
  const [f, setF] = useState({ title:'', km:'', dur:'', date: inWeek ? todayISO : week });
  const [showAll, setShowAll] = useState(false);
  useEffect(() => { setF(x => Object.assign({}, x, { date: (todayISO >= week && todayISO <= addDays(week, 6)) ? todayISO : week })); }, [week]);

  const all = useMemo(() => state.runs.slice().sort((a, b) => a.date < b.date ? 1 : -1), [state.runs]);
  const weekRuns = all.filter(r => r.date >= week && r.date <= addDays(week, 6));
  const totKm = weekRuns.reduce((a, r) => a + r.km, 0);
  const totSec = weekRuns.reduce((a, r) => a + r.sec, 0);
  const avgPace = totKm > 0 ? totSec / totKm : 0;
  const bestPace = state.runs.length ? Math.min.apply(null, state.runs.map(r => r.sec / Math.max(r.km, .01))) : 0;

  const kmNum = numOr0(f.km), secNum = parseDur(f.dur);
  const valid = kmNum > 0 && secNum > 0 && f.date;
  const addRun = () => {
    if (!valid) return;
    mutate(d => { d.runs.unshift({ id: uid(), date: f.date, title: f.title.trim() || 'ריצה', km: kmNum, sec: secNum, updatedAt: Date.now() }); });
    setF({ title:'', km:'', dur:'', date: f.date });
  };
  const delRun = r => {
    if (!confirm('למחוק את "' + r.title + '" (' + r.km + ' ק"מ)?')) return;
    mutate(d => { d.runs = d.runs.filter(x => x.id !== r.id); if (d.deletedRuns.indexOf(r.id) < 0) d.deletedRuns.push(r.id); });
  };

  const Stat = ({ v, l, accent }) => (
    <div className="glass rounded-2xl py-2.5 text-center">
      <div className={'font-black text-lg leading-none ' + (accent || '')}>{v}</div>
      <div className="text-[9px] text-white/40 mt-1">{l}</div>
    </div>
  );

  const RunRow = ({ r }) => (
    <div className="glass rounded-2xl p-3 flex items-center gap-3">
      <div className="w-9 h-9 rounded-xl bg-ember/15 text-ember flex items-center justify-center shrink-0">
        <Icon d={I.activity} className="w-4 h-4"/>
      </div>
      <div className="flex-1 min-w-0">
        <div className="font-bold text-sm truncate">{r.title}</div>
        <div className="text-[10px] text-white/40">{heDate(r.date)}</div>
      </div>
      <div className="flex gap-3 text-center shrink-0">
        <div><div className="font-black text-volt text-sm">{r.km}</div><div className="text-[8px] text-white/40">ק"מ</div></div>
        <div><div className="font-black text-ember text-sm">{fmtPace(r.sec / Math.max(r.km, .01))}</div><div className="text-[8px] text-white/40">קצב</div></div>
        <div><div className="font-black text-sm">{fmtDur(r.sec)}</div><div className="text-[8px] text-white/40">זמן</div></div>
      </div>
      <button onClick={() => delRun(r)} className="w-8 h-8 rounded-lg text-white/25 flex items-center justify-center active:scale-90 transition shrink-0">
        <Icon d={I.trash} className="w-3.5 h-3.5"/>
      </button>
    </div>
  );

  return (
    <div className="fadein space-y-3">
      <div className="grid grid-cols-4 gap-2">
        <Stat v={totKm ? totKm.toFixed(1) : '0'} l={'ק"מ השבוע'} accent="text-volt"/>
        <Stat v={weekRuns.length} l="ריצות השבוע"/>
        <Stat v={fmtPace(avgPace)} l="קצב ממוצע" accent="text-ember"/>
        <Stat v={fmtPace(bestPace)} l="שיא קצב"/>
      </div>

      <div className="glass rounded-3xl p-4">
        <div className="flex items-center justify-between mb-1">
          <div className="font-black italic">מגמות ביצועים</div>
          <div className="flex gap-3 text-[10px] font-bold">
            <span className="flex items-center gap-1 text-volt"><span className="w-2.5 h-0.5 bg-volt inline-block rounded-full"></span> מרחק</span>
            <span className="flex items-center gap-1 text-ember"><span className="w-2.5 h-0.5 bg-ember inline-block rounded-full" style={{ borderTop:'1px dashed' }}></span> קצב</span>
          </div>
        </div>
        <RunChart runs={state.runs}/>
      </div>

      <div className="glass rounded-3xl p-4 space-y-2.5">
        <div className="font-bold flex items-center gap-2">
          <span className="w-7 h-7 rounded-xl bg-ember/20 text-ember flex items-center justify-center"><Icon d={I.plus} className="w-4 h-4"/></span>
          ריצה חדשה
        </div>
        <input className="inp" placeholder="כותרת (למשל: ריצת בוקר קלה)" value={f.title} onChange={e => setF({ ...f, title: e.target.value })}/>
        <div className="grid grid-cols-3 gap-2">
          <div><label className="lbl">מרחק (ק"מ)</label>
            <input className="inp text-center font-bold" inputMode="decimal" placeholder="5.0" value={f.km} onChange={e => setF({ ...f, km: e.target.value })}/></div>
          <div><label className="lbl">זמן (דק:שנ)</label>
            <input className="inp text-center font-bold" inputMode="numeric" placeholder="30:00" value={f.dur} onChange={e => setF({ ...f, dur: e.target.value })}/></div>
          <div><label className="lbl">תאריך</label>
            <input type="date" className="inp text-center" value={f.date} onChange={e => setF({ ...f, date: e.target.value })}/></div>
        </div>
        <div className="flex items-center justify-between bg-black/25 rounded-2xl px-4 py-2.5 border border-white/5">
          <span className="text-xs text-white/40">קצב מחושב</span>
          <span className="font-black text-xl text-volt text-glow">{valid ? fmtPace(secNum / kmNum) : '—'}<span className="text-[10px] text-white/40 font-normal ms-1">דק' / ק"מ</span></span>
        </div>
        <button onClick={addRun} disabled={!valid}
                className="w-full py-3 rounded-2xl bg-volt text-obsidian font-black text-lg active:scale-[.98] transition disabled:opacity-25 glow-volt disabled:shadow-none">
          הוסף ריצה ⚡
        </button>
      </div>

      <div className="flex items-center justify-between px-1 pt-1">
        <span className="text-white/40 text-xs font-bold">{showAll ? 'כל ההיסטוריה (' + all.length + ')' : 'ריצות השבוע (' + weekRuns.length + ')'}</span>
        <button onClick={() => setShowAll(!showAll)} className="text-volt text-xs font-bold active:scale-95 transition">{showAll ? 'הצג שבוע נוכחי' : 'הצג הכל'}</button>
      </div>
      {(showAll ? all : weekRuns).map(r => <RunRow key={r.id} r={r}/>)}
      {(showAll ? all : weekRuns).length === 0 && (
        <div className="text-center py-6 text-white/25 text-sm">אין ריצות בשבוע הזה</div>
      )}
    </div>
  );
}

/* ============================== nutrition ============================== */
function NutritionTab({ state, week, mutate }){
  const todayISO = toISO(new Date());
  const isCur = weekStartISO(new Date()) === week;
  const [day, setDay] = useState(isCur ? new Date().getDay() : 0);
  const [edit, setEdit] = useState(false);
  useEffect(() => { setDay(weekStartISO(new Date()) === week ? new Date().getDay() : 0); }, [week]);

  const nut = (state.logs[week] || {}).nutrition || {};
  const checks = nut[day] || {};
  const doneCount = state.meals.filter(m => checks[m.id]).length;
  const weekDone = DAYS_HE.reduce((a, _, i) => a + state.meals.filter(m => (nut[i] || {})[m.id]).length, 0);
  const weekTotal = Math.max(1, 7 * state.meals.length);
  const weekPct = Math.round(weekDone / weekTotal * 100);

  const toggleAt = (di, mealId) => mutate(d => {
    const wk = (d.logs[week] = d.logs[week] || {});
    const n = (wk.nutrition = wk.nutrition || {});
    const dd = (n[di] = n[di] || {});
    dd[mealId] = !dd[mealId];
  }, ['week', week]);

  const updMeal = (id, patch) => mutate(d => { Object.assign(d.meals.find(m => m.id === id), patch); }, 'meals');
  const delMeal = id => {
    const m = state.meals.find(x => x.id === id);
    if (!confirm('למחוק את "' + (m ? m.title : '') + '"?')) return;
    mutate(d => { d.meals = d.meals.filter(x => x.id !== id); }, 'meals');
  };
  const addMeal = () => mutate(d => { d.meals.push({ id: uid(), icon:'🍽️', title:'ארוחה חדשה', desc:'' }); }, 'meals');

  return (
    <div className="fadein space-y-3">
      <div className="glass rounded-3xl p-5">
        <div className="flex items-center justify-between">
          <div>
            <h2 className="text-xl font-black italic leading-none">LEAN BULK</h2>
            <div className="text-white/40 text-xs mt-1">צ'קליסט תזונה יומי</div>
          </div>
          <div className="relative w-[64px] h-[64px]">
            <Ring pct={doneCount / Math.max(1, state.meals.length)} size={64} stroke={5}/>
            <div className="absolute inset-0 flex flex-col items-center justify-center">
              <span className="font-black text-xl leading-none">{doneCount}</span>
              <span className="text-[8px] text-white/40">מתוך {state.meals.length}</span>
            </div>
          </div>
        </div>
        <div className="grid grid-cols-7 gap-1.5 mt-4">
          {DAYS_HE.map((d, i) => {
            const iso = addDays(week, i);
            const c = state.meals.filter(m => (nut[i] || {})[m.id]).length;
            const full = c === state.meals.length && c > 0;
            const active = day === i;
            return (
              <button key={i} onClick={() => setDay(i)}
                      className={'rounded-xl py-1.5 flex flex-col items-center transition active:scale-95 ' + (active ? 'bg-volt text-obsidian glow-volt' : 'bg-white/5 text-white/60')}>
                <span className="text-sm font-black leading-none">{d}</span>
                <span className={'text-[9px] mt-0.5 ' + (active ? 'text-obsidian/60' : (iso === todayISO ? 'text-volt' : 'text-white/30'))}>{fromISO(iso).getDate()}</span>
                <span className={'mt-1 w-1 h-1 rounded-full ' + (full ? (active ? 'bg-obsidian' : 'bg-volt') : (c > 0 ? 'bg-ember' : 'bg-transparent'))}></span>
              </button>
            );
          })}
        </div>
        <div className="mt-3.5 flex items-center gap-2">
          <div className="flex-1 h-1.5 bg-white/5 rounded-full overflow-hidden">
            <div className="h-full rounded-full bg-gradient-to-l from-volt to-lime-300 transition-all duration-500" style={{ width: weekPct + '%' }}/>
          </div>
          <span className="text-[10px] text-white/40 font-bold shrink-0">{weekPct}% שבועי</span>
        </div>
      </div>

      <div className="flex items-center justify-between px-1">
        <span className="text-white/40 text-xs font-bold">{DAYS_FULL[day]} · {(() => { const d = fromISO(addDays(week, day)); return d.getDate() + '.' + (d.getMonth() + 1); })()}</span>
        <button onClick={() => setEdit(!edit)}
                className={'h-8 px-3 rounded-xl flex items-center gap-1.5 text-xs font-bold active:scale-95 transition ' + (edit ? 'bg-volt text-obsidian' : 'bg-white/5 text-white/50')}>
          <Icon d={edit ? I.check : I.pencil} className="w-3.5 h-3.5"/>{edit ? 'סיום' : 'עריכה'}
        </button>
      </div>

      {state.meals.map(m => {
        const done = !!checks[m.id];
        if (edit) return (
          <div key={m.id} className="glass rounded-3xl p-4 space-y-2 fadein">
            <div className="flex gap-2">
              <input className="inp w-16 text-center text-xl" value={m.icon} onChange={e => updMeal(m.id, { icon: e.target.value })}/>
              <input className="inp flex-1 font-bold" value={m.title} onChange={e => updMeal(m.id, { title: e.target.value })}/>
              <button onClick={() => delMeal(m.id)} className="w-11 rounded-xl bg-ember/15 text-ember flex items-center justify-center shrink-0 active:scale-90 transition">
                <Icon d={I.trash} className="w-4 h-4"/>
              </button>
            </div>
            <textarea className="inp leading-relaxed" rows="3" value={m.desc} placeholder="פירוט הארוחה..." onChange={e => updMeal(m.id, { desc: e.target.value })}/>
          </div>
        );
        return (
          <button key={m.id} onClick={() => toggleAt(day, m.id)}
                  className={'w-full text-start rounded-3xl p-4 flex gap-3 items-start transition active:scale-[.985] border ' + (done ? 'bg-volt/10 border-volt/25' : 'glass border-transparent')}>
            <div className={'w-7 h-7 rounded-full border-2 flex items-center justify-center shrink-0 mt-0.5 transition ' + (done ? 'bg-volt border-volt text-obsidian glow-volt' : 'border-white/15 text-transparent')}>
              <Icon d={I.check} className="w-4 h-4"/>
            </div>
            <span className="text-2xl leading-none mt-0.5">{m.icon}</span>
            <div className="min-w-0">
              <div className={'font-bold leading-snug ' + (done ? 'text-volt' : '')}>{m.title}</div>
              <div className={'text-xs leading-relaxed mt-1 ' + (done ? 'text-white/30' : 'text-white/45')}>{m.desc}</div>
            </div>
          </button>
        );
      })}

      {edit && (
        <button onClick={addMeal} className="w-full glass rounded-3xl py-4 text-volt font-bold flex items-center justify-center gap-2 active:scale-[.98] transition">
          <Icon d={I.plus} className="w-5 h-5"/> הוסף ארוחה
        </button>
      )}

      <div className="glass rounded-3xl p-4">
        <div className="text-xs font-bold text-white/40 mb-3">מפת השבוע · לחיצה על תא מסמנת</div>
        <div className="grid gap-1" style={{ gridTemplateColumns:'28px repeat(7, 1fr)' }}>
          <div></div>
          {DAYS_HE.map((d, i) => <div key={i} className="text-center text-[10px] font-bold text-white/40">{d}</div>)}
          {state.meals.map(m => (
            <React.Fragment key={m.id}>
              <div className="flex items-center justify-center text-sm">{m.icon}</div>
              {DAYS_HE.map((_, di) => {
                const on = !!((nut[di] || {})[m.id]);
                return (
                  <button key={di} onClick={() => toggleAt(di, m.id)}
                          className={'h-7 rounded-lg transition active:scale-90 ' + (on ? 'bg-volt/80 glow-volt' : 'bg-white/5')}></button>
                );
              })}
            </React.Fragment>
          ))}
        </div>
      </div>
    </div>
  );
}

/* ============================== settings / sync ============================== */
function SettingsTab({ state, sync, syncNow, replaceState }){
  const [tok, setTok] = useState(localStorage.getItem(TOKEN_KEY) || '');
  const fileRef = useRef(null);
  const connected = !!localStorage.getItem(TOKEN_KEY);

  const saveTok = () => { const t = tok.trim(); if (!t) return; localStorage.setItem(TOKEN_KEY, t); syncNow(false); };
  const disconnect = () => { localStorage.removeItem(TOKEN_KEY); setTok(''); syncNow(false); };

  const doExport = () => {
    const blob = new Blob([JSON.stringify(state, null, 1)], { type:'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'athletics-backup-' + toISO(new Date()) + '.json';
    a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 3000);
  };
  const doImport = e => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const rd = new FileReader();
    rd.onload = () => {
      try {
        const s = JSON.parse(rd.result);
        if (!s || s.version !== 1) throw new Error('bad');
        if (confirm('לייבא גיבוי? הנתונים ימוזגו עם הקיימים.')) replaceState(mergeStates(normalize(s), state));
      } catch (err) { alert('קובץ לא תקין'); }
      e.target.value = '';
    };
    rd.readAsText(file);
  };
  const doReset = () => {
    if (!confirm('לאפס את כל הנתונים במכשיר הזה? (גיבוי בג׳יסט לא יימחק)')) return;
    if (!confirm('בטוח בטוח? אין דרך חזרה מקומית.')) return;
    replaceState(seed());
  };

  const statusInfo = {
    off:     { c:'bg-white/20',  t:'לא מחובר לסנכרון' },
    pending: { c:'bg-ember',     t:'שינויים ממתינים...' },
    syncing: { c:'bg-ember',     t:'מסנכרן...' },
    ok:      { c:'bg-volt',      t:'מסונכרן ✓' + (sync.at ? ' · ' + new Date(sync.at).toLocaleTimeString('he-IL', { hour:'2-digit', minute:'2-digit' }) : '') },
    error:   { c:'bg-red-500',   t:'שגיאת סנכרון' },
  }[sync.status] || { c:'bg-white/20', t:'' };

  return (
    <div className="fadein space-y-3">
      <div className="glass rounded-3xl p-5">
        <div className="flex items-center justify-between">
          <div className="font-black italic text-lg flex items-center gap-2">
            <Icon d={I.refresh} className={'w-5 h-5 text-volt ' + (sync.status === 'syncing' ? 'spin' : '')}/>
            סנכרון בין מכשירים
          </div>
          <div className="flex items-center gap-2">
            <span className={'w-2.5 h-2.5 rounded-full ' + statusInfo.c}></span>
            <span className="text-xs text-white/50 font-semibold">{statusInfo.t}</span>
          </div>
        </div>
        {sync.status === 'error' && <div className="mt-2 text-xs text-red-400 bg-red-500/10 border border-red-500/20 rounded-xl px-3 py-2 break-all" dir="ltr">{sync.msg}</div>}

        <div className="mt-4 space-y-2">
          <label className="lbl">GitHub Personal Access Token (הרשאת gist בלבד)</label>
          <input className="inp" dir="ltr" type="password" placeholder="ghp_..." value={tok} onChange={e => setTok(e.target.value)}/>
          <div className="flex gap-2">
            <button onClick={saveTok} className="flex-1 py-2.5 rounded-2xl bg-volt text-obsidian font-black active:scale-[.98] transition disabled:opacity-30" disabled={!tok.trim()}>
              {connected ? 'עדכן טוקן' : 'התחבר'}
            </button>
            <button onClick={() => syncNow(false)} className="flex-1 py-2.5 rounded-2xl bg-white/5 border border-white/10 font-bold active:scale-[.98] transition disabled:opacity-30" disabled={!connected}>
              סנכרן עכשיו
            </button>
            {connected && (
              <button onClick={disconnect} className="px-3 rounded-2xl bg-ember/15 text-ember font-bold text-xs active:scale-95 transition">נתק</button>
            )}
          </div>
          {state.settings.gistId && (
            <div className="text-[10px] text-white/30 pt-1" dir="ltr">Gist: {state.settings.gistId}</div>
          )}
        </div>
      </div>

      <div className="glass rounded-3xl p-5 text-sm leading-relaxed">
        <div className="font-bold mb-2 text-volt">איך מחברים? (פעם אחת לכל מכשיר)</div>
        <ol className="space-y-2 text-white/60 text-xs list-decimal ps-4">
          <li>
            צור טוקן בגיטהאב:{' '}
            <a className="text-volt underline font-bold" href="https://github.com/settings/tokens/new?scopes=gist&description=ATHLETICS%20Sync" target="_blank" rel="noopener">
              לחץ כאן
            </a>{' '}
            (Generate new token · classic) — הרשאת <b dir="ltr">gist</b> כבר מסומנת. בחר Expiration ארוך ולחץ Generate.
          </li>
          <li>העתק את הטוקן והדבק אותו למעלה, ולחץ <b>התחבר</b>.</li>
          <li>חזור על אותו תהליך באייפון עם <b>אותו טוקן</b> — האפליקציה תמצא את הג׳יסט הפרטי אוטומטית והכל יתמזג.</li>
        </ol>
        <div className="mt-3 text-[10px] text-white/30">הנתונים נשמרים בג׳יסט פרטי בחשבון הגיטהאב שלך. הטוקן נשמר רק על המכשיר הזה. סנכרון רץ אוטומטית אחרי כל שינוי ובכל פתיחה של האפליקציה.</div>
      </div>

      <div className="glass rounded-3xl p-5">
        <div className="font-bold mb-3 text-white/70 text-sm">התקנה באייפון 📱</div>
        <ol className="space-y-1.5 text-white/50 text-xs list-decimal ps-4 leading-relaxed">
          <li>פתח את כתובת האפליקציה ב-Safari.</li>
          <li>לחץ על כפתור השיתוף (הריבוע עם החץ).</li>
          <li>בחר <b>הוסף למסך הבית</b> — תקבל אייקון ⚡ כמו אפליקציה אמיתית.</li>
        </ol>
      </div>

      <div className="glass rounded-3xl p-5 space-y-2">
        <div className="font-bold text-white/70 text-sm mb-1">גיבוי מקומי</div>
        <div className="flex gap-2">
          <button onClick={doExport} className="flex-1 py-2.5 rounded-2xl bg-white/5 border border-white/10 font-bold text-sm flex items-center justify-center gap-2 active:scale-[.98] transition">
            <Icon d={I.download} className="w-4 h-4 text-volt"/> ייצוא JSON
          </button>
          <button onClick={() => fileRef.current && fileRef.current.click()} className="flex-1 py-2.5 rounded-2xl bg-white/5 border border-white/10 font-bold text-sm flex items-center justify-center gap-2 active:scale-[.98] transition">
            <Icon d={I.upload} className="w-4 h-4 text-ember"/> ייבוא JSON
          </button>
          <input ref={fileRef} type="file" accept="application/json" className="hidden" onChange={doImport}/>
        </div>
        <button onClick={doReset} className="w-full py-2 rounded-2xl text-red-400/60 text-xs font-bold active:scale-[.98] transition">איפוס כל הנתונים במכשיר</button>
      </div>

      <div className="text-center text-[10px] text-white/20 pb-2 tracking-[.3em]">ATHLETICS · LEAN BULK ENGINE ⚡</div>
    </div>
  );
}

/* ============================== app shell ============================== */
function App(){
  const [state, setState] = useState(load);
  const stateRef = useRef(state); stateRef.current = state;
  const [tab, setTab] = useState('workouts');
  const [week, setWeek] = useState(() => weekStartISO(new Date()));
  const [openTpl, setOpenTpl] = useState(null);
  const [sync, setSync] = useState({ status: localStorage.getItem(TOKEN_KEY) ? 'ok' : 'off', msg:'', at:0 });
  const pushTimer = useRef(null);
  const syncingRef = useRef(false);
  const lastSyncRef = useRef(0);

  const schedulePush = useCallback(() => {
    if (!localStorage.getItem(TOKEN_KEY)) return;
    setSync(s => (s.status === 'syncing' ? s : { ...s, status:'pending' }));
    clearTimeout(pushTimer.current);
    pushTimer.current = setTimeout(() => syncNow(true), 2500);
  }, []);

  const mutate = useCallback((fn, stamp) => {
    const d = clone(stateRef.current);
    fn(d);
    const t = Date.now();
    if (stamp === 'templates') d.stamps.templates = t;
    else if (stamp === 'meals') d.stamps.meals = t;
    else if (Array.isArray(stamp) && stamp[0] === 'week') d.stamps.weeks[stamp[1]] = t;
    stateRef.current = d; persist(d); setState(d); schedulePush();
  }, [schedulePush]);

  const replaceState = useCallback(d => {
    d = normalize(clone(d));
    d.stamps.templates = Date.now(); d.stamps.meals = Date.now();
    stateRef.current = d; persist(d); setState(d); schedulePush();
  }, [schedulePush]);

  async function gh(path, opts){
    opts = opts || {};
    const token = localStorage.getItem(TOKEN_KEY);
    const headers = { 'Authorization':'Bearer ' + token, 'Accept':'application/vnd.github+json' };
    if (opts.body) headers['Content-Type'] = 'application/json';
    const res = await fetch('https://api.github.com' + path, { method: opts.method || 'GET', headers, body: opts.body });
    if (!res.ok) {
      let t = ''; try { t = (await res.json()).message || ''; } catch (e) {}
      throw new Error('GitHub ' + res.status + (t ? ' · ' + t : ''));
    }
    return res.status === 204 ? null : res.json();
  }

  async function syncNow(silent){
    const token = localStorage.getItem(TOKEN_KEY);
    if (!token) { setSync({ status:'off', msg:'', at:0 }); return; }
    if (syncingRef.current) return;
    syncingRef.current = true;
    setSync(s => ({ ...s, status:'syncing' }));
    try {
      let st = stateRef.current;
      let gid = st.settings.gistId;
      if (!gid) {
        const gists = await gh('/gists?per_page=100');
        const found = gists.find(g => g.description === GIST_DESC || (g.files && g.files[GIST_FILE]));
        if (found) gid = found.id;
      }
      if (!gid) {
        const created = await gh('/gists', { method:'POST', body: JSON.stringify({ description: GIST_DESC, public:false, files:{ [GIST_FILE]:{ content: JSON.stringify(st) } } }) });
        gid = created.id;
        const d = clone(stateRef.current); d.settings.gistId = gid;
        stateRef.current = d; persist(d); setState(d);
      } else {
        const g = await gh('/gists/' + gid);
        let remote = null;
        const file = g.files && g.files[GIST_FILE];
        if (file) {
          let content = file.content;
          if (file.truncated) content = await (await fetch(file.raw_url)).text();
          try { remote = JSON.parse(content); } catch (e) {}
        }
        let merged = remote ? mergeStates(stateRef.current, remote) : clone(stateRef.current);
        merged.settings.gistId = gid;
        stateRef.current = merged; persist(merged); setState(merged);
        await gh('/gists/' + gid, { method:'PATCH', body: JSON.stringify({ files:{ [GIST_FILE]:{ content: JSON.stringify(merged) } } }) });
      }
      lastSyncRef.current = Date.now();
      setSync({ status:'ok', msg:'', at: Date.now() });
    } catch (e) {
      setSync({ status:'error', msg: String(e.message || e).slice(0, 200), at: Date.now() });
    } finally {
      syncingRef.current = false;
    }
  }

  useEffect(() => {
    if (localStorage.getItem(TOKEN_KEY)) syncNow(true);
    const onVis = () => {
      if (document.visibilityState === 'visible' && localStorage.getItem(TOKEN_KEY) && Date.now() - lastSyncRef.current > 15000) syncNow(true);
    };
    document.addEventListener('visibilitychange', onVis);
    return () => document.removeEventListener('visibilitychange', onVis);
  }, []);

  const isCur = week === weekStartISO(new Date());
  const dotColor = { off:'bg-white/20', pending:'bg-ember', syncing:'bg-ember', ok:'bg-volt', error:'bg-red-500' }[sync.status] || 'bg-white/20';

  const TABS = [
    { id:'workouts', label:'אימונים', icon:I.dumbbell },
    { id:'runs',     label:'ריצה',    icon:I.activity },
    { id:'food',     label:'תזונה',   icon:I.clipboard },
    { id:'settings', label:'סנכרון',  icon:I.refresh },
  ];

  return (
    <div className="min-h-screen">
      <div className="fixed inset-0 pointer-events-none overflow-hidden" style={{ zIndex:-1 }}>
        <div className="absolute -top-32 -end-32 w-96 h-96 rounded-full" style={{ background:'radial-gradient(circle,#CCFF00,transparent 70%)', opacity:.07 }}></div>
        <div className="absolute top-1/2 -start-40 w-96 h-96 rounded-full" style={{ background:'radial-gradient(circle,#FF5A1F,transparent 70%)', opacity:.05 }}></div>
      </div>

      <header className="sticky top-0 z-40 bg-obsidian/85 border-b border-white/5" style={{ paddingTop:'env(safe-area-inset-top)', backdropFilter:'blur(24px)', WebkitBackdropFilter:'blur(24px)' }}>
        <div className="max-w-xl mx-auto px-4 pt-3 pb-2.5">
          <div className="flex items-center justify-between">
            <div className="flex items-center gap-2.5">
              <div className="w-9 h-9 rounded-xl bg-volt flex items-center justify-center glow-volt">
                <Icon d={I.bolt} className="w-5 h-5 text-obsidian" filled/>
              </div>
              <div>
                <div className="font-black italic text-xl tracking-tight leading-none">ATHLETICS</div>
                <div className="text-[9px] text-white/35 tracking-[.35em] font-bold mt-0.5">LEAN BULK ENGINE</div>
              </div>
            </div>
            <button onClick={() => setTab('settings')} className="flex items-center gap-1.5 bg-white/5 border border-white/10 rounded-full ps-2.5 pe-3 py-1.5 active:scale-95 transition">
              <span className={'w-2 h-2 rounded-full ' + dotColor + (sync.status === 'syncing' || sync.status === 'pending' ? ' animate-pulse' : '')}></span>
              <span className="text-[10px] font-bold text-white/50">{sync.status === 'ok' ? 'מסונכרן' : sync.status === 'error' ? 'שגיאה' : sync.status === 'off' ? 'מקומי' : 'מסנכרן'}</span>
            </button>
          </div>

          <div className="mt-3 flex items-center justify-between glass rounded-2xl px-2 py-1.5">
            <button onClick={() => { setWeek(addDays(week, -7)); }} className="w-10 h-10 rounded-xl bg-white/5 active:scale-90 transition flex items-center justify-center">
              <Icon d={I.chevR} className="w-5 h-5 text-white/60"/>
            </button>
            <button onClick={() => setWeek(weekStartISO(new Date()))} className="text-center active:scale-95 transition px-2">
              <div className="font-black text-lg leading-none">
                שבוע {weekNum(week)}
                {!isCur && <span className="text-ember text-xs font-bold ms-1.5">· ארכיון</span>}
              </div>
              <div className="text-[10px] text-white/40 mt-1">
                {weekRangeLabel(week)}{!isCur && ' · לחץ לחזרה להיום'}
              </div>
            </button>
            <button onClick={() => { setWeek(addDays(week, 7)); }} className="w-10 h-10 rounded-xl bg-white/5 active:scale-90 transition flex items-center justify-center">
              <Icon d={I.chevL} className="w-5 h-5 text-white/60"/>
            </button>
          </div>
        </div>
      </header>

      <main className="max-w-xl mx-auto px-4 pt-4" style={{ paddingBottom:'calc(110px + env(safe-area-inset-bottom))' }}>
        {tab === 'workouts' && <WorkoutsTab state={state} week={week} mutate={mutate} openTpl={openTpl} setOpenTpl={setOpenTpl}/>}
        {tab === 'runs' && <RunsTab state={state} week={week} mutate={mutate}/>}
        {tab === 'food' && <NutritionTab state={state} week={week} mutate={mutate}/>}
        {tab === 'settings' && <SettingsTab state={state} sync={sync} syncNow={syncNow} replaceState={replaceState}/>}
      </main>

      <nav className="fixed bottom-0 inset-x-0 z-40 bg-obsidian/90 border-t border-white/5" style={{ backdropFilter:'blur(24px)', WebkitBackdropFilter:'blur(24px)' }}>
        <div className="max-w-xl mx-auto grid grid-cols-4 px-2 pt-1.5" style={{ paddingBottom:'max(env(safe-area-inset-bottom), 10px)' }}>
          {TABS.map(t => {
            const active = tab === t.id;
            return (
              <button key={t.id} onClick={() => { setTab(t.id); if (t.id !== 'workouts') setOpenTpl(null); }}
                      className="flex flex-col items-center gap-0.5 py-1 select-none active:scale-95 transition">
                <div className={active ? 'text-volt' : 'text-white/35'}>
                  <Icon d={t.icon} className="w-6 h-6"/>
                </div>
                <span className={'text-[10px] font-bold ' + (active ? 'text-volt' : 'text-white/35')}>{t.label}</span>
                <span className={'w-1 h-1 rounded-full ' + (active ? 'bg-volt glow-volt' : 'bg-transparent')}></span>
              </button>
            );
          })}
        </div>
      </nav>
    </div>
  );
}

class ErrorBoundary extends React.Component {
  constructor(p){ super(p); this.state = { err:null }; }
  static getDerivedStateFromError(e){ return { err:e }; }
  render(){
    if (this.state.err) return (
      <div style={{ padding:24, direction:'ltr', fontFamily:'monospace', fontSize:12, color:'#f87171' }}>
        App error: {String(this.state.err && this.state.err.message || this.state.err)}
      </div>
    );
    return this.props.children;
  }
}

ReactDOM.createRoot(document.getElementById('root')).render(<ErrorBoundary><App/></ErrorBoundary>);
</script>
</body>
</html>
