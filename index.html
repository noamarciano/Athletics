const clone = o => (typeof structuredClone === 'function' ? structuredClone(o) : JSON.parse(JSON.stringify(o)));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const pad2 = n => String(n).padStart(2, '0');
const numOr0 = v => { const n = parseFloat(v); return isNaN(n) ? 0 : n; };

function toISO(d){ return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate()); }
function fromISO(s){ const p = s.split('-').map(Number); return new Date(p[0], p[1]-1, p[2]); }
function weekStartISO(d){ const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - x.getDay()); return toISO(x); }
function addDays(iso, n){ const d = fromISO(iso); d.setDate(d.getDate() + n); return toISO(d); }
function weekNum(ws){
  const d = fromISO(ws);
  const mid = new Date(d); mid.setDate(mid.getDate() + 3);
  const jan1 = new Date(mid.getFullYear(), 0, 1);
  const firstSun = new Date(jan1); firstSun.setDate(jan1.getDate() - jan1.getDay());
  return Math.round((d - firstSun) / (7 * DAY)) + 1;
}
function weekRangeLabel(ws){
  const a = fromISO(ws), b = fromISO(addDays(ws, 6));
  const f = d => d.getDate() + '.' + (d.getMonth() + 1);
  return f(a) + ' – ' + f(b) + ' · ' + b.getFullYear();
}
function heDate(iso){ const d = fromISO(iso); return DAYS_FULL[d.getDay()] + ' · ' + d.getDate() + '.' + (d.getMonth()+1) + '.' + d.getFullYear(); }
function fmtPace(spk){
  if (!isFinite(spk) || spk <= 0) return '—';
  let m = Math.floor(spk / 60), s = Math.round(spk % 60);
  if (s === 60) { m++; s = 0; }
  return m + ':' + pad2(s);
}
function fmtDur(sec){
  sec = Math.round(sec);
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
  return h ? h + ':' + pad2(m) + ':' + pad2(s) : m + ':' + pad2(s);
}
function parseDur(str){
  if (!str) return 0;
  const p = String(str).trim().split(':').map(x => parseFloat(x));
  if (p.some(isNaN)) return 0;
  if (p.length === 1) return Math.round(p[0] * 60);
  if (p.length === 2) return Math.round(p[0] * 60 + p[1]);
  return Math.round(p[0] * 3600 + p[1] * 60 + p[2]);
}
function greet(){
  const h = new Date().getHours();
  if (h >= 5 && h < 11) return 'בוקר טוב';
  if (h < 15) return 'צהריים טובים';
  if (h < 18) return 'אחר הצהריים טובים';
  if (h < 22) return 'ערב טוב';
  return 'לילה טוב';
}

/* image compression for progress photos */
function fileToDataUrl(file, maxDim, q){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      try {
        const sc = Math.min(1, maxDim / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.max(1, Math.round(img.width * sc));
        c.height = Math.max(1, Math.round(img.height * sc));
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        res(c.toDataURL('image/jpeg', q));
      } catch (e) { rej(e); }
    };
    img.onerror = rej;
    img.src = url;
  });
}
function shrinkDataUrl(dataUrl, maxDim, q){
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => {
      const sc = Math.min(1, maxDim / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(img.width * sc));
      c.height = Math.max(1, Math.round(img.height * sc));
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      res(c.toDataURL('image/jpeg', q));
    };
    img.onerror = rej;
    img.src = dataUrl;
  });
}

/* tiny IndexedDB cache for full-res photos */
const idb = {
  _db: null,
  open(){
    return new Promise((res, rej) => {
      if (idb._db) return res(idb._db);
      const r = indexedDB.open('athletics', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('photos');
      r.onsuccess = () => { idb._db = r.result; res(idb._db); };
      r.onerror = () => rej(r.error);
    });
  },
  async get(k){ const db = await idb.open(); return new Promise((res, rej) => { const t = db.transaction('photos').objectStore('photos').get(k); t.onsuccess = () => res(t.result || null); t.onerror = () => rej(t.error); }); },
  async set(k, v){ const db = await idb.open(); return new Promise((res, rej) => { const t = db.transaction('photos','readwrite').objectStore('photos').put(v, k); t.onsuccess = () => res(); t.onerror = () => rej(t.error); }); },
  async del(k){ const db = await idb.open(); return new Promise((res, rej) => { const t = db.transaction('photos','readwrite').objectStore('photos').delete(k); t.onsuccess = () => res(); t.onerror = () => rej(t.error); }); },
};

/* ============================== state ============================== */
function seed(){
  return {
    version:1,
    templates: clone(DEFAULT_TEMPLATES),
    meals: clone(DEFAULT_MEALS),
    logs:{}, runs:[], deletedRuns:[],
    weights:[], deletedWeights:[],
    photos:[], deletedPhotos:[],
    stamps:{ templates:0, meals:0, settings:0, weeks:{} },
    settings:{ gistId:'', name:'', height:'', strava:null },
  };
}
function normalize(s){
  const base = seed();
  const out = Object.assign(base, s);
  out.stamps = Object.assign({ templates:0, meals:0, settings:0, weeks:{} }, s.stamps || {});
  out.stamps.weeks = (s.stamps && s.stamps.weeks) || {};
  out.settings = Object.assign({ gistId:'', name:'', height:'', strava:null }, s.settings || {});
  out.logs = s.logs || {}; out.runs = s.runs || []; out.deletedRuns = s.deletedRuns || [];
  out.weights = s.weights || []; out.deletedWeights = s.deletedWeights || [];
  out.photos = s.photos || []; out.deletedPhotos = s.deletedPhotos || [];
  return out;
}
function load(){
  try {
    const s = JSON.parse(localStorage.getItem(LS_KEY));
    if (s && s.version === 1) return normalize(s);
  } catch (e) {}
  return seed();
}
function persist(d){ try { localStorage.setItem(LS_KEY, JSON.stringify(d)); } catch (e) {} }

function unionById(a, b, dead){
  const byId = {};
  b.concat(a).forEach(r => {
    if (!r || dead.has(r.id)) return;
    const prev = byId[r.id];
    if (!prev || (r.updatedAt || 0) > (prev.updatedAt || 0)) byId[r.id] = r;
  });
  return Object.values(byId);
}

function mergeStates(local, remote){
  const out = clone(local);
  remote = normalize(clone(remote));
  if ((remote.stamps.templates || 0) > (out.stamps.templates || 0)) { out.templates = remote.templates; out.stamps.templates = remote.stamps.templates; }
  if ((remote.stamps.meals || 0) > (out.stamps.meals || 0)) { out.meals = remote.meals; out.stamps.meals = remote.stamps.meals; }
  if ((remote.stamps.settings || 0) > (out.stamps.settings || 0)) {
    const gid = out.settings.gistId;
    out.settings = remote.settings;
    out.settings.gistId = gid || remote.settings.gistId || '';
    out.stamps.settings = remote.stamps.settings;
  } else {
    out.settings.gistId = out.settings.gistId || remote.settings.gistId || '';
  }
  const weeks = new Set(Object.keys(out.logs).concat(Object.keys(remote.logs)));
  weeks.forEach(k => {
    const lt = out.stamps.weeks[k] || 0, rt = remote.stamps.weeks[k] || 0;
    if (rt > lt || (!out.logs[k] && remote.logs[k])) { out.logs[k] = remote.logs[k]; out.stamps.weeks[k] = rt; }
  });
  const deadRuns = new Set((out.deletedRuns || []).concat(remote.deletedRuns || []));
  out.runs = unionById(out.runs || [], remote.runs || [], deadRuns).sort((a, b) => a.date < b.date ? 1 : -1);
  out.deletedRuns = Array.from(deadRuns).slice(-500);
  const deadW = new Set((out.deletedWeights || []).concat(remote.deletedWeights || []));
  out.weights = unionById(out.weights || [], remote.weights || [], deadW).sort((a, b) => a.date < b.date ? 1 : -1);
  out.deletedWeights = Array.from(deadW).slice(-300);
  const deadP = new Set((out.deletedPhotos || []).concat(remote.deletedPhotos || []));
  out.photos = unionById(out.photos || [], remote.photos || [], deadP).sort((a, b) => a.date < b.date ? 1 : -1);
  out.deletedPhotos = Array.from(deadP).slice(-300);
  return out;
}

/* ============================== log getters ============================== */
function getSets(state, week, tplId, ex){
  const wk = state.logs[week] || {};
  const arr = ((wk.workouts || {})[tplId] || {})[ex.id] || [];
  const n = Math.max(ex.sets, arr.length);
  return Array.from({ length: n }, (_, i) => arr[i] || { w:'', r:'', done:false });
}
function prevSets(state, week, tplId, exId){
  const keys = Object.keys(state.logs).filter(k => k < week).sort();
  for (let i = keys.length - 1; i >= 0; i--) {
    const a = (((state.logs[keys[i]] || {}).workouts || {})[tplId] || {})[exId];
    if (a && a.some(s => (s.w !== '' && s.w != null) || (s.r !== '' && s.r != null))) return { week: keys[i], sets: a };
  }
  return null;
}
function tplProgress(state, week, tpl){
  let done = 0, total = 0;
  tpl.exercises.forEach(ex => { const sets = getSets(state, week, tpl.id, ex); total += sets.length; done += sets.filter(s => s.done).length; });
  return { done, total };
}
function tonnage(state, week, tpl){
  let t = 0;
  tpl.exercises.forEach(ex => { getSets(state, week, tpl.id, ex).forEach(s => { t += numOr0(s.w) * numOr0(s.r); }); });
  return Math.round(t);
}

/* ---------- analytics ---------- */
function todayStats(state){
  const today = toISO(new Date());
  const week = weekStartISO(new Date());
  const wk = state.logs[week] || {};
  let sets = 0, ton = 0;
  const perTpl = [];
  state.templates.forEach(tpl => {
    let s = 0, t = 0;
    tpl.exercises.forEach(ex => {
      const arr = (((wk.workouts || {})[tpl.id]) || {})[ex.id] || [];
      arr.forEach(x => { if (x.done && x.t === today) { s++; t += numOr0(x.w) * numOr0(x.r); } });
    });
    if (s > 0) perTpl.push({ tpl, sets: s, ton: Math.round(t) });
    sets += s; ton += t;
  });
  const runs = state.runs.filter(r => r.date === today);
  const km = runs.reduce((a, r) => a + r.km, 0);
  const dayIdx = new Date().getDay();
  const meals = state.meals.filter(m => ((wk.nutrition || {})[dayIdx] || {})[m.id]).length;
  return { sets, ton: Math.round(ton), perTpl, runs, km, meals };
}
function dayActive(state, iso){
  const wkk = weekStartISO(fromISO(iso));
  const wk = state.logs[wkk] || {};
  const dayIdx = fromISO(iso).getDay();
  const hasSet = state.templates.some(tpl => tpl.exercises.some(ex => {
    const arr = ((wk.workouts || {})[tpl.id] || {})[ex.id] || [];
    return arr.some(x => x.done && x.t === iso);
  }));
  if (hasSet) return true;
  if (state.runs.some(r => r.date === iso)) return true;
  const n = (wk.nutrition || {})[dayIdx] || {};
  return Object.keys(n).some(k => n[k]);
}
function streak(state){
  const today = toISO(new Date());
  let s = 0;
  for (let i = 0; i < 180; i++) {
    const d = addDays(today, -i);
    if (dayActive(state, d)) s++;
    else { if (i === 0) continue; break; }
  }
  return s;
}
function exerciseHistory(state, tplId, exId){
  return Object.keys(state.logs).sort().map(wk => {
    const arr = (((state.logs[wk] || {}).workouts || {})[tplId] || {})[exId] || [];
    let maxW = 0, vol = 0;
    arr.forEach(s => { const w = numOr0(s.w); if (w > maxW) maxW = w; vol += numOr0(s.w) * numOr0(s.r); });
    return { week: wk, maxW, vol: Math.round(vol) };
  }).filter(p => p.maxW > 0 || p.vol > 0);
}
function findPRs(state){
  const out = [];
  state.templates.forEach(tpl => tpl.exercises.forEach(ex => {
    const h = exerciseHistory(state, tpl.id, ex.id);
    if (h.length >= 2) {
      const last = h[h.length - 1];
      const bestPrev = Math.max.apply(null, h.slice(0, -1).map(p => p.maxW));
      if (last.maxW > bestPrev && bestPrev > 0) out.push({ icon:'🏋️', text: ex.name, from: bestPrev + ' ק"ג', to: last.maxW + ' ק"ג', week: last.week });
    }
  }));
  return out.sort((a, b) => a.week < b.week ? 1 : -1).slice(0, 8);
}
function runningInsights(state){
  const runs = state.runs.slice().sort((a, b) => a.date < b.date ? -1 : 1);
  const withPace = runs.filter(r => r.km > 0 && r.sec > 0);
  const today = toISO(new Date());
  const cur = weekStartISO(new Date());
  const weeks = [];
  for (let i = 7; i >= 0; i--) {
    const ws = addDays(cur, -7 * i), end = addDays(ws, 6);
    const km = runs.filter(r => r.date >= ws && r.date <= end).reduce((a, r) => a + r.km, 0);
    weeks.push({ label: 'ש' + weekNum(ws), v: Math.round(km * 10) / 10 });
  }
  if (!withPace.length) return { weeks, fastest:null, longest:null, paceDelta:null, recentPace:0, total: runs.reduce((a, r) => a + r.km, 0) };
  const fastest = withPace.reduce((b, r) => (r.sec / r.km) < (b.sec / b.km) ? r : b);
  const longest = runs.reduce((b, r) => r.km > b.km ? r : b);
  const d14 = addDays(today, -14), d28 = addDays(today, -28);
  const avg = a => { const km = a.reduce((x, r) => x + r.km, 0); return km > 0 ? a.reduce((x, r) => x + r.sec, 0) / km : 0; };
  const recentPace = avg(withPace.filter(r => r.date > d14));
  const prevPace = avg(withPace.filter(r => r.date > d28 && r.date <= d14));
  const paceDelta = (recentPace && prevPace) ? Math.round(prevPace - recentPace) : null;
  return { weeks, fastest, longest, paceDelta, recentPace, total: runs.reduce((a, r) => a + r.km, 0) };
}

/* generic dual-series line chart (A = solid volt w/ area, B = dashed ember, optional) */
function TrendChart({ data, fmtA, fmtB, unitA, unitB }){
  const [sel, setSel] = useState(data.length ? data.length - 1 : null);
  useEffect(() => { setSel(data.length ? data.length - 1 : null); }, [data.length, data.map(d => d.a).join(',')]);
  if (!data.length) return <div className="text-center py-8 text-white/25 text-sm">אין עדיין נתונים — תתחיל לרשום 💪</div>;
  const W = 640, H = 220, L = 42, R = 46, T = 14, B = 26;
  const fa = fmtA || (v => String(Math.round(v * 10) / 10));
  const fb = fmtB || (v => String(Math.round(v)));
  const amax = Math.max.apply(null, data.map(d => d.a).concat([1])) * 1.2;
  const hasB = data.some(d => d.b != null && d.b > 0);
  let bmin = 0, bmax = 1;
  if (hasB) {
    const bs = data.filter(d => d.b > 0).map(d => d.b);
    bmin = Math.min.apply(null, bs); bmax = Math.max.apply(null, bs);
    const p = Math.max((bmax - bmin) * .25, 1); bmin -= p; bmax += p;
  }
  const X = i => data.length === 1 ? (L + (W - L - R) / 2) : L + i * (W - L - R) / (data.length - 1);
  const Ya = v => H - B - (v / amax) * (H - T - B);
  const Yb = v => H - B - ((v - bmin) / (bmax - bmin)) * (H - T - B);
  const aPts = data.map((d, i) => X(i) + ',' + Ya(d.a)).join(' ');
  const bPts = hasB ? data.filter(d => d.b > 0).map((d) => X(data.indexOf(d)) + ',' + Yb(d.b)).join(' ') : '';
  const area = data.length > 1
    ? 'M' + X(0) + ',' + (H - B) + ' L' + data.map((d, i) => X(i) + ',' + Ya(d.a)).join(' L') + ' L' + X(data.length - 1) + ',' + (H - B) + ' Z'
    : '';
  const step = Math.max(1, Math.ceil(data.length / 6));
  const s = sel != null ? data[sel] : null;
  return (
    <div dir="ltr">
      <svg viewBox={'0 0 ' + W + ' ' + H} className="w-full select-none">
        <defs>
          <linearGradient id="gta" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stopColor="#CCFF00" stopOpacity=".24"/>
            <stop offset="100%" stopColor="#CCFF00" stopOpacity="0"/>
          </linearGradient>
        </defs>
        {[.33, .66, 1].map(f => {
          const v = amax * f, y = Ya(v);
          return (
            <g key={f}>
              <line x1={L} x2={W - R} y1={y} y2={y} stroke="rgba(255,255,255,.05)"/>
              <text x={L - 7} y={y + 3} textAnchor="end" fontSize="9" fill="rgba(204,255,0,.45)">{fa(v)}</text>
            </g>
          );
        })}
        {hasB && [.2, .8].map(f => {
          const v = bmin + (bmax - bmin) * f;
          return <text key={f} x={W - R + 7} y={Yb(v) + 3} fontSize="9" fill="rgba(255,90,31,.6)">{fb(v)}</text>;
        })}
        {area && <path d={area} fill="url(#gta)"/>}
        {hasB && data.filter(d => d.b > 0).length > 1 && <polyline points={bPts} fill="none" stroke="#FF5A1F" strokeWidth="2" strokeDasharray="5 4" strokeLinejoin="round" opacity=".85"/>}
        {data.length > 1 && <polyline points={aPts} fill="none" stroke="#CCFF00" strokeWidth="2.5" strokeLinejoin="round" style={{ filter:'drop-shadow(0 0 6px rgba(204,255,0,.5))' }}/>}
        {data.map((d, i) => (
          <g key={i}>
            {sel === i && <line x1={X(i)} x2={X(i)} y1={T} y2={H - B} stroke="rgba(255,255,255,.15)" strokeDasharray="3 3"/>}
            <circle cx={X(i)} cy={Ya(d.a)} r={sel === i ? 5 : 3.5} fill={sel === i ? '#CCFF00' : '#0B0B0C'} stroke="#CCFF00" strokeWidth="2"/>
            {hasB && d.b > 0 && <circle cx={X(i)} cy={Yb(d.b)} r={sel === i ? 4 : 3} fill={sel === i ? '#FF5A1F' : '#0B0B0C'} stroke="#FF5A1F" strokeWidth="1.5"/>}
            <rect x={X(i) - 14} y={T} width="28" height={H - T - B} fill="transparent" onClick={() => setSel(i)} style={{ cursor:'pointer' }}/>
          </g>
        ))}
        {data.map((d, i) => ((i % step === 0 || i === data.length - 1)
          ? <text key={'x' + i} x={X(i)} y={H - 8} textAnchor="middle" fontSize="9" fill="rgba(255,255,255,.35)">{d.label}</text>
          : null))}
      </svg>
      {s && (
        <div dir="rtl" className="mt-2 bg-black/30 rounded-2xl px-4 py-2 flex items-center justify-between gap-2 border border-white/5">
          <span className="text-xs font-bold text-white/50">{s.label}</span>
          <div className="flex gap-4 text-center">
            <div><span className="font-black text-volt">{fa(s.a)}</span><span className="text-[9px] text-white/40 ms-1">{unitA || ''}</span></div>
            {hasB && s.b > 0 && <div><span className="font-black text-ember">{fb(s.b)}</span><span className="text-[9px] text-white/40 ms-1">{unitB || ''}</span></div>}
          </div>
        </div>
      )}
    </div>
  );
}

/* ============================== rest timer ============================== */
function RestTimer(){
  const [total, setTotal] = useState(0);
  const [left, setLeft] = useState(0);
  const [flash, setFlash] = useState(false);
  const ctxRef = useRef(null);
  const flashTimer = useRef(null);

  /* iOS requires the AudioContext to be created/resumed inside a user gesture —
     we unlock it when a preset is tapped so the finish alarm is guaranteed to play */
  function unlockAudio(){
    try {
      if (!ctxRef.current) ctxRef.current = new (window.AudioContext || window.webkitAudioContext)();
      const ctx = ctxRef.current;
      if (ctx.state === 'suspended') ctx.resume();
      const o = ctx.createOscillator(), g = ctx.createGain();
      g.gain.value = 0.0001; o.connect(g); g.connect(ctx.destination);
      o.start(); o.stop(ctx.currentTime + 0.01);
    } catch (e) {}
  }
  const start = s => {
    unlockAudio();
    clearTimeout(flashTimer.current);
    setFlash(false); setTotal(s); setLeft(s);
  };
  useEffect(() => {
    if (left <= 0) return;
    const t = setTimeout(() => {
      const nl = left - 1;
      setLeft(nl);
      if (nl === 0) finish();
    }, 1000);
    return () => clearTimeout(t);
  }, [left]);
  function alarm(){
    try {
      if (!ctxRef.current) ctxRef.current = new (window.AudioContext || window.webkitAudioContext)();
      const ctx = ctxRef.current;
      if (ctx.state === 'suspended') ctx.resume();
      const ding = (t, f, vol) => {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = 'square';
        o.connect(g); g.connect(ctx.destination);
        o.frequency.value = f;
        g.gain.setValueAtTime(0.0001, ctx.currentTime + t);
        g.gain.exponentialRampToValueAtTime(vol, ctx.currentTime + t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + t + 0.22);
        o.start(ctx.currentTime + t); o.stop(ctx.currentTime + t + 0.3);
      };
      /* boxing-bell style: ding-ding-DING, twice */
      [0, .22, .44].forEach((t, i) => ding(t, i === 2 ? 1568 : 1046, .5));
      [1.1, 1.32, 1.54].forEach((t, i) => ding(t, i === 2 ? 1568 : 1046, .5));
    } catch (e) {}
  }
  function finish(){
    if (navigator.vibrate) { try { navigator.vibrate([300, 120, 300, 120, 600]); } catch (e) {} }
    alarm();
    setFlash(true);
    clearTimeout(flashTimer.current);
    flashTimer.current = setTimeout(() => setFlash(false), 6000);
  }
  return (
    <React.Fragment>
      <div className="glass rounded-2xl p-2.5 flex items-center gap-2">
        <span className="text-[11px] font-bold text-white/40 flex items-center gap-1 ps-1 shrink-0">
          <Icon d={I.timer} className="w-4 h-4 text-ember"/> מנוחה
        </span>
        {[60, 90, 120, 180].map(s => (
          <button key={s} onClick={() => start(s)}
                  className="flex-1 py-1.5 rounded-xl bg-white/5 text-sm font-bold active:scale-95 transition select-none">
            {fmtDur(s)}
          </button>
        ))}
      </div>
      {left > 0 && (
        <div className="fixed bottom-24 inset-x-0 z-50 flex justify-center pointer-events-none">
          <div className="pointer-events-auto flex items-center gap-3 rounded-full ps-5 pe-3 py-2.5 bg-gradient-to-l from-ember to-orange-600 shadow-2xl shadow-ember/40 fadein">
            <span className="font-black text-2xl text-white" style={{ fontVariantNumeric:'tabular-nums' }}>{fmtDur(left)}</span>
            <div className="w-24 h-1.5 bg-black/30 rounded-full overflow-hidden" dir="ltr">
              <div className="h-full bg-white rounded-full" style={{ width:(left / total * 100) + '%', transition:'width 1s linear' }}/>
            </div>
            <button onClick={() => setLeft(0)} className="w-7 h-7 rounded-full bg-black/25 flex items-center justify-center text-white">
              <Icon d={I.x} className="w-4 h-4"/>
            </button>
          </div>
        </div>
      )}
      {flash && left === 0 && (
        <div className="fixed bottom-24 inset-x-0 z-50 flex justify-center pointer-events-none">
          <button onClick={() => { clearTimeout(flashTimer.current); setFlash(false); }}
                  className="pointer-events-auto flex items-center gap-2 rounded-full px-6 py-3 bg-volt text-obsidian shadow-2xl glow-volt fadein font-black text-lg animate-pulse">
            ⏰ הזמן נגמר — סט חדש! 💪
          </button>
        </div>
      )}
    </React.Fragment>
  );
}

function SetRow({ s, i, prev, onField, onToggle }){
  const ph = f => (prev && prev.sets[i] && prev.sets[i][f] !== '' && prev.sets[i][f] != null) ? String(prev.sets[i][f]) : (f === 'w' ? 'ק"ג' : 'חזרות');
  return (

    const wk = (d.logs[week] = d.logs[week] || {});
    const wo = (wk.workouts = wk.workouts || {});
    const t = (wo[tpl.id] = wo[tpl.id] || {});

    while (arr.length <= idx) arr.push({ w:'', r:'', done:false });

      arr[idx].done = !arr[idx].done;

                <Icon d={I.chevUp} className="w-4 h-4"/>

function RunChart({ runs }){
  const data = useMemo(() => runs.slice().sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0).slice(-24), [runs]);
  const [sel, setSel] = useState(null);
  useEffect(() => { setSel(data.length ? data.length - 1 : null); }, [data.length]);
  if (data.length === 0) return (
    <div className="text-center py-10 text-white/30 text-sm">אין ריצות עדיין — רשום את הריצה הראשונה שלך 🏃</div>
  );
  const W = 640, H = 250, L = 40, R = 46, T = 16, B = 30;
  const kmMax = Math.max.apply(null, data.map(r => r.km).concat([1])) * 1.2;
  const paceOf = r => r.sec / Math.max(r.km, .01);
  const paces = data.map(paceOf);
  let pMin = Math.min.apply(null, paces), pMax = Math.max.apply(null, paces);
  const padP = Math.max((pMax - pMin) * .25, 20); pMin -= padP; pMax += padP;
  const X = i => data.length === 1 ? (L + (W - L - R) / 2) : L + i * (W - L - R) / (data.length - 1);
  const Ykm = v => H - B - (v / kmMax) * (H - T - B);
  const Yp = v => T + ((v - pMin) / (pMax - pMin)) * (H - T - B);
  const kmPts = data.map((r, i) => X(i) + ',' + Ykm(r.km)).join(' ');
  const pPts = data.map((r, i) => X(i) + ',' + Yp(paceOf(r))).join(' ');
  const area = data.length > 1
    ? 'M' + X(0) + ',' + (H - B) + ' L' + data.map((r, i) => X(i) + ',' + Ykm(r.km)).join(' L') + ' L' + X(data.length - 1) + ',' + (H - B) + ' Z'
    : '';
  const xLabelStep = Math.max(1, Math.ceil(data.length / 6));
  const selRun = sel != null ? data[sel] : null;
  return (
    <div dir="ltr">
      <svg viewBox={'0 0 ' + W + ' ' + H} className="w-full select-none">
        <defs>
          <linearGradient id="gkm" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stopColor="#CCFF00" stopOpacity=".26"/>
            <stop offset="100%" stopColor="#CCFF00" stopOpacity="0"/>
          </linearGradient>
        </defs>
        {[.25, .5, .75, 1].map(f => {
          const v = kmMax * f, y = Ykm(v);
          return (
            <g key={f}>
              <line x1={L} x2={W - R} y1={y} y2={y} stroke="rgba(255,255,255,.05)"/>
              <text x={L - 7} y={y + 3} textAnchor="end" fontSize="9" fill="rgba(204,255,0,.45)">{v.toFixed(1)}</text>
            </g>
          );
        })}
        {[.15, .5, .85].map(f => {
          const v = pMin + (pMax - pMin) * f;
          return <text key={f} x={W - R + 7} y={Yp(v) + 3} fontSize="9" fill="rgba(255,90,31,.6)">{fmtPace(v)}</text>;
        })}
        {area && <path d={area} fill="url(#gkm)"/>}
        {data.length > 1 && <polyline points={pPts} fill="none" stroke="#FF5A1F" strokeWidth="2" strokeDasharray="5 4" strokeLinejoin="round" opacity=".85"/>}
        {data.length > 1 && <polyline points={kmPts} fill="none" stroke="#CCFF00" strokeWidth="2.5" strokeLinejoin="round" style={{ filter:'drop-shadow(0 0 6px rgba(204,255,0,.5))' }}/>}
        {data.map((r, i) => (
          <g key={r.id}>
            {sel === i && <line x1={X(i)} x2={X(i)} y1={T} y2={H - B} stroke="rgba(255,255,255,.15)" strokeDasharray="3 3"/>}
            <circle cx={X(i)} cy={Ykm(r.km)} r={sel === i ? 5 : 3.5} fill={sel === i ? '#CCFF00' : '#0B0B0C'} stroke="#CCFF00" strokeWidth="2"/>
            <circle cx={X(i)} cy={Yp(paceOf(r))} r={sel === i ? 4 : 3} fill={sel === i ? '#FF5A1F' : '#0B0B0C'} stroke="#FF5A1F" strokeWidth="1.5"/>
            <rect x={X(i) - 14} y={T} width="28" height={H - T - B} fill="transparent" onClick={() => setSel(i)} style={{ cursor:'pointer' }}/>
          </g>
        ))}
        {data.map((r, i) => ((i % xLabelStep === 0 || i === data.length - 1)
          ? <text key={'x' + r.id} x={X(i)} y={H - 8} textAnchor="middle" fontSize="9" fill="rgba(255,255,255,.35)">
              {fromISO(r.date).getDate() + '.' + (fromISO(r.date).getMonth() + 1)}
            </text>
          : null))}
      </svg>
      {selRun && (
        <div dir="rtl" className="mt-2 bg-black/30 rounded-2xl px-4 py-2.5 flex items-center justify-between gap-2 fadein border border-white/5">
          <div className="min-w-0">
            <div className="font-bold text-sm truncate">{selRun.title}</div>
            <div className="text-[10px] text-white/40">{heDate(selRun.date)}</div>
          </div>
          <div className="flex gap-4 text-center shrink-0">
            <div><div className="font-black text-volt">{selRun.km}</div><div className="text-[9px] text-white/40">ק"מ</div></div>
            <div><div className="font-black text-ember">{fmtPace(paceOf(selRun))}</div><div className="text-[9px] text-white/40">קצב</div></div>
            <div><div className="font-black">{fmtDur(selRun.sec)}</div><div className="text-[9px] text-white/40">זמן</div></div>
          </div>
        </div>
      )}
    </div>
  );
}

function RunsTab({ state, week, mutate, stravaConnected, onOpenSettings }){
  const todayISO = toISO(new Date());
  const inWeek = todayISO >= week && todayISO <= addDays(week, 6);
  const [f, setF] = useState({ title:'', km:'', dur:'', date: inWeek ? todayISO : week });
  const [showAll, setShowAll] = useState(false);
  useEffect(() => { setF(x => Object.assign({}, x, { date: (todayISO >= week && todayISO <= addDays(week, 6)) ? todayISO : week })); }, [week]);

  const all = useMemo(() => state.runs.slice().sort((a, b) => a.date < b.date ? 1 : -1), [state.runs]);
  const weekRuns = all.filter(r => r.date >= week && r.date <= addDays(week, 6));
  const totKm = weekRuns.reduce((a, r) => a + r.km, 0);
  const totSec = weekRuns.reduce((a, r) => a + r.sec, 0);
  const avgPace = totKm > 0 ? totSec / totKm : 0;
  const bestPace = state.runs.length ? Math.min.apply(null, state.runs.map(r => r.sec / Math.max(r.km, .01))) : 0;

  const kmNum = numOr0(f.km), secNum = parseDur(f.dur);
  const addRun = () => {
    if (!(kmNum > 0)) { alert('הכנס מרחק בק"מ (למשל 5.0)'); return; }
    if (!(secNum > 0)) { alert('הכנס זמן ריצה (למשל 30:00)'); return; }
    if (!f.date) { alert('בחר תאריך'); return; }
    mutate(d => { d.runs.unshift({ id: uid(), date: f.date, title: f.title.trim() || 'ריצה', km: kmNum, sec: secNum, updatedAt: Date.now() }); });
    setF({ title:'', km:'', dur:'', date: f.date });
  };
  const delRun = r => {
    if (!confirm('למחוק את "' + r.title + '" (' + r.km + ' ק"מ)?')) return;
    mutate(d => { d.runs = d.runs.filter(x => x.id !== r.id); if (d.deletedRuns.indexOf(r.id) < 0) d.deletedRuns.push(r.id); });
  };

  const Stat = ({ v, l, accent }) => (
    <div className="glass rounded-2xl py-2.5 text-center">
      <div className={'font-black text-lg leading-none ' + (accent || '')}>{v}</div>
      <div className="text-[9px] text-white/40 mt-1">{l}</div>
    </div>
  );

  const RunRow = ({ r }) => (
    <div className="glass rounded-2xl p-3 flex items-center gap-3">
      <div className={'w-9 h-9 rounded-xl flex items-center justify-center shrink-0 ' + (r.src === 'strava' ? 'bg-strava/15 text-strava' : 'bg-ember/15 text-ember')}>
        <Icon d={I.activity} className="w-4 h-4"/>
      </div>
      <div className="flex-1 min-w-0">
        <div className="flex items-center gap-1.5 min-w-0">
          <span className="font-bold text-sm truncate">{r.title}</span>
          {r.src === 'strava' && <span className="text-[8px] font-black text-strava bg-strava/10 border border-strava/25 rounded-full px-1.5 py-0.5 shrink-0">STRAVA</span>}
        </div>
        <div className="text-[10px] text-white/40">{heDate(r.date)}</div>
      </div>
      <div className="flex gap-3 text-center shrink-0">
        <div><div className="font-black text-volt text-sm">{r.km}</div><div className="text-[8px] text-white/40">ק"מ</div></div>
        <div><div className="font-black text-ember text-sm">{fmtPace(r.sec / Math.max(r.km, .01))}</div><div className="text-[8px] text-white/40">קצב</div></div>
        <div><div className="font-black text-sm">{fmtDur(r.sec)}</div><div className="text-[8px] text-white/40">זמן</div></div>
      </div>
      <button onClick={() => delRun(r)} className="w-8 h-8 rounded-lg text-white/25 flex items-center justify-center active:scale-90 transition shrink-0">
        <Icon d={I.trash} className="w-3.5 h-3.5"/>
      </button>
    </div>
  );

  return (
    <div className="fadein space-y-3">
      <div className="glass rounded-3xl p-4 space-y-2.5">
        <div className="flex items-center justify-between">
          <div className="font-bold flex items-center gap-2">
            <span className="w-7 h-7 rounded-xl bg-ember/20 text-ember flex items-center justify-center"><Icon d={I.plus} className="w-4 h-4"/></span>
            ריצה חדשה
            <span className="text-[10px] text-white/30 font-normal">אין הגבלה — כמה שבא לך 🔥</span>
          </div>
          {!stravaConnected && (
            <button onClick={onOpenSettings} className="text-[10px] font-black text-strava bg-strava/10 border border-strava/25 rounded-full px-2.5 py-1 active:scale-95 transition">חבר STRAVA</button>
          )}
        </div>
        <input className="inp" placeholder="כותרת (למשל: ריצת בוקר קלה)" value={f.title} onChange={e => setF({ ...f, title: e.target.value })}/>
        <div className="grid grid-cols-3 gap-2">
          <div><label className="lbl">מרחק (ק"מ)</label>
            <input className="inp text-center font-bold" inputMode="decimal" placeholder="5.0" value={f.km} onChange={e => setF({ ...f, km: e.target.value })}/></div>
          <div><label className="lbl">זמן (דק:שנ)</label>
            <input className="inp text-center font-bold" inputMode="numeric" placeholder="30:00" value={f.dur} onChange={e => setF({ ...f, dur: e.target.value })}/></div>
          <div><label className="lbl">תאריך</label>
            <input type="date" className="inp text-center" value={f.date} onChange={e => setF({ ...f, date: e.target.value })}/></div>
        </div>
        <div className="flex items-center justify-between bg-black/25 rounded-2xl px-4 py-2.5 border border-white/5">
          <span className="text-xs text-white/40">קצב מחושב</span>
          <span className="font-black text-xl text-volt text-glow">{(kmNum > 0 && secNum > 0) ? fmtPace(secNum / kmNum) : '—'}<span className="text-[10px] text-white/40 font-normal ms-1">דק' / ק"מ</span></span>
        </div>
        <button onClick={addRun}
                className="w-full py-3 rounded-2xl bg-volt text-obsidian font-black text-lg active:scale-[.98] transition glow-volt">
          הוסף ריצה ⚡
        </button>
      </div>

      <div className="grid grid-cols-4 gap-2">
        <Stat v={totKm ? totKm.toFixed(1) : '0'} l={'ק"מ השבוע'} accent="text-volt"/>
        <Stat v={weekRuns.length} l="ריצות השבוע"/>
        <Stat v={fmtPace(avgPace)} l="קצב ממוצע" accent="text-ember"/>
        <Stat v={fmtPace(bestPace)} l="שיא קצב"/>
      </div>

      <div className="glass rounded-3xl p-4">
        <div className="flex items-center justify-between mb-1">
          <div className="font-black italic">מגמות ביצועים</div>
          <div className="flex gap-3 text-[10px] font-bold">
            <span className="flex items-center gap-1 text-volt"><span className="w-2.5 h-0.5 bg-volt inline-block rounded-full"></span> מרחק</span>
            <span className="flex items-center gap-1 text-ember"><span className="w-2.5 h-0.5 bg-ember inline-block rounded-full"></span> קצב</span>
          </div>
        </div>
        <RunChart runs={state.runs}/>
      </div>

      <div className="flex items-center justify-between px-1 pt-1">
        <span className="text-white/40 text-xs font-bold">{showAll ? 'כל ההיסטוריה (' + all.length + ')' : 'ריצות השבוע (' + weekRuns.length + ')'}</span>
        <button onClick={() => setShowAll(!showAll)} className="text-volt text-xs font-bold active:scale-95 transition">{showAll ? 'הצג שבוע נוכחי' : 'הצג הכל'}</button>
      </div>
      {(showAll ? all : weekRuns).map(r => <RunRow key={r.id} r={r}/>)}
      {(showAll ? all : weekRuns).length === 0 && (
        <div className="text-center py-6 text-white/25 text-sm">אין ריצות בשבוע הזה</div>
      )}
    </div>
  );
}

/* ============================== nutrition ============================== */
function NutritionTab({ state, week, mutate }){
  const todayISO = toISO(new Date());
  const isCur = weekStartISO(new Date()) === week;
  const [day, setDay] = useState(isCur ? new Date().getDay() : 0);
  const [edit, setEdit] = useState(false);
  useEffect(() => { setDay(weekStartISO(new Date()) === week ? new Date().getDay() : 0); }, [week]);

  const nut = (state.logs[week] || {}).nutrition || {};
  const checks = nut[day] || {};
  const doneCount = state.meals.filter(m => checks[m.id]).length;
  const weekDone = DAYS_HE.reduce((a, _, i) => a + state.meals.filter(m => (nut[i] || {})[m.id]).length, 0);
  const weekTotal = Math.max(1, 7 * state.meals.length);
  const weekPct = Math.round(weekDone / weekTotal * 100);

  const toggleAt = (di, mealId) => mutate(d => {
    const wk = (d.logs[week] = d.logs[week] || {});
    const n = (wk.nutrition = wk.nutrition || {});
    const dd = (n[di] = n[di] || {});
    dd[mealId] = !dd[mealId];
  }, ['week', week]);

  const updMeal = (id, patch) => mutate(d => { Object.assign(d.meals.find(m => m.id === id), patch); }, 'meals');
  const delMeal = id => {
    const m = state.meals.find(x => x.id === id);
    if (!confirm('למחוק את "' + (m ? m.title : '') + '"?')) return;
    mutate(d => { d.meals = d.meals.filter(x => x.id !== id); }, 'meals');
  };
  const addMeal = () => mutate(d => { d.meals.push({ id: uid(), icon:'🍽️', title:'ארוחה חדשה', desc:'' }); }, 'meals');
  const moveMeal = (id, dir) => mutate(d => {
    const i = d.meals.findIndex(m => m.id === id), j = i + dir;
    if (i < 0 || j < 0 || j >= d.meals.length) return;
    const tmp = d.meals[i]; d.meals[i] = d.meals[j]; d.meals[j] = tmp;
  }, 'meals');

  return (
    <div className="fadein space-y-3">
      <div className="glass rounded-3xl p-5">
        <div className="flex items-center justify-between">
          <div>
            <h2 className="text-xl font-black italic leading-none">LEAN BULK</h2>
            <div className="text-white/40 text-xs mt-1">צ'קליסט תזונה יומי</div>
          </div>
          <div className="relative w-[64px] h-[64px]">
            <Ring pct={doneCount / Math.max(1, state.meals.length)} size={64} stroke={5}/>
            <div className="absolute inset-0 flex flex-col items-center justify-center">
              <span className="font-black text-xl leading-none">{doneCount}</span>
              <span className="text-[8px] text-white/40">מתוך {state.meals.length}</span>
            </div>
          </div>
        </div>
        <div className="grid grid-cols-7 gap-1.5 mt-4">
          {DAYS_HE.map((d, i) => {
            const iso = addDays(week, i);
            const c = state.meals.filter(m => (nut[i] || {})[m.id]).length;
            const full = c === state.meals.length && c > 0;
            const active = day === i;
            return (
              <button key={i} onClick={() => setDay(i)}
                      className={'rounded-xl py-1.5 flex flex-col items-center transition active:scale-95 ' + (active ? 'bg-volt text-obsidian glow-volt' : 'bg-white/5 text-white/60')}>
                <span className="text-sm font-black leading-none">{d}</span>
                <span className={'text-[9px] mt-0.5 ' + (active ? 'text-obsidian/60' : (iso === todayISO ? 'text-volt' : 'text-white/30'))}>{fromISO(iso).getDate()}</span>
                <span className={'mt-1 w-1 h-1 rounded-full ' + (full ? (active ? 'bg-obsidian' : 'bg-volt') : (c > 0 ? 'bg-ember' : 'bg-transparent'))}></span>
              </button>
            );
          })}
        </div>
        <div className="mt-3.5 flex items-center gap-2">
          <div className="flex-1 h-1.5 bg-white/5 rounded-full overflow-hidden">
            <div className="h-full rounded-full bg-gradient-to-l from-volt to-lime-300 transition-all duration-500" style={{ width: weekPct + '%' }}/>
          </div>
          <span className="text-[10px] text-white/40 font-bold shrink-0">{weekPct}% שבועי</span>
        </div>
      </div>

      <div className="flex items-center justify-between px-1">
        <span className="text-white/40 text-xs font-bold">{DAYS_FULL[day]} · {(() => { const d = fromISO(addDays(week, day)); return d.getDate() + '.' + (d.getMonth() + 1); })()}</span>
        <button onClick={() => setEdit(!edit)}
                className={'h-8 px-3 rounded-xl flex items-center gap-1.5 text-xs font-bold active:scale-95 transition ' + (edit ? 'bg-volt text-obsidian' : 'bg-white/5 text-white/50')}>
          <Icon d={edit ? I.check : I.pencil} className="w-3.5 h-3.5"/>{edit ? 'סיום' : 'עריכה'}
        </button>
      </div>

      {state.meals.map((m, mi) => {
        const done = !!checks[m.id];
        if (edit) return (
          <div key={m.id} className="glass rounded-3xl p-4 space-y-2 fadein">
            <div className="flex gap-2">
              <input className="inp w-16 text-center text-xl" value={m.icon} onChange={e => updMeal(m.id, { icon: e.target.value })}/>
              <input className="inp flex-1 min-w-0 font-bold" value={m.title} onChange={e => updMeal(m.id, { title: e.target.value })}/>
            </div>
            <textarea className="inp leading-relaxed" rows="3" value={m.desc} placeholder="פירוט הארוחה..." onChange={e => updMeal(m.id, { desc: e.target.value })}/>
            <div className="flex gap-1.5">
              <button onClick={() => moveMeal(m.id, -1)} disabled={mi === 0}
                      className="w-10 h-9 rounded-xl bg-white/5 border border-white/10 text-white/60 flex items-center justify-center active:scale-90 transition disabled:opacity-15">
                <Icon d={I.chevUp} className="w-4 h-4"/>
              </button>
              <button onClick={() => moveMeal(m.id, 1)} disabled={mi === state.meals.length - 1}
                      className="w-10 h-9 rounded-xl bg-white/5 border border-white/10 text-white/60 flex items-center justify-center active:scale-90 transition disabled:opacity-15">
                <Icon d={I.chevDown} className="w-4 h-4"/>
              </button>
              <div className="flex-1"></div>
              <button onClick={() => delMeal(m.id)} className="w-10 h-9 rounded-xl bg-ember/15 text-ember flex items-center justify-center active:scale-90 transition">
                <Icon d={I.trash} className="w-4 h-4"/>
              </button>
            </div>
          </div>
        );
        return (
          <button key={m.id} onClick={() => toggleAt(day, m.id)}
                  className={'w-full text-start rounded-3xl p-4 flex gap-3 items-start transition active:scale-[.985] border ' + (done ? 'bg-volt/10 border-volt/25' : 'glass border-transparent')}>
            <div className={'w-7 h-7 rounded-full border-2 flex items-center justify-center shrink-0 mt-0.5 transition ' + (done ? 'bg-volt border-volt text-obsidian glow-volt' : 'border-white/15 text-transparent')}>
              <Icon d={I.check} className="w-4 h-4"/>
            </div>
            <span className="text-2xl leading-none mt-0.5">{m.icon}</span>
            <div className="min-w-0">
              <div className={'font-bold leading-snug ' + (done ? 'text-volt' : '')}>{m.title}</div>
              <div className={'text-xs leading-relaxed mt-1 ' + (done ? 'text-white/30' : 'text-white/45')}>{m.desc}</div>
            </div>
          </button>
        );
      })}

      {edit && (
        <button onClick={addMeal} className="w-full glass rounded-3xl py-4 text-volt font-bold flex items-center justify-center gap-2 active:scale-[.98] transition">
          <Icon d={I.plus} className="w-5 h-5"/> הוסף ארוחה
        </button>
      )}

      <div className="glass rounded-3xl p-4">
        <div className="text-xs font-bold text-white/40 mb-3">מפת השבוע · לחיצה על תא מסמנת</div>
        <div className="grid gap-1" style={{ gridTemplateColumns:'28px repeat(7, 1fr)' }}>
          <div></div>
          {DAYS_HE.map((d, i) => <div key={i} className="text-center text-[10px] font-bold text-white/40">{d}</div>)}
          {state.meals.map(m => (
            <React.Fragment key={m.id}>
              <div className="flex items-center justify-center text-sm">{m.icon}</div>
              {DAYS_HE.map((_, di) => {
                const on = !!((nut[di] || {})[m.id]);
                return (
                  <button key={di} onClick={() => toggleAt(di, m.id)}
                          className={'h-7 rounded-lg transition active:scale-90 ' + (on ? 'bg-volt/80 glow-volt' : 'bg-white/5')}></button>
                );
              })}
            </React.Fragment>
          ))}
        </div>
      </div>
    </div>
  );
}

/* ============================== dashboard ============================== */
function Dashboard({ state, setTab, setOpenTpl, setWeek }){
  const today = toISO(new Date());
  const ts = todayStats(state);
  const st = streak(state);
  const week = weekStartISO(new Date());
  const latestW = state.weights.length ? state.weights[0] : null;
  const prevW = state.weights.length > 1 ? state.weights[1] : null;
  const latestPhoto = state.photos.length ? state.photos.slice().sort((a, b) => a.date < b.date ? 1 : -1)[0] : null;
  const name = state.settings.name;

  const go = (tab) => { setWeek(week); setTab(tab); };
  const openWorkout = id => { setWeek(week); setOpenTpl(id); setTab('workouts'); };

  const QA = ({ icon, label, tab, color }) => (
    <button onClick={() => go(tab)} className="glass rounded-2xl py-3 flex flex-col items-center gap-1.5 active:scale-95 transition">
      <div className={color}><Icon d={icon} className="w-5 h-5"/></div>
      <span className="text-[10px] font-bold text-white/60">{label}</span>
    </button>
  );

  return (
    <div className="fadein space-y-3">
      <div className="glass rounded-3xl p-5 relative overflow-hidden">
        <div className="absolute -end-4 -bottom-10 text-[130px] leading-none opacity-[.05] select-none" style={{ transform:'rotate(12deg)' }}>⚡</div>
        <div className="flex items-start justify-between relative">
          <div>
            <div className="text-white/40 text-xs">{greet()},</div>
            <div className="text-2xl font-black italic leading-tight">{name || 'אלוף'} 👊</div>
            <div className="text-[11px] text-white/35 mt-1">{heDate(today)}</div>
          </div>
          {st >= 2 && (
            <div className="flex items-center gap-1.5 bg-ember/15 border border-ember/25 rounded-full ps-2.5 pe-3 py-1.5">
              <Icon d={I.flame} className="w-4 h-4 text-ember"/>
              <span className="text-sm font-black text-ember">{st}</span>
              <span className="text-[9px] text-ember/70 font-bold">ימים ברצף</span>
            </div>
          )}
        </div>
        <div className="grid grid-cols-3 gap-2 mt-4 relative">
          <div className="bg-black/30 rounded-2xl py-2.5 text-center">
            <div className="font-black text-xl text-volt">{ts.sets}</div>
            <div className="text-[9px] text-white/40 mt-0.5">סטים היום</div>
          </div>
          <div className="bg-black/30 rounded-2xl py-2.5 text-center">
            <div className="font-black text-xl text-ember">{ts.km ? ts.km.toFixed(1) : 0}</div>
            <div className="text-[9px] text-white/40 mt-0.5">ק"מ היום</div>
          </div>
          <div className="bg-black/30 rounded-2xl py-2.5 text-center">
            <div className="font-black text-xl">{ts.meals}<span className="text-white/30 text-sm">/{state.meals.length}</span></div>
            <div className="text-[9px] text-white/40 mt-0.5">ארוחות היום</div>
          </div>
        </div>
      </div>

      <div className="grid grid-cols-4 gap-2">
        <QA icon={I.dumbbell} label="התחל אימון" tab="workouts" color="text-volt"/>
        <QA icon={I.activity} label="רשום ריצה" tab="runs" color="text-ember"/>
        <QA icon={I.clipboard} label="צ'קליסט" tab="food" color="text-volt"/>
        <QA icon={I.camera} label="התקדמות" tab="progress" color="text-ember"/>
      </div>

      <div className="glass rounded-3xl p-4">
        <div className="font-black italic mb-2.5">מה עשית היום</div>
        {(ts.perTpl.length === 0 && ts.runs.length === 0 && ts.meals === 0) ? (
          <div className="text-center py-5">
            <div className="text-3xl mb-1.5">😴</div>
            <div className="text-white/40 text-sm font-bold">עוד לא רשמת כלום היום</div>
            <div className="text-white/25 text-xs mt-0.5">יאללה, הברזל לא ירים את עצמו 🔥</div>
          </div>
        ) : (
          <div className="space-y-1.5">
            {ts.perTpl.map(p => (
              <button key={p.tpl.id} onClick={() => openWorkout(p.tpl.id)} className="w-full flex items-center gap-3 bg-black/25 border border-white/5 rounded-2xl p-3 active:scale-[.985] transition text-start">
                <span className="text-2xl">{p.tpl.icon}</span>
                <div className="flex-1 min-w-0">
                  <div className="font-bold text-sm">{p.tpl.name}</div>
                  <div className="text-[10px] text-white/40">{p.sets} סטים · {p.ton.toLocaleString()} ק"ג נפח</div>
                </div>
                <Icon d={I.chevL} className="w-4 h-4 text-white/25"/>
              </button>
            ))}
            {ts.runs.map(r => (
              <div key={r.id} className="flex items-center gap-3 bg-black/25 border border-white/5 rounded-2xl p-3">
                <span className="text-2xl">🏃</span>
                <div className="flex-1 min-w-0">
                  <div className="font-bold text-sm truncate">{r.title}</div>
                  <div className="text-[10px] text-white/40">{r.km} ק"מ · {fmtPace(r.sec / Math.max(r.km, .01))} דק'/ק"מ · {fmtDur(r.sec)}</div>
                </div>
                {r.src === 'strava' && <span className="text-[8px] font-black text-strava bg-strava/10 border border-strava/25 rounded-full px-1.5 py-0.5">STRAVA</span>}
              </div>
            ))}
            {ts.meals > 0 && (
              <button onClick={() => go('food')} className="w-full flex items-center gap-3 bg-black/25 border border-white/5 rounded-2xl p-3 active:scale-[.985] transition text-start">
                <span className="text-2xl">🥗</span>
                <div className="flex-1">
                  <div className="font-bold text-sm">תזונה</div>
                  <div className="text-[10px] text-white/40">{ts.meals} מתוך {state.meals.length} ארוחות סומנו</div>
                </div>
                <div className="relative w-[30px] h-[30px]">
                  <Ring pct={ts.meals / Math.max(1, state.meals.length)} size={30} stroke={3}/>
                </div>
              </button>
            )}
          </div>
        )}
      </div>

      <div>
        <div className="text-white/40 text-xs font-bold mb-2 px-1">האימונים של השבוע</div>
        <WeekChips state={state} week={week} onOpen={openWorkout}/>
      </div>

      <div className="grid grid-cols-2 gap-2">
        <button onClick={() => go('progress')} className="glass rounded-3xl p-4 text-start active:scale-[.985] transition">
          <div className="flex items-center gap-2 text-white/40 text-[10px] font-bold"><Icon d={I.scale} className="w-3.5 h-3.5"/> משקל גוף</div>
          {latestW ? (
            <div className="mt-1.5">
              <span className="font-black text-2xl">{latestW.kg}</span>
              <span className="text-xs text-white/40 ms-1">ק"ג</span>
              {prevW && (
                <span className={'text-[10px] font-bold ms-2 ' + (latestW.kg - prevW.kg >= 0 ? 'text-volt' : 'text-ember')}>
                  {latestW.kg - prevW.kg >= 0 ? '+' : ''}{Math.round((latestW.kg - prevW.kg) * 10) / 10}
                </span>
              )}
            </div>
          ) : <div className="mt-1.5 text-white/25 text-sm font-bold">הוסף שקילה ←</div>}
        </button>
        <button onClick={() => go('progress')} className="glass rounded-3xl p-4 text-start active:scale-[.985] transition flex items-center gap-3">
          {latestPhoto ? (
            <React.Fragment>
              <img src={latestPhoto.thumb} className="w-12 h-12 rounded-xl object-cover border border-white/10" alt=""/>
              <div>
                <div className="text-white/40 text-[10px] font-bold">תמונה אחרונה</div>
                <div className="text-xs font-bold mt-0.5">{heDate(latestPhoto.date).split(' · ')[1]}</div>
              </div>
            </React.Fragment>
          ) : (
            <React.Fragment>
              <div className="w-12 h-12 rounded-xl bg-white/5 flex items-center justify-center"><Icon d={I.camera} className="w-5 h-5 text-white/25"/></div>
              <div className="text-white/25 text-sm font-bold">צלם התקדמות ←</div>
            </React.Fragment>
          )}
        </button>
      </div>
    </div>
  );
}

/* ============================== progress ============================== */
function PhotoViewer({ photo, onClose, onDelete, loadPhoto }){
  const [src, setSrc] = useState(photo.thumb);
  const [loading, setLoading] = useState(true);
  useEffect(() => {
    let alive = true;
    setSrc(photo.thumb); setLoading(true);
    loadPhoto(photo).then(full => { if (alive) { if (full) setSrc(full); setLoading(false); } }).catch(() => alive && setLoading(false));
    return () => { alive = false; };
  }, [photo.id]);
  return (
    <div className="fixed inset-0 z-50 bg-black/95 flex flex-col fadein" onClick={onClose}>
      <div className="flex items-center justify-between p-4" style={{ paddingTop:'max(env(safe-area-inset-top), 16px)' }}>
        <button onClick={onClose} className="w-10 h-10 rounded-full bg-white/10 flex items-center justify-center"><Icon d={I.x} className="w-5 h-5"/></button>
        <div className="text-sm font-bold">{heDate(photo.date)}</div>
        <button onClick={e => { e.stopPropagation(); onDelete(photo); }} className="w-10 h-10 rounded-full bg-ember/20 text-ember flex items-center justify-center"><Icon d={I.trash} className="w-4 h-4"/></button>
      </div>
      <div className="flex-1 flex items-center justify-center p-4 relative">
        <img src={src} className="max-w-full max-h-full rounded-2xl object-contain" alt="" style={{ filter: loading ? 'blur(6px)' : 'none', transition:'filter .3s' }}/>
        {loading && <div className="absolute inset-0 flex items-center justify-center"><Icon d={I.refresh} className="w-7 h-7 text-volt spin"/></div>}
      </div>
    </div>
  );
}

function ProgressTab({ state, mutate, loadPhoto, addPhoto, delPhoto }){
  const flat = useMemo(() => {
    const arr = [];
    state.templates.forEach(tpl => tpl.exercises.forEach(ex => arr.push({ tpl, ex })));
    return arr;
  }, [state.templates]);
  const firstWithData = useMemo(() => {
    const f = flat.find(p => exerciseHistory(state, p.tpl.id, p.ex.id).length > 0);
    return f || flat[0];
  }, []);
  const [selEx, setSelEx] = useState(firstWithData ? firstWithData.tpl.id + '|' + firstWithData.ex.id : '');
  const [kg, setKg] = useState('');
  const [viewPhoto, setViewPhoto] = useState(null);
  const fileRef = useRef(null);

  const prs = useMemo(() => findPRs(state), [state.logs, state.templates]);
  const ri = useMemo(() => runningInsights(state), [state.runs]);

  const pair = selEx ? selEx.split('|') : null;
  const selPair = pair ? flat.find(p => p.tpl.id === pair[0] && p.ex.id === pair[1]) : null;
  const hist = selPair ? exerciseHistory(state, selPair.tpl.id, selPair.ex.id) : [];
  const strengthData = hist.slice(-16).map(h => ({ label:'ש' + weekNum(h.week), a: h.maxW, b: h.vol }));

  const weightData = state.weights.slice().sort((a, b) => a.date < b.date ? -1 : 1).slice(-20)
    .map(w => ({ label: fromISO(w.date).getDate() + '.' + (fromISO(w.date).getMonth() + 1), a: w.kg, b: 0 }));
  const latestW = state.weights.length ? state.weights[0] : null;
  const h = numOr0(state.settings.height);
  const bmi = (latestW && h > 0) ? Math.round(latestW.kg / Math.pow(h / 100, 2) * 10) / 10 : null;

  const addWeight = () => {
    const v = numOr0(kg);
    if (!(v > 20 && v < 400)) { alert('הכנס משקל תקין בק"ג'); return; }
    mutate(d => { d.weights.unshift({ id: uid(), date: toISO(new Date()), kg: v, updatedAt: Date.now() }); d.weights.sort((a, b) => a.date < b.date ? 1 : -1); });
    setKg('');
  };
  const delWeight = w => {
    if (!confirm('למחוק שקילה של ' + w.kg + ' ק"ג?')) return;
    mutate(d => { d.weights = d.weights.filter(x => x.id !== w.id); if (d.deletedWeights.indexOf(w.id) < 0) d.deletedWeights.push(w.id); });
  };
  const onFile = e => {
    const file = e.target.files && e.target.files[0];
    if (file) addPhoto(file);
    e.target.value = '';
  };

  const photosSorted = state.photos.slice().sort((a, b) => a.date < b.date ? 1 : -1);

  return (
    <div className="fadein space-y-3">
      {/* ---- PRs ---- */}
      <div className="glass rounded-3xl p-4">
        <div className="font-black italic mb-2.5 flex items-center gap-2"><Icon d={I.trend} className="w-5 h-5 text-volt"/> הישגים אחרונים</div>
        {prs.length === 0 && (!ri || ri.paceDelta == null) ? (
          <div className="text-white/30 text-sm text-center py-3">ברגע שתעלה משקלים או תשתפר בריצה — זה יופיע כאן 📈</div>
        ) : (
          <div className="space-y-1.5">
            {ri && ri.paceDelta != null && ri.paceDelta !== 0 && (
              <div className="flex items-center gap-3 bg-black/25 border border-white/5 rounded-2xl p-3">
                <span className="text-xl">🏃</span>
                <div className="flex-1 text-sm font-bold">קצב ריצה (14 יום אחרונים)</div>
                <span className={'text-xs font-black ' + (ri.paceDelta > 0 ? 'text-volt' : 'text-ember')}>
                  {ri.paceDelta > 0 ? 'מהיר ב־' + ri.paceDelta + ' שנ׳/ק"מ ↑' : 'איטי ב־' + Math.abs(ri.paceDelta) + ' שנ׳/ק"מ'}
                </span>
              </div>
            )}
            {prs.map((p, i) => (
              <div key={i} className="flex items-center gap-3 bg-black/25 border border-white/5 rounded-2xl p-3">
                <span className="text-xl">{p.icon}</span>
                <div className="flex-1 min-w-0">
                  <div className="text-sm font-bold truncate">{p.text}</div>
                  <div className="text-[10px] text-white/40">שבוע {weekNum(p.week)}</div>
                </div>
                <span className="text-xs font-black text-white/40">{p.from}</span>
                <Icon d={I.chevL} className="w-3.5 h-3.5 text-volt"/>
                <span className="text-xs font-black text-volt">{p.to}</span>
              </div>
            ))}
          </div>
        )}
      </div>

      {/* ---- strength ---- */}
      <div className="glass rounded-3xl p-4">
        <div className="font-black italic mb-2.5">התקדמות בכוח 🏋️</div>
        <select className="inp mb-2" value={selEx} onChange={e => setSelEx(e.target.value)}>
          {state.templates.map(tpl => (
            <optgroup key={tpl.id} label={tpl.name}>
              {tpl.exercises.map(ex => <option key={ex.id} value={tpl.id + '|' + ex.id}>{ex.name}</option>)}
            </optgroup>
          ))}
        </select>
        <div className="flex gap-3 text-[10px] font-bold mb-1">
          <span className="flex items-center gap-1 text-volt"><span className="w-2.5 h-0.5 bg-volt inline-block rounded-full"></span> משקל שיא (ק"ג)</span>
          <span className="flex items-center gap-1 text-ember"><span className="w-2.5 h-0.5 bg-ember inline-block rounded-full"></span> נפח שבועי</span>
        </div>
        <TrendChart data={strengthData} unitA={'ק"ג'} unitB={'ק"ג נפח'}/>
      </div>

      {/* ---- running ---- */}
      <div className="glass rounded-3xl p-4">
        <div className="font-black italic mb-2.5">התקדמות בריצה 🏃</div>
        <div className="grid grid-cols-3 gap-2 mb-3">
          <div className="bg-black/25 rounded-2xl py-2.5 text-center border border-white/5">
            <div className="font-black text-ember">{ri && ri.fastest ? fmtPace(ri.fastest.sec / ri.fastest.km) : '—'}</div>
            <div className="text-[9px] text-white/40 mt-0.5">שיא קצב</div>
          </div>
          <div className="bg-black/25 rounded-2xl py-2.5 text-center border border-white/5">
            <div className="font-black text-volt">{ri && ri.longest ? ri.longest.km : '—'}</div>
            <div className="text-[9px] text-white/40 mt-0.5">ריצה הכי ארוכה</div>
          </div>
          <div className="bg-black/25 rounded-2xl py-2.5 text-center border border-white/5">
            <div className="font-black">{ri ? Math.round(ri.total * 10) / 10 : 0}</div>
            <div className="text-[9px] text-white/40 mt-0.5">סה"כ ק"מ</div>
          </div>
        </div>
        <div className="text-[10px] font-bold text-white/40 mb-1">ק"מ לפי שבוע (8 שבועות אחרונים)</div>
        {ri && <BarChart items={ri.weeks}/>}
      </div>

      {/* ---- body ---- */}
      <div className="glass rounded-3xl p-4">
        <div className="flex items-center justify-between mb-2.5">
          <div className="font-black italic">מעקב גוף ⚖️</div>
          {bmi && <span className="text-[10px] font-bold text-white/40 bg-white/5 rounded-full px-2.5 py-1">BMI {bmi}</span>}
        </div>
        <div className="flex gap-2 mb-3">
          <input className="inp flex-1 text-center font-bold" inputMode="decimal" placeholder={latestW ? 'שקילה חדשה (אחרונה: ' + latestW.kg + ')' : 'משקל בק"ג (למשל 78.5)'}
                 value={kg} onChange={e => setKg(e.target.value)}/>
          <button onClick={addWeight} className="px-5 rounded-2xl bg-volt text-obsidian font-black active:scale-95 transition">שמור</button>
        </div>
        {weightData.length > 0
          ? <TrendChart data={weightData} unitA={'ק"ג'} fmtA={v => String(Math.round(v * 10) / 10)}/>
          : <div className="text-white/25 text-xs text-center py-2">רשום שקילה ראשונה כדי לראות את הגרף</div>}
        {state.weights.slice(0, 5).map(w => (
          <div key={w.id} className="flex items-center justify-between border-t border-white/5 py-2 first:border-0">
            <span className="text-xs text-white/40">{heDate(w.date)}</span>
            <div className="flex items-center gap-2">
              <span className="font-black">{w.kg} <span className="text-[10px] text-white/40 font-normal">ק"ג</span></span>
              <button onClick={() => delWeight(w)} className="text-white/20 active:scale-90 transition"><Icon d={I.trash} className="w-3.5 h-3.5"/></button>
            </div>
          </div>
        ))}
      </div>

      {/* ---- photos ---- */}
      <div className="glass rounded-3xl p-4">
        <div className="flex items-center justify-between mb-3">
          <div className="font-black italic">גלריית התקדמות 📸</div>
          <button onClick={() => fileRef.current && fileRef.current.click()}

            <Icon d={I.camera} className="w-4 h-4"/> צלם / העלה
          </button>
          <input ref={fileRef} type="file" accept="image/*" capture="environment" className="hidden" onChange={onFile}/>
        </div>
        {photosSorted.length === 0 ? (
          <div className="text-center py-6">
            <div className="text-3xl mb-1.5">📷</div>
            <div className="text-white/40 text-sm font-bold">אין תמונות עדיין</div>
            <div className="text-white/25 text-xs mt-0.5">צלם תמונה אחרי אימון — עוד חודשיים תגיד תודה</div>
          </div>
        ) : (
          <div className="grid grid-cols-3 gap-2">
            {photosSorted.map(p => (
              <button key={p.id} onClick={() => setViewPhoto(p)} className="relative rounded-2xl overflow-hidden active:scale-95 transition" style={{ aspectRatio:'1' }}>
                <img src={p.thumb} className="w-full h-full object-cover" alt=""/>
                <div className="absolute bottom-0 inset-x-0 bg-gradient-to-t from-black/80 to-transparent px-2 py-1">
                  <div className="text-[9px] font-bold text-white/80" dir="ltr">{fromISO(p.date).getDate()}.{fromISO(p.date).getMonth() + 1}.{fromISO(p.date).getFullYear()}</div>
                </div>
                {!p.gistId && <div className="absolute top-1.5 end-1.5 w-2 h-2 rounded-full bg-ember" title="ממתין לסנכרון"></div>}
              </button>
            ))}
          </div>
        )}
        <div className="text-[9px] text-white/25 mt-2.5">התמונות נשמרות בג׳יסטים פרטיים בחשבון שלך ומסתנכרנות בין המכשירים. נקודה כתומה = טרם הועלה.</div>
      </div>

      {viewPhoto && <PhotoViewer photo={viewPhoto} onClose={() => setViewPhoto(null)} loadPhoto={loadPhoto}
                                 onDelete={p => { delPhoto(p); setViewPhoto(null); }}/>}
    </div>
  );
}

/* ============================== calendar / journal ============================== */
const MONTHS_HE = ['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];

function dayFlags(state, iso){
  const wkk = weekStartISO(fromISO(iso));
  const wk = state.logs[wkk] || {};
  const dayIdx = fromISO(iso).getDay();
  let strength = false;
  const wo = wk.workouts || {};
  outer:
  for (const tplId in wo) {
    for (const exId in wo[tplId]) {
      const arr = wo[tplId][exId];
      if (Array.isArray(arr) && arr.some(s => s && s.done && s.t === iso)) { strength = true; break outer; }
    }
  }
  const run = state.runs.some(r => r.date === iso);
  const mealsDone = state.meals.filter(m => ((wk.nutrition || {})[dayIdx] || {})[m.id]).length;
  return { strength, run, fullNutrition: mealsDone > 0 && mealsDone === state.meals.length };
}

function daySummary(state, iso){
  const wkk = weekStartISO(fromISO(iso));
  const wk = state.logs[wkk] || {};
  const dayIdx = fromISO(iso).getDay();
  const workouts = [];
  const wo = wk.workouts || {};
  Object.keys(wo).forEach(tplId => {
    let sets = 0, ton = 0;
    Object.keys(wo[tplId] || {}).forEach(exId => {
      (wo[tplId][exId] || []).forEach(s => {
        if (s && s.done && s.t === iso) { sets++; ton += numOr0(s.w) * numOr0(s.r); }
      });
    });
    if (sets > 0) {
      const tpl = state.templates.find(t => t.id === tplId);
      workouts.push({ id: tplId, icon: tpl ? tpl.icon : '🏋️', name: tpl ? tpl.name : 'אימון', sets, ton: Math.round(ton) });
    }
  });
  const runs = state.runs.filter(r => r.date === iso);
  const mealChecks = (wk.nutrition || {})[dayIdx] || {};
  const mealsDone = state.meals.filter(m => mealChecks[m.id]).length;
  const weight = state.weights.find(w => w.date === iso) || null;
  const photos = state.photos.filter(p => p.date === iso);
  return { workouts, runs, mealChecks, mealsDone, mealsTotal: state.meals.length, weight, photos };
}

function CalendarTab({ state, goTo }){
  const todayISO = toISO(new Date());
  const [ym, setYm] = useState(() => ({ y: new Date().getFullYear(), m: new Date().getMonth() }));
  const [sel, setSel] = useState(todayISO);
  const firstOfMonth = new Date(ym.y, ym.m, 1);
  const gridStart = weekStartISO(firstOfMonth);
  const daysInMonth = new Date(ym.y, ym.m + 1, 0).getDate();
  const rows = Math.ceil((firstOfMonth.getDay() + daysInMonth) / 7);
  const cells = Array.from({ length: rows * 7 }, (_, i) => addDays(gridStart, i));
  const prevM = () => setYm(v => v.m === 0 ? { y: v.y - 1, m: 11 } : { y: v.y, m: v.m - 1 });
  const nextM = () => setYm(v => v.m === 11 ? { y: v.y + 1, m: 0 } : { y: v.y, m: v.m + 1 });
  const goToday = () => { setYm({ y: new Date().getFullYear(), m: new Date().getMonth() }); setSel(todayISO); };
  const s = daySummary(state, sel);
  const empty = s.workouts.length === 0 && s.runs.length === 0 && s.mealsDone === 0 && !s.weight && s.photos.length === 0;
  return (
    <div className="fadein space-y-3">
      <div className="glass rounded-3xl p-4">
        <div className="flex items-center justify-between mb-3">
          <button onClick={prevM} className="w-10 h-10 rounded-xl bg-white/5 active:scale-90 transition flex items-center justify-center">
            <Icon d={I.chevR} className="w-5 h-5 text-white/60"/>
          </button>
          <button onClick={goToday} className="text-center active:scale-95 transition px-2">
            <div className="font-black text-lg leading-none">{MONTHS_HE[ym.m]} <span className="text-white/40">{ym.y}</span></div>
            <div className="text-[10px] text-white/35 mt-0.5">לחץ לחזרה להיום</div>
          </button>
          <button onClick={nextM} className="w-10 h-10 rounded-xl bg-white/5 active:scale-90 transition flex items-center justify-center">
            <Icon d={I.chevL} className="w-5 h-5 text-white/60"/>
          </button>
        </div>
        <div className="grid grid-cols-7 gap-1 mb-1">
          {DAYS_HE.map((d, i) => <div key={i} className="text-center text-[10px] font-bold text-white/35 py-1">{d}</div>)}
        </div>
        <div className="grid grid-cols-7 gap-1">
          {cells.map(iso => {
            const d = fromISO(iso);
            const inMonth = d.getMonth() === ym.m;
            const f = dayFlags(state, iso);
            const isSel = iso === sel;
            const isToday = iso === todayISO;
            return (
              <button key={iso} onClick={() => setSel(iso)}
                      className={'relative rounded-xl flex flex-col items-center pt-1.5 pb-1 transition active:scale-95 border ' +
                        (isSel ? 'bg-volt text-obsidian border-volt glow-volt' :
                          isToday ? 'bg-white/10 border-white/20' : 'bg-white/[.03] border-transparent') +
                        (inMonth ? '' : ' opacity-30')}
                      style={{ minHeight:'52px' }}>
                <span className={'w-6 h-6 flex items-center justify-center rounded-full text-xs font-bold ' +
                  (f.fullNutrition ? (isSel ? 'border-2 border-obsidian/50 ' : 'border-2 border-volt ') : '') +
                  (isSel ? 'text-obsidian' : isToday ? 'text-volt' : 'text-white/80')}>
                  {d.getDate()}
                </span>
                <span className="flex gap-0.5 mt-1" style={{ height:'6px' }}>
                  {f.strength && <span className={'w-1.5 h-1.5 rounded-full ' + (isSel ? 'bg-obsidian' : 'bg-volt')}></span>}
                  {f.run && <span className={'w-1.5 h-1.5 rounded-full ' + (isSel ? 'bg-obsidian/60' : 'bg-ember')}></span>}
                </span>
              </button>
            );
          })}
        </div>
        <div className="flex items-center justify-center gap-4 mt-3 text-[9px] text-white/40 font-bold">
          <span className="flex items-center gap-1"><span className="w-1.5 h-1.5 rounded-full bg-volt inline-block"></span> אימון כוח</span>
          <span className="flex items-center gap-1"><span className="w-1.5 h-1.5 rounded-full bg-ember inline-block"></span> ריצה</span>
          <span className="flex items-center gap-1"><span className="w-3 h-3 rounded-full border-2 border-volt inline-block"></span> תזונה 100%</span>
        </div>
      </div>

      <div className="glass rounded-3xl p-4 fadein" key={sel}>
        <div className="flex items-center justify-between mb-2.5">
          <div className="font-black italic">{heDate(sel)}</div>
          {sel > todayISO && <span className="text-[10px] font-bold text-white/30 bg-white/5 rounded-full px-2.5 py-1">עתיד 🔮</span>}
        </div>
        {empty ? (
          <div className="text-center py-5">
            <div className="text-3xl mb-1.5">{sel > todayISO ? '📅' : '😴'}</div>
            <div className="text-white/40 text-sm font-bold">{sel > todayISO ? 'עוד לא הגענו לשם' : 'יום מנוחה — לא נרשם כלום'}</div>
          </div>
        ) : (
          <div className="space-y-1.5">
            {s.workouts.map(w => (
              <button key={w.id} onClick={() => goTo(sel, 'workouts', w.id)}
                      className="w-full flex items-center gap-3 bg-black/25 border border-white/5 rounded-2xl p-3 text-start active:scale-[.985] transition">
                <span className="text-2xl">{w.icon}</span>
                <div className="flex-1 min-w-0">
                  <div className="font-bold text-sm">{w.name}</div>
                  <div className="text-[10px] text-white/40">{w.sets} סטים הושלמו · {w.ton.toLocaleString()} ק"ג נפח</div>
                </div>
                <Icon d={I.chevL} className="w-4 h-4 text-white/25"/>
              </button>
            ))}
            {s.runs.map(r => (

                  <div className="font-bold text-sm truncate">{r.title}</div>

                </div>
                {r.src === 'strava' && <span className="text-[8px] font-black text-strava bg-strava/10 border border-strava/25 rounded-full px-1.5 py-0.5 shrink-0">STRAVA</span>}
                <Icon d={I.chevL} className="w-4 h-4 text-white/25 shrink-0"/>
              </button>
            ))}
            {s.mealsDone > 0 && (
              <button onClick={() => goTo(sel, 'food')}
                      className="w-full flex items-center gap-3 bg-black/25 border border-white/5 rounded-2xl p-3 text-start active:scale-[.985] transition">
                <span className="text-2xl">🥗</span>
                <div className="flex-1">
                  <div className="font-bold text-sm">תזונה · {s.mealsDone}/{s.mealsTotal} {s.mealsDone === s.mealsTotal ? '✓' : ''}</div>
                  <div className="flex gap-1.5 mt-1">
                    {state.meals.map(m => (
                      <span key={m.id} className={'text-sm ' + (s.mealChecks[m.id] ? '' : 'opacity-20')} style={s.mealChecks[m.id] ? {} : { filter:'grayscale(1)' }}>{m.icon}</span>

              </button>
            )}
            {s.weight && (
              <div className="flex items-center gap-3 bg-black/25 border border-white/5 rounded-2xl p-3">
                <span className="text-2xl">⚖️</span>
                <div className="font-bold text-sm">שקילה · {s.weight.kg} ק"ג</div>
              </div>
            )}
            {s.photos.length > 0 && (
              <button onClick={() => goTo(sel, 'progress')}
                      className="w-full flex items-center gap-3 bg-black/25 border border-white/5 rounded-2xl p-3 text-start active:scale-[.985] transition">
                <div className="flex gap-1.5">
                  {s.photos.slice(0, 3).map(p => <img key={p.id} src={p.thumb} className="w-10 h-10 rounded-lg object-cover border border-white/10" alt=""/>)}
                </div>
                <div className="font-bold text-sm">{s.photos.length === 1 ? 'תמונת התקדמות' : s.photos.length + ' תמונות התקדמות'}</div>
              </button>
            )}
          </div>
        )}
      </div>
    </div>
  );
}
