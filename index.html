function NutritionTab({ state, week, mutate }){
  const todayISO = toISO(new Date());
  const isCur = weekStartISO(new Date()) === week;
  const [day, setDay] = useState(isCur ? new Date().getDay() : 0);
  const [picker, setPicker] = useState(null);
  const [showTargets, setShowTargets] = useState(false);
  useEffect(() => { setDay(weekStartISO(new Date()) === week ? new Date().getDay() : 0); setPicker(null); }, [week]);

  const targets = nutriTargets(state);
  const wk = state.logs[week] || {};
  const d2 = (wk.nutri2 || {})[day];
  const legacyChecks = (wk.nutrition || {})[day] || {};
  const isLegacy = !d2 && Object.keys(legacyChecks).some(k => legacyChecks[k]);
  const viewMeals = (d2 && d2.meals) ? d2.meals : (state.mealPlan || []).map(m => ({ id: m.id, icon: m.icon, title: m.title, items: (m.items || []).map(it => Object.assign({}, it, { eaten: false })) }));

  let eatK = 0, eatP = 0, eatC = 0, eatF = 0;
  viewMeals.forEach(m => (m.items || []).forEach(it => { if (it.eaten) { eatK += numOr0(it.kcal); eatP += numOr0(it.p); eatC += numOr0(it.c); eatF += numOr0(it.f); } }));
  eatK = Math.round(eatK); eatP = Math.round(eatP); eatC = Math.round(eatC); eatF = Math.round(eatF);
  const water = d2 ? numOr0(d2.water) : 0;
  const sleep = d2 ? (d2.sleep || '') : '';
  const dateISO = addDays(week, day);
  const burn = dayBurn(state, dateISO);
  const kcalTarget = Math.round(targets.kcal + burn.total);
  const remaining = kcalTarget - eatK;

  const withDay = fn => mutate(d => {
    const w2 = (d.logs[week] = d.logs[week] || {});
    const n2 = (w2.nutri2 = w2.nutri2 || {});
    if (!n2[day]) n2[day] = {
      meals: (d.mealPlan || []).map(m => ({ id: m.id, icon: m.icon, title: m.title, items: (m.items || []).map(it => Object.assign({}, it, { id: uid(), eaten: false })) })),
      water: 0, sleep: ''
    };
    fn(n2[day], d);
  }, ['week', week]);

  const toggleItem = (mi, ii) => withDay(dd => { const it = (dd.meals[mi] || { items: [] }).items[ii]; if (it) it.eaten = !it.eaten; });
  const setItemQty = (mi, ii, q) => withDay((dd, d) => {
    const it = (dd.meals[mi] || { items: [] }).items[ii]; if (!it) return;
    const nq = numOr0(q);
    const fd = it.foodId ? foodCatalog(d).find(x => x.id === it.foodId) : null;
    if (fd && nq > 0) Object.assign(it, calcMacros(fd, nq));
    else if (nq > 0 && numOr0(it.qty) > 0) {
      const r = nq / numOr0(it.qty);
      it.kcal = Math.round(it.kcal * r); it.p = Math.round(it.p * r * 10) / 10; it.c = Math.round(it.c * r * 10) / 10; it.f = Math.round(it.f * r * 10) / 10;
    }
    it.qty = q;
  });
  const delItem = (mi, ii) => withDay(dd => { (dd.meals[mi] || { items: [] }).items.splice(ii, 1); });
  const addItemTo = (mi, item) => withDay(dd => { (dd.meals[mi] || { items: [] }).items.push(item); });
  const addWater = ml => withDay(dd => { dd.water = Math.max(0, numOr0(dd.water) + ml); });
  const setSleep = v => withDay(dd => { dd.sleep = v; });
  const toggleLegacy = mealId => mutate(d => {
    const w2 = (d.logs[week] = d.logs[week] || {});
    const n = (w2.nutrition = w2.nutrition || {});
    const dd = (n[day] = n[day] || {});
    dd[mealId] = !dd[mealId];
  }, ['week', week]);
  const saveAsTemplate = () => {
    if (!confirm('לשמור את התפריט של היום הזה כתבנית הקבועה לכל הימים הבאים?')) return;
    mutate(d => {
      const src = ((((d.logs[week] || {}).nutri2) || {})[day] || {}).meals || d.mealPlan;
      d.mealPlan = src.map(m => ({ id: m.id, icon: m.icon, title: m.title, items: (m.items || []).map(it => ({ id: uid(), foodId: it.foodId || null, name: it.name, qty: it.qty, per: it.per, unitName: it.unitName, kcal: it.kcal, p: it.p, c: it.c, f: it.f })) }));
    }, 'meals');
  };
  const setTarget = (k, v) => mutate(d => { d.settings.nutri = Object.assign({}, nutriTargets(d), { [k]: numOr0(v) }); }, 'settings');

  const trained = burn.total > 0;
  const sleepOk = numOr0(sleep) >= 7;
  const protOk = eatP >= targets.protein * 0.9;
  const score = (sleepOk ? 1 : 0) + (protOk ? 1 : 0) + (trained ? 1 : 0);
  const recovery = score === 3 ? { t:'התאוששות אופטימלית לבניית שריר ⚡', c:'bg-volt/15 text-volt border-volt/30' }
    : score === 2 ? { t:'התאוששות טובה 💪', c:'bg-volt/5 text-volt/80 border-volt/15' }
    : score === 1 ? { t:'התאוששות חלקית 😴', c:'bg-ember/10 text-ember border-ember/25' }
    : { t:'עדכן שינה, חלבון ואימון להערכת ההתאוששות', c:'bg-white/5 text-white/40 border-white/10' };

  const MacroBar = ({ label, val, target, color }) => (
    <div>
      <div className="flex items-center justify-between text-[10px] font-bold mb-1">
        <span className="text-white/50">{label}</span>
        <span><span className={color}>{val}</span><span className="text-white/30"> / {target} ג׳</span></span>
      </div>
      <div className="h-1.5 bg-white/5 rounded-full overflow-hidden" dir="ltr">
        <div className={'h-full rounded-full transition-all duration-500 ' + (val > target * 1.15 ? 'bg-ember' : 'bg-gradient-to-r from-lime-700 to-volt')} style={{ width: Math.min(100, val / Math.max(1, target) * 100) + '%' }}/>
      </div>
    </div>
  );

  return (
    <div className="fadein space-y-3">
      <div className="glass rounded-2xl p-2">
        <div className="grid grid-cols-7 gap-1.5">
          {DAYS_HE.map((d, i) => {
            const iso = addDays(week, i);
            const nsI = dayNutriSummary(state, week, i);
            const active = day === i;
            return (
              <button key={i} onClick={() => setDay(i)}
                      className={'rounded-xl py-1.5 flex flex-col items-center transition active:scale-95 ' + (active ? 'bg-volt text-obsidian glow-volt' : 'bg-white/5 text-white/60')}>
                <span className="text-sm font-black leading-none">{d}</span>
                <span className={'text-[9px] mt-0.5 ' + (active ? 'text-obsidian/60' : (iso === todayISO ? 'text-volt' : 'text-white/30'))}>{fromISO(iso).getDate()}</span>
                <span className={'mt-1 w-1 h-1 rounded-full ' + (nsI.full ? (active ? 'bg-obsidian' : 'bg-volt') : (nsI.done > 0 ? 'bg-ember' : 'bg-transparent'))}></span>
              </button>
            );
          })}
        </div>
      </div>

      {isLegacy ? (
        <React.Fragment>
          <div className="glass rounded-3xl p-4 text-center">
            <div className="text-white/50 text-sm font-bold">יום מהמעקב הקודם (צ'קליסט) 📋</div>
            <div className="text-white/30 text-xs mt-1">הסימונים ההיסטוריים נשמרו — אפשר להמשיך לסמן כרגיל</div>
            <button onClick={() => withDay(() => {})} className="mt-2.5 px-4 py-2 rounded-2xl bg-volt/10 border border-volt/25 text-volt text-xs font-bold active:scale-95 transition">עבור למעקב המאקרו החדש ליום זה ←</button>
          </div>
          {state.meals.map(m => {
            const done = !!legacyChecks[m.id];
            return (
              <button key={m.id} onClick={() => toggleLegacy(m.id)}
                      className={'w-full text-start rounded-3xl p-4 flex gap-3 items-start transition active:scale-[.985] border ' + (done ? 'bg-volt/10 border-volt/25' : 'glass border-transparent')}>
                <div className={'w-7 h-7 rounded-full border-2 flex items-center justify-center shrink-0 mt-0.5 transition ' + (done ? 'bg-volt border-volt text-obsidian glow-volt' : 'border-white/15 text-transparent')}>
                  <Icon d={I.check} className="w-4 h-4"/>
                </div>
                <span className="text-2xl leading-none mt-0.5">{m.icon}</span>
                <div className="min-w-0">
                  <div className={'font-bold leading-snug ' + (done ? 'text-volt' : '')}>{m.title}</div>
                  <div className={'text-xs leading-relaxed mt-1 ' + (done ? 'text-white/30' : 'text-white/45')}>{m.desc}</div>
                </div>
              </button>
            );
          })}
        </React.Fragment>
      ) : (
        <React.Fragment>
          <div className="glass rounded-3xl p-4">
            <div className="flex items-center gap-4">
              <div className="relative shrink-0" style={{ width:'110px', height:'110px' }}>
                <Ring pct={eatK / Math.max(1, kcalTarget)} size={110} stroke={9} color={eatK > kcalTarget ? '#FF5A1F' : '#CCFF00'}/>
                <div className="absolute inset-0 flex flex-col items-center justify-center">
                  <span className="font-black text-2xl leading-none">{eatK}</span>
                  <span className="text-[9px] text-white/40 mt-0.5">מתוך {kcalTarget}</span>
                </div>
              </div>
              <div className="flex-1 min-w-0 space-y-1.5">
                <div className={'rounded-2xl px-3 py-2 border text-sm font-black ' + (remaining >= 0 ? 'bg-volt/10 border-volt/25 text-volt' : 'bg-ember/10 border-ember/25 text-ember')}>
                  {remaining >= 0 ? 'נשארו ' + remaining + ' קק"ל' : 'חריגה של ' + (-remaining) + ' קק"ל'}
                </div>
                <div className="flex flex-wrap gap-1">
                  <span className="text-[9px] font-bold text-white/40 bg-white/5 rounded-full px-2 py-1">בסיס {targets.kcal}</span>
                  {burn.strengthKcal > 0 && <span className="text-[9px] font-bold text-volt bg-volt/10 border border-volt/20 rounded-full px-2 py-1">🏋️ אימון +{burn.strengthKcal}</span>}
                  {burn.runKcal > 0 && <span className="text-[9px] font-bold text-ember bg-ember/10 border border-ember/20 rounded-full px-2 py-1">🏃 ריצה +{burn.runKcal}</span>}
                </div>
              </div>
            </div>
            <div className="mt-3.5 space-y-2.5">
              <MacroBar label="חלבון 🥩" val={eatP} target={targets.protein} color="text-volt"/>
              <MacroBar label="פחמימות 🍚" val={eatC} target={targets.carbs} color="text-white"/>
              <MacroBar label="שומן 🥑" val={eatF} target={targets.fat} color="text-ember"/>
            </div>
            <div className="mt-3.5">
              <div className="flex items-center justify-between text-[10px] font-bold mb-1">
                <span className="text-white/50">מים 💧</span>
                <span className="text-sky-300">{water} <span className="text-white/30">/ {targets.water} מ"ל</span></span>
              </div>
              <div className="h-1.5 bg-white/5 rounded-full overflow-hidden mb-2" dir="ltr">
                <div className="h-full rounded-full bg-gradient-to-r from-sky-700 to-sky-300 transition-all duration-500" style={{ width: Math.min(100, water / Math.max(1, targets.water) * 100) + '%' }}/>
              </div>
              <div className="flex gap-1.5">
                <button onClick={() => addWater(250)} className="flex-1 py-1.5 rounded-xl bg-sky-400/10 border border-sky-400/25 text-sky-300 text-xs font-bold active:scale-95 transition">+250 מ"ל</button>
                <button onClick={() => addWater(500)} className="flex-1 py-1.5 rounded-xl bg-sky-400/10 border border-sky-400/25 text-sky-300 text-xs font-bold active:scale-95 transition">+500 מ"ל</button>
                <button onClick={() => addWater(-250)} className="px-3 py-1.5 rounded-xl bg-white/5 border border-white/10 text-white/40 text-xs font-bold active:scale-95 transition">−250</button>
              </div>
            </div>
          </div>

          <div className="glass rounded-3xl p-4">
            <div className="flex items-center gap-3">
              <span className="text-2xl">😴</span>
              <div className="flex-1">
                <div className="text-[10px] font-bold text-white/50 mb-1">שעות שינה הלילה</div>
                <input className="inp text-center font-black" inputMode="decimal" placeholder="7.5" value={sleep} onChange={e => setSleep(e.target.value)} style={{ maxWidth:'110px' }}/>
              </div>
              <div className="flex flex-col items-end gap-1 text-[9px] font-bold">
                <span className={sleepOk ? 'text-volt' : 'text-white/30'}>שינה 7+ שע׳ {sleepOk ? '✓' : '·'}</span>
                <span className={protOk ? 'text-volt' : 'text-white/30'}>חלבון 90% {protOk ? '✓' : '·'}</span>
                <span className={trained ? 'text-volt' : 'text-white/30'}>אימון היום {trained ? '✓' : '·'}</span>
              </div>
            </div>
            <div className={'mt-3 rounded-2xl px-3.5 py-2.5 border text-sm font-black text-center ' + recovery.c}>{recovery.t}</div>
          </div>

          {viewMeals.map((m, mi) => {
            const items = m.items || [];
            const planned = Math.round(items.reduce((a, it) => a + numOr0(it.kcal), 0));
            const eaten = Math.round(items.reduce((a, it) => a + (it.eaten ? numOr0(it.kcal) : 0), 0));
            const allDone = items.length > 0 && items.every(it => it.eaten);
            return (
              <div key={m.id || mi} className={'rounded-3xl p-4 border transition ' + (allDone ? 'bg-volt/10 border-volt/25' : 'glass border-transparent')}>
                <div className="flex items-center gap-2.5 mb-2">
                  <span className="text-2xl">{m.icon}</span>
                  <div className="flex-1 min-w-0">
                    <div className={'font-bold ' + (allDone ? 'text-volt' : '')}>{m.title}</div>
                    <div className="text-[10px] text-white/40">{eaten}/{planned} קק"ל</div>
                  </div>
                  {allDone && <span className="text-[9px] font-black text-obsidian bg-volt rounded-full px-2 py-1 glow-volt shrink-0">✓</span>}
                </div>
                <div className="space-y-1.5">
                  {items.map((it, ii) => (
                    <div key={it.id || ii} className={'flex items-center gap-2 rounded-2xl ps-2 pe-1.5 py-1.5 border transition ' + (it.eaten ? 'bg-volt/10 border-volt/20' : 'bg-black/25 border-white/5')}>
                      <button onClick={() => toggleItem(mi, ii)}
                              className={'w-6 h-6 rounded-full border-2 flex items-center justify-center shrink-0 transition active:scale-90 ' + (it.eaten ? 'bg-volt border-volt text-obsidian' : 'border-white/15 text-transparent')}>
                        <Icon d={I.check} className="w-3.5 h-3.5"/>
                      </button>
                      <div className="flex-1 min-w-0">
                        <div className="text-sm font-bold truncate leading-tight">{it.name}</div>
                        <div className="text-[9px] text-white/40">{it.kcal} קק"ל · ח {it.p} · פ {it.c} · ש {it.f}</div>
                      </div>
                      <div className="flex items-center gap-1 shrink-0">
                        <input className="inp text-center font-bold" inputMode="decimal" value={it.qty}
                               onChange={e => setItemQty(mi, ii, e.target.value)} style={{ width:'52px', fontSize:'13px', padding:'4px 4px' }}/>
                        <span className="text-[9px] text-white/35 truncate" style={{ width:'34px' }}>{it.per === '100g' ? 'גרם' : it.unitName}</span>
                      </div>
                      <button onClick={() => delItem(mi, ii)} className="w-7 h-7 rounded-lg text-white/20 flex items-center justify-center active:scale-90 transition shrink-0">
                        <Icon d={I.trash} className="w-3.5 h-3.5"/>
                      </button>
                    </div>
                  ))}
                </div>
                <button onClick={() => setPicker(mi)} className="mt-2 w-full py-2 rounded-xl bg-white/5 border border-white/10 text-volt text-xs font-bold flex items-center justify-center gap-1 active:scale-[.98] transition">
                  <Icon d={I.plus} className="w-3.5 h-3.5"/> הוסף מאכל
                </button>
              </div>
            );
          })}

          <button onClick={saveAsTemplate} className="w-full glass rounded-2xl py-3 text-white/50 text-xs font-bold active:scale-[.98] transition">📌 שמור את התפריט של היום כתבנית הקבועה לכל יום</button>

          <button onClick={() => setShowTargets(!showTargets)} className="w-full glass rounded-2xl py-2.5 text-white/40 text-xs font-bold flex items-center justify-center gap-1.5 active:scale-[.98] transition">
            יעדים יומיים ⚙️ <Icon d={showTargets ? I.chevUp : I.chevDown} className="w-3.5 h-3.5"/>
          </button>
          {showTargets && (
            <div className="glass rounded-3xl p-4 grid grid-cols-3 gap-2 fadein">
              {[['kcal','קק"ל בסיס'], ['protein','חלבון (ג׳)'], ['carbs','פחמימות (ג׳)'], ['fat','שומן (ג׳)'], ['water','מים (מ"ל)'], ['strengthBurn','שריפה באימון כוח']].map(p2 => (
                <div key={p2[0]}><label className="lbl">{p2[1]}</label>
                  <input className="inp text-center font-bold" inputMode="numeric" value={targets[p2[0]]} onChange={e => setTarget(p2[0], e.target.value)}/>
                </div>
              ))}
            </div>
          )}
        </React.Fragment>
      )}

      {picker != null && (
        <FoodPicker state={state} mutate={mutate} onClose={() => setPicker(null)}
                    onPick={item => { addItemTo(picker, item); setPicker(null); }}/>
      )}
    </div>
  );
}

/* ============================== dashboard ============================== */
function Dashboard({ state, setTab, setOpenTpl, setWeek }){
  const today = toISO(new Date());
  const ts = todayStats(state);
  const st = streak(state);
  const week = weekStartISO(new Date());
  const latestW = state.weights.length ? state.weights[0] : null;
  const prevW = state.weights.length > 1 ? state.weights[1] : null;
  const latestPhoto = state.photos.length ? state.photos.slice().sort((a, b) => a.date < b.date ? 1 : -1)[0] : null;
  const name = state.settings.name;

  const go = (tab) => { setWeek(week); setTab(tab); };
  const openWorkout = id => { setWeek(week); setOpenTpl(id); setTab('workouts'); };

  const QA = ({ icon, label, tab, color }) => (
    <button onClick={() => go(tab)} className="glass rounded-2xl py-3 flex flex-col items-center gap-1.5 active:scale-95 transition">
      <div className={color}><Icon d={icon} className="w-5 h-5"/></div>
      <span className="text-[10px] font-bold text-white/60">{label}</span>
    </button>
  );

  return (
    <div className="fadein space-y-3">
      <div className="glass rounded-3xl p-5 relative overflow-hidden">
        <div className="absolute -end-4 -bottom-10 text-[130px] leading-none opacity-[.05] select-none" style={{ transform:'rotate(12deg)' }}>⚡</div>
        <div className="flex items-start justify-between relative">
          <div>
            <div className="text-white/40 text-xs">{greet()},</div>
            <div className="text-2xl font-black italic leading-tight">{name || 'אלוף'} 👊</div>
            <div className="text-[11px] text-white/35 mt-1">{heDate(today)}</div>
          </div>
          {st >= 2 && (
            <div className="flex items-center gap-1.5 bg-ember/15 border border-ember/25 rounded-full ps-2.5 pe-3 py-1.5">
              <Icon d={I.flame} className="w-4 h-4 text-ember"/>
              <span className="text-sm font-black text-ember">{st}</span>
              <span className="text-[9px] text-ember/70 font-bold">ימים ברצף</span>
            </div>
          )}
        </div>
        <div className="grid grid-cols-3 gap-2 mt-4 relative">
          <div className="bg-black/30 rounded-2xl py-2.5 text-center">
            <div className="font-black text-xl text-volt">{ts.sets}</div>
            <div className="text-[9px] text-white/40 mt-0.5">סטים היום</div>
          </div>
          <div className="bg-black/30 rounded-2xl py-2.5 text-center">
            <div className="font-black text-xl text-ember">{ts.km ? ts.km.toFixed(1) : 0}</div>
            <div className="text-[9px] text-white/40 mt-0.5">ק"מ היום</div>
          </div>
          <div className="bg-black/30 rounded-2xl py-2.5 text-center">
            <div className="font-black text-xl">{ts.meals}<span className="text-white/30 text-sm">/{ts.mealsTotal}</span></div>
            <div className="text-[9px] text-white/40 mt-0.5">{ts.kcal > 0 ? ts.kcal + ' קק"ל היום' : 'ארוחות היום'}</div>
          </div>
        </div>
      </div>

      <div className="grid grid-cols-4 gap-2">
        <QA icon={I.dumbbell} label="התחל אימון" tab="workouts" color="text-volt"/>
        <QA icon={I.activity} label="רשום ריצה" tab="runs" color="text-ember"/>
        <QA icon={I.clipboard} label="צ'קליסט" tab="food" color="text-volt"/>
        <QA icon={I.camera} label="התקדמות" tab="progress" color="text-ember"/>
      </div>

      <div className="glass rounded-3xl p-4">
        <div className="font-black italic mb-2.5">מה עשית היום</div>
        {(ts.perTpl.length === 0 && ts.runs.length === 0 && ts.meals === 0) ? (
          <div className="text-center py-5">
            <div className="text-3xl mb-1.5">😴</div>
            <div className="text-white/40 text-sm font-bold">עוד לא רשמת כלום היום</div>
            <div className="text-white/25 text-xs mt-0.5">יאללה, הברזל לא ירים את עצמו 🔥</div>
          </div>
        ) : (
          <div className="space-y-1.5">
            {ts.perTpl.map(p => (
              <button key={p.tpl.id} onClick={() => openWorkout(p.tpl.id)} className="w-full flex items-center gap-3 bg-black/25 border border-white/5 rounded-2xl p-3 active:scale-[.985] transition text-start">
                <span className="text-2xl">{p.tpl.icon}</span>
                <div className="flex-1 min-w-0">
                  <div className="font-bold text-sm">{p.tpl.name}</div>
                  <div className="text-[10px] text-white/40">{p.sets} סטים · {p.ton.toLocaleString()} ק"ג נפח</div>
                </div>
                <Icon d={I.chevL} className="w-4 h-4 text-white/25"/>
              </button>
            ))}
            {ts.runs.map(r => (
              <div key={r.id} className="flex items-center gap-3 bg-black/25 border border-white/5 rounded-2xl p-3">
                <span className="text-2xl">🏃</span>
                <div className="flex-1 min-w-0">
                  <div className="font-bold text-sm truncate">{r.title}</div>
                  <div className="text-[10px] text-white/40">{r.km} ק"מ · {fmtPace(r.sec / Math.max(r.km, .01))} דק'/ק"מ · {fmtDur(r.sec)}</div>
                </div>
                {r.src === 'strava' && <span className="text-[8px] font-black text-strava bg-strava/10 border border-strava/25 rounded-full px-1.5 py-0.5">STRAVA</span>}
              </div>
            ))}
            {ts.meals > 0 && (
              <button onClick={() => go('food')} className="w-full flex items-center gap-3 bg-black/25 border border-white/5 rounded-2xl p-3 active:scale-[.985] transition text-start">
                <span className="text-2xl">🥗</span>
                <div className="flex-1">
                  <div className="font-bold text-sm">תזונה</div>
                  <div className="text-[10px] text-white/40">{ts.meals} מתוך {ts.mealsTotal} ארוחות{ts.kcal > 0 ? ' · ' + ts.kcal + ' קק"ל' : ''}</div>
                </div>
                <div className="relative w-[30px] h-[30px]">
                  <Ring pct={ts.meals / Math.max(1, ts.mealsTotal)} size={30} stroke={3}/>
                </div>
              </button>
            )}
          </div>
        )}
      </div>

      <div>
        <div className="text-white/40 text-xs font-bold mb-2 px-1">האימונים של השבוע</div>
        <WeekChips state={state} week={week} onOpen={openWorkout}/>
      </div>

      <div className="grid grid-cols-2 gap-2">
        <button onClick={() => go('progress')} className="glass rounded-3xl p-4 text-start active:scale-[.985] transition">
          <div className="flex items-center gap-2 text-white/40 text-[10px] font-bold"><Icon d={I.scale} className="w-3.5 h-3.5"/> משקל גוף</div>
          {latestW ? (
            <div className="mt-1.5">
              <span className="font-black text-2xl">{latestW.kg}</span>
              <span className="text-xs text-white/40 ms-1">ק"ג</span>
              {prevW && (
                <span className={'text-[10px] font-bold ms-2 ' + (latestW.kg - prevW.kg >= 0 ? 'text-volt' : 'text-ember')}>
                  {latestW.kg - prevW.kg >= 0 ? '+' : ''}{Math.round((latestW.kg - prevW.kg) * 10) / 10}
                </span>
              )}
            </div>
          ) : <div className="mt-1.5 text-white/25 text-sm font-bold">הוסף שקילה ←</div>}
        </button>
        <button onClick={() => go('progress')} className="glass rounded-3xl p-4 text-start active:scale-[.985] transition flex items-center gap-3">
          {latestPhoto ? (
            <React.Fragment>
              <img src={latestPhoto.thumb} className="w-12 h-12 rounded-xl object-cover border border-white/10" alt=""/>
              <div>
                <div className="text-white/40 text-[10px] font-bold">תמונה אחרונה</div>
                <div className="text-xs font-bold mt-0.5">{heDate(latestPhoto.date).split(' · ')[1]}</div>
              </div>
            </React.Fragment>
          ) : (
            <React.Fragment>
              <div className="w-12 h-12 rounded-xl bg-white/5 flex items-center justify-center"><Icon d={I.camera} className="w-5 h-5 text-white/25"/></div>
              <div className="text-white/25 text-sm font-bold">צלם התקדמות ←</div>
            </React.Fragment>
          )}
        </button>
      </div>
    </div>
  );
}

/* ============================== progress ============================== */
function PhotoViewer({ photo, onClose, onDelete, loadPhoto }){
  const [src, setSrc] = useState(photo.thumb);
  const [loading, setLoading] = useState(true);
  useEffect(() => {
    let alive = true;
    setSrc(photo.thumb); setLoading(true);
    loadPhoto(photo).then(full => { if (alive) { if (full) setSrc(full); setLoading(false); } }).catch(() => alive && setLoading(false));
    return () => { alive = false; };
  }, [photo.id]);
  return (
    <div className="fixed inset-0 z-50 bg-black/95 flex flex-col fadein" onClick={onClose}>
      <div className="flex items-center justify-between p-4" style={{ paddingTop:'max(env(safe-area-inset-top), 16px)' }}>
        <button onClick={onClose} className="w-10 h-10 rounded-full bg-white/10 flex items-center justify-center"><Icon d={I.x} className="w-5 h-5"/></button>
        <div className="text-sm font-bold">{heDate(photo.date)}</div>
        <button onClick={e => { e.stopPropagation(); onDelete(photo); }} className="w-10 h-10 rounded-full bg-ember/20 text-ember flex items-center justify-center"><Icon d={I.trash} className="w-4 h-4"/></button>
      </div>
      <div className="flex-1 flex items-center justify-center p-4 relative">
        <img src={src} className="max-w-full max-h-full rounded-2xl object-contain" alt="" style={{ filter: loading ? 'blur(6px)' : 'none', transition:'filter .3s' }}/>
        {loading && <div className="absolute inset-0 flex items-center justify-center"><Icon d={I.refresh} className="w-7 h-7 text-volt spin"/></div>}
      </div>
    </div>
  );
}

function ProgressTab({ state, mutate, loadPhoto, addPhoto, delPhoto }){
  const flat = useMemo(() => {
    const arr = [];
    state.templates.forEach(tpl => tpl.exercises.forEach(ex => {
      if (ex.check) return;
      exOptions(ex).forEach(o => arr.push({ tpl, ex, key: o.key, label: o.label }));
    }));
    return arr;
  }, [state.templates]);
  const chartTpls = useMemo(() => state.templates.filter(t => (t.exercises || []).some(e => !e.check)), [state.templates]);
  const initial = useMemo(() => {
    const f = flat.find(p => exerciseHistory(state, p.tpl.id, p.key).length > 0) || flat[0];
    return f ? { tpl: f.tpl.id, key: f.key } : { tpl: chartTpls[0] ? chartTpls[0].id : '', key: '' };
  }, []);
  const [selTpl, setSelTpl] = useState(initial.tpl);
  const [selKey, setSelKey] = useState(initial.key);
  const [showDetail, setShowDetail] = useState(false);
  const [showAllEx, setShowAllEx] = useState(false);
  const volData = useMemo(() => {
    const v = weeklyVolumes(state, 12);
    while (v.length > 2 && v[0].a === 0) v.shift();
    return v.some(x => x.a > 0) ? v : [];
  }, [state.logs]);
  const curVol = volData.length ? volData[volData.length - 1].a : 0;
  const prevVol = volData.length > 1 ? volData[volData.length - 2].a : 0;
  const volDeltaPct = prevVol > 0 ? Math.round((curVol - prevVol) / prevVol * 100) : null;
  const statusRows = useMemo(() => exerciseStatus(state), [state.logs, state.templates]);
  const tplOptions = flat.filter(p => p.tpl.id === selTpl);
  const pickTpl = id => {
    setSelTpl(id);
    const opts = flat.filter(p => p.tpl.id === id);
    const withData = opts.find(p => exerciseHistory(state, id, p.key).length > 0);
    setSelKey((withData || opts[0]) ? (withData || opts[0]).key : '');
  };
  const [kg, setKg] = useState('');
  const [viewPhoto, setViewPhoto] = useState(null);
  const fileRef = useRef(null);

  const prs = useMemo(() => findPRs(state), [state.logs, state.templates]);
  const ri = useMemo(() => runningInsights(state), [state.runs]);

  const hist = (selTpl && selKey) ? exerciseHistory(state, selTpl, selKey) : [];
  const strengthData = hist.slice(-16).map(h => ({ label:'ש' + weekNum(h.week), a: h.maxW, b: h.vol }));

  const weightData = state.weights.slice().sort((a, b) => a.date < b.date ? -1 : 1).slice(-20)
    .map(w => ({ label: fromISO(w.date).getDate() + '.' + (fromISO(w.date).getMonth() + 1), a: w.kg, b: 0 }));
  const latestW = state.weights.length ? state.weights[0] : null;
  const h = numOr0(state.settings.height);
  const bmi = (latestW && h > 0) ? Math.round(latestW.kg / Math.pow(h / 100, 2) * 10) / 10 : null;

  const addWeight = () => {
    const v = numOr0(kg);
    if (!(v > 20 && v < 400)) { alert('הכנס משקל תקין בק"ג'); return; }
    mutate(d => { d.weights.unshift({ id: uid(), date: toISO(new Date()), kg: v, updatedAt: Date.now() }); d.weights.sort((a, b) => a.date < b.date ? 1 : -1); });
    setKg('');
  };
  const delWeight = w => {
    if (!confirm('למחוק שקילה של ' + w.kg + ' ק"ג?')) return;
    mutate(d => { d.weights = d.weights.filter(x => x.id !== w.id); if (d.deletedWeights.indexOf(w.id) < 0) d.deletedWeights.push(w.id); });
  };
  const onFile = e => {
    const file = e.target.files && e.target.files[0];
    if (file) addPhoto(file);
    e.target.value = '';

/* ============================== calendar / journal ============================== */
const MONTHS_HE = ['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];

function dayFlags(state, iso){
  const wkk = weekStartISO(fromISO(iso));
  const wk = state.logs[wkk] || {};
  const dayIdx = fromISO(iso).getDay();
  let strength = false;
  const wo = wk.workouts || {};
  outer:
  for (const tplId in wo) {
    for (const exId in wo[tplId]) {
      const arr = wo[tplId][exId];
      if (Array.isArray(arr) && arr.some(s => s && s.done && s.t === iso)) { strength = true; break outer; }
    }
  }
  const run = state.runs.some(r => r.date === iso);
  const ns = dayNutriSummary(state, wkk, dayIdx);
  return { strength, run, fullNutrition: ns.full };
}

function daySummary(state, iso){
  const wkk = weekStartISO(fromISO(iso));
  const wk = state.logs[wkk] || {};
  const dayIdx = fromISO(iso).getDay();
  const workouts = [];
  const wo = wk.workouts || {};
  Object.keys(wo).forEach(tplId => {
    let sets = 0, ton = 0;
    Object.keys(wo[tplId] || {}).forEach(exId => {
      (wo[tplId][exId] || []).forEach(s => {
        if (s && s.done && s.t === iso) { sets++; ton += numOr0(s.w) * numOr0(s.r); }
      });
    });
    if (sets > 0) {
      const tpl = state.templates.find(t => t.id === tplId);
      workouts.push({ id: tplId, icon: tpl ? tpl.icon : '🏋️', name: tpl ? tpl.name : 'אימון', sets, ton: Math.round(ton) });
    }
  });
  const runs = state.runs.filter(r => r.date === iso);
  const ns = dayNutriSummary(state, wkk, dayIdx);
  const weight = state.weights.find(w => w.date === iso) || null;
  const photos = state.photos.filter(p => p.date === iso);
  return { workouts, runs, mealIcons: ns.icons, mealsDone: ns.done, mealsTotal: ns.total, dayKcal: ns.kcal, weight, photos };
}

function CalendarTab({ state, goTo }){
  const todayISO = toISO(new Date());
  const [ym, setYm] = useState(() => ({ y: new Date().getFullYear(), m: new Date().getMonth() }));
  const [sel, setSel] = useState(todayISO);
  const firstOfMonth = new Date(ym.y, ym.m, 1);
  const gridStart = weekStartISO(firstOfMonth);
  const daysInMonth = new Date(ym.y, ym.m + 1, 0).getDate();
  const rows = Math.ceil((firstOfMonth.getDay() + daysInMonth) / 7);
  const cells = Array.from({ length: rows * 7 }, (_, i) => addDays(gridStart, i));
  const prevM = () => setYm(v => v.m === 0 ? { y: v.y - 1, m: 11 } : { y: v.y, m: v.m - 1 });
  const nextM = () => setYm(v => v.m === 11 ? { y: v.y + 1, m: 0 } : { y: v.y, m: v.m + 1 });
  const goToday = () => { setYm({ y: new Date().getFullYear(), m: new Date().getMonth() }); setSel(todayISO); };
  const s = daySummary(state, sel);
  const empty = s.workouts.length === 0 && s.runs.length === 0 && s.mealsDone === 0 && !s.weight && s.photos.length === 0;
  return (
    <div className="fadein space-y-3">
      <div className="glass rounded-3xl p-4">
        <div className="flex items-center justify-between mb-3">
          <button onClick={prevM} className="w-10 h-10 rounded-xl bg-white/5 active:scale-90 transition flex items-center justify-center">
            <Icon d={I.chevR} className="w-5 h-5 text-white/60"/>
          </button>
          <button onClick={goToday} className="text-center active:scale-95 transition px-2">
            <div className="font-black text-lg leading-none">{MONTHS_HE[ym.m]} <span className="text-white/40">{ym.y}</span></div>
            <div className="text-[10px] text-white/35 mt-0.5">לחץ לחזרה להיום</div>
          </button>
          <button onClick={nextM} className="w-10 h-10 rounded-xl bg-white/5 active:scale-90 transition flex items-center justify-center">
            <Icon d={I.chevL} className="w-5 h-5 text-white/60"/>
          </button>
        </div>
        <div className="grid grid-cols-7 gap-1 mb-1">
          {DAYS_HE.map((d, i) => <div key={i} className="text-center text-[10px] font-bold text-white/35 py-1">{d}</div>)}
        </div>
        <div className="grid grid-cols-7 gap-1">
          {cells.map(iso => {
            const d = fromISO(iso);
            const inMonth = d.getMonth() === ym.m;
            const f = dayFlags(state, iso);
            const isSel = iso === sel;
            const isToday = iso === todayISO;
            return (
              <button key={iso} onClick={() => setSel(iso)}
                      className={'relative rounded-xl flex flex-col items-center pt-1.5 pb-1 transition active:scale-95 border ' +
                        (isSel ? 'bg-volt text-obsidian border-volt glow-volt' :
                          isToday ? 'bg-white/10 border-white/20' : 'bg-white/[.03] border-transparent') +
                        (inMonth ? '' : ' opacity-30')}
                      style={{ minHeight:'52px' }}>
                <span className={'w-6 h-6 flex items-center justify-center rounded-full text-xs font-bold ' +
                  (f.fullNutrition ? (isSel ? 'border-2 border-obsidian/50 ' : 'border-2 border-volt ') : '') +
                  (isSel ? 'text-obsidian' : isToday ? 'text-volt' : 'text-white/80')}>
                  {d.getDate()}
                </span>
                <span className="flex gap-0.5 mt-1" style={{ height:'6px' }}>
                  {f.strength && <span className={'w-1.5 h-1.5 rounded-full ' + (isSel ? 'bg-obsidian' : 'bg-volt')}></span>}
                  {f.run && <span className={'w-1.5 h-1.5 rounded-full ' + (isSel ? 'bg-obsidian/60' : 'bg-ember')}></span>}

/* ============================== app shell ============================== */
function App(){
  const [state, setState] = useState(load);
  const stateRef = useRef(state); stateRef.current = state;
  const [tab, setTab] = useState('home');
  const [week, setWeek] = useState(() => weekStartISO(new Date()));
  const [openTpl, setOpenTpl] = useState(null);
  const [sync, setSync] = useState({ status: localStorage.getItem(TOKEN_KEY) ? 'ok' : 'off', msg:'', at:0 });
  const [stravaUi, setStravaUi] = useState({ status:'idle', msg:'' });
  const pushTimer = useRef(null);
  const syncingRef = useRef(false);
  const lastSyncRef = useRef(0);

  const schedulePush = useCallback(() => {
    if (!localStorage.getItem(TOKEN_KEY)) return;
    setSync(s => (s.status === 'syncing' ? s : { ...s, status:'pending' }));
    clearTimeout(pushTimer.current);
    pushTimer.current = setTimeout(() => syncNow(true), 2500);
  }, []);

  const mutate = useCallback((fn, stamp) => {
    const d = clone(stateRef.current);
    fn(d);
    const t = Date.now();
    if (stamp === 'templates') d.stamps.templates = t;
    else if (stamp === 'meals') d.stamps.meals = t;
    else if (stamp === 'settings') d.stamps.settings = t;
    else if (Array.isArray(stamp) && stamp[0] === 'week') d.stamps.weeks[stamp[1]] = t;
    stateRef.current = d; persist(d); setState(d); schedulePush();
  }, [schedulePush]);

  const replaceState = useCallback(d => {
    d = normalize(clone(d));
    const t = Date.now();
    d.stamps.templates = t; d.stamps.meals = t; d.stamps.settings = t;
    stateRef.current = d; persist(d); setState(d); schedulePush();
  }, [schedulePush]);

  /* ---------- github gist sync ---------- */
  async function gh(path, opts){
    opts = opts || {};
    const token = localStorage.getItem(TOKEN_KEY);
    const headers = { 'Authorization':'Bearer ' + token, 'Accept':'application/vnd.github+json' };
    if (opts.body) headers['Content-Type'] = 'application/json';
    const res = await fetch('https://api.github.com' + path, { method: opts.method || 'GET', headers, body: opts.body });
    if (!res.ok) {
      let t = ''; try { t = (await res.json()).message || ''; } catch (e) {}
      throw new Error('GitHub ' + res.status + (t ? ' · ' + t : ''));
    }
    return res.status === 204 ? null : res.json();
  }

  async function uploadPendingPhotos(st){
    for (const p of st.photos) {
      if (p.gistId) continue;
      try {
        const full = await idb.get(p.id);
        if (!full) continue;
        const created = await gh('/gists', { method:'POST', body: JSON.stringify({ description:'ATHLETICS_PHOTO ' + p.id, public:false, files:{ [PHOTO_FILE]:{ content: full } } }) });
        p.gistId = created.id;
        p.updatedAt = Date.now();
      } catch (e) {}
    }
  }

  async function syncNow(silent){
    const token = localStorage.getItem(TOKEN_KEY);
    if (!token) { setSync({ status:'off', msg:'', at:0 }); return; }
    if (syncingRef.current) return;
    syncingRef.current = true;
    setSync(s => ({ ...s, status:'syncing' }));
    try {
      let st = stateRef.current;
      let gid = st.settings.gistId;
      if (!gid) {
        const gists = await gh('/gists?per_page=100');
        const found = gists.find(g => g.description === GIST_DESC || (g.files && g.files[GIST_FILE]));
        if (found) gid = found.id;
      }
      if (!gid) {
        const withPhotos = clone(stateRef.current);
        await uploadPendingPhotos(withPhotos);
        const created = await gh('/gists', { method:'POST', body: JSON.stringify({ description: GIST_DESC, public:false, files:{ [GIST_FILE]:{ content: JSON.stringify(withPhotos) } } }) });
        withPhotos.settings.gistId = created.id;
        stateRef.current = withPhotos; persist(withPhotos); setState(withPhotos);
      } else {
        const g = await gh('/gists/' + gid);
        let remote = null;
        const file = g.files && g.files[GIST_FILE];
        if (file) {
          let content = file.content;
          if (file.truncated) content = await (await fetch(file.raw_url)).text();
          try { remote = JSON.parse(content); } catch (e) {}
        }
        let merged = remote ? mergeStates(stateRef.current, remote) : clone(stateRef.current);
        merged.settings.gistId = gid;
        await uploadPendingPhotos(merged);
        stateRef.current = merged; persist(merged); setState(merged);
        await gh('/gists/' + gid, { method:'PATCH', body: JSON.stringify({ files:{ [GIST_FILE]:{ content: JSON.stringify(merged) } } }) });
      }
      lastSyncRef.current = Date.now();
      setSync({ status:'ok', msg:'', at: Date.now() });
    } catch (e) {
      setSync({ status:'error', msg: String(e.message || e).slice(0, 200), at: Date.now() });
    } finally {
      syncingRef.current = false;
    }
  }

  /* ---------- photos ---------- */
  async function addPhoto(file){
    try {
      const full = await fileToDataUrl(file, 1000, .72);
      const thumb = await shrinkDataUrl(full, 260, .6);
      const id = uid();
      await idb.set(id, full).catch(() => {});
      mutate(d => { d.photos.push({ id, date: toISO(new Date()), thumb, gistId: null, updatedAt: Date.now() }); });
    } catch (e) { alert('שגיאה בטעינת התמונה'); }
  }
  async function loadPhoto(p){
    const local = await idb.get(p.id).catch(() => null);
    if (local) return local;
    if (p.gistId && localStorage.getItem(TOKEN_KEY)) {
      const g = await gh('/gists/' + p.gistId);
      const f = g.files && g.files[PHOTO_FILE];
      if (f) {
        let c = f.content;
        if (f.truncated) c = await (await fetch(f.raw_url)).text();
        idb.set(p.id, c).catch(() => {});
        return c;
      }
    }
    return null;
  }
  function delPhoto(p){
    if (!confirm('למחוק את התמונה?')) return;
    mutate(d => { d.photos = d.photos.filter(x => x.id !== p.id); if (d.deletedPhotos.indexOf(p.id) < 0) d.deletedPhotos.push(p.id); });
    idb.del(p.id).catch(() => {});
    if (p.gistId && localStorage.getItem(TOKEN_KEY)) gh('/gists/' + p.gistId, { method:'DELETE' }).catch(() => {});
  }

  /* ---------- strava ---------- */
  async function stravaTokenReq(body){
    const r = await fetch('https://www.strava.com/api/v3/oauth/token', { method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify(body) });
    if (!r.ok) { let m = ''; try { m = JSON.stringify(await r.json()).slice(0, 120); } catch (e) {} throw new Error('Strava ' + r.status + ' ' + m); }
    return r.json();
  }
  function stravaConnect(){
    const sv = stateRef.current.settings.strava || {};
    if (!sv.clientId || !sv.clientSecret) { alert('מלא Client ID ו-Client Secret'); return; }
    const redirect = location.origin + location.pathname;
    localStorage.setItem('athletics.strava.pending', '1');
    location.href = 'https://www.strava.com/oauth/authorize?client_id=' + encodeURIComponent(sv.clientId)
      + '&redirect_uri=' + encodeURIComponent(redirect)
      + '&response_type=code&approval_prompt=auto&scope=activity:read_all';
  }
  function stravaDisconnect(){
    if (!confirm('לנתק את סטרבה? (הריצות שכבר יובאו יישארו)')) return;
    mutate(d => { d.settings.strava = { clientId: (d.settings.strava || {}).clientId || '', clientSecret: (d.settings.strava || {}).clientSecret || '' }; }, 'settings');
    setStravaUi({ status:'idle', msg:'' });
  }
  async function ensureStravaToken(){
    const sv = stateRef.current.settings.strava;
    if (!sv || !sv.refreshToken) return null;
    if ((sv.expiresAt || 0) * 1000 - 60000 > Date.now()) return sv.accessToken;
    const j = await stravaTokenReq({ client_id: sv.clientId, client_secret: sv.clientSecret, grant_type:'refresh_token', refresh_token: sv.refreshToken });
    mutate(d => { d.settings.strava = Object.assign({}, d.settings.strava, { accessToken: j.access_token, refreshToken: j.refresh_token || sv.refreshToken, expiresAt: j.expires_at }); }, 'settings');
    return j.access_token;
  }
  async function stravaImport(silent){
    if (!silent) setStravaUi({ status:'syncing', msg:'מייבא ריצות מסטרבה...' });
    try {
      const at = await ensureStravaToken();
      if (!at) { if (!silent) setStravaUi({ status:'error', msg:'לא מחובר לסטרבה' }); return; }
      const dead = new Set(stateRef.current.deletedRuns);
      const have = new Set(stateRef.current.runs.map(r => r.id));
      const news = [];
      let page = 1;
      while (page <= 3) {
        const r = await fetch('https://www.strava.com/api/v3/athlete/activities?per_page=100&page=' + page, { headers:{ Authorization:'Bearer ' + at } });
        if (!r.ok) throw new Error('Strava ' + r.status);
        const acts = await r.json();
        acts.forEach(a => {
          const t = String(a.sport_type || a.type || '');
          if (!/run/i.test(t)) return;
          const id = 'sv' + a.id;
          if (have.has(id) || dead.has(id)) return;
          const date = String(a.start_date_local || a.start_date || '').slice(0, 10);
          if (!date) return;
          news.push({ id, date, title: a.name || 'Strava Run', km: Math.round(a.distance / 10) / 100, sec: Math.round(a.moving_time || 0), src:'strava', updatedAt: Date.now() });
        });
        if (acts.length < 100) break;
        page++;
      }
      if (news.length) mutate(d => { d.runs = news.concat(d.runs); });
      localStorage.setItem('athletics.strava.last', String(Date.now()));
      setStravaUi({ status:'ok', msg: news.length ? ('יובאו ' + news.length + ' ריצות חדשות ✓') : 'הכל מעודכן — אין ריצות חדשות ✓' });
    } catch (e) {
      setStravaUi({ status:'error', msg: String(e.message || e).slice(0, 160) });
    }
  }

  /* ---------- lifecycle ---------- */
  useEffect(() => {
    /* one-tap token handoff: opening the app with #gh=<token> stores the sync
       token on this device and immediately cleans it out of the address bar.
       The token itself never lives in this file or in the repo. */
    try {
      if (location.hash && location.hash.indexOf('gh=') !== -1) {
        const m = location.hash.match(/gh=([A-Za-z0-9_-]+)/);
        if (m) {
          localStorage.setItem(TOKEN_KEY, m[1]);
          history.replaceState({}, '', location.pathname + location.search);
        }
      }
    } catch (e) {}
    if (localStorage.getItem(TOKEN_KEY)) syncNow(true);
    const q = new URLSearchParams(location.search);
    const code = q.get('code');
    if (code && localStorage.getItem('athletics.strava.pending')) {
      localStorage.removeItem('athletics.strava.pending');
      history.replaceState({}, '', location.pathname);
      setTab('settings');
      (async () => {
        try {
          const sv = stateRef.current.settings.strava || {};
          const j = await stravaTokenReq({ client_id: sv.clientId, client_secret: sv.clientSecret, code, grant_type:'authorization_code' });
          mutate(d => {
            d.settings.strava = Object.assign({}, d.settings.strava, {
              accessToken: j.access_token, refreshToken: j.refresh_token, expiresAt: j.expires_at,
              athlete: j.athlete ? ((j.athlete.firstname || '') + ' ' + (j.athlete.lastname || '')).trim() : ''
            });
          }, 'settings');
          setStravaUi({ status:'ok', msg:'סטרבה חוברה בהצלחה ✓ מייבא ריצות...' });
          stravaImport(false);
        } catch (e) {
          setStravaUi({ status:'error', msg:'החיבור נכשל: ' + String(e.message || e).slice(0, 120) });
        }
      })();
    } else if (code) {
      history.replaceState({}, '', location.pathname);
    } else {
      const sv = stateRef.current.settings.strava;
      const last = Number(localStorage.getItem('athletics.strava.last') || 0);
      if (sv && sv.refreshToken && Date.now() - last > 6 * 3600 * 1000) stravaImport(true);
    }
    const onVis = () => {
      if (document.visibilityState === 'visible' && localStorage.getItem(TOKEN_KEY) && Date.now() - lastSyncRef.current > 15000) syncNow(true);
    };
    document.addEventListener('visibilitychange', onVis);
    return () => document.removeEventListener('visibilitychange', onVis);
  }, []);

  const isCur = week === weekStartISO(new Date());
  const dotColor = { off:'bg-white/20', pending:'bg-ember', syncing:'bg-ember', ok:'bg-volt', error:'bg-red-500' }[sync.status] || 'bg-white/20';
  const showWeekBar = tab === 'workouts' || tab === 'runs' || tab === 'food';

  const TABS = [
    { id:'home',     label:'בית',      icon:I.home },
    { id:'food',     label:'תזונה',    icon:I.clipboard },
    { id:'workouts', label:'אימונים',  icon:I.dumbbell },
    { id:'runs',     label:'ריצה',     icon:I.activity },
    { id:'progress', label:'התקדמות', icon:I.trend },
    { id:'calendar', label:'יומן',     icon:I.calendar },
  ];

  const goTo = (iso, t, tplId) => {
    setWeek(weekStartISO(fromISO(iso)));
    setOpenTpl(tplId || null);
    setTab(t);
  };

  return (
    <div className="min-h-screen">
      <div className="fixed inset-0 pointer-events-none overflow-hidden" style={{ zIndex:-1 }}>
        <div className="absolute -top-32 -end-32 w-96 h-96 rounded-full" style={{ background:'radial-gradient(circle,#CCFF00,transparent 70%)', opacity:.07 }}></div>
        <div className="absolute top-1/2 -start-40 w-96 h-96 rounded-full" style={{ background:'radial-gradient(circle,#FF5A1F,transparent 70%)', opacity:.05 }}></div>
      </div>

      <header className="sticky top-0 z-40 bg-obsidian/85 border-b border-white/5" style={{ paddingTop:'env(safe-area-inset-top)', backdropFilter:'blur(24px)', WebkitBackdropFilter:'blur(24px)' }}>
        <div className="max-w-xl mx-auto px-4 pt-3 pb-2.5">
          <div className="flex items-center justify-between">
            <button onClick={() => setTab('home')} className="flex items-center gap-2.5 active:scale-[.98] transition">
              <div className="w-9 h-9 rounded-xl bg-volt flex items-center justify-center glow-volt">
                <Icon d={I.bolt} className="w-5 h-5 text-obsidian" filled/>
              </div>
              <div className="text-start">
                <div className="font-black italic text-xl tracking-tight leading-none">ATHLETICS</div>
                <div className="text-[9px] text-white/35 tracking-[.35em] font-bold mt-0.5">LEAN BULK ENGINE</div>
              </div>
            </button>
            <button onClick={() => setTab('settings')} className="relative w-10 h-10 rounded-2xl bg-white/5 border border-white/10 flex items-center justify-center active:scale-90 transition">
              <Icon d={I.gear} className={'w-5 h-5 ' + (tab === 'settings' ? 'text-volt' : 'text-white/50')}/>
              <span className={'absolute top-1 end-1 w-2 h-2 rounded-full ' + dotColor + (sync.status === 'syncing' || sync.status === 'pending' ? ' animate-pulse' : '')}></span>
            </button>
          </div>

          {showWeekBar && (
            <div className="mt-3 flex items-center justify-between glass rounded-2xl px-2 py-1.5">
              <button onClick={() => setWeek(addDays(week, -7))} className="w-10 h-10 rounded-xl bg-white/5 active:scale-90 transition flex items-center justify-center">
                <Icon d={I.chevR} className="w-5 h-5 text-white/60"/>
              </button>
              <button onClick={() => setWeek(weekStartISO(new Date()))} className="text-center active:scale-95 transition px-2">
                <div className="font-black text-lg leading-none">
                  שבוע {weekNum(week)}
                  {!isCur && <span className="text-ember text-xs font-bold ms-1.5">· ארכיון</span>}
                </div>
                <div className="text-[10px] text-white/40 mt-1">
                  {weekRangeLabel(week)}{!isCur && ' · לחץ לחזרה להיום'}
                </div>
              </button>
              <button onClick={() => setWeek(addDays(week, 7))} className="w-10 h-10 rounded-xl bg-white/5 active:scale-90 transition flex items-center justify-center">
                <Icon d={I.chevL} className="w-5 h-5 text-white/60"/>
              </button>
            </div>
          )}
        </div>
      </header>

      <main className="max-w-xl mx-auto px-4 pt-4" style={{ paddingBottom:'calc(110px + env(safe-area-inset-bottom))' }}>
        {tab === 'home' && <Dashboard state={state} setTab={setTab} setOpenTpl={setOpenTpl} setWeek={setWeek}/>}
        {tab === 'workouts' && <WorkoutsTab state={state} week={week} mutate={mutate} openTpl={openTpl} setOpenTpl={setOpenTpl}/>}
        {tab === 'runs' && <RunsTab state={state} week={week} mutate={mutate} stravaConnected={!!(state.settings.strava && state.settings.strava.refreshToken)} onOpenSettings={() => setTab('settings')}/>}
        {tab === 'food' && <NutritionTab state={state} week={week} mutate={mutate}/>}
        {tab === 'progress' && <ProgressTab state={state} mutate={mutate} loadPhoto={loadPhoto} addPhoto={addPhoto} delPhoto={delPhoto}/>}
        {tab === 'calendar' && <CalendarTab state={state} goTo={goTo}/>}
        {tab === 'settings' && <SettingsTab state={state} sync={sync} syncNow={syncNow} replaceState={replaceState} mutate={mutate}
                                            stravaUi={stravaUi} stravaConnect={stravaConnect} stravaDisconnect={stravaDisconnect} stravaImport={stravaImport}
                                            onBack={() => setTab('home')}/>}
      </main>

      <nav className="fixed bottom-0 inset-x-0 z-40 bg-obsidian/90 border-t border-white/5" style={{ backdropFilter:'blur(24px)', WebkitBackdropFilter:'blur(24px)' }}>
        <div className="max-w-xl mx-auto grid grid-cols-6 px-1 pt-1.5" style={{ paddingBottom:'max(env(safe-area-inset-bottom), 10px)' }}>
          {TABS.map(t => {
            const active = tab === t.id;
            return (
              <button key={t.id} onClick={() => { setTab(t.id); if (t.id !== 'workouts') setOpenTpl(null); }}
                      className="flex flex-col items-center gap-0.5 py-1 select-none active:scale-95 transition">
                <div className={active ? 'text-volt' : 'text-white/35'}>
                  <Icon d={t.icon} className="w-6 h-6"/>
                </div>
                <span className={'text-[10px] font-bold ' + (active ? 'text-volt' : 'text-white/35')}>{t.label}</span>
                <span className={'w-1 h-1 rounded-full ' + (active ? 'bg-volt glow-volt' : 'bg-transparent')}></span>
              </button>
            );
          })}
        </div>
      </nav>
    </div>
  );
}

class ErrorBoundary extends React.Component {
  constructor(p){ super(p); this.state = { err:null }; }
  static getDerivedStateFromError(e){ return { err:e }; }
  render(){
    if (this.state.err) return (
      <div style={{ padding:24, direction:'ltr', fontFamily:'monospace', fontSize:12, color:'#f87171' }}>
        App error: {String(this.state.err && this.state.err.message || this.state.err)}
      </div>
    );
    return this.props.children;
  }
}

ReactDOM.createRoot(document.getElementById('root')).render(<ErrorBoundary><App/></ErrorBoundary>);
</script>
</body>
</html>
