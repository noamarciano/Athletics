          )}
        </button>
      </div>

    </div>
  );
}

/* ============================== progress ============================== */
function PhotoViewer({ photo, onClose, onDelete, loadPhoto }){
  const [src, setSrc] = useState(photo.thumb);
  const [loading, setLoading] = useState(true);
  useEffect(() => {
    let alive = true;
    setSrc(photo.thumb); setLoading(true);
    loadPhoto(photo).then(full => { if (alive) { if (full) setSrc(full); setLoading(false); } }).catch(() => alive && setLoading(false));
    return () => { alive = false; };
  }, [photo.id]);
  return (
    <div className="fixed inset-0 z-50 bg-black/95 flex flex-col fadein" onClick={onClose}>
      <div className="flex items-center justify-between p-4" style={{ paddingTop:'max(env(safe-area-inset-top), 16px)' }}>
        <button onClick={onClose} className="w-10 h-10 rounded-full bg-white/10 flex items-center justify-center"><Icon d={I.x} className="w-5 h-5"/></button>
        <div className="text-sm font-bold">{heDate(photo.date)}</div>
        <button onClick={e => { e.stopPropagation(); onDelete(photo); }} className="w-10 h-10 rounded-full bg-ember/20 text-ember flex items-center justify-center"><Icon d={I.trash} className="w-4 h-4"/></button>
      </div>
      <div className="flex-1 flex items-center justify-center p-4 relative">
        <img src={src} className="max-w-full max-h-full rounded-2xl object-contain" alt="" style={{ filter: loading ? 'blur(6px)' : 'none', transition:'filter .3s' }}/>
        {loading && <div className="absolute inset-0 flex items-center justify-center"><Icon d={I.refresh} className="w-7 h-7 text-volt spin"/></div>}
      </div>
    </div>
  );
}

function ProgressTab({ state, mutate, loadPhoto, addPhoto, delPhoto, onStory }){
  const flat = useMemo(() => {
    const arr = [];
    state.templates.forEach(tpl => tpl.exercises.forEach(ex => {
      if (ex.check) return;
      exOptions(ex).forEach(o => arr.push({ tpl, ex, key: o.key, label: o.label }));
    }));
    return arr;
  }, [state.templates]);
  const chartTpls = useMemo(() => state.templates.filter(t => (t.exercises || []).some(e => !e.check)), [state.templates]);
  const initial = useMemo(() => {
    const f = flat.find(p => exerciseHistory(state, p.tpl.id, p.key).length > 0) || flat[0];
    return f ? { tpl: f.tpl.id, key: f.key } : { tpl: chartTpls[0] ? chartTpls[0].id : '', key: '' };
  }, []);
  const [selTpl, setSelTpl] = useState(initial.tpl);
  const [selKey, setSelKey] = useState(initial.key);
  const [showDetail, setShowDetail] = useState(false);
  const [showAllEx, setShowAllEx] = useState(false);
  const volData = useMemo(() => {
    const v = weeklyVolumes(state, 12);
    while (v.length > 2 && v[0].a === 0) v.shift();
    return v.some(x => x.a > 0) ? v : [];
  }, [state.logs]);
  const curVol = volData.length ? volData[volData.length - 1].a : 0;
  const prevVol = volData.length > 1 ? volData[volData.length - 2].a : 0;
  const volDeltaPct = prevVol > 0 ? Math.round((curVol - prevVol) / prevVol * 100) : null;
  const statusRows = useMemo(() => exerciseStatus(state), [state.logs, state.templates]);
  const tplOptions = flat.filter(p => p.tpl.id === selTpl);
  const pickTpl = id => {
    setSelTpl(id);
    const opts = flat.filter(p => p.tpl.id === id);
    const withData = opts.find(p => exerciseHistory(state, id, p.key).length > 0);
    setSelKey((withData || opts[0]) ? (withData || opts[0]).key : '');
  };
  const [kg, setKg] = useState('');
  const [viewPhoto, setViewPhoto] = useState(null);
  const [cmpMode, setCmpMode] = useState(false);
  const [cmpSel, setCmpSel] = useState([]);
  const fileRef = useRef(null);

  const prs = useMemo(() => findPRs(state), [state.logs, state.templates]);
  const ri = useMemo(() => runningInsights(state), [state.runs]);

  const hist = (selTpl && selKey) ? exerciseHistory(state, selTpl, selKey) : [];
  const strengthData = hist.slice(-16).map(h => ({ label:'ש' + weekNum(h.week), a: h.maxW, b: h.vol }));

  const weightData = state.weights.slice().sort((a, b) => a.date < b.date ? -1 : 1).slice(-20)
    .map(w => ({ label: fromISO(w.date).getDate() + '.' + (fromISO(w.date).getMonth() + 1), a: w.kg, b: 0 }));
  const latestW = state.weights.length ? state.weights[0] : null;
  const h = numOr0(state.settings.height);
  const bmi = (latestW && h > 0) ? Math.round(latestW.kg / Math.pow(h / 100, 2) * 10) / 10 : null;

  const addWeight = () => {
    const v = numOr0(kg);
    if (!(v > 20 && v < 400)) { uiToast('הכנס משקל תקין בק"ג', 'warn'); return; }
    mutate(d => { d.weights.unshift({ id: uid(), date: toISO(new Date()), kg: v, updatedAt: Date.now() }); d.weights.sort((a, b) => a.date < b.date ? 1 : -1); });
    setKg('');
  };
  const delWeight = async w => {
    if (!await uiConfirm('למחוק שקילה של ' + w.kg + ' ק"ג?', { title:'מחיקת שקילה', danger:true, okText:'מחק' })) return;
    mutate(d => { d.weights = d.weights.filter(x => x.id !== w.id); if (d.deletedWeights.indexOf(w.id) < 0) d.deletedWeights.push(w.id); });
  };
  const onFile = e => {
    const file = e.target.files && e.target.files[0];
    if (file) addPhoto(file);
    e.target.value = '';
  };

  const photosSorted = state.photos.slice().sort((a, b) => a.date < b.date ? 1 : -1);

  return (
    <div className="fadein space-y-3">
      {/* ---- PRs ---- */}
      <div className="glass rounded-[24px] p-4">
        <SectionHead icon={I.trophy} title="הישגים אחרונים" sub="שיאים חדשים · 14 יום אחרונים" tone="var(--gold)" className="mb-3"
          right={onStory && (
            <button onClick={() => onStory({
                      kicker:'ההתקדמות שלי', title:'PR SHOWCASE', sub: heDate(toISO(new Date())),
                      stats: [
                        { v: statusRows.length ? statusRows[0].maxW : '—', l:'שיא אחרון (ק"ג)', color: CHART.train.c },
                        { v: curVol >= 1000 ? (Math.round(curVol/100)/10)+'K' : curVol, l:'ק"ג נפח השבוע', color:'#fff' },
                        { v: ri && ri.fastest ? fmtPace(ri.fastest.sec / ri.fastest.km) : '—', l:'שיא קצב', color:'#FFD75E' },
                        { v: prs.length, l:'שיאים חדשים', color: CHART.train.c }
                      ],
                      lines: prs.slice(0, 4).map(pr2 => ({ a: pr2.text.length > 26 ? pr2.text.slice(0,25)+'…' : pr2.text, b: pr2.from + ' → ' + pr2.to }))
                    })}

/* ============================== calendar / journal ============================== */
const MONTHS_HE = ['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];

function dayFlags(state, iso){
  const wkk = weekStartISO(fromISO(iso));
  const wk = state.logs[wkk] || {};
  const dayIdx = fromISO(iso).getDay();
  let strength = false;
  const wo = wk.workouts || {};
  outer:
  for (const tplId in wo) {
    for (const exId in wo[tplId]) {
      const arr = wo[tplId][exId];
      if (Array.isArray(arr) && arr.some(s => s && s.done && s.t === iso)) { strength = true; break outer; }
    }
  }
  const run = state.runs.some(r => r.date === iso);
  const ns = dayNutriSummary(state, wkk, dayIdx);
  /* a "perfect" day: trained (lift or run) AND every planned meal ticked */
  const perfect = ns.full && (strength || run);
  const nutriPct = ns.total > 0 ? ns.done / ns.total : 0;
  return { strength, run, fullNutrition: ns.full, perfect, nutriPct, kcal: ns.kcal || 0 };
}

/* two concentric micro-rings behind a calendar date: outer = training, inner = nutrition.
   A perfect day burns both rings gold — that's the reward you scan the month for. */
function DayRings({ train, fuel, gold, dim }){
  const S = 34, cx = S / 2, sw = 2.4;
  const rings = [{ r: 13.6, p: train, c: gold ? '#FFD75E' : '#9BE86B' },
                 { r: 9.9,  p: fuel,  c: gold ? '#F0A93B' : '#6FDCF7' }];
  return (
    <svg width={S} height={S} viewBox={'0 0 ' + S + ' ' + S} className="absolute inset-0 m-auto pointer-events-none"
         style={{ transform:'rotate(-90deg)', opacity: dim ? .35 : 1 }}>
      {rings.map((g, i) => {
        const c = 2 * Math.PI * g.r, p = Math.max(0, Math.min(1, g.p || 0));
        return (
          <g key={i}>
            <circle cx={cx} cy={cx} r={g.r} fill="none" stroke="rgba(255,255,255,.07)" strokeWidth={sw}/>
            {p > 0 && <circle cx={cx} cy={cx} r={g.r} fill="none" stroke={g.c} strokeWidth={sw} strokeLinecap="round"
                              strokeDasharray={c} strokeDashoffset={c * (1 - p)}
                              style={{ filter: gold ? 'drop-shadow(0 0 4px rgba(255,215,94,.6))' : 'none' }}/>}
          </g>
        );
      })}
    </svg>
  );
}

function daySummary(state, iso){
  const wkk = weekStartISO(fromISO(iso));
  const wk = state.logs[wkk] || {};
  const dayIdx = fromISO(iso).getDay();
  const workouts = [];
  const wo = wk.workouts || {};
  Object.keys(wo).forEach(tplId => {
    let sets = 0, ton = 0;
    Object.keys(wo[tplId] || {}).forEach(exId => {
      (wo[tplId][exId] || []).forEach(s => {
        if (s && s.done && s.t === iso) { sets++; ton += numOr0(s.w) * numOr0(s.r); }
      });
    });
    if (sets > 0) {
      const tpl = state.templates.find(t => t.id === tplId);
      workouts.push({ id: tplId, tpl: tpl || null, name: tpl ? tpl.name : 'אימון', sets, ton: Math.round(ton) });
    }
  });
  const runs = state.runs.filter(r => r.date === iso);
  const ns = dayNutriSummary(state, wkk, dayIdx);
  const weight = state.weights.find(w => w.date === iso) || null;
  const photos = state.photos.filter(p => p.date === iso);
  return { workouts, runs, mealIcons: ns.icons, mealsDone: ns.done, mealsTotal: ns.total, dayKcal: ns.kcal, weight, photos };
}

function CalendarTab({ state, goTo }){
  const todayISO = toISO(new Date());
  const [ym, setYm] = useState(() => ({ y: new Date().getFullYear(), m: new Date().getMonth() }));
  const [sel, setSel] = useState(todayISO);
  const firstOfMonth = new Date(ym.y, ym.m, 1);
  const gridStart = weekStartISO(firstOfMonth);
  const daysInMonth = new Date(ym.y, ym.m + 1, 0).getDate();
  const rows = Math.ceil((firstOfMonth.getDay() + daysInMonth) / 7);
  const cells = Array.from({ length: rows * 7 }, (_, i) => addDays(gridStart, i));
  const prevM = () => setYm(v => v.m === 0 ? { y: v.y - 1, m: 11 } : { y: v.y, m: v.m - 1 });
  const nextM = () => setYm(v => v.m === 11 ? { y: v.y + 1, m: 0 } : { y: v.y, m: v.m + 1 });
  const goToday = () => { setYm({ y: new Date().getFullYear(), m: new Date().getMonth() }); setSel(todayISO); };
  const s = daySummary(state, sel);
  const empty = s.workouts.length === 0 && s.runs.length === 0 && s.mealsDone === 0 && !s.weight && s.photos.length === 0;
  /* month roll-up shown above the grid — gives the page a headline, not just a calendar */
  const mstat = useMemo(() => {
    let trained = 0, perfect = 0, runs = 0;
    cells.forEach(iso => {
      if (fromISO(iso).getMonth() !== ym.m) return;
      const f = dayFlags(state, iso);
      if (f.strength || f.run) trained++;
      if (f.perfect) perfect++;
      if (f.run) runs++;
    });
    return { trained, perfect, runs };
  }, [state, ym.y, ym.m]);
  const selDate = fromISO(sel);
  const isFuture = sel > todayISO;
  const setTon = s.workouts.reduce((a, w) => a + w.ton, 0);
  const setCount = s.workouts.reduce((a, w) => a + w.sets, 0);
  const runKm = Math.round(s.runs.reduce((a, r) => a + numOr0(r.km), 0) * 10) / 10;
  const selFlags = dayFlags(state, sel);
  return (
    <div className="fadein space-y-3">
      <div className="glass rounded-[24px] p-4">
        <div className="flex items-center justify-between mb-1">
          <button onClick={prevM} className="w-10 h-10 rounded-[14px] flex items-center justify-center active:scale-[.98] transition"
                  style={{ background:'rgba(255,255,255,.045)', border:'1px solid rgba(255,255,255,.07)' }}>
            <Icon d={I.chevR} className="w-[18px] h-[18px]" style={{ color:'rgba(255,255,255,.55)' }}/>
          </button>
          <button onClick={goToday} className="text-center active:scale-[.98] transition px-2">
            <div className="t-label" style={{ fontSize:'8.5px' }}>לחץ לחזרה להיום</div>
            <div className="font-black italic leading-none mt-1" style={{ fontSize:'19px' }}>
              {MONTHS_HE[ym.m]} <span style={{ color:'var(--ink-3)' }}>{ym.y}</span>
            </div>
          </button>
          <button onClick={nextM} className="w-10 h-10 rounded-[14px] flex items-center justify-center active:scale-[.98] transition"
                  style={{ background:'rgba(255,255,255,.045)', border:'1px solid rgba(255,255,255,.07)' }}>
            <Icon d={I.chevL} className="w-[18px] h-[18px]" style={{ color:'rgba(255,255,255,.55)' }}/>
          </button>
        </div>
        <div className="flex items-center justify-center gap-3 mb-3">
          {[{ v: mstat.trained, l:'ימי אימון', c:'#9BE86B' }, { v: mstat.perfect, l:'ימים מושלמים', c:'var(--gold)' }, { v: mstat.runs, l:'ריצות', c:'#6FDCF7' }].map((x, i) => (
            <div key={i} className="flex items-baseline gap-1.5">
              <span className="t-metric" style={{ fontSize:'15px', color:x.c }}>{x.v}</span>
              <span className="t-label" style={{ fontSize:'8px' }}>{x.l}</span>
            </div>
          ))}
        </div>
        <div className="grid grid-cols-7 gap-1 mb-1.5">
          {DAYS_HE.map((d, i) => <div key={i} className="text-center t-label py-1" style={{ fontSize:'9px' }}>{d}</div>)}
        </div>
        <div className="grid grid-cols-7 gap-1">
          {cells.map(iso => {
            const d = fromISO(iso);
            const inMonth = d.getMonth() === ym.m;
            const f = dayFlags(state, iso);
            const isSel = iso === sel;
            const isToday = iso === todayISO;
            const trained = f.strength || f.run;
            return (
              <button key={iso} onClick={() => setSel(iso)}
                      className="relative rounded-[14px] flex flex-col items-center justify-center transition active:scale-[.96]"
                      style={Object.assign(
                        { minHeight:'48px', opacity: inMonth ? 1 : .28,
                          background: isSel ? 'rgba(215,255,62,.13)' : f.perfect ? 'rgba(255,215,94,.09)' : 'rgba(255,255,255,.028)',
                          border: '1px solid ' + (isSel ? 'rgba(215,255,62,.55)' : f.perfect ? 'rgba(255,215,94,.28)' : isToday ? 'rgba(255,255,255,.16)' : 'transparent') },
                        isSel ? { boxShadow:'0 0 18px rgba(215,255,62,.18)' } : f.perfect ? { boxShadow:'0 0 16px rgba(255,215,94,.14)' } : {})}>
                <span className="relative w-[34px] h-[34px] flex items-center justify-center">
                  <DayRings train={trained ? 1 : 0} fuel={f.nutriPct} gold={f.perfect} dim={!inMonth}/>
                  <span className="t-num relative" style={{ fontSize:'12.5px', fontWeight:800,
                        color: isSel ? 'var(--lime)' : f.perfect ? 'var(--gold)' : isToday ? '#fff' : 'rgba(255,255,255,.72)' }}>
                    {d.getDate()}
                  </span>
                </span>
                <span className="flex gap-[3px] mt-[2px]" style={{ height:'4px' }}>
                  {f.run && <span className="w-1 h-1 rounded-full" style={{ background:'#6FDCF7' }}></span>}
                  {isToday && !isSel && <span className="w-1 h-1 rounded-full" style={{ background:'var(--lime)' }}></span>}
                </span>
              </button>
            );
          })}
        </div>
        <div className="flex items-center justify-center flex-wrap gap-x-3.5 gap-y-1.5 mt-3.5 pt-3" style={{ borderTop:'1px solid rgba(255,255,255,.05)' }}>
          {[{ c:'#9BE86B', l:'טבעת חיצונית · אימון' }, { c:'#6FDCF7', l:'טבעת פנימית · תזונה' }, { c:'var(--gold)', l:'יום מושלם' }].map((x, i) => (
            <span key={i} className="flex items-center gap-1.5 t-label" style={{ fontSize:'8.5px' }}>
              <span className="w-2.5 h-2.5 rounded-full inline-block shrink-0" style={{ border:'2px solid ' + x.c }}></span>{x.l}
            </span>
          ))}
        </div>
      </div>

      <div className="glass rounded-[24px] p-4 fadein" key={sel}>
        <div className="flex items-center justify-between gap-2 mb-3">
          <div className="min-w-0">
            <div className="t-label" style={{ fontSize:'8.5px' }}>{DAYS_FULL[selDate.getDay()]}</div>
            <div className="font-black italic leading-none mt-1 truncate t-num" style={{ fontSize:'19px' }}>
              {selDate.getDate() + '.' + (selDate.getMonth() + 1) + '.' + selDate.getFullYear()}
            </div>
          </div>
          <div className="flex items-center gap-1.5 shrink-0">
            {selFlags.perfect && (
              <span className="flex items-center gap-1 rounded-full px-2.5 py-1 text-[9.5px] font-black"
                    style={{ background:'rgba(255,215,94,.13)', border:'1px solid rgba(255,215,94,.32)', color:'var(--gold)', boxShadow:'0 0 14px rgba(255,215,94,.14)' }}>
                <Icon d={I.trophy} className="w-3 h-3"/> יום מושלם
              </span>
            )}
            {sel === todayISO
              ? <span className="t-num text-[9.5px] font-black rounded-full px-2.5 py-1"
                      style={{ background:'rgba(215,255,62,.12)', border:'1px solid rgba(215,255,62,.3)', color:'var(--lime)' }}>היום</span>
              : isFuture
                ? <span className="t-label rounded-full px-2.5 py-1" style={{ fontSize:'8.5px', background:'rgba(255,255,255,.04)', border:'1px solid rgba(255,255,255,.07)' }}>עתיד</span>
                : null}
          </div>
        </div>
        {!empty && (
          <div className="grid grid-cols-3 gap-2 mb-3">
            {[{ v: setCount || '—', l:'סטים', c:'#9BE86B' },
              { v: setTon ? (setTon >= 1000 ? (Math.round(setTon / 100) / 10) + 'K' : setTon) : (runKm ? runKm : '—'), l: setTon ? 'ק"ג נפח' : 'ק"מ', c: setTon ? '#fff' : '#6FDCF7' },
              { v: s.dayKcal ? s.dayKcal.toLocaleString() : '—', l:'קק"ל', c:'#6FDCF7' }].map((x, i) => (
              <div key={i} className="glass-2 rounded-[16px] py-2.5 text-center">
                <div className="t-metric" style={{ fontSize:'17px', color:x.c }}>{x.v}</div>
                <div className="t-label mt-1" style={{ fontSize:'8px' }}>{x.l}</div>
              </div>
            ))}
          </div>
        )}
        {empty ? (
          isFuture ? (
            <div className="text-center py-6">
              <span className="w-14 h-14 rounded-[19px] mx-auto flex items-center justify-center mb-2.5"
                    style={{ background:'rgba(255,255,255,.04)', border:'1px solid rgba(255,255,255,.08)' }}>
                <Icon d={I.calendar} className="w-6 h-6" style={{ color:'rgba(255,255,255,.28)' }}/>
              </span>
              <div className="text-white/45 text-sm font-bold">עוד לא הגענו לשם</div>
              <div className="t-note mt-1">היום הזה עדיין לפניך</div>
            </div>
          ) : (
            /* rest is a planned part of a 5-day week — present it as recovery, never as a miss */
            <div className="rounded-[20px] p-4 text-center relative overflow-hidden"
                 style={{ background:'linear-gradient(160deg, rgba(179,156,251,.14), rgba(138,111,240,.04))', border:'1px solid rgba(179,156,251,.26)' }}>
              <span className="absolute inset-0 pointer-events-none" style={{ background:'radial-gradient(circle at 30% 8%, rgba(179,156,251,.22), transparent 62%)' }}></span>
              <span className="relative w-14 h-14 rounded-[19px] mx-auto flex items-center justify-center"
                    style={{ background:'rgba(179,156,251,.14)', border:'1px solid rgba(179,156,251,.3)' }}>
                <Icon d={RUN_ART.recovery} className="w-6 h-6" style={{ color:'#B39CFB' }}/>
              </span>
              <div className="font-black italic mt-2.5 relative" style={{ fontSize:'15px' }}>יום התאוששות</div>
              <div className="t-note mt-1.5 relative px-2">
                השריר נבנה במנוחה, לא באימון — יום בלי לוג הוא חלק מהתוכנית
              </div>
              <div className="flex items-center justify-center gap-2 mt-3 relative">
                {[{ i: I.timer, l:'שינה' }, { i: I.flame, l:'קלוריות' }, { i: I.dumbbell, l:'ריקברי' }].map((x, k) => (
                  <span key={k} className="flex items-center gap-1.5 rounded-full px-2.5 py-1 t-label" style={{ fontSize:'8.5px', background:'rgba(255,255,255,.04)', border:'1px solid rgba(255,255,255,.07)' }}>
                    <Icon d={x.i} className="w-3 h-3" style={{ color:'#B39CFB' }}/>{x.l}
                  </span>
                ))}
              </div>
            </div>
          )
        ) : (
          <div className="space-y-2">
            {s.workouts.map(w => (
              <button key={w.id} onClick={() => goTo(sel, 'workouts', w.id)}
                      className="w-full flex items-center gap-3 glass-2 rounded-[18px] p-3 text-start active:scale-[.98] transition">
                <DayGlyph tpl={w.tpl} size={40}/>
                <div className="flex-1 min-w-0">
                  <div className="font-bold text-sm truncate">{w.name}</div>
                  <div className="t-cap mt-0.5" style={{ fontSize:'9.5px' }}>{w.sets} סטים · {w.ton.toLocaleString()} ק"ג נפח</div>
                </div>
                <Icon d={I.chevL} className="w-4 h-4 shrink-0" style={{ color:'rgba(255,255,255,.22)' }}/>
              </button>
            ))}
            {s.runs.map(r => (
              <button key={r.id} onClick={() => goTo(sel, 'runs')}
                      className="w-full flex items-center gap-3 glass-2 rounded-[18px] p-3 text-start active:scale-[.98] transition">
                <RunGlyph type={r.type || 'easy'} size={40}/>
                <div className="flex-1 min-w-0">
                  <div className="font-bold text-sm truncate">{r.title}</div>
                  <div className="t-cap mt-0.5" style={{ fontSize:'9.5px' }}>{r.km} ק"מ · {fmtDur(r.sec)} · {fmtPace(r.sec / Math.max(r.km, .01))} דק'/ק"מ</div>
                </div>
                {r.src === 'strava' && <span className="text-[8px] font-black text-strava bg-strava/10 border border-strava/25 rounded-full px-1.5 py-0.5 shrink-0">STRAVA</span>}
                <Icon d={I.chevL} className="w-4 h-4 shrink-0" style={{ color:'rgba(255,255,255,.22)' }}/>
              </button>
            ))}
            {(s.mealsDone > 0 || s.dayKcal > 0) && (
              <button onClick={() => goTo(sel, 'food')}
                      className="w-full flex items-center gap-3 glass-2 rounded-[18px] p-3 text-start active:scale-[.98] transition">
                <div className="relative w-10 h-10 shrink-0 flex items-center justify-center">
                  <Ring pct={s.mealsDone / Math.max(1, s.mealsTotal)} size={40} stroke={3} color={CHART.fuel.c}/>
                  <span className="absolute inset-0 flex items-center justify-center t-num font-black" style={{ fontSize:'10px', color: CHART.fuel.c }}>
                    {Math.round(s.mealsDone / Math.max(1, s.mealsTotal) * 100)}
                  </span>
                </div>
                <div className="flex-1 min-w-0">
                  <div className="font-bold text-sm">תזונה · {s.mealsDone}/{s.mealsTotal}{s.dayKcal > 0 ? ' · ' + s.dayKcal.toLocaleString() + ' קק"ל' : ''}</div>
                  <div className="flex gap-1.5 mt-1.5">
                    {s.mealIcons.map((mi, i) => (
                      <MealGlyph key={i} meal={{ icon: mi.icon, title: mi.title }} size={19}
                                 tone={mi.done ? CHART.fuel.c : 'rgba(255,255,255,.18)'}/>
                    ))}
                  </div>
                </div>
                <Icon d={I.chevL} className="w-4 h-4 shrink-0" style={{ color:'rgba(255,255,255,.22)' }}/>
              </button>
            )}
            {s.weight && (
              <div className="flex items-center gap-3 glass-2 rounded-[18px] p-3">
                <span className="w-10 h-10 rounded-[14px] flex items-center justify-center shrink-0"
                      style={{ background:'rgba(179,156,251,.12)', border:'1px solid rgba(179,156,251,.24)' }}>
                  <Icon d={I.bodyscale} className="w-[18px] h-[18px]" style={{ color:'#B39CFB' }}/>
                </span>
                <div className="flex-1">
                  <div className="font-bold text-sm">שקילה</div>
                  <div className="t-cap mt-0.5" style={{ fontSize:'9.5px' }}>נרשם ביומן הגוף</div>
                </div>
                <span className="t-metric shrink-0" style={{ fontSize:'17px', color:'#B39CFB' }}>{s.weight.kg}<span className="t-label ms-1" style={{ fontSize:'8px' }}>ק"ג</span></span>
              </div>
            )}
            {s.photos.length > 0 && (
              <button onClick={() => goTo(sel, 'progress')}
                      className="w-full flex items-center gap-3 glass-2 rounded-[18px] p-3 text-start active:scale-[.98] transition">
                <div className="flex gap-1.5 shrink-0">
                  {s.photos.slice(0, 3).map(p => <img key={p.id} src={p.thumb} className="w-10 h-10 rounded-[13px] object-cover" style={{ border:'1px solid rgba(255,255,255,.1)' }} alt=""/>)}
                </div>
                <div className="flex-1 font-bold text-sm">{s.photos.length === 1 ? 'תמונת התקדמות' : s.photos.length + ' תמונות התקדמות'}</div>
                <Icon d={I.chevL} className="w-4 h-4 shrink-0" style={{ color:'rgba(255,255,255,.22)' }}/>
              </button>
            )}
          </div>
        )}
      </div>
    </div>
  );
}

/* ============================== settings ============================== */
function SettingsTab({ state, sync, syncNow, replaceState, mutate, stravaUi, stravaConnect, stravaDisconnect, stravaImport, onBack }){
  const [tok, setTok] = useState(localStorage.getItem(TOKEN_KEY) || '');
  const fileRef = useRef(null);
  const connected = !!localStorage.getItem(TOKEN_KEY);
  const sv = state.settings.strava || {};

  const saveTok = () => { const t = tok.trim(); if (!t) return; localStorage.setItem(TOKEN_KEY, t); syncNow(false); };
  const disconnect = () => { localStorage.removeItem(TOKEN_KEY); setTok(''); syncNow(false); };
  const updSettings = patch => mutate(d => { Object.assign(d.settings, patch); }, 'settings');
  const updStrava = patch => mutate(d => { d.settings.strava = Object.assign({}, d.settings.strava, patch); }, 'settings');

  const doExport = () => {
    const blob = new Blob([JSON.stringify(state, null, 1)], { type:'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'athletics-backup-' + toISO(new Date()) + '.json';
    a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 3000);
  };
  const doImport = e => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const rd = new FileReader();
    rd.onload = () => {
      try {
        const s = JSON.parse(rd.result);
        if (!s || s.version !== 1) throw new Error('bad');
        uiConfirm('הנתונים ימוזגו עם הקיימים.', { title:'לייבא גיבוי?', okText:'ייבא' }).then(ok => { if (ok) replaceState(mergeStates(normalize(s), state)); });
      } catch (err) { uiToast('קובץ לא תקין', 'warn'); }
      e.target.value = '';
    };
    rd.readAsText(file);
  };
  const doReset = async () => {
    if (!await uiConfirm('כל הנתונים במכשיר הזה יימחקו. הגיבוי בג׳יסט לא יימחק.', { title:'לאפס הכול?', danger:true, okText:'המשך' })) return;
    if (!await uiConfirm('אין דרך חזרה מקומית.', { title:'בטוח בטוח?', danger:true, okText:'אפס הכול' })) return;
    replaceState(seed());
  };

  const statusInfo = {
    off:     { c:'rgba(255,255,255,.25)', t:'לא מחובר לסנכרון' },
    pending: { c:'var(--gold)',           t:'שינויים ממתינים…' },
    syncing: { c:'var(--gold)',           t:'מסנכרן…' },
    ok:      { c:'#9BE86B',               t:'מסונכרן' + (sync.at ? ' · ' + new Date(sync.at).toLocaleTimeString('he-IL', { hour:'2-digit', minute:'2-digit' }) : '') },
    error:   { c:'var(--coral)',          t:'שגיאת סנכרון' },
  }[sync.status] || { c:'rgba(255,255,255,.25)', t:'' };

  const initial = (state.settings.name || 'A').trim().charAt(0).toUpperCase();

  return (
    <div className="fadein space-y-3">
      <div className="flex items-center justify-between mb-1">
        <button onClick={onBack} className="h-10 px-3.5 rounded-[14px] flex items-center gap-1.5 text-sm font-bold active:scale-[.98] transition"
                style={{ background:'rgba(255,255,255,.045)', border:'1px solid rgba(255,255,255,.07)', color:'rgba(255,255,255,.6)' }}>
          <Icon d={I.chevR} className="w-[18px] h-[18px]"/> חזרה
        </button>
        <div className="font-black italic" style={{ fontSize:'19px' }}>הגדרות</div>
      </div>

      {/* ---- profile ---- */}
      <div className="glass rounded-[24px] p-4">
        <div className="flex items-center gap-3 mb-3.5">
          <span className="w-[52px] h-[52px] rounded-[18px] flex items-center justify-center shrink-0 relative overflow-hidden"
                style={{ background:'linear-gradient(160deg, rgba(215,255,62,.20), rgba(159,232,0,.05))', border:'1px solid rgba(215,255,62,.30)' }}>
            <span className="absolute inset-0 pointer-events-none" style={{ background:'radial-gradient(circle at 30% 15%, rgba(215,255,62,.26), transparent 64%)' }}></span>
            <span className="t-metric relative" style={{ fontSize:'22px', color:'var(--lime)' }}>{initial}</span>
          </span>
          <div className="min-w-0 flex-1">
            <div className="font-black italic leading-none truncate" style={{ fontSize:'16px' }}>{state.settings.name || 'הפרופיל שלי'}</div>
            <div className="t-label mt-1.5" style={{ fontSize:'8.5px' }}>
              {state.settings.height ? state.settings.height + ' ס"מ' : 'גובה לא הוגדר'} · {state.weights.length} שקילות · {state.runs.length} ריצות
            </div>
          </div>
        </div>
        <div className="space-y-2.5">
          <div>
            <label className="lbl">שם (לברכה בדשבורד)</label>
            <input className="inp" placeholder="נועם" value={state.settings.name} onChange={e => updSettings({ name: e.target.value })}/>
          </div>
          <div>
            <label className="lbl">גובה (ס"מ) — לחישוב BMI</label>
            <input className="inp text-center font-bold t-num" inputMode="numeric" placeholder="178" value={state.settings.height} onChange={e => updSettings({ height: e.target.value })}/>
          </div>
        </div>
        <div className="t-note mt-3">שקילות ותמונות התקדמות נמצאות בטאב «התקדמות».</div>
      </div>

      {/* ---- gist sync ---- */}
      <div className="glass rounded-[24px] p-4">
        <SectionHead icon={I.refresh} title="סנכרון מק ↔ אייפון" sub="גיבוי חי בג׳יסט פרטי" tone="#9BE86B"
          right={
            <span className="flex items-center gap-1.5 shrink-0 rounded-full px-2.5 py-1.5"
                  style={{ background:'rgba(255,255,255,.045)', border:'1px solid rgba(255,255,255,.07)' }}>
              <span className={'w-2 h-2 rounded-full shrink-0 ' + (sync.status === 'syncing' ? 'pulse-dot' : '')}
                    style={{ background: statusInfo.c, boxShadow:'0 0 8px ' + statusInfo.c }}></span>
              <span className="t-label whitespace-nowrap" style={{ fontSize:'8.5px' }}>{statusInfo.t}</span>
            </span>
          }/>
        {sync.status === 'error' && (
          <div className="mb-3 rounded-[14px] px-3 py-2.5 text-[11px] break-all" dir="ltr"
               style={{ background:'rgba(255,107,87,.09)', border:'1px solid rgba(255,107,87,.24)', color:'var(--coral)' }}>{sync.msg}</div>
        )}
        <label className="lbl">טוקן GitHub · הרשאת gist בלבד</label>
        <input className="inp" dir="ltr" type="password" placeholder="ghp_…" value={tok} onChange={e => setTok(e.target.value)}/>

        <div className="mt-3.5 pt-3 space-y-2" style={{ borderTop:'1px solid rgba(255,255,255,.05)' }}>

              <a className="font-bold underline" style={{ color:'var(--strava, #FC4C02)' }} href="https://www.strava.com/settings/api" target="_blank" rel="noopener">strava.com/settings/api</a>.
              <br/>ב־<b>Authorization Callback Domain</b> רשום את הדומיין של האפליקציה (למשל <b dir="ltr">localhost</b> או <b dir="ltr">שלך.github.io</b>), והעתק לכאן:

            <input className="inp" dir="ltr" type="password" placeholder="Client Secret" value={sv.clientSecret || ''} onChange={e => updStrava({ clientSecret: e.target.value.trim() })}/>
            <button onClick={stravaConnect} disabled={!(sv.clientId && sv.clientSecret)}
                    className="w-full py-3 rounded-[16px] font-black text-sm active:scale-[.98] transition flex items-center justify-center gap-2"
                    style={ (sv.clientId && sv.clientSecret)
                      ? { background:'#FC4C02', color:'#fff', boxShadow:'0 6px 20px rgba(252,76,2,.24)' }
                      : { background:'rgba(255,255,255,.05)', color:'rgba(255,255,255,.28)', border:'1px solid rgba(255,255,255,.08)' } }>

              <button onClick={() => stravaImport(false)} className="flex-1 py-3 rounded-[16px] font-bold text-sm active:scale-[.98] transition"
                      style={{ background:'rgba(252,76,2,.14)', border:'1px solid rgba(252,76,2,.28)', color:'#FC4C02' }}>

              </button>
              <button onClick={stravaDisconnect} className="px-4 rounded-[16px] font-bold text-xs active:scale-[.98] transition"
                      style={{ background:'rgba(255,255,255,.05)', border:'1px solid rgba(255,255,255,.09)', color:'rgba(255,255,255,.5)' }}>נתק</button>

      {/* ---- iphone install ---- */}

            <div key={i} className="flex items-start gap-2.5">
              <span className="w-[18px] h-[18px] rounded-[7px] shrink-0 flex items-center justify-center t-num mt-[1px]"

              <span className="text-[11px] leading-relaxed" style={{ color:'var(--ink-2)' }}>{t}</span>
            </div>
          ))}

      </div>

      {/* ---- backup ---- */}
      <div className="glass rounded-[24px] p-4">
        <SectionHead icon={I.clipboard} title="גיבוי מקומי" sub="קובץ JSON על המכשיר"/>
        <div className="flex gap-2">
          <button onClick={doExport} className="flex-1 py-3 rounded-[16px] font-bold text-sm flex items-center justify-center gap-2 active:scale-[.98] transition"
                  style={{ background:'rgba(255,255,255,.05)', border:'1px solid rgba(255,255,255,.09)' }}>
            <Icon d={I.download} className="w-4 h-4" style={{ color:'#9BE86B' }}/> ייצוא
          </button>
          <button onClick={() => fileRef.current && fileRef.current.click()} className="flex-1 py-3 rounded-[16px] font-bold text-sm flex items-center justify-center gap-2 active:scale-[.98] transition"
                  style={{ background:'rgba(255,255,255,.05)', border:'1px solid rgba(255,255,255,.09)' }}>
            <Icon d={I.upload} className="w-4 h-4" style={{ color:'#6FDCF7' }}/> ייבוא
          </button>

      {/* ---- danger zone ---- */}
      <div className="rounded-[24px] p-4" style={{ background:'rgba(255,107,87,.05)', border:'1px solid rgba(255,107,87,.16)' }}>
        <SectionHead icon={I.trash} title="אזור מסוכן" sub="הפעולה הזו לא הפיכה במכשיר" tone="var(--coral)" className="mb-3"/>
        <button onClick={doReset} className="w-full py-3 rounded-[16px] font-bold text-sm active:scale-[.98] transition"
                style={{ background:'rgba(255,107,87,.1)', border:'1px solid rgba(255,107,87,.26)', color:'var(--coral)' }}>
          איפוס כל הנתונים במכשיר
        </button>
        <div className="t-note mt-2.5 text-center">הגיבוי בג׳יסט לא נמחק — אפשר לשחזר משם.</div>
      </div>

      <div className="text-center t-label pt-1 pb-2" style={{ fontSize:'8.5px', letterSpacing:'.34em' }}>ATHLETICS · LEAN BULK ENGINE</div>

}

/* ============================== app shell ============================== */
function App(){
  const [state, setState] = useState(load);
  const stateRef = useRef(state); stateRef.current = state;
  const [tab, setTab] = useState('home');
  const [week, setWeek] = useState(() => weekStartISO(new Date()));
  const [openTpl, setOpenTpl] = useState(null);
  const [sync, setSync] = useState({ status: localStorage.getItem(TOKEN_KEY) ? 'ok' : 'off', msg:'', at:0 });
  const [stravaUi, setStravaUi] = useState({ status:'idle', msg:'' });
  const [storyPreview, setStoryPreview] = useState(null);
  const openStory = spec => { try { setStoryPreview({ url: drawStoryCard(spec).toDataURL('image/png'), spec }); } catch (e) {} };
  const pushTimer = useRef(null);
  const syncingRef = useRef(false);
  const lastSyncRef = useRef(0);

  const schedulePush = useCallback(() => {
    if (!localStorage.getItem(TOKEN_KEY)) return;
    setSync(s => (s.status === 'syncing' ? s : { ...s, status:'pending' }));
    clearTimeout(pushTimer.current);
    pushTimer.current = setTimeout(() => syncNow(true), 2500);
  }, []);

  const mutate = useCallback((fn, stamp) => {
    const d = clone(stateRef.current);
    fn(d);
    const t = Date.now();
    if (stamp === 'templates') d.stamps.templates = t;
    else if (stamp === 'meals') d.stamps.meals = t;
    else if (stamp === 'settings') d.stamps.settings = t;
    else if (Array.isArray(stamp) && stamp[0] === 'week') d.stamps.weeks[stamp[1]] = t;
    stateRef.current = d; persist(d); setState(d); schedulePush();
  }, [schedulePush]);

  const replaceState = useCallback(d => {
    d = normalize(clone(d));
    const t = Date.now();
    d.stamps.templates = t; d.stamps.meals = t; d.stamps.settings = t;
    stateRef.current = d; persist(d); setState(d); schedulePush();
  }, [schedulePush]);

  /* ---------- github gist sync ---------- */
  async function gh(path, opts){
    opts = opts || {};
    const token = localStorage.getItem(TOKEN_KEY);
    const headers = { 'Authorization':'Bearer ' + token, 'Accept':'application/vnd.github+json' };
    if (opts.body) headers['Content-Type'] = 'application/json';
    const res = await fetch('https://api.github.com' + path, { method: opts.method || 'GET', headers, body: opts.body });
    if (!res.ok) {
      let t = ''; try { t = (await res.json()).message || ''; } catch (e) {}
      throw new Error('GitHub ' + res.status + (t ? ' · ' + t : ''));
    }
    return res.status === 204 ? null : res.json();
  }

  async function uploadPendingPhotos(st){
    for (const p of st.photos) {
      if (p.gistId) continue;
      try {
        const full = await idb.get(p.id);
        if (!full) continue;
        const created = await gh('/gists', { method:'POST', body: JSON.stringify({ description:'ATHLETICS_PHOTO ' + p.id, public:false, files:{ [PHOTO_FILE]:{ content: full } } }) });
        p.gistId = created.id;
        p.updatedAt = Date.now();
      } catch (e) {}
    }
  }

  async function syncNow(silent){
    const token = localStorage.getItem(TOKEN_KEY);
    if (!token) { setSync({ status:'off', msg:'', at:0 }); return; }
    if (syncingRef.current) return;
    syncingRef.current = true;
    setSync(s => ({ ...s, status:'syncing' }));
    try {
      let st = stateRef.current;
      let gid = st.settings.gistId;
      if (!gid) {
        const gists = await gh('/gists?per_page=100');
        const found = gists.find(g => g.description === GIST_DESC || (g.files && g.files[GIST_FILE]));
        if (found) gid = found.id;
      }
      if (!gid) {
        const withPhotos = clone(stateRef.current);
        await uploadPendingPhotos(withPhotos);
        const created = await gh('/gists', { method:'POST', body: JSON.stringify({ description: GIST_DESC, public:false, files:{ [GIST_FILE]:{ content: JSON.stringify(withPhotos) } } }) });
        withPhotos.settings.gistId = created.id;
        stateRef.current = withPhotos; persist(withPhotos); setState(withPhotos);
      } else {
        const g = await gh('/gists/' + gid);
        let remote = null;
        const file = g.files && g.files[GIST_FILE];
        if (file) {
          let content = file.content;
          if (file.truncated) content = await (await fetch(file.raw_url)).text();
          try { remote = JSON.parse(content); } catch (e) {}
        }
        let merged = remote ? mergeStates(stateRef.current, remote) : clone(stateRef.current);
        merged.settings.gistId = gid;
        await uploadPendingPhotos(merged);
        stateRef.current = merged; persist(merged); setState(merged);
        await gh('/gists/' + gid, { method:'PATCH', body: JSON.stringify({ files:{ [GIST_FILE]:{ content: JSON.stringify(merged) } } }) });
      }
      lastSyncRef.current = Date.now();
      setSync({ status:'ok', msg:'', at: Date.now() });
    } catch (e) {
      setSync({ status:'error', msg: String(e.message || e).slice(0, 200), at: Date.now() });
    } finally {
      syncingRef.current = false;
    }
  }

  /* ---------- photos ---------- */
  async function addPhoto(file){
    try {
      const full = await fileToDataUrl(file, 1000, .72);
      const thumb = await shrinkDataUrl(full, 260, .6);
      const id = uid();
      await idb.set(id, full).catch(() => {});
      mutate(d => { d.photos.push({ id, date: toISO(new Date()), thumb, gistId: null, updatedAt: Date.now() }); });
    } catch (e) { uiToast('שגיאה בטעינת התמונה', 'warn'); }
  }
  async function loadPhoto(p){
    const local = await idb.get(p.id).catch(() => null);
    if (local) return local;
    if (p.gistId && localStorage.getItem(TOKEN_KEY)) {
      const g = await gh('/gists/' + p.gistId);
      const f = g.files && g.files[PHOTO_FILE];
      if (f) {
        let c = f.content;
        if (f.truncated) c = await (await fetch(f.raw_url)).text();
        idb.set(p.id, c).catch(() => {});
        return c;
      }
    }
    return null;
  }
  async function delPhoto(p){
    if (!await uiConfirm('למחוק את התמונה?', { title:'מחיקת תמונה', danger:true, okText:'מחק' })) return;
    mutate(d => { d.photos = d.photos.filter(x => x.id !== p.id); if (d.deletedPhotos.indexOf(p.id) < 0) d.deletedPhotos.push(p.id); });
    idb.del(p.id).catch(() => {});
    if (p.gistId && localStorage.getItem(TOKEN_KEY)) gh('/gists/' + p.gistId, { method:'DELETE' }).catch(() => {});
  }

  /* ---------- strava ---------- */
  async function stravaTokenReq(body){
    const r = await fetch('https://www.strava.com/api/v3/oauth/token', { method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify(body) });
    if (!r.ok) { let m = ''; try { m = JSON.stringify(await r.json()).slice(0, 120); } catch (e) {} throw new Error('Strava ' + r.status + ' ' + m); }
    return r.json();
  }
  function stravaConnect(){
    const sv = stateRef.current.settings.strava || {};
    if (!sv.clientId || !sv.clientSecret) { uiToast('מלא Client ID ו-Client Secret', 'warn'); return; }
    const redirect = location.origin + location.pathname;
    localStorage.setItem('athletics.strava.pending', '1');
    location.href = 'https://www.strava.com/oauth/authorize?client_id=' + encodeURIComponent(sv.clientId)
      + '&redirect_uri=' + encodeURIComponent(redirect)
      + '&response_type=code&approval_prompt=auto&scope=activity:read_all';
  }
  async function stravaDisconnect(){
    if (!await uiConfirm('הריצות שכבר יובאו יישארו.', { title:'לנתק את סטרבה?', danger:true, okText:'נתק' })) return;
    mutate(d => { d.settings.strava = { clientId: (d.settings.strava || {}).clientId || '', clientSecret: (d.settings.strava || {}).clientSecret || '' }; }, 'settings');
    setStravaUi({ status:'idle', msg:'' });
  }
  async function ensureStravaToken(){
    const sv = stateRef.current.settings.strava;
    if (!sv || !sv.refreshToken) return null;
    if ((sv.expiresAt || 0) * 1000 - 60000 > Date.now()) return sv.accessToken;
    const j = await stravaTokenReq({ client_id: sv.clientId, client_secret: sv.clientSecret, grant_type:'refresh_token', refresh_token: sv.refreshToken });
    mutate(d => { d.settings.strava = Object.assign({}, d.settings.strava, { accessToken: j.access_token, refreshToken: j.refresh_token || sv.refreshToken, expiresAt: j.expires_at }); }, 'settings');
    return j.access_token;
  }
  async function stravaImport(silent){
    if (!silent) setStravaUi({ status:'syncing', msg:'מייבא ריצות מסטרבה...' });
    try {
      const at = await ensureStravaToken();
      if (!at) { if (!silent) setStravaUi({ status:'error', msg:'לא מחובר לסטרבה' }); return; }
      const dead = new Set(stateRef.current.deletedRuns);
      const have = new Set(stateRef.current.runs.map(r => r.id));
      const news = [];
      let page = 1;
      while (page <= 3) {
        const r = await fetch('https://www.strava.com/api/v3/athlete/activities?per_page=100&page=' + page, { headers:{ Authorization:'Bearer ' + at } });
        if (!r.ok) throw new Error('Strava ' + r.status);
        const acts = await r.json();
        acts.forEach(a => {
          const t = String(a.sport_type || a.type || '');
          if (!/run/i.test(t)) return;
          const id = 'sv' + a.id;
          if (have.has(id) || dead.has(id)) return;
          const date = String(a.start_date_local || a.start_date || '').slice(0, 10);
          if (!date) return;
          news.push({ id, date, title: a.name || 'Strava Run', km: Math.round(a.distance / 10) / 100, sec: Math.round(a.moving_time || 0), src:'strava', updatedAt: Date.now() });
        });
        if (acts.length < 100) break;
        page++;
      }
      if (news.length) mutate(d => { d.runs = news.concat(d.runs); });
      localStorage.setItem('athletics.strava.last', String(Date.now()));
      setStravaUi({ status:'ok', msg: news.length ? ('יובאו ' + news.length + ' ריצות חדשות ✓') : 'הכל מעודכן — אין ריצות חדשות ✓' });
    } catch (e) {
      setStravaUi({ status:'error', msg: String(e.message || e).slice(0, 160) });
    }
  }

  /* ---------- lifecycle ---------- */
  useEffect(() => { applyMood(); const iv = setInterval(applyMood, 10 * 60 * 1000); return () => clearInterval(iv); }, []);
  useEffect(() => {
    /* one-tap token handoff: opening the app with #gh=<token> stores the sync
       token on this device and immediately cleans it out of the address bar.
       The token itself never lives in this file or in the repo. */
    try {
      if (location.hash && location.hash.indexOf('gh=') !== -1) {
        const m = location.hash.match(/gh=([A-Za-z0-9_-]+)/);
        if (m) {
          localStorage.setItem(TOKEN_KEY, m[1]);
          history.replaceState({}, '', location.pathname + location.search);
        }
      }
    } catch (e) {}
    if (localStorage.getItem(TOKEN_KEY)) syncNow(true);
    const q = new URLSearchParams(location.search);
    const code = q.get('code');
    if (code && localStorage.getItem('athletics.strava.pending')) {
      localStorage.removeItem('athletics.strava.pending');
      history.replaceState({}, '', location.pathname);
      setTab('settings');
      (async () => {
        try {
          const sv = stateRef.current.settings.strava || {};
          const j = await stravaTokenReq({ client_id: sv.clientId, client_secret: sv.clientSecret, code, grant_type:'authorization_code' });
          mutate(d => {
            d.settings.strava = Object.assign({}, d.settings.strava, {
              accessToken: j.access_token, refreshToken: j.refresh_token, expiresAt: j.expires_at,
              athlete: j.athlete ? ((j.athlete.firstname || '') + ' ' + (j.athlete.lastname || '')).trim() : ''
            });
          }, 'settings');
          setStravaUi({ status:'ok', msg:'סטרבה חוברה בהצלחה ✓ מייבא ריצות...' });
          stravaImport(false);
        } catch (e) {
          setStravaUi({ status:'error', msg:'החיבור נכשל: ' + String(e.message || e).slice(0, 120) });
        }
      })();
    } else if (code) {
      history.replaceState({}, '', location.pathname);
    } else {
      const sv = stateRef.current.settings.strava;
      const last = Number(localStorage.getItem('athletics.strava.last') || 0);
      if (sv && sv.refreshToken && Date.now() - last > 6 * 3600 * 1000) stravaImport(true);
    }
    const onVis = () => {
      if (document.visibilityState === 'visible' && localStorage.getItem(TOKEN_KEY) && Date.now() - lastSyncRef.current > 15000) syncNow(true);
    };
    document.addEventListener('visibilitychange', onVis);
    return () => document.removeEventListener('visibilitychange', onVis);
  }, []);

  const isCur = week === weekStartISO(new Date());
  const dotColor = { off:'bg-white/20', pending:'bg-ember', syncing:'bg-ember', ok:'bg-volt', error:'bg-red-500' }[sync.status] || 'bg-white/20';
  const showWeekBar = tab === 'workouts' || tab === 'runs' || tab === 'food';

  const TABS = [
    { id:'home',     label:'בית',      icon:I.home },
    { id:'food',     label:'תזונה',    icon:I.clipboard },
    { id:'workouts', label:'אימונים',  icon:I.dumbbell },
    { id:'runs',     label:'ריצה',     icon:I.activity },
    { id:'progress', label:'התקדמות', icon:I.trend },
    { id:'calendar', label:'יומן',     icon:I.calendar },
  ];

  const goTo = (iso, t, tplId) => {
    setWeek(weekStartISO(fromISO(iso)));
    setOpenTpl(tplId || null);
    setTab(t);
  };

  return (
    <div className="min-h-screen">
      <DialogHost/>
      <div className="fixed inset-0 pointer-events-none overflow-hidden" style={{ zIndex:-1 }}>

      </div>

      <header className="sticky top-0 z-40" style={{ paddingTop:'env(safe-area-inset-top)', background:'linear-gradient(180deg, rgba(9,10,15,.92), rgba(9,10,15,.72))', borderBottom:'1px solid rgba(255,255,255,.06)', backdropFilter:'blur(22px) saturate(150%)', WebkitBackdropFilter:'blur(22px) saturate(150%)' }}>
        <div className="max-w-xl mx-auto px-4 pt-3 pb-2.5">
          <div className="flex items-center justify-between">
            <button onClick={() => setTab('home')} className="flex items-center gap-2.5 active:scale-[.98] transition">
              <div className="w-9 h-9 rounded-[13px] bg-volt flex items-center justify-center glow-volt">
                <Icon d={I.bolt} className="w-[18px] h-[18px] text-obsidian" filled/>
              </div>
              <div className="text-start">
                <div className="font-black italic text-[19px] leading-none" style={{ letterSpacing:'-.03em' }}>ATHLETICS</div>
                <div className="text-[8px] text-white/28 tracking-[.34em] font-bold mt-1">LEAN BULK ENGINE</div>
              </div>
            </button>
            <button onClick={() => setTab('settings')} className="relative w-10 h-10 rounded-2xl bg-white/5 border border-white/10 flex items-center justify-center active:scale-90 transition">
              <Icon d={I.gear} className={'w-5 h-5 ' + (tab === 'settings' ? 'text-volt' : 'text-white/50')}/>
              <span className={'absolute top-1 end-1 w-2 h-2 rounded-full ' + dotColor + (sync.status === 'syncing' || sync.status === 'pending' ? ' animate-pulse' : '')}></span>
            </button>
          </div>

          {showWeekBar && (
            <div className="mt-3 flex items-center justify-between glass rounded-[18px] px-2 py-1.5">
              <button onClick={() => setWeek(addDays(week, -7))} className="w-10 h-10 rounded-xl bg-white/5 active:scale-90 transition flex items-center justify-center">
                <Icon d={I.chevR} className="w-5 h-5 text-white/60"/>
              </button>
              <button onClick={() => setWeek(weekStartISO(new Date()))} className="text-center active:scale-95 transition px-2">
                <div className="font-black text-lg leading-none">
                  שבוע {weekNum(week)}
                  {!isCur && <span className="text-ember text-xs font-bold ms-1.5">· ארכיון</span>}
                </div>
                <div className="text-[10px] text-white/40 mt-1">
                  {weekRangeLabel(week)}{!isCur && ' · לחץ לחזרה להיום'}
                </div>
              </button>
              <button onClick={() => setWeek(addDays(week, 7))} className="w-10 h-10 rounded-xl bg-white/5 active:scale-90 transition flex items-center justify-center">
                <Icon d={I.chevL} className="w-5 h-5 text-white/60"/>
              </button>
            </div>
          )}
        </div>
      </header>

      <main className="max-w-xl mx-auto px-4 pt-4" style={{ paddingBottom:'calc(110px + env(safe-area-inset-bottom))' }}>
        {tab === 'home' && <Dashboard state={state} setTab={setTab} setOpenTpl={setOpenTpl} setWeek={setWeek}/>}
        {tab === 'workouts' && <WorkoutsTab state={state} week={week} mutate={mutate} openTpl={openTpl} setOpenTpl={setOpenTpl} onStory={openStory}/>}
        {tab === 'runs' && <RunsTab state={state} week={week} mutate={mutate} stravaConnected={!!(state.settings.strava && state.settings.strava.refreshToken)} onOpenSettings={() => setTab('settings')}
                                   onShare={r => openStory({
                                     kicker:'ריצה הושלמה', title: r.title, sub: heDate(r.date),
                                     stats: [
                                       { v: r.km, l:'ק"מ', color:'#6FDCF7' },
                                       { v: fmtPace(r.sec / Math.max(r.km, .01)), l:'דק׳/ק"מ', color:'#9BE86B' },
                                       { v: fmtDur(r.sec), l:'זמן', color:'#fff' },
                                       { v: Math.round(r.km * ((state.weights[0] && numOr0(state.weights[0].kg)) || 74)), l:'קק"ל', color:'#9BE86B' }
                                     ],
                                     lines: (r.splits || []).slice(0, 4).map((sp, i) => ({ a: 'קטע ' + (i + 1) + ' · ' + sp.km + ' ק"מ', b: fmtPace(sp.sec / Math.max(sp.km, .01)) }))
                                   })}/>}
        {tab === 'food' && <NutritionTab state={state} week={week} mutate={mutate}/>}
        {tab === 'progress' && <ProgressTab state={state} mutate={mutate} loadPhoto={loadPhoto} addPhoto={addPhoto} delPhoto={delPhoto} onStory={openStory}/>}
        {tab === 'calendar' && <CalendarTab state={state} goTo={goTo}/>}
        {tab === 'settings' && <SettingsTab state={state} sync={sync} syncNow={syncNow} replaceState={replaceState} mutate={mutate}
                                            stravaUi={stravaUi} stravaConnect={stravaConnect} stravaDisconnect={stravaDisconnect} stravaImport={stravaImport}
                                            onBack={() => setTab('home')}/>}
      </main>

      {storyPreview && (
        <div className="fixed inset-0 z-50 flex flex-col items-center justify-center gap-3 p-5 fadein" style={{ background:'rgba(0,0,0,.92)' }} onClick={() => setStoryPreview(null)}>
          <img src={storyPreview.url} alt="" onClick={e => e.stopPropagation()}
               style={{ maxHeight:'70vh', maxWidth:'100%', borderRadius:'22px', boxShadow:'0 30px 70px rgba(0,0,0,.8)' }}/>
          <div className="flex gap-2 w-full max-w-xs" onClick={e => e.stopPropagation()}>
            <button onClick={async () => { await shareStory(storyPreview.spec); setStoryPreview(null); }}
                    className="flex-1 py-3 rounded-2xl bg-volt text-obsidian font-black active:scale-[.98] transition glow-volt">שתף / שמור ⚡</button>
            <button onClick={() => setStoryPreview(null)} className="px-5 py-3 rounded-2xl bg-white/10 text-white/70 font-bold active:scale-95 transition">סגור</button>
          </div>
        </div>
      )}

      <nav className="fixed bottom-0 inset-x-0 z-40" style={{ background:'linear-gradient(0deg, rgba(9,10,15,.97), rgba(9,10,15,.80))', borderTop:'1px solid rgba(255,255,255,.07)', backdropFilter:'blur(26px) saturate(160%)', WebkitBackdropFilter:'blur(26px) saturate(160%)' }}>
        <div className="max-w-xl mx-auto grid grid-cols-6 px-1 pt-1.5" style={{ paddingBottom:'max(env(safe-area-inset-bottom), 10px)' }}>
          {TABS.map(t => {
            const active = tab === t.id;
            return (
              <button key={t.id} onClick={() => { setTab(t.id); if (t.id !== 'workouts') setOpenTpl(null); }}
                      className="relative flex flex-col items-center gap-1 py-1.5 select-none">
                {active && <span className="absolute -top-0.5 w-7 h-[3px] rounded-full bg-volt glow-volt"></span>}
                <Icon d={t.icon} className={'w-[22px] h-[22px] transition-colors ' + (active ? 'text-volt' : 'text-white/32')}/>
                <span className={'text-[9.5px] font-bold transition-colors ' + (active ? 'text-volt' : 'text-white/32')}>{t.label}</span>
              </button>
            );
          })}
        </div>
      </nav>
    </div>
  );
}

class ErrorBoundary extends React.Component {
  constructor(p){ super(p); this.state = { err:null }; }
  static getDerivedStateFromError(e){ return { err:e }; }
  render(){
    if (this.state.err) return (
      <div style={{ padding:24, direction:'ltr', fontFamily:'monospace', fontSize:12, color:'#f87171' }}>
        App error: {String(this.state.err && this.state.err.message || this.state.err)}
      </div>
    );
    return this.props.children;
  }
}

ReactDOM.createRoot(document.getElementById('root')).render(<ErrorBoundary><App/></ErrorBoundary>);
</script>
</body>
</html>
