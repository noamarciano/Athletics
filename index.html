/* last 3 logged sessions for one exercise/variant — progressive-overload at a tap */
function ExerciseHistorySheet({ state, tplId, ex, variant, onClose }){
  const key = exKey(ex, variant);
  const rows = useMemo(() => {
    const weeks = Object.keys(state.logs).sort().reverse();
    const out = [];
    for (let i = 0; i < weeks.length && out.length < 3; i++) {
      const arr = (((state.logs[weeks[i]] || {}).workouts || {})[tplId] || {})[key] || [];
      const sets = arr.filter(x => x && ((x.w !== '' && x.w != null) || (x.r !== '' && x.r != null)));
      if (sets.length) out.push({ week: weeks[i], sets });
    }
    return out;
  }, [state.logs, tplId, key]);
  const best = rows.length ? Math.max.apply(null, rows.flatMap(r => r.sets.map(s => numOr0(s.w)))) : 0;
  return (
    <div className="fixed inset-0 z-50 flex items-end justify-center" onClick={onClose} style={{ background:'rgba(0,0,0,.75)' }}>
      <div className="w-full max-w-xl rounded-t-3xl border border-white/10 p-4 space-y-3 fadein" onClick={e => e.stopPropagation()}
           style={{ background:'rgba(13,16,24,.98)', backdropFilter:'blur(24px)', WebkitBackdropFilter:'blur(24px)', maxHeight:'80vh', overflowY:'auto', paddingBottom:'max(env(safe-area-inset-bottom), 16px)' }}>
        <div className="flex items-start justify-between gap-3">
          <div className="min-w-0">
            <div className="text-[10px] font-bold text-volt flex items-center gap-1"><Icon d={I.history} className="w-3.5 h-3.5"/> 3 האימונים האחרונים</div>
            <div className="font-black text-lg leading-tight mt-0.5">{ex.name}</div>
            {variant && <div className="text-[10px] text-white/40 mt-0.5">{variant}</div>}
          </div>
          <button onClick={onClose} className="w-8 h-8 rounded-full bg-white/5 flex items-center justify-center text-white/60 shrink-0"><Icon d={I.x} className="w-4 h-4"/></button>
        </div>
        {rows.length === 0 ? (
          <div className="text-center text-white/30 text-sm py-6">עוד אין היסטוריה לתרגיל הזה — הסטים של היום יהיו הראשונים 💪</div>
        ) : rows.map(r => (
          <div key={r.week} className="glass-2 rounded-2xl p-3">
            <div className="flex items-center justify-between mb-2">
              <span className="text-xs font-bold text-white/60">שבוע {weekNum(r.week)}</span>
              <span className="text-[10px] text-white/30">{weekRangeLabel(r.week)}</span>
            </div>
            <div className="flex flex-wrap gap-1.5">
              {r.sets.map((sx, i) => {
                const isBest = numOr0(sx.w) === best && best > 0;
                return (
                  <span key={i} className={'text-xs font-bold rounded-xl px-2.5 py-1.5 border ' + (isBest ? 'bg-volt/15 text-volt border-volt/35' : 'bg-white/5 text-white/70 border-white/10')}>
                    {sx.w || '—'}<span className="text-white/30 mx-0.5">×</span>{sx.r || '—'}
                  </span>
                );
              })}
            </div>
          </div>
        ))}
        {best > 0 && <div className="text-center text-[11px] text-white/40">שיא במשקל: <span className="text-volt font-black">{best} ק"ג</span></div>}
      </div>
    </div>
  );
}

/* cardio-native view for the Friday run day: no lifting stats, no rest timer —
   a real run form that writes straight into the global run log, or the linked
   run once one exists for that week's Friday/Saturday */
function FridayRunBlock({ state, week, tpl, mutate }){
  const run = fridayRunOf(state, week);
  const fri = addDays(week, 5);
  const blank = { title:'', km:'', dur:'', date: fri, type:'', splits:[] };
  const [mode, setMode] = useState(null); // null = view, 'add' | 'edit' = form
  const [f, setF] = useState(blank);
  const [goalEdit, setGoalEdit] = useState(null); // { id, name } while editing a goal line
  useEffect(() => { setMode(null); setGoalEdit(null); setF(Object.assign({}, blank, { date: addDays(week, 5) })); }, [week]);
  const eff = (numOr0(f.km) > 0 || parseDur(f.dur) > 0) ? { km: numOr0(f.km), sec: parseDur(f.dur) } : sumSplits(f.splits);
  const goals = tpl.exercises.filter(e => e.check);

  const startEdit = () => { setF({ title: run.title, km: String(run.km), dur: fmtDur(run.sec), date: run.date, type: run.type || '', splits: (run.splits || []).map(s => ({ km: String(s.km), dur: fmtDur(s.sec) })) }); setMode('edit'); };
  const pickStyle = st => setF(x => {
    const isDefaultTitle = !x.title || RUN_STYLES.some(s => s.title === x.title);
    return Object.assign({}, x, { type: st.id, title: isDefaultTitle ? st.title : x.title });
  });
  const validSplits = () => (f.splits || []).map(s => ({ km: numOr0(s.km), sec: parseDur(s.dur) })).filter(s => s.km > 0 && s.sec > 0);
  const save = () => {
    if (!(eff.km > 0)) { uiToast('הכנס מרחק בק"מ (או הוסף ספליטים)', 'warn'); return; }
    if (!(eff.sec > 0)) { uiToast('הכנס זמן ריצה (או הוסף ספליטים)', 'warn'); return; }
    const sp = validSplits();
    const patch = { title: (f.title.trim() || (styleOf(f.type) || {}).title || 'ריצת שישי'), km: eff.km, sec: eff.sec, date: f.date || fri, type: f.type || '', splits: sp };
    if (mode === 'edit' && run) {
      mutate(d => { const r = d.runs.find(x => x.id === run.id); if (r) { Object.assign(r, patch, { updatedAt: Date.now() }); } });
    } else {
      mutate(d => { d.runs.unshift(Object.assign({ id: uid() }, patch, { updatedAt: Date.now() })); });
    }
    setMode(null);
  };
  const reset = () => setF(Object.assign({}, blank, { date: addDays(week, 5) }));
  const del = async () => {
    if (!run) return;
    if (!await uiConfirm('למחוק את ריצת שישי (' + run.km + ' ק"מ)? תוכל לרשום חדשה מיד.', { title:'מחיקת ריצה', danger:true, okText:'מחק' })) return;
    mutate(d => { d.runs = d.runs.filter(x => x.id !== run.id); if (d.deletedRuns.indexOf(run.id) < 0) d.deletedRuns.push(run.id); });
    reset(); setMode(null);
  };
  const saveGoal = () => {
    const g = goalEdit; if (!g) return;
    mutate(d => { const t = d.templates.find(x => x.id === tpl.id); const ex = t && t.exercises.find(e => e.id === g.id); if (ex) ex.name = g.name.trim() || ex.name; }, 'templates');
    setGoalEdit(null);
  };

  const form = (
    <div className="glass rounded-[24px] p-4 space-y-2.5 fadein">
      <div className="flex items-center justify-between">
        <div className="font-bold flex items-center gap-2">
          <span className={'w-7 h-7 rounded-xl flex items-center justify-center ' + (mode === 'edit' ? 'bg-volt/20 text-volt' : 'bg-ember/20 text-ember')}>
            <Icon d={mode === 'edit' ? I.pencil : I.plus} className="w-4 h-4"/>
          </span>
          {mode === 'edit' ? 'עריכת ריצת שישי' : 'רשום את ריצת שישי'}
        </div>
        {run && <button onClick={() => { reset(); setMode(null); }} className="text-[10px] font-bold text-white/50 bg-white/5 border border-white/10 rounded-full px-2.5 py-1 active:scale-95 transition">בטל ✕</button>}
      </div>
      <div><label className="lbl">סגנון ריצה</label><StylePills value={f.type} onPick={pickStyle}/></div>
      <input className="inp" placeholder="שם הריצה (למשל: ריצת בוקר קלה)" value={f.title} onChange={e => setF({ ...f, title: e.target.value })}/>
      <div className="grid grid-cols-3 gap-2">
        <div><label className="lbl">מרחק (ק"מ)</label>
          <input className="inp text-center font-bold" inputMode="decimal" placeholder="5.0" value={f.km} onChange={e => setF({ ...f, km: e.target.value })}/></div>
        <div><label className="lbl">זמן (דק:שנ)</label>
          <input className="inp text-center font-bold" inputMode="numeric" placeholder="30:00" value={f.dur} onChange={e => setF({ ...f, dur: fmtTimeInput(e.target.value) })}/></div>
        <div><label className="lbl">תאריך</label>
          <input type="date" className="inp text-center" value={f.date} onChange={e => setF({ ...f, date: e.target.value })}/></div>
      </div>
      <SplitsEditor splits={f.splits} setSplits={sp => setF(x => Object.assign({}, x, { splits: sp }))}
                    onApplySum={sum => setF(x => Object.assign({}, x, { km: sum.km ? String(sum.km) : x.km, dur: sum.sec ? fmtDur(sum.sec) : x.dur }))}/>
      <div className="flex items-center justify-between glass-2 rounded-2xl px-4 py-2.5">
        <span className="text-xs text-white/40">קצב מחושב</span>
        <span className="font-black text-xl text-volt text-glow">{(eff.km > 0 && eff.sec > 0) ? fmtPace(eff.sec / eff.km) : '—'}<span className="text-[10px] text-white/40 font-normal ms-1">דק' / ק"מ</span></span>
      </div>
      <button onClick={save} className="w-full py-3 rounded-2xl bg-volt text-obsidian font-black text-lg active:scale-[.98] transition glow-volt">{mode === 'edit' ? 'עדכן ריצה 💾' : 'שמור ריצה ⚡'}</button>
      {mode !== 'edit' && <div className="text-[10px] text-white/30 text-center">נשמר ישירות ליומן הריצות — והשבוע מסומן כהושלם אוטומטית</div>}
    </div>
  );

  const st = styleOf(run && run.type);
  return (
    <React.Fragment>
      {goals.length > 0 && (
        <div className="glass rounded-[24px] p-4">
          <div className="text-[10px] font-bold text-white/40 mb-1">היעד הקבוע</div>
          {goals.map(g => (
            goalEdit && goalEdit.id === g.id ? (
              <div key={g.id} className="flex gap-2 py-1">
                <input className="inp flex-1 min-w-0 font-bold" value={goalEdit.name} autoFocus onChange={e => setGoalEdit({ id: g.id, name: e.target.value })}/>
                <button onClick={saveGoal} className="px-3 rounded-xl bg-volt text-obsidian font-black active:scale-95 transition"><Icon d={I.check} className="w-4 h-4"/></button>
                <button onClick={() => setGoalEdit(null)} className="px-3 rounded-xl bg-white/5 border border-white/10 text-white/50 active:scale-95 transition"><Icon d={I.x} className="w-4 h-4"/></button>
              </div>
            ) : (
              <div key={g.id} className="flex items-center justify-between gap-2 py-1">
                <button onClick={() => setGoalEdit({ id: g.id, name: g.name })} className="flex items-center gap-1.5 text-start active:scale-[.98] transition min-w-0">
                  <Icon d={I.pencil} className="w-3.5 h-3.5 text-white/30 shrink-0"/>
                  <span className="font-bold text-sm">{g.name}</span>
                </button>
                <span className="text-volt text-xs font-black shrink-0">{g.reps}</span>
              </div>
            )
          ))}
        </div>
      )}
      {(run && mode !== 'edit') ? (
        <div className="rounded-[24px] p-4 bg-volt/10 border border-volt/25 fadein">
          <div className="flex items-center gap-3">
            <span className="text-3xl">{st ? st.emoji : '🏃'}</span>
            <div className="flex-1 min-w-0">
              <div className="font-bold truncate">{run.title}</div>
              <div className="text-[11px] text-white/40">{heDate(run.date)}{st ? ' · ' + st.label : ''}</div>
            </div>
            <span className="text-[9px] font-black text-obsidian bg-volt rounded-full px-2.5 py-1 glow-volt shrink-0">הושלם ✓</span>
          </div>
          <div className="grid grid-cols-3 gap-2 mt-3 text-center">
            <div className="glass-2 rounded-2xl py-2.5"><div className="font-black text-xl text-volt">{run.km}</div><div className="text-[10px] text-white/40 mt-0.5">ק"מ</div></div>
            <div className="glass-2 rounded-2xl py-2.5"><div className="font-black text-xl text-ember">{fmtPace(run.sec / Math.max(run.km, .01))}</div><div className="text-[10px] text-white/40 mt-0.5">דק'/ק"מ</div></div>
            <div className="glass-2 rounded-2xl py-2.5"><div className="font-black text-xl">{fmtDur(run.sec)}</div><div className="text-[10px] text-white/40 mt-0.5">זמן</div></div>
          </div>
          {run.splits && run.splits.length > 0 && (
            <React.Fragment>
              <div className="text-[10px] font-bold text-white/40 mt-3 mb-1">ספליטים</div>
              <SplitsList splits={run.splits}/>
            </React.Fragment>
          )}
          <div className="flex gap-2 mt-3">
            <button onClick={startEdit} className="flex-1 py-2.5 rounded-2xl bg-white/5 border border-white/10 text-white/80 font-bold text-sm flex items-center justify-center gap-2 active:scale-[.98] transition">
              <Icon d={I.pencil} className="w-4 h-4 text-volt"/> ערוך ריצה
            </button>
            <button onClick={del} className="px-4 py-2.5 rounded-2xl bg-ember/15 border border-ember/25 text-ember font-bold text-sm flex items-center justify-center gap-1.5 active:scale-95 transition">
              <Icon d={I.trash} className="w-4 h-4"/> מחק
            </button>
          </div>
        </div>
      ) : form}
    </React.Fragment>
  );
}

function WorkoutDetail({ state, week, tpl, mutate, onBack, onStory }){
  const [edit, setEdit] = useState(false);
  const [restTick, setRestTick] = useState(0);
  const [histFor, setHistFor] = useState(null);
  const [dragId, setDragId] = useState(null);
  const dragRef = useRef(null);
  const prog = tplProgress(state, week, tpl);
  const ton = tonnage(state, week, tpl);
  const pct = prog.total ? prog.done / prog.total : 0;
  const isRunDay = !!tpl.runDay || (tpl.exercises.length > 0 && tpl.exercises.every(e => e.check));
  const runDayDone = isRunDay && tpl.exercises.some(ex => isCheckExDone(state, week, tpl.id, ex));

  const setSetField = (key, idx, field, val) => {
    let justCompleted = false;
    mutate(d => {
    const wk = (d.logs[week] = d.logs[week] || {});
    const wo = (wk.workouts = wk.workouts || {});
    const t = (wo[tpl.id] = wo[tpl.id] || {});
    const arr = (t[key] = t[key] || []);
    while (arr.length <= idx) arr.push({ w:'', r:'', done:false });
    if (field === 'done') {
      arr[idx].done = !arr[idx].done;
      if (arr[idx].done) { arr[idx].t = toISO(new Date()); justCompleted = true; }
      else delete arr[idx].t;
    } else arr[idx][field] = val;
    }, ['week', week]);
    if (justCompleted) setRestTick(t => t + 1);   /* auto rest countdown */
  };

  const setVariant = (ex, v) => mutate(d => {
    const wk = (d.logs[week] = d.logs[week] || {});
    const vm = (wk.variants = wk.variants || {});
    vm[tpl.id + '|' + ex.id] = v;
  }, ['week', week]);

  const updTpl = patch => mutate(d => { Object.assign(d.templates.find(x => x.id === tpl.id), patch); }, 'templates');
  const updEx = (exId, patch) => mutate(d => {
    const t = d.templates.find(x => x.id === tpl.id);
    Object.assign(t.exercises.find(e => e.id === exId), patch);
  }, 'templates');
  const delEx = async exId => {
    const ex = tpl.exercises.find(e => e.id === exId);
    if (!await uiConfirm('למחוק את התרגיל "' + (ex ? ex.name : '') + '"?', { title:'מחיקת תרגיל', danger:true, okText:'מחק' })) return;
    mutate(d => { const t = d.templates.find(x => x.id === tpl.id); t.exercises = t.exercises.filter(e => e.id !== exId); }, 'templates');
  };
  const addEx = () => mutate(d => {
    d.templates.find(x => x.id === tpl.id).exercises.push({ id: uid(), muscle:'קבוצת שריר', name:'תרגיל חדש', sets:3, reps:'8-10' });
  }, 'templates');
  const moveEx = (exId, dir) => mutate(d => {
    const t = d.templates.find(x => x.id === tpl.id);
    const i = t.exercises.findIndex(e => e.id === exId), j = i + dir;
    if (i < 0 || j < 0 || j >= t.exercises.length) return;
    const tmp = t.exercises[i]; t.exercises[i] = t.exercises[j]; t.exercises[j] = tmp;
  }, 'templates');
  /* touch/pointer drag-to-reorder: find the card under the finger and move into it */
  const onDragStart = (exId, e) => {
    try { e.currentTarget.setPointerCapture(e.pointerId); } catch (err) {}
    setDragId(exId); dragRef.current = { id: exId };
  };
  const onDragMove = e => {
    if (!dragRef.current) return;
    const y = e.clientY;
    const nodes = Array.from(document.querySelectorAll('[data-exrow]'));
    for (let i = 0; i < nodes.length; i++) {
      const r = nodes[i].getBoundingClientRect();
      if (y >= r.top && y <= r.bottom) {
        const overId = nodes[i].getAttribute('data-exrow');
        if (overId && overId !== dragRef.current.id) {
          mutate(d => {
            const t = d.templates.find(x => x.id === tpl.id);
            const from = t.exercises.findIndex(x => x.id === dragRef.current.id);
            const to = t.exercises.findIndex(x => x.id === overId);
            if (from < 0 || to < 0) return;
            const [it] = t.exercises.splice(from, 1);
            t.exercises.splice(to, 0, it);
          }, 'templates');
        }
        break;
      }
    }
  };
  const onDragEnd = () => { dragRef.current = null; setDragId(null); };

  const moveTpl = dir => mutate(d => {
    const i = d.templates.findIndex(x => x.id === tpl.id), j = i + dir;
    if (i < 0 || j < 0 || j >= d.templates.length) return;
    const tmp = d.templates[i]; d.templates[i] = d.templates[j]; d.templates[j] = tmp;
  }, 'templates');
  const delWorkout = async () => {
    if (!await uiConfirm('למחוק את האימון "' + tpl.name + '" לגמרי?', { title:'מחיקת אימון', danger:true, okText:'מחק' })) return;
    mutate(d => { d.templates = d.templates.filter(x => x.id !== tpl.id); }, 'templates');
    onBack();
  };

  return (
    <div className="fadein space-y-3">
      <div className="flex items-center justify-between">
        <button onClick={onBack} className="flex items-center gap-1 text-white/60 text-sm font-bold active:scale-95 transition">
          <Icon d={I.chevR} className="w-5 h-5"/> חזרה
        </button>
        <div className="flex gap-2">
          {edit && (
            <React.Fragment>
              <button onClick={() => moveTpl(-1)} title="הזז למעלה ברשימת האימונים"
                      className="w-10 h-10 rounded-2xl bg-white/5 border border-white/10 text-white/60 flex items-center justify-center active:scale-90 transition">
                <Icon d={I.chevUp} className="w-4 h-4"/>
              </button>
              <button onClick={() => moveTpl(1)} title="הזז למטה ברשימת האימונים"
                      className="w-10 h-10 rounded-2xl bg-white/5 border border-white/10 text-white/60 flex items-center justify-center active:scale-90 transition">
                <Icon d={I.chevDown} className="w-4 h-4"/>
              </button>
              <button onClick={delWorkout} className="w-10 h-10 rounded-2xl bg-ember/15 text-ember flex items-center justify-center active:scale-90 transition">
                <Icon d={I.trash} className="w-4 h-4"/>
              </button>
            </React.Fragment>
          )}
          {!edit && onStory && prog.done > 0 && (
            <button onClick={() => onStory({
                      kicker:'אימון הושלם', title: tpl.name, sub: tpl.sub,
                      stats: [
                        { v: prog.done + '/' + prog.total, l:'סטים', color: CHART.train.c },
                        { v: ton.toLocaleString(), l:'ק"ג נפח', color:'#fff' },
                        { v: tpl.exercises.length, l:'תרגילים', color: CHART.fuel.c },
                        { v: Math.round(pct * 100) + '%', l:'הושלם', color: CHART.train.c }
                      ],
                      lines: tpl.exercises.slice(0, 4).map(ex2 => {
                        const ss = getSetsByKey(state, week, tpl.id, exKey(ex2, getActiveVariant(state, week, tpl.id, ex2)), ex2.sets).filter(x => x.done);
                        const top = ss.reduce((b, x) => numOr0(x.w) > numOr0(b.w) ? x : b, ss[0] || { w:'', r:'' });
                        return ss.length ? { a: ex2.name.length > 26 ? ex2.name.slice(0, 25) + '…' : ex2.name, b: (top.w || '—') + ' × ' + (top.r || '—') } : null;
                      }).filter(Boolean),
                      footer: heDate(toISO(new Date()))
                    })}
                    className="h-10 px-3 rounded-2xl bg-volt/10 border border-volt/25 text-volt flex items-center gap-1.5 text-sm font-bold active:scale-95 transition">
              <Icon d={I.share} className="w-4 h-4"/> שתף
            </button>
          )}
          <button onClick={() => setEdit(!edit)}
                  className={'h-10 px-4 rounded-2xl flex items-center gap-2 text-sm font-bold active:scale-95 transition ' + (edit ? 'bg-volt text-obsidian glow-volt' : 'bg-white/5 text-white/70 border border-white/10')}>
            <Icon d={edit ? I.check : I.pencil} className="w-4 h-4"/>{edit ? 'סיום עריכה' : 'עריכה'}
          </button>
        </div>
      </div>

      <div className="glass rounded-[24px] p-5">
        {edit ? (
          <div className="space-y-2">
            <div className="flex gap-2">
              <input className="inp w-16 text-center text-2xl" value={tpl.icon} onChange={e => updTpl({ icon: e.target.value })}/>
              <input className="inp flex-1 font-black text-lg" value={tpl.name} onChange={e => updTpl({ name: e.target.value })}/>
            </div>
            <input className="inp text-xs" value={tpl.sub} onChange={e => updTpl({ sub: e.target.value })} placeholder="תיאור (למשל: סבב א׳ · יום 1)"/>
          </div>
        ) : (
          <div className="flex items-center gap-3">
            <DayGlyph tpl={tpl} size={58}/>
            <div className="flex-1 min-w-0">
              <h2 className="t-display" style={{ fontSize:'26px' }}>{tpl.name}</h2>
              <div className="t-cap mt-1.5">{tpl.sub}</div>
            </div>
            {isRunDay && (runDayDone
              ? <span className="text-[10px] font-black text-obsidian bg-volt rounded-full px-2.5 py-1 glow-volt shrink-0">הושלם השבוע ✓</span>
              : <span className="text-[10px] font-bold text-white/40 bg-white/5 border border-white/10 rounded-full px-2.5 py-1 shrink-0">ממתין לריצה 🏃</span>)}
          </div>
        )}
        {!isRunDay && (
          <React.Fragment>
            <div className="grid grid-cols-3 gap-2 mt-4 text-center">
              {[
                { v: prog.done + '/' + prog.total, l:'סטים', c: CHART.train.c },
                { v: ton.toLocaleString(), l:'ק"ג נפח', c:'#fff' },
                { v: tpl.exercises.length, l:'תרגילים', c:'#fff' }
              ].map((x, i) => (
                <div key={i} className="glass-2 rounded-[16px] py-3">
                  <div className="t-metric" style={{ color:x.c, fontSize:'21px' }}>{x.v}</div>
                  <div className="t-label mt-1.5" style={{ fontSize:'8.5px' }}>{x.l}</div>
                </div>
              ))}
            </div>
            <div className="mt-3 h-[5px] rounded-full overflow-hidden" style={{ background:'rgba(255,255,255,.07)' }} dir="ltr">
              <div className="h-full rounded-full" style={{ width:(pct * 100) + '%', background:'linear-gradient(90deg,' + CHART.train.c + '55,' + CHART.train.c + ')', boxShadow:'0 0 10px ' + CHART.train.c + '88', transition:'width .6s var(--ease)' }}/>
            </div>
          </React.Fragment>
        )}
      </div>

      {!edit && !isRunDay && <RestTimer trigger={restTick}/>}

      {isRunDay ? (
        <React.Fragment>
          <FridayRunBlock state={state} week={week} tpl={tpl} mutate={mutate}/>
          {edit && (
            <div className="glass rounded-[24px] p-4 space-y-2 fadein">
              <div className="text-[10px] font-bold text-white/40">היעד הקבוע (טקסט בלבד — הריצה נרשמת מלמעלה)</div>
              {tpl.exercises.filter(e => e.check).map(g => (
                <div key={g.id} className="flex gap-2">
                  <input className="inp flex-1 min-w-0" value={g.name} onChange={e => updEx(g.id, { name: e.target.value })}/>
                  <input className="inp w-24 text-center" value={g.reps} onChange={e => updEx(g.id, { reps: e.target.value })}/>
                </div>
              ))}
            </div>
          )}
        </React.Fragment>
      ) : (
        <React.Fragment>
          {tpl.exercises.map((ex, i) => (
            <div key={ex.id} data-exrow={ex.id}>
              <ExerciseCard state={state} week={week} tpl={tpl} ex={ex} edit={edit}
                            updEx={updEx} delEx={delEx} setSetField={setSetField} setVariant={setVariant}
                            moveEx={moveEx} idx={i} count={tpl.exercises.length}
                            onHistory={(e2, v) => setHistFor({ ex: e2, variant: v })}
                            dragging={dragId === ex.id}
                            dragProps={{ onPointerDown: e => onDragStart(ex.id, e), onPointerMove: onDragMove, onPointerUp: onDragEnd, onPointerCancel: onDragEnd }}/>
            </div>
          ))}
          {edit && (
            <button onClick={addEx} className="w-full glass rounded-[24px] py-4 text-volt font-bold flex items-center justify-center gap-2 active:scale-[.98] transition">
              <Icon d={I.plus} className="w-5 h-5"/> הוסף תרגיל
            </button>
          )}
          {edit && <div className="text-center text-[10px] text-white/30">גרור את הידית לשינוי סדר התרגילים</div>}
        </React.Fragment>
      )}
      {histFor && (
        <ExerciseHistorySheet state={state} tplId={tpl.id} ex={histFor.ex} variant={histFor.variant} onClose={() => setHistFor(null)}/>
      )}
    </div>
  );
}

/* ============================== runs ============================== */
function RunChart({ runs }){
  const data = useMemo(() => runs.slice().sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0).slice(-24), [runs]);
  const [sel, setSel] = useState(null);
  useEffect(() => { setSel(data.length ? data.length - 1 : null); }, [data.length]);
  if (data.length === 0) return (
    <div className="text-center py-10 text-white/30 text-sm">אין ריצות עדיין — רשום את הריצה הראשונה שלך 🏃</div>
  );
  const W = 640, H = 250, L = 40, R = 46, T = 16, B = 30;
  const kmMax = Math.max.apply(null, data.map(r => r.km).concat([1])) * 1.2;
  const paceOf = r => r.sec / Math.max(r.km, .01);
  const paces = data.map(paceOf);
  let pMin = Math.min.apply(null, paces), pMax = Math.max.apply(null, paces);
  const padP = Math.max((pMax - pMin) * .25, 20); pMin -= padP; pMax += padP;
  const X = i => data.length === 1 ? (L + (W - L - R) / 2) : L + i * (W - L - R) / (data.length - 1);
  const Ykm = v => H - B - (v / kmMax) * (H - T - B);
  const Yp = v => T + ((v - pMin) / (pMax - pMin)) * (H - T - B);
  const kmPts = data.map((r, i) => X(i) + ',' + Ykm(r.km)).join(' ');
  const pPts = data.map((r, i) => X(i) + ',' + Yp(paceOf(r))).join(' ');
  const area = data.length > 1
    ? 'M' + X(0) + ',' + (H - B) + ' L' + data.map((r, i) => X(i) + ',' + Ykm(r.km)).join(' L') + ' L' + X(data.length - 1) + ',' + (H - B) + ' Z'
    : '';
  const xLabelStep = Math.max(1, Math.ceil(data.length / 6));
  const selRun = sel != null ? data[sel] : null;
  return (
    <div dir="ltr">
      <svg viewBox={'0 0 ' + W + ' ' + H} className="w-full select-none">
        <defs>
          <linearGradient id="gkm" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stopColor="#6FDCF7" stopOpacity=".40"/>
            <stop offset="55%" stopColor="#6FDCF7" stopOpacity=".13"/>
            <stop offset="100%" stopColor="#9BE86B" stopOpacity="0"/>
          </linearGradient>
        </defs>
        {[.25, .5, .75, 1].map(f => {
          const v = kmMax * f, y = Ykm(v);
          return (
            <g key={f}>
              <line x1={L} x2={W - R} y1={y} y2={y} stroke="rgba(255,255,255,.05)"/>
              <text x={L - 7} y={y + 3} textAnchor="end" fontSize="9" fill="rgba(155,232,107,.5)">{v.toFixed(1)}</text>
            </g>
          );
        })}
        {[.15, .5, .85].map(f => {
          const v = pMin + (pMax - pMin) * f;
          return <text key={f} x={W - R + 7} y={Yp(v) + 3} fontSize="9" fill="rgba(111,220,247,.6)">{fmtPace(v)}</text>;
        })}
        {area && <path d={area} fill="url(#gkm)"/>}
        {data.length > 1 && <polyline points={pPts} fill="none" stroke="#6FDCF7" strokeWidth="2" strokeDasharray="5 4" strokeLinejoin="round" opacity=".85"/>}
        {data.length > 1 && <polyline points={kmPts} fill="none" stroke="#9BE86B" strokeWidth="2.5" strokeLinejoin="round" style={{ filter:'drop-shadow(0 0 8px rgba(155,232,107,.55))' }}/>}
        {data.map((r, i) => (
          <g key={r.id}>
            {sel === i && <line x1={X(i)} x2={X(i)} y1={T} y2={H - B} stroke="rgba(255,255,255,.15)" strokeDasharray="3 3"/>}
            <circle cx={X(i)} cy={Ykm(r.km)} r={sel === i ? 5 : 3.5} fill={sel === i ? '#9BE86B' : '#07080C'} stroke="#9BE86B" strokeWidth="2"/>
            <circle cx={X(i)} cy={Yp(paceOf(r))} r={sel === i ? 4 : 3} fill={sel === i ? '#6FDCF7' : '#07080C'} stroke="#6FDCF7" strokeWidth="1.5"/>
            <rect x={X(i) - 14} y={T} width="28" height={H - T - B} fill="transparent" onClick={() => setSel(i)} style={{ cursor:'pointer' }}/>
          </g>
        ))}
        {(() => {
          const kms = data.map(r => r.km);
          const bi = kms.indexOf(Math.max.apply(null, kms));
          const paces2 = data.map(paceOf);
          const fi = paces2.indexOf(Math.min.apply(null, paces2));
          const tags = [];
          if (data.length > 1 && bi >= 0) tags.push(
            <g key="pk-km">
              <circle cx={X(bi)} cy={Ykm(data[bi].km)} r="7" fill="none" stroke="#6FDCF7" strokeWidth="1.5" opacity=".55"/>
              <text x={X(bi)} y={Ykm(data[bi].km) - 12} textAnchor="middle" fontSize="9" fontWeight="bold" fill="#6FDCF7">▲{data[bi].km}</text>
            </g>);
          if (data.length > 1 && fi >= 0 && fi !== bi) tags.push(
            <g key="pk-pace">
              <circle cx={X(fi)} cy={Yp(paces2[fi])} r="6" fill="none" stroke="#9BE86B" strokeWidth="1.5" opacity=".55"/>
              <text x={X(fi)} y={Yp(paces2[fi]) - 11} textAnchor="middle" fontSize="9" fontWeight="bold" fill="#9BE86B">⚡{fmtPace(paces2[fi])}</text>
            </g>);
          return tags;
        })()}
        {data.map((r, i) => ((i % xLabelStep === 0 || i === data.length - 1)
          ? <text key={'x' + r.id} x={X(i)} y={H - 8} textAnchor="middle" fontSize="9" fill="rgba(255,255,255,.35)">
              {fromISO(r.date).getDate() + '.' + (fromISO(r.date).getMonth() + 1)}
            </text>
          : null))}
      </svg>
      {selRun && (
        <div dir="rtl" className="mt-2 bg-black/30 rounded-2xl px-4 py-2.5 flex items-center justify-between gap-2 fadein border border-white/5">
          <div className="min-w-0">
            <div className="font-bold text-sm truncate">{selRun.title}</div>
            <div className="text-[10px] text-white/40">{heDate(selRun.date)}</div>
          </div>
          <div className="flex gap-4 text-center shrink-0">
            <div><div className="font-black t-num" style={{ color: CHART.fuel.c }}>{selRun.km}</div><div className="t-label" style={{ fontSize:'8px' }}>ק"מ</div></div>
            <div><div className="font-black t-num" style={{ color: CHART.train.c }}>{fmtPace(paceOf(selRun))}</div><div className="t-label" style={{ fontSize:'8px' }}>קצב</div></div>
            <div><div className="font-black">{fmtDur(selRun.sec)}</div><div className="text-[9px] text-white/40">זמן</div></div>
          </div>
        </div>
      )}
    </div>
  );
}

function RunsTab({ state, week, mutate, stravaConnected, onOpenSettings, onShare }){
  const todayISO = toISO(new Date());
  const inWeek = todayISO >= week && todayISO <= addDays(week, 6);
  const [f, setF] = useState({ title:'', km:'', dur:'', date: inWeek ? todayISO : week, type:'', splits:[] });
  const [showAll, setShowAll] = useState(false);
  const [editing, setEditing] = useState(null);
  const [openSplits, setOpenSplits] = useState(null);
  const [formOpen, setFormOpen] = useState(false);
  useEffect(() => { if (!editing) setF(x => Object.assign({}, x, { date: (todayISO >= week && todayISO <= addDays(week, 6)) ? todayISO : week })); }, [week]);

  const all = useMemo(() => state.runs.slice().sort((a, b) => a.date < b.date ? 1 : -1), [state.runs]);
  const weekRuns = all.filter(r => r.date >= week && r.date <= addDays(week, 6));
  const totKm = weekRuns.reduce((a, r) => a + r.km, 0);
  const totSec = weekRuns.reduce((a, r) => a + r.sec, 0);
  const avgPace = totKm > 0 ? totSec / totKm : 0;
  const bestPace = state.runs.length ? Math.min.apply(null, state.runs.map(r => r.sec / Math.max(r.km, .01))) : 0;

  const eff = (numOr0(f.km) > 0 || parseDur(f.dur) > 0) ? { km: numOr0(f.km), sec: parseDur(f.dur) } : sumSplits(f.splits);
  const pickStyle = st => setF(x => {
    const isDefaultTitle = !x.title || RUN_STYLES.some(s => s.title === x.title);
    return Object.assign({}, x, { type: st.id, title: isDefaultTitle ? st.title : x.title });
  });
  const resetForm = () => setF({ title:'', km:'', dur:'', date: (todayISO >= week && todayISO <= addDays(week, 6)) ? todayISO : week, type:'', splits:[] });
  const saveRun = () => {
    if (!(eff.km > 0)) { uiToast('הכנס מרחק בק"מ (או הוסף ספליטים)', 'warn'); return; }
    if (!(eff.sec > 0)) { uiToast('הכנס זמן ריצה (או הוסף ספליטים)', 'warn'); return; }
    if (!f.date) { uiToast('בחר תאריך', 'warn'); return; }
    const sp = (f.splits || []).map(s => ({ km: numOr0(s.km), sec: parseDur(s.dur) })).filter(s => s.km > 0 && s.sec > 0);
    const patch = { title: (f.title.trim() || (styleOf(f.type) || {}).title || 'ריצה'), km: eff.km, sec: eff.sec, date: f.date, type: f.type || '', splits: sp };
    if (editing) {
      mutate(d => { const r = d.runs.find(x => x.id === editing); if (r) Object.assign(r, patch, { updatedAt: Date.now() }); });
      setEditing(null);
    } else {
      mutate(d => { d.runs.unshift(Object.assign({ id: uid() }, patch, { updatedAt: Date.now() })); });
    }
    resetForm();
    setFormOpen(false);
  };
  const startEdit = r => {
    setEditing(r.id); setFormOpen(true);
    setF({ title: r.title, km: String(r.km), dur: fmtDur(r.sec), date: r.date, type: r.type || '', splits: (r.splits || []).map(s => ({ km: String(s.km), dur: fmtDur(s.sec) })) });
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };
  const cancelEdit = () => { setEditing(null); setFormOpen(false); resetForm(); };
  const delRun = async r => {
    if (!await uiConfirm('אפשר גם לערוך במקום למחוק — בכפתור העיפרון.', { title:'למחוק את "' + r.title + '"?', danger:true, okText:'מחק' })) return;
    if (editing === r.id) cancelEdit();
    mutate(d => { d.runs = d.runs.filter(x => x.id !== r.id); if (d.deletedRuns.indexOf(r.id) < 0) d.deletedRuns.push(r.id); });
  };

  const Stat = ({ v, l, tone }) => (
    <div className="glass rounded-[18px] py-3 text-center">
      <div className="t-metric" style={{ fontSize:'19px', color: tone || '#fff' }}>{v}</div>
      <div className="t-label mt-1.5" style={{ fontSize:'8px' }}>{l}</div>
    </div>
  );

  const RunRow = ({ r }) => {
    const st = styleOf(r.type);
    const hasSplits = r.splits && r.splits.length > 0;
    const isOpen = openSplits === r.id;
    return (
      <div className="glass rounded-[20px] p-3">
        <div className="flex items-center gap-3">
          <RunGlyph type={r.type} size={42}/>
          <div className="flex-1 min-w-0">
            <div className="flex items-center gap-1.5 min-w-0">
              <span className="font-bold text-sm truncate">{r.title}</span>
              {r.src === 'strava' && <span className="text-[8px] font-black text-strava bg-strava/10 border border-strava/25 rounded-full px-1.5 py-0.5 shrink-0">STRAVA</span>}
            </div>
            <div className="text-[10px] text-white/40 flex items-center gap-1.5">
              {heDate(r.date)}
              {hasSplits && (
                <button onClick={() => setOpenSplits(isOpen ? null : r.id)} className="text-volt font-bold inline-flex items-center gap-0.5 active:scale-95 transition">
                  · ⏱️ {r.splits.length} ספליטים <Icon d={isOpen ? I.chevUp : I.chevDown} className="w-3 h-3"/>
                </button>
              )}
            </div>
          </div>
          <div className="flex gap-2.5 text-center shrink-0">
            {[
              { v: r.km, l:'ק"מ', c: CHART.fuel.c },
              { v: fmtPace(r.sec / Math.max(r.km, .01)), l:'קצב', c: CHART.train.c },
              { v: fmtDur(r.sec), l:'זמן', c:'#fff' }
            ].map((x, i) => (
              <div key={i}>
                <div className="text-[13px] font-black t-num" style={{ color:x.c }}>{x.v}</div>
                <div className="t-label" style={{ fontSize:'8px' }}>{x.l}</div>
              </div>
            ))}
          </div>
          <div className="flex flex-col gap-1 shrink-0">
            <button onClick={() => onShare && onShare(r)} className="w-8 h-7 rounded-lg text-volt/70 bg-volt/10 flex items-center justify-center active:scale-90 transition" title="שתף לסטורי">
              <Icon d={I.share} className="w-3.5 h-3.5"/>
            </button>
            <button onClick={() => startEdit(r)} className="w-8 h-7 rounded-lg text-white/50 bg-white/5 flex items-center justify-center active:scale-90 transition">
              <Icon d={I.pencil} className="w-3.5 h-3.5"/>
            </button>
            <button onClick={() => delRun(r)} className="w-8 h-7 rounded-lg text-white/25 flex items-center justify-center active:scale-90 transition">
              <Icon d={I.trash} className="w-3.5 h-3.5"/>
            </button>
          </div>
        </div>
        {hasSplits && isOpen && <SplitsList splits={r.splits}/>}
      </div>
    );
  };

  return (
    <div className="fadein space-y-3">
      {!formOpen && (
        <button onClick={() => { setFormOpen(true); resetForm(); }}
                className="w-full py-3.5 rounded-[24px] bg-volt text-obsidian font-black text-base flex items-center justify-center gap-2 active:scale-[.98] transition glow-volt">
          <Icon d={I.plus} className="w-5 h-5"/> רשום ריצה חדשה
        </button>
      )}
      <div className="glass rounded-[24px] p-4 space-y-2.5" style={{ display: formOpen ? 'block' : 'none' }}>
        <div className="flex items-center justify-between">
          <div className="font-bold flex items-center gap-2">
            <span className={'w-7 h-7 rounded-xl flex items-center justify-center ' + (editing ? 'bg-volt/20 text-volt' : 'bg-ember/20 text-ember')}>
              <Icon d={editing ? I.pencil : I.plus} className="w-4 h-4"/>
            </span>
            {editing ? 'עריכת ריצה' : 'ריצה חדשה'}
          </div>
          <div className="flex items-center gap-1.5">
            {!editing && !stravaConnected && (
              <button onClick={onOpenSettings} className="text-[10px] font-black text-strava bg-strava/10 border border-strava/25 rounded-full px-2.5 py-1 active:scale-95 transition">חבר STRAVA</button>
            )}
            <button onClick={editing ? cancelEdit : () => { setFormOpen(false); resetForm(); }}
                    className="text-[10px] font-bold text-white/50 bg-white/5 border border-white/10 rounded-full px-2.5 py-1 active:scale-95 transition">
              {editing ? 'בטל עריכה ✕' : 'סגור ✕'}
            </button>
          </div>
        </div>
        <div><label className="lbl">סגנון ריצה</label><StylePills value={f.type} onPick={pickStyle}/></div>
        <input className="inp" placeholder="שם הריצה (למשל: ריצת בוקר קלה)" value={f.title} onChange={e => setF({ ...f, title: e.target.value })}/>
        <div className="grid grid-cols-3 gap-2">
          <div><label className="lbl">מרחק (ק"מ)</label>
            <input className="inp text-center font-bold" inputMode="decimal" placeholder="5.0" value={f.km} onChange={e => setF({ ...f, km: e.target.value })}/></div>
          <div><label className="lbl">זמן (דק:שנ)</label>
            <input className="inp text-center font-bold" inputMode="numeric" placeholder="30:00" value={f.dur} onChange={e => setF({ ...f, dur: fmtTimeInput(e.target.value) })}/></div>
          <div><label className="lbl">תאריך</label>
            <input type="date" className="inp text-center" value={f.date} onChange={e => setF({ ...f, date: e.target.value })}/></div>
        </div>
        <SplitsEditor splits={f.splits} setSplits={sp => setF(x => Object.assign({}, x, { splits: sp }))}
                      onApplySum={sum => setF(x => Object.assign({}, x, { km: sum.km ? String(sum.km) : x.km, dur: sum.sec ? fmtDur(sum.sec) : x.dur }))}/>
        <div className="flex items-center justify-between glass-2 rounded-2xl px-4 py-2.5">
          <span className="text-xs text-white/40">קצב מחושב</span>
          <span className="font-black text-xl text-volt text-glow">{(eff.km > 0 && eff.sec > 0) ? fmtPace(eff.sec / eff.km) : '—'}<span className="text-[10px] text-white/40 font-normal ms-1">דק' / ק"מ</span></span>
        </div>
        <button onClick={saveRun}
                className="w-full py-3 rounded-2xl bg-volt text-obsidian font-black text-lg active:scale-[.98] transition glow-volt">
          {editing ? 'עדכן ריצה 💾' : 'הוסף ריצה ⚡'}
        </button>
      </div>

      <div className="grid grid-cols-4 gap-2">
        <Stat v={totKm ? totKm.toFixed(1) : '0'} l={'ק"מ השבוע'} tone={CHART.fuel.c}/>
        <Stat v={weekRuns.length} l="ריצות השבוע"/>
        <Stat v={fmtPace(avgPace)} l="קצב ממוצע" tone={CHART.train.c}/>
        <Stat v={fmtPace(bestPace)} l="שיא קצב" tone="var(--gold)"/>
      </div>

      <div className="glass rounded-[24px] p-4">
        <div className="flex items-center justify-between mb-1">
          <div className="font-black italic">מגמות ביצועים</div>
          <div className="flex gap-3 text-[10px] font-bold">
            <span className="flex items-center gap-1" style={{ color: CHART.fuel.c }}><span className="w-2.5 h-0.5 inline-block rounded-full" style={{ background: CHART.fuel.c }}></span> מרחק</span>
            <span className="flex items-center gap-1" style={{ color: CHART.train.c }}><span className="w-2.5 h-0.5 inline-block rounded-full" style={{ background: CHART.train.c }}></span> קצב</span>
          </div>
        </div>
        <RunChart runs={state.runs}/>
      </div>

      <div className="flex items-center justify-between px-1 pt-1">
        <span className="text-white/40 text-xs font-bold">{showAll ? 'כל ההיסטוריה (' + all.length + ')' : 'ריצות השבוע (' + weekRuns.length + ')'}</span>
        <button onClick={() => setShowAll(!showAll)} className="text-volt text-xs font-bold active:scale-95 transition">{showAll ? 'הצג שבוע נוכחי' : 'הצג הכל'}</button>
      </div>
      {(showAll ? all : weekRuns).map(r => <RunRow key={r.id} r={r}/>)}
      {(showAll ? all : weekRuns).length === 0 && (
        <div className="text-center py-6 text-white/25 text-sm">אין ריצות בשבוע הזה</div>

/* ============================== nutrition ============================== */
function FoodPicker({ state, mutate, onPick, onPickMany, onClose }){
  const [q, setQ] = useState('');
  const [sel, setSel] = useState(null);
  const [qty, setQty] = useState('');
  const [unit, setUnit] = useState('g');
  const [creating, setCreating] = useState(false);
  const [scanning, setScanning] = useState(false);
  const [scanErr, setScanErr] = useState('');
  const [bcManual, setBcManual] = useState('');
  const [nf, setNf] = useState({ name:'', per:'unit', unitName:'יחידה', kcal:'', p:'', c:'', f:'', bc:'' });
  const cat = foodCatalog(state);
  const list = q.trim() ? cat.filter(fd => fd.name.indexOf(q.trim()) !== -1) : cat;
  const pick = fd => { setSel(fd); setUnit('g'); setQty(fd.per === 'unit' ? '1' : '100'); };
  const macros = sel ? calcMacros(sel, qty, unit) : null;

  /* ---- barcode scanner (html5-qrcode, loaded lazily on demand) ---- */
  const [toast, setToast] = useState(null);
  const [showManual, setShowManual] = useState(false);
  const [lookup, setLookup] = useState(null);
  const [photoBusy, setPhotoBusy] = useState(false);
  const [decoded, setDecoded] = useState(null);
  const decodedTimer = useRef(null);
  const videoRef = useRef(null);
  const streamRef = useRef(null);
  const readerRef = useRef(null);
  const photoRef = useRef(null);
  const handledRef = useRef(false);
  const audioRef = useRef(null);
  const toastTimer = useRef(null);
  const flashToast = (text, kind) => {
    clearTimeout(toastTimer.current);
    setToast({ text, kind });
    toastTimer.current = setTimeout(() => setToast(null), 2400);
  };
  const stopScan = () => {
    try { if (readerRef.current) readerRef.current.reset(); } catch (e) {}
    readerRef.current = null;
    const st = streamRef.current;
    streamRef.current = null;
    if (st) { try { st.getTracks().forEach(t => t.stop()); } catch (e) {} }
    const v = videoRef.current;
    if (v) { try { v.pause(); v.srcObject = null; } catch (e) {} }
    setScanning(false);
  };
  useEffect(() => {
    /* warm the decoder up front so it never delays the camera later */
    loadScanner().catch(() => {});

      clearTimeout(toastTimer.current);
      try { if (readerRef.current) readerRef.current.reset(); } catch (e) {}
      const st = streamRef.current;
      if (st) { try { st.getTracks().forEach(t => t.stop()); } catch (e) {} }

  const close = () => { stopScan(); onClose(); };

     the scan-button tap, iOS requirement) */
  const scanFeedback = () => {
    try { if (navigator.vibrate) navigator.vibrate(80); } catch (e) {}
    try {
      const ctx = audioRef.current || new (window.AudioContext || window.webkitAudioContext)();
      audioRef.current = ctx;
      if (ctx.state === 'suspended') ctx.resume();
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'sine'; o.frequency.value = 1200;
      o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(0.25, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15);
      o.start(); o.stop(ctx.currentTime + 0.18);
    } catch (e) {}
  };
  /* scanned/typed code → 1) my saved barcodes  2) Open Food Facts (live)
     3) unknown → create-form permanently linked to that barcode */
  const handleCode = async code => {
    if (handledRef.current) return;
    handledRef.current = true;
    scanFeedback();
    stopScan();
    setShowManual(false); setBcManual(''); setScanErr('');
    /* full transparency: show exactly what the image processor read */
    const rawStr = String(code);
    setDecoded({ raw: rawStr, clean: bcDigits(rawStr) });
    clearTimeout(decodedTimer.current);
    decodedTimer.current = setTimeout(() => setDecoded(null), 3200);
    try {
      const key = bcKey(code);
      const local = cat.find(fd => fd.bc && bcKey(fd.bc) === key);
      if (local) {
        flashToast('✅ מוצר נמצא: ' + local.name, 'ok');
        pick(local);
        return;
      }
      setLookup(bcDigits(code) || String(code));
      flashToast('🔎 מחפש במאגר העולמי…', 'wait');
      /* try the cleaned code first, then padding/symbology variants */
      let prod = null;
      const cands = bcCandidates(code);
      for (let i = 0; i < cands.length && !prod; i++) prod = await fetchOffProduct(cands[i]);
      setLookup(null);
      if (prod) {
        /* cache it forever so the next scan is instant + offline */
        mutate(d => { if (!(d.foods || []).some(x => x.bc && bcKey(x.bc) === bcKey(prod.bc))) d.foods.push(prod); }, 'meals');
        flashToast('✅ מוצר נמצא: ' + prod.name, 'ok');
        pick(prod);
      } else {
        const clean = bcDigits(code) || String(code).trim();
        flashToast('🆕 ברקוד חדש - הוסף נתונים פעם אחת', 'new');
        setNf({ name:'', per:'100g', unitName:'יחידה', kcal:'', p:'', c:'', f:'', bc: clean });

      setLookup(null);

    }

    if (window.ZXing) return res();
    const sc = document.createElement('script');
    sc.src = 'https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js';

     small in frame — so retry the decode across derived images instead of
     giving up after a single pass. */

    await loadScanner();
    const url = URL.createObjectURL(file);
    try {
      const img = await new Promise((res, rej) => {
        const i = new Image();
        i.onload = () => res(i); i.onerror = () => rej(new Error('img load'));
        i.src = url;
      });
      const reader = makeReader();
      const tryUrl = async u => {
        try { const r = await reader.decodeFromImageUrl(u); const t = r && r.getText ? String(r.getText()).trim() : ''; return t || null; }
        catch (e) { return null; }
      };
      let hit = await tryUrl(url);                          /* pass 1: as shot */
      if (hit) return hit;

      const mk = (w, h, draw) => {
        const c = document.createElement('canvas');
        c.width = Math.max(1, Math.round(w)); c.height = Math.max(1, Math.round(h));
        draw(c.getContext('2d'), c); return c;
      };

      const W = img.width * sc, H = img.height * sc;
      const variants = [];
      variants.push(mk(W, H, g => g.drawImage(img, 0, 0, W, H)));                 /* normalised */
      variants.push(mk(W * 0.84, H * 0.5, (g, c) =>                                /* centre band — where people aim */
        g.drawImage(img, img.width * 0.08, img.height * 0.25, img.width * 0.84, img.height * 0.5, 0, 0, c.width, c.height)));
      variants.push(mk(H, W, g => {                                                /* rotated 90° */
        g.translate(H / 2, W / 2); g.rotate(Math.PI / 2); g.drawImage(img, -W / 2, -H / 2, W, H);
      }));
      variants.push(mk(W * 1.5, H * 1.5, g => g.drawImage(img, 0, 0, W * 1.5, H * 1.5))); /* upscaled thin bars */
      variants.push((() => {                                                       /* hard contrast */
        const c = mk(W, H, g => g.drawImage(img, 0, 0, W, H));

        try {
          const d = g.getImageData(0, 0, c.width, c.height), px = d.data;
          for (let i = 0; i < px.length; i += 4) {
            const lum = px[i] * 0.299 + px[i + 1] * 0.587 + px[i + 2] * 0.114;
            const v = lum < 110 ? 0 : (lum > 150 ? 255 : (lum - 110) * 6.375);
            px[i] = px[i + 1] = px[i + 2] = v;
          }
          g.putImageData(d, 0, 0);
        } catch (e) {}
        return c;
      })());

      for (let i = 0; i < variants.length && !hit; i++) hit = await tryUrl(variants[i].toDataURL('image/png'));

    else {
      setShowManual(true);
      setScanErr('לא זוהה ברקוד בתמונה — צלם שוב מקרוב (שהברקוד ימלא את הרוחב, ישר ובתאורה טובה) או הזן ידנית:');

            <div className="grid grid-cols-4 gap-1.5">

              <div><label className="lbl">פחמימה</label><input className="inp text-center font-bold" inputMode="decimal" value={nf.c} onChange={e => setNf({ ...nf, c: e.target.value })}/></div>
              <div><label className="lbl">שומן</label><input className="inp text-center font-bold" inputMode="decimal" value={nf.f} onChange={e => setNf({ ...nf, f: e.target.value })}/></div>

            <div className="font-bold text-lg">{sel.name}</div>

              <div className="text-[10px] text-white/35 flex items-center gap-1.5 flex-wrap">
                <span dir="ltr">📷 {sel.bc}</span>
                {sel.src === 'off' && <span className="text-volt bg-volt/10 border border-volt/25 rounded-full px-2 py-0.5 font-bold">נתונים מ-Open Food Facts · נשמר אצלך ✓</span>}
              </div>
            )}
            {sel.per === 'unit' && (
              <div>
                <label className="lbl">יחידת מדידה</label>
                <div className="flex gap-1.5">
                  <span className="flex-1 py-2 rounded-xl text-xs font-black text-center border"
                        style={{ background: CHART.train.c + '26', color: CHART.train.c, borderColor: CHART.train.c + '5C' }}>
                    {sel.unitName || 'יחידה'}
                  </span>
                </div>
                <div className="t-cap mt-1.5" style={{ fontSize:'9.5px' }}>המוצר הזה נמדד ביחידות — הזן כמה יחידות אכלת</div>
              </div>
            )}
            {sel.per === '100g' && (
              <div>
                <label className="lbl">יחידת מדידה</label>
                <div className="flex gap-1.5">

                    <button key={u.id} onClick={() => { setUnit(u.id); setQty(u.id === 'g' ? '100' : '1'); }}
                            className={'flex-1 py-2 rounded-xl text-xs font-bold border transition active:scale-95 ' +
                              (unit === u.id ? 'bg-volt/15 text-volt border-volt/40 glow-volt' : 'bg-white/5 text-white/45 border-white/10')}>
                      {u.label}
                    </button>
                  ))}

            <div>
              <label className="lbl">
                {sel.per === 'unit' ? 'כמות (' + (sel.unitName || 'יחידות') + ')'

              </label>
              <input className="inp text-center font-black text-xl" inputMode="decimal" value={qty} onChange={e => setQty(e.target.value)}/>
            </div>
            {macros && (
              <div className="grid grid-cols-4 gap-1.5 text-center">
                <div className="glass-2 rounded-xl py-2"><div className="font-black text-volt">{macros.kcal}</div><div className="text-[9px] text-white/40">קק"ל</div></div>
                <div className="glass-2 rounded-xl py-2"><div className="font-black">{macros.p}</div><div className="text-[9px] text-white/40">חלבון</div></div>
                <div className="glass-2 rounded-xl py-2"><div className="font-black">{macros.c}</div><div className="text-[9px] text-white/40">פחמימה</div></div>
                <div className="glass-2 rounded-xl py-2"><div className="font-black">{macros.f}</div><div className="text-[9px] text-white/40">שומן</div></div>
              </div>
            )}
            <button onClick={addNow} className="w-full py-3 rounded-2xl bg-volt text-obsidian font-black text-lg active:scale-[.98] transition glow-volt">הוסף לארוחה ⚡</button>
          </div>
        )}
      </div>
    </div>
  );
}

function NutritionTab({ state, week, mutate }){
  const todayISO = toISO(new Date());
  const isCur = weekStartISO(new Date()) === week;
  const [day, setDay] = useState(isCur ? new Date().getDay() : 0);
  const [picker, setPicker] = useState(null);
  const [showTargets, setShowTargets] = useState(false);
  const [view, setView] = useState('day');
  useEffect(() => { setDay(weekStartISO(new Date()) === week ? new Date().getDay() : 0); setPicker(null); }, [week]);

  const targets = nutriTargets(state);
  const wk = state.logs[week] || {};
  const d2 = (wk.nutri2 || {})[day];
  const legacyChecks = (wk.nutrition || {})[day] || {};
  const isLegacy = !d2 && Object.keys(legacyChecks).some(k => legacyChecks[k]);
  /* a template section that a materialised day predates (e.g. the snacks bucket
     added later) is appended on the fly — in plan order, so indexes stay stable */
  const blankSection = m => ({ id: m.id, icon: m.icon, title: m.title, snack: !!m.snack, items: (m.items || []).map(it => Object.assign({}, it, { eaten: false })) });
  const mergeSections = meals => {
    const out = (meals || []).slice();
    (state.mealPlan || []).forEach(pm => { if (!out.some(m => m.id === pm.id)) out.push(blankSection(pm)); });
    return out;
  };
  const viewMeals = mergeSections((d2 && d2.meals) ? d2.meals : (state.mealPlan || []).map(blankSection));

  let eatK = 0, eatP = 0, eatC = 0, eatF = 0;
  viewMeals.forEach(m => (m.items || []).forEach(it => { if (it.eaten) { eatK += numOr0(it.kcal); eatP += numOr0(it.p); eatC += numOr0(it.c); eatF += numOr0(it.f); } }));
  eatK = Math.round(eatK); eatP = Math.round(eatP); eatC = Math.round(eatC); eatF = Math.round(eatF);
  const water = d2 ? numOr0(d2.water) : 0;
  const sleep = d2 ? (d2.sleep || '') : '';
  const dateISO = addDays(week, day);
  const burn = dayBurn(state, dateISO);
  const kcalTarget = Math.round(targets.kcal + burn.total);
  const remaining = kcalTarget - eatK;

  const withDay = fn => mutate(d => {
    const w2 = (d.logs[week] = d.logs[week] || {});
    const n2 = (w2.nutri2 = w2.nutri2 || {});
    if (!n2[day]) n2[day] = {
      meals: (d.mealPlan || []).map(m => ({ id: m.id, icon: m.icon, title: m.title, snack: !!m.snack, items: (m.items || []).map(it => Object.assign({}, it, { id: uid(), eaten: false })) })),
      water: 0, sleep: ''
    };
    /* keep the stored day in sync with template sections added after it began */
    n2[day].meals = n2[day].meals || [];
    (d.mealPlan || []).forEach(pm => {
      if (!n2[day].meals.some(m => m.id === pm.id)) {
        n2[day].meals.push({ id: pm.id, icon: pm.icon, title: pm.title, snack: !!pm.snack, items: (pm.items || []).map(it => Object.assign({}, it, { id: uid(), eaten: false })) });
      }
    });
    fn(n2[day], d);
  }, ['week', week]);

  const toggleItem = (mi, ii) => withDay(dd => { const it = (dd.meals[mi] || { items: [] }).items[ii]; if (it) it.eaten = !it.eaten; });
  /* recompute an item from its source food when we know it, otherwise scale the
     stored macros proportionally — works for qty and unit changes alike */
  const reprice = (it, d, nextQty, nextUnit) => {
    const nq = numOr0(nextQty);
    const un = nextUnit !== undefined ? nextUnit : it.unit;
    const fd = it.foodId ? foodCatalog(d).find(x => x.id === it.foodId) : null;
    if (fd && nq > 0) Object.assign(it, calcMacros(fd, nq, un));
    else {
      const oldG = numOr0(it.qty) * (it.per === '100g' ? unitById(it.unit).grams : 1);
      const newG = nq * (it.per === '100g' ? unitById(un).grams : 1);
      if (oldG > 0 && newG > 0) {
        const r = newG / oldG;
        it.kcal = Math.round(it.kcal * r);
        it.p = Math.round(it.p * r * 10) / 10; it.c = Math.round(it.c * r * 10) / 10; it.f = Math.round(it.f * r * 10) / 10;
      }
    }
    it.qty = String(nextQty);
    if (nextUnit !== undefined) it.unit = nextUnit;
  };
  const setItemQty = (mi, ii, q) => withDay((dd, d) => {
    const it = (dd.meals[mi] || { items: [] }).items[ii]; if (!it) return;
    reprice(it, d, q);
  });
  const setItemUnit = (mi, ii, u) => withDay((dd, d) => {
    const it = (dd.meals[mi] || { items: [] }).items[ii]; if (!it) return;
    reprice(it, d, it.qty, u);
  });
  const setItemName = (mi, ii, nm) => withDay(dd => {
    const it = (dd.meals[mi] || { items: [] }).items[ii]; if (it) it.name = nm;
  });
  const delItem = (mi, ii) => withDay(dd => { (dd.meals[mi] || { items: [] }).items.splice(ii, 1); });
  const toggleAllMeal = mi => withDay(dd => {
    const m = dd.meals[mi]; if (!m) return;
    const target = !((m.items || []).length && m.items.every(it => it.eaten));
    (m.items || []).forEach(it => { it.eaten = target; });
  });
  const addItemTo = (mi, item) => withDay(dd => { (dd.meals[mi] || { items: [] }).items.push(item); });
  const addItemsTo = (mi, items) => withDay(dd => {
    const tgt = dd.meals[mi] || { items: [] };
    (items || []).forEach(it => tgt.items.push(Object.assign({}, it, { id: uid(), eaten: true })));
  });
  /* save a whole meal for 1-tap logging later */
  const renameMeal = async (mi, m) => {
    const name = await uiPrompt('השם הזה יעודכן בתפריט הקבוע ובכל הימים הבאים.', m.title, { title:'שם הארוחה', okText:'שמור' });
    if (name === null || !name.trim()) return;
    mutate(d => {
      const pm = (d.mealPlan || []).find(x => x.id === m.id);
      if (pm) pm.title = name.trim();
      const dd = (((d.logs[week] || {}).nutri2) || {})[day];
      const sm = dd && (dd.meals || []).find(x => x.id === m.id);
      if (sm) sm.title = name.trim();
    }, 'meals');
  };
  const saveFav = async mi => {
    const m = viewMeals[mi];
    if (!m || !(m.items || []).length) { uiToast('אין פריטים בארוחה הזו לשמור', 'warn'); return; }
    const name = await uiPrompt('תוכל להוסיף את הארוחה הזו בלחיצה אחת בכל יום.', m.title, { title:'שמירת מועדף', okText:'שמור' });
    if (name === null) return;
    mutate(d => {
      d.favMeals = d.favMeals || [];
      d.favMeals.unshift({ id: uid(), name: (name || m.title).trim() || m.title, icon: m.icon,
        items: (m.items || []).map(it => ({ foodId: it.foodId || null, name: it.name, qty: it.qty, per: it.per,
          unit: it.unit || null, unitName: it.unitName, kcal: it.kcal, p: it.p, c: it.c, f: it.f })),
        updatedAt: Date.now() });
      d.favMeals = d.favMeals.slice(0, 40);
    }, 'meals');
  };
  const addWater = ml => withDay(dd => { dd.water = Math.max(0, numOr0(dd.water) + ml); });
  const setSleep = v => withDay(dd => { dd.sleep = v; });
  const toggleLegacy = mealId => mutate(d => {
    const w2 = (d.logs[week] = d.logs[week] || {});
    const n = (w2.nutrition = w2.nutrition || {});
    const dd = (n[day] = n[day] || {});
    dd[mealId] = !dd[mealId];
  }, ['week', week]);
  const saveAsTemplate = async () => {
    if (!await uiConfirm('התפריט של היום ייטען אוטומטית בכל יום חדש.', { title:'לשמור כתבנית קבועה?', okText:'שמור' })) return;
    mutate(d => {
      const src = ((((d.logs[week] || {}).nutri2) || {})[day] || {}).meals || d.mealPlan;
      d.mealPlan = src.map(m => ({ id: m.id, icon: m.icon, title: m.title, snack: !!m.snack, items: (m.items || []).map(it => ({ id: uid(), foodId: it.foodId || null, name: it.name, qty: it.qty, per: it.per, unit: it.unit || null, unitName: it.unitName, kcal: it.kcal, p: it.p, c: it.c, f: it.f })) }));
    }, 'meals');
  };
  const setTarget = (k, v) => mutate(d => { d.settings.nutri = Object.assign({}, nutriTargets(d), { [k]: numOr0(v) }); }, 'settings');

  const trained = burn.total > 0;
  const sleepOk = numOr0(sleep) >= 7;
  const protOk = eatP >= targets.protein * 0.9;
  const score = (sleepOk ? 1 : 0) + (protOk ? 1 : 0) + (trained ? 1 : 0);
  const recovery = score === 3 ? { t:'התאוששות אופטימלית לבניית שריר ⚡', c:'bg-volt/15 text-volt border-volt/30' }
    : score === 2 ? { t:'התאוששות טובה 💪', c:'bg-volt/5 text-volt/80 border-volt/15' }
    : score === 1 ? { t:'התאוששות חלקית 😴', c:'bg-ember/10 text-ember border-ember/25' }
    : { t:'עדכן שינה, חלבון ואימון להערכת ההתאוששות', c:'bg-white/5 text-white/40 border-white/10' };

  const MacroBar = ({ label, val, target, tone }) => {
    const over = val > target * 1.15;
    const c = over ? CHART.over : tone;
    return (
      <div>
        <div className="flex items-center justify-between mb-1.5 gap-2">
          <span className="flex items-center gap-1.5 min-w-0">
            <span className="w-[6px] h-[6px] rounded-full shrink-0" style={{ background:c, boxShadow:'0 0 7px ' + c }}></span>
            <span className="t-label" style={{ letterSpacing:'.08em' }}>{label}</span>
          </span>
          <span className="text-[11px] font-bold t-num shrink-0" style={{ color:c }}>{val}<span className="text-white/25"> / {target} ג׳</span></span>
        </div>
        <div className="h-[6px] rounded-full overflow-hidden" style={{ background:'rgba(255,255,255,.07)' }} dir="ltr">
          <div className="h-full rounded-full" style={{ width: Math.min(100, val / Math.max(1, target) * 100) + '%', background:'linear-gradient(90deg,' + c + '55,' + c + ')', boxShadow:'0 0 10px ' + c + '88', transition:'width .6s var(--ease)' }}/>
        </div>
      </div>
    );
  };

  const ws = weekNutriStats(state, week, targets);
  const wStatus = ws.days === 0
    ? { t:'עוד לא נרשמו ימים השבוע — תתחיל לסמן ⚡', c:'bg-white/5 text-white/40 border-white/10' }
    : Math.abs(ws.diffPct) <= 5
      ? { t:'🎯 שבוע מושלם לשמירה ובניית שריר', c:'bg-volt/15 text-volt border-volt/35 glow-volt' }
      : ws.diffPct > 5
        ? { t:'⚖️ חריגה שבועית קלה — מומלץ לקזז ' + Math.abs(ws.totalDiff).toLocaleString() + ' קק"ל בימים הקרובים', c:'bg-ember/10 text-ember border-ember/30' }
        : { t:'⚡ גירעון שבועי קל — דחוף עוד פחמימה/חלבון', c:'bg-sky-400/10 text-sky-300 border-sky-400/30' };

  return (
    <div className="fadein space-y-3">
      <div className="glass rounded-2xl p-2 space-y-2">
        <div className="grid grid-cols-7 gap-1.5">
          {DAYS_HE.map((d, i) => {
            const iso = addDays(week, i);
            const nsI = dayNutriSummary(state, week, i);
            const active = day === i && view === 'day';
            return (
              <button key={i} onClick={() => { setDay(i); setView('day'); }}
                      className={'rounded-xl py-1.5 flex flex-col items-center transition active:scale-95 ' + (active ? 'bg-volt text-obsidian glow-volt' : 'bg-white/5 text-white/60')}>
                <span className="text-sm font-black leading-none">{d}</span>
                <span className={'text-[9px] mt-0.5 ' + (active ? 'text-obsidian/60' : (iso === todayISO ? 'text-volt' : 'text-white/30'))}>{fromISO(iso).getDate()}</span>
                <span className={'mt-1 w-1 h-1 rounded-full ' + (nsI.full ? (active ? 'bg-obsidian' : 'bg-volt') : (nsI.done > 0 ? 'bg-ember' : 'bg-transparent'))}></span>
              </button>
            );
          })}
        </div>
        <div className="flex gap-1.5">
          <button onClick={() => setView('day')} className={'flex-1 py-1.5 rounded-xl text-xs font-bold border transition active:scale-95 ' + (view === 'day' ? 'bg-volt/15 text-volt border-volt/35' : 'bg-white/5 text-white/45 border-white/10')}>📅 יומי</button>
          <button onClick={() => setView('week')} className={'flex-1 py-1.5 rounded-xl text-xs font-bold border transition active:scale-95 ' + (view === 'week' ? 'bg-volt/15 text-volt border-volt/35' : 'bg-white/5 text-white/45 border-white/10')}>📊 שבועי</button>
        </div>
      </div>

      {view === 'week' && (
        <div className="fadein space-y-3">
          <div className="glass rounded-[24px] p-4">
            <div className="flex items-center justify-between mb-3">
              <div>
                <h2 className="text-lg font-black italic leading-none">מאזן שבועי</h2>
                <div className="text-white/40 text-[10px] mt-1">{ws.days} ימים נרשמו · שבוע {weekNum(week)}</div>

                <Ring pct={ws.goal ? ws.avgKcal / ws.goal : 0} size={72} stroke={6} color={ws.diffPct > 5 ? CHART.over : CHART.fuel.c}/>

                  <span className="font-black text-base leading-none">{ws.avgKcal}</span>
                  <span className="text-[8px] text-white/40 mt-0.5">ממוצע/יום</span>

            <div className="grid grid-cols-4 gap-2 mt-3 text-center">
              <div className="bg-black/25 rounded-2xl py-2.5 border border-white/5">
                <div className={'font-black ' + (ws.avgProtein >= targets.protein * 0.9 ? 'text-volt' : 'text-white')}>{ws.avgProtein}</div>
                <div className="text-[9px] text-white/40 mt-0.5">חלבון ממוצע</div>
              </div>
              <div className="bg-black/25 rounded-2xl py-2.5 border border-white/5">
                <div className="font-black">{ws.avgCarbs}</div>
                <div className="text-[9px] text-white/40 mt-0.5">פחמימה ממוצעת</div>
              </div>
              <div className="bg-black/25 rounded-2xl py-2.5 border border-white/5">
                <div className="font-black text-ember">{ws.avgFat}</div>
                <div className="text-[9px] text-white/40 mt-0.5">שומן ממוצע</div>
              </div>
              <div className="bg-black/25 rounded-2xl py-2.5 border border-white/5">
                <div className="font-black">{ws.goal}</div>
                <div className="text-[9px] text-white/40 mt-0.5">יעד יומי ממוצע</div>
              </div>

              <div className="flex items-center justify-center gap-1.5 mt-2 t-label" style={{ fontSize:'9.5px' }}>
                <Icon d={I.flame} className="w-3 h-3" style={{ color:'var(--c-train)' }}/>

/* what to train today: the run day on Fri/Sat, otherwise the next strength
   template in this week's rotation that still has work left */
function todaysWorkout(state){
  const week = weekStartISO(new Date());
  const dow = new Date().getDay();
  const runDay = state.templates.find(t => t.runDay || (t.exercises || []).length && (t.exercises || []).every(e => e.check));
  if ((dow === 5 || dow === 6) && runDay) {
    const done = (runDay.exercises || []).some(ex => isCheckExDone(state, week, runDay.id, ex));
    return { tpl: runDay, done, isRun: true };
  }
  const lifts = state.templates.filter(t => t !== runDay && (t.exercises || []).some(e => !e.check));
  for (let i = 0; i < lifts.length; i++) {
    const p = tplProgress(state, week, lifts[i]);
    if (p.total > 0 && p.done < p.total) return { tpl: lifts[i], done: false, isRun: false, prog: p };
  }
  return { tpl: null, done: true, isRun: false };
}

function Dashboard({ state, setTab, setOpenTpl, setWeek }){
  const realToday = toISO(new Date());
  const [sel, setSel] = useState(realToday);          /* the day the dashboard is showing */
  const today = sel;
  const isToday = sel === realToday;
  const ts = todayStats(state, sel);
  const st = streak(state);
  const week = weekStartISO(fromISO(sel));
  const mom = useMemo(() => weekMomentum(state, week), [state.logs, state.runs, week]);
  const targets = nutriTargets(state);
  const dayIdx = fromISO(sel).getDay();
  const ns = dayNutriSummary(state, week, dayIdx);
  const burn = dayBurn(state, sel);
  const kcalTarget = Math.round(targets.kcal + burn.total);
  const kcalLeft = kcalTarget - ns.kcal;
  const wSeries = useMemo(() => state.weights.slice().sort((a, b) => a.date < b.date ? -1 : 1).slice(-8).map(w => numOr0(w.kg)), [state.weights]);
  const weekAgo = addDays(realToday, -7);
  const wPrev = state.weights.filter(w => w.date <= weekAgo)[0];
  const latestW = state.weights.length ? state.weights[0] : null;
  const wDelta = (latestW && wPrev) ? Math.round((numOr0(latestW.kg) - numOr0(wPrev.kg)) * 10) / 10 : null;
  const prevW = state.weights.length > 1 ? state.weights[1] : null;
  const plan = todaysWorkout(state);
  const hype = useMemo(() => hypeWord(), []);
  /* dial inputs: training completion today, fuel vs target, recovery composite */
  /* what actually happened on the SELECTED day — not on the real today */
  const train = useMemo(() => {
    const wo = (state.logs[week] || {}).workouts || {};
    let done = 0, total = 0;
    state.templates.forEach(tpl => {
      const m = wo[tpl.id] || {};
      let d = 0;
      Object.keys(m).forEach(k => (m[k] || []).forEach(x => { if (x && x.done && x.t === sel) d++; }));
      if (d > 0) { done += d; total += tplProgress(state, week, tpl).total; }
    });
    const ranToday = (state.runs || []).some(r => r.date === sel);
    if (total > 0) {
      const p = Math.min(1, done / total);
      return { p, state: p >= 0.999 ? 'done' : 'partial', sets: done };
    }
    if (ranToday) return { p: 1, state:'run', sets: 0 };
    /* a finished day with nothing logged is a REST day — that is a success
       state in a 5-day program, not a gap */
    return { p: 0, state: sel < realToday ? 'rest' : 'pending', sets: 0 };
  }, [state.logs, state.runs, state.templates, sel, week]);
  const dayTrain = train.p;
  const fuelPct = kcalTarget ? ns.kcal / kcalTarget : 0;
  const recPct = useMemo(() => {
    const sl = Math.min(1, numOr0(ns.sleep) / 8);
    const wa = Math.min(1, numOr0(ns.water) / Math.max(1, targets.water));
    const pr = Math.min(1, ns.p / Math.max(1, targets.protein));
    return (sl + wa + pr) / 3;
  }, [ns.sleep, ns.water, ns.p, targets]);
  const quote = useMemo(() => quoteOfDay(), []);
  const latestPhoto = state.photos.length ? state.photos.slice().sort((a, b) => a.date < b.date ? 1 : -1)[0] : null;
  const name = state.settings.name;

  const go = (tab) => { setWeek(week); setTab(tab); };
  const stepWeek = n => setSel(addDays(sel, n * 7));
  const openWorkout = id => { setWeek(week); setOpenTpl(id); setTab('workouts'); };

  const QA = ({ icon, label, tab, color }) => (
    <button onClick={() => go(tab)} className="glass rounded-[20px] py-3.5 flex flex-col items-center gap-2">
      <span className="w-9 h-9 rounded-2xl bg-volt/10 border border-volt/20 flex items-center justify-center">
        <Icon d={icon} className="w-[18px] h-[18px] text-volt"/>
      </span>
      <span className="text-[10px] font-bold t-sec">{label}</span>
    </button>
  );

  return (
    <div className="fadein space-y-3">
      <div className="glass rounded-[30px] p-5 relative overflow-hidden rise">
        <div className="flex items-start justify-between gap-3 relative">
          <div className="min-w-0">
            <div className="t-label">{greet()}</div>
            <div className="t-hero mt-1.5">{name || hype}</div>
            <div className="t-cap mt-2">{heDate(today)}</div>
          </div>
          {st >= 2 && (
            <div className="tint-lime rounded-full ps-2 pe-3.5 py-2 flex items-center gap-2 shrink-0">
              <span className="w-7 h-7 rounded-full flex items-center justify-center" style={{ background:'rgba(215,255,62,.18)' }}>
                <Icon d={I.flame} className="w-[15px] h-[15px] text-volt"/>
              </span>
              <div className="leading-none">
                <div className="text-[17px] font-black text-volt t-num">{st}</div>
                <div className="text-[7.5px] font-black text-volt/55 mt-1 tracking-[.12em]">רצף</div>
              </div>
            </div>
          )}
        </div>

        {/* signature dial: training · fuel · recovery */}
        <div className="flex items-center gap-3.5 mt-5 relative">
          <div className="relative shrink-0" style={{ width:'150px', height:'150px' }}>
            <ArcGauge size={150} rings={[
              { p: dayTrain, c: CHART.train.c, c2: CHART.train.c2, rest: train.state === 'rest' },

        <div className="flex items-center gap-2 mt-3 pt-3" style={{ borderTop:'1px solid rgba(255,255,255,.06)' }}>

          <div className="flex-1 min-w-0">
            <div className="text-[13px] font-bold">{mom.cur.sessions} אימונים · {mom.cur.trainedDays} ימי אימון</div>

              {mom.cur.sessions > mom.prev.sessions ? 'קצב טוב יותר משבוע שעבר'

      </div>

      {/* what happened on the selected day — only when there is something to show */}
      {(ts.perTpl.length > 0 || ts.runs.length > 0) && (

            {ts.perTpl.map(pp => (
              <button key={pp.tpl.id} onClick={() => openWorkout(pp.tpl.id)} className="w-full flex items-center gap-3 glass-2 rounded-[16px] p-3 text-start">

                  <div className="font-bold text-[14px]">{pp.tpl.name}</div>
                  <div className="t-cap" style={{ fontSize:'10px' }}>{pp.sets} סטים · {pp.ton.toLocaleString()} ק"ג</div>

                <Icon d={I.chevL} className="w-4 h-4 text-white/20"/>

              <div key={r.id} className="flex items-center gap-3 glass-2 rounded-[16px] p-3">

                      style={{ background:'rgba(79,227,255,.10)', border:'1px solid rgba(79,227,255,.22)' }}>

                </span>
                <div className="flex-1 min-w-0">
                  <div className="font-bold text-[14px] truncate">{r.title}</div>
                  <div className="t-cap" style={{ fontSize:'10px' }}>{r.km} ק"מ · {fmtPace(r.sec / Math.max(r.km, .01))} · {fmtDur(r.sec)}</div>
                </div>
              </div>
            ))}
          </div>
        </div>
      )}

      <div>
        <div className="text-white/40 text-xs font-bold mb-2 px-1">האימונים של השבוע</div>
        <WeekChips state={state} week={week} onOpen={openWorkout}/>

      <div className="grid grid-cols-2 gap-2">
        <button onClick={() => go('progress')} className="glass rounded-[24px] p-4 text-start active:scale-[.985] transition">
          <div className="flex items-center gap-2 text-white/40 text-[10px] font-bold"><Icon d={I.scale} className="w-3.5 h-3.5"/> משקל גוף</div>
          {latestW ? (
            <React.Fragment>
              <div className="mt-1.5 flex items-end justify-between gap-2">
                <div>
                  <span className="font-black text-2xl">{latestW.kg}</span>
                  <span className="text-xs text-white/40 ms-1">ק"ג</span>
                </div>
                <Sparkline points={wSeries}/>
              </div>
              {wDelta != null ? (
                <div className={'text-[10px] font-bold mt-1 ' + (wDelta > 0 ? 'text-volt' : wDelta < 0 ? 'text-ember' : 'text-white/35')}>
                  {wDelta > 0 ? '+' : ''}{wDelta} ק"ג השבוע
                </div>
              ) : prevW ? (
                <div className={'text-[10px] font-bold mt-1 ' + (latestW.kg - prevW.kg >= 0 ? 'text-volt' : 'text-ember')}>
                  {latestW.kg - prevW.kg >= 0 ? '+' : ''}{Math.round((latestW.kg - prevW.kg) * 10) / 10} מהשקילה הקודמת
                </div>
              ) : <div className="text-[10px] text-white/30 mt-1">שקילה ראשונה נרשמה</div>}
            </React.Fragment>
          ) : <div className="mt-1.5 text-white/25 text-sm font-bold">הוסף שקילה ←</div>}
        </button>
        <button onClick={() => go('progress')} className="glass rounded-[24px] p-4 text-start active:scale-[.985] transition flex items-center gap-3">
          {latestPhoto ? (
            <React.Fragment>
              <img src={latestPhoto.thumb} className="w-12 h-12 rounded-xl object-cover border border-white/10" alt=""/>
              <div>
                <div className="text-white/40 text-[10px] font-bold">תמונה אחרונה</div>
                <div className="text-xs font-bold mt-0.5">{heDate(latestPhoto.date).split(' · ')[1]}</div>
              </div>
            </React.Fragment>
          ) : (
            <React.Fragment>
              <div className="w-12 h-12 rounded-xl bg-white/5 flex items-center justify-center"><Icon d={I.camera} className="w-5 h-5 text-white/25"/></div>
              <div className="text-white/25 text-sm font-bold">צלם התקדמות ←</div>
