function fmtPace(spk){

  let m = Math.floor(spk / 60), s = Math.round(spk % 60);
  if (s === 60) { m++; s = 0; }

  if (p.length === 1) return Math.round(p[0] * 60);
  if (p.length === 2) return Math.round(p[0] * 60 + p[1]);

/* image compression for progress photos */
function fileToDataUrl(file, maxDim, q){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      try {
        const sc = Math.min(1, maxDim / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.max(1, Math.round(img.width * sc));
        c.height = Math.max(1, Math.round(img.height * sc));
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        res(c.toDataURL('image/jpeg', q));
      } catch (e) { rej(e); }
    };
    img.onerror = rej;
    img.src = url;
  });
}
function shrinkDataUrl(dataUrl, maxDim, q){
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => {
      const sc = Math.min(1, maxDim / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(img.width * sc));
      c.height = Math.max(1, Math.round(img.height * sc));
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      res(c.toDataURL('image/jpeg', q));
    };
    img.onerror = rej;
    img.src = dataUrl;
  });
}

/* tiny IndexedDB cache for full-res photos */
const idb = {
  _db: null,
  open(){
    return new Promise((res, rej) => {
      if (idb._db) return res(idb._db);
      const r = indexedDB.open('athletics', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('photos');
      r.onsuccess = () => { idb._db = r.result; res(idb._db); };
      r.onerror = () => rej(r.error);
    });
  },
  async get(k){ const db = await idb.open(); return new Promise((res, rej) => { const t = db.transaction('photos').objectStore('photos').get(k); t.onsuccess = () => res(t.result || null); t.onerror = () => rej(t.error); }); },
  async set(k, v){ const db = await idb.open(); return new Promise((res, rej) => { const t = db.transaction('photos','readwrite').objectStore('photos').put(v, k); t.onsuccess = () => res(); t.onerror = () => rej(t.error); }); },
  async del(k){ const db = await idb.open(); return new Promise((res, rej) => { const t = db.transaction('photos','readwrite').objectStore('photos').delete(k); t.onsuccess = () => res(); t.onerror = () => rej(t.error); }); },

/* ============================== state ============================== */
function seed(){
  return {
    version:1,
    routineVersion: ROUTINE_V,
    templates: clone(DEFAULT_TEMPLATES),
    meals: clone(DEFAULT_MEALS),
    mealPlan: clone(DEFAULT_MEAL_PLAN),
    foods:[], deletedFoods:[],
    logs:{}, runs:[], deletedRuns:[],
    weights:[], deletedWeights:[],
    photos:[], deletedPhotos:[],
    stamps:{ templates:0, meals:0, settings:0, weeks:{} },
    settings:{ gistId:'', name:'', height:'', strava:null },
  };
}
function normalize(s){
  const base = seed();
  const out = Object.assign(base, s);
  out.stamps = Object.assign({ templates:0, meals:0, settings:0, weeks:{} }, s.stamps || {});
  out.stamps.weeks = (s.stamps && s.stamps.weeks) || {};
  out.settings = Object.assign({ gistId:'', name:'', height:'', strava:null }, s.settings || {});
  out.logs = s.logs || {}; out.runs = s.runs || []; out.deletedRuns = s.deletedRuns || [];
  out.weights = s.weights || []; out.deletedWeights = s.deletedWeights || [];
  out.photos = s.photos || []; out.deletedPhotos = s.deletedPhotos || [];
  out.mealPlan = s.mealPlan || null;
  out.foods = s.foods || []; out.deletedFoods = s.deletedFoods || [];
  out.routineVersion = s.routineVersion || 1;
  return normalizeLogKeys(out);
}

/* For exercises that define equipment variants, workout-log entries are keyed
   "exId::variant". Older logs (or logs arriving from a device on older code)
   use the plain exId — this idempotently re-keys them onto the exercise's
   default (first) variant so no logged set ever disappears. */
function normalizeLogKeys(s){
  const defs = {};
  (s.templates || []).forEach(t => (t.exercises || []).forEach(ex => {
    if (ex.variants && ex.variants.length) defs[t.id + '|' + ex.id] = ex.id + '::' + ex.variants[0];
  }));
  Object.keys(s.logs || {}).forEach(wk => {
    const wo = (s.logs[wk] || {}).workouts;
    if (!wo) return;
    Object.keys(wo).forEach(tplId => {
      const m = wo[tplId];
      Object.keys(m).forEach(k => {
        if (k.indexOf('::') !== -1) return;
        const nk = defs[tplId + '|' + k];
        if (nk && !m[nk]) { m[nk] = m[k]; delete m[k]; }
      });
    });
  });
  return s;
}

/* One-time routine upgrade: swaps the four split templates for the current
   program while leaving custom templates (e.g. the Friday block) and ALL
   logged history untouched. Matching movements keep their exercise ids, so
   this week's checked-off sets and prior-week ghost values carry over. */
function migrateRoutine(s){
  let v = s.routineVersion || 1;
  if (v >= ROUTINE_V) return s;
  if (v < 2) {
    /* v2: the 4-day split rework — swap the four split templates wholesale,
       keep custom templates (Friday block etc.) and all history */
    const four = { 'push-a':1, 'pull-a':1, 'push-b':1, 'pull-b':1 };
    const kept = (s.templates || []).filter(t => !four[t.id]);
    s.templates = DEFAULT_TEMPLATES.filter(t => four[t.id]).map(t => clone(t)).concat(kept);
    v = 2;
  }
  if (v < 3) {
    /* v3: surgical patch only — add equipment variants to the incline press
       (pa2) without disturbing any other user customization */
    const t = (s.templates || []).find(x => x.id === 'push-a');
    const ex = t && (t.exercises || []).find(e => e.id === 'pa2');
    if (ex && !(ex.variants && ex.variants.length)) {
      ex.variants = ['משקולות', 'מכונה'];
      if (ex.name === 'לחיצת חזה בשיפוע חיובי (משקולות)') ex.name = 'לחיצת חזה בשיפוע חיובי';
    }
    v = 3;
  }
  if (v < 4) {
    /* v4: "בלוק שישי" becomes "ריצת שישי" — drop the dead hang, and flag the
       run as a check-style item that auto-completes from the run log */
    const t = (s.templates || []).find(x => x.id === 'friday');
    if (t) {
      if (t.name === 'בלוק שישי') t.name = 'ריצת שישי';
      if (t.sub === 'ריצה ושחרור · קבוע') t.sub = 'אירובי קבוע · שישי';
      t.exercises = (t.exercises || []).filter(e => e.id !== 'fr2');
      const fr1 = (t.exercises || []).find(e => e.id === 'fr1');
      if (fr1) { fr1.check = true; fr1.runLinked = true; }
    }
    v = 4;
  }
  if (v < 5) {
    /* v5: make the Friday day a run day by IDENTITY (template flag) so it can
       never be broken by deleting/adding exercises, and self-heal the goal if
       it was lost. Any stray non-run exercises are dropped from this day. */
    const t = (s.templates || []).find(x => x.id === 'friday');
    if (t) {
      t.runDay = true;
      if (!t.name || t.name === 'בלוק שישי') t.name = 'ריצת שישי';
      if (!t.sub || t.sub === 'ריצה ושחרור · קבוע') t.sub = 'אירובי קבוע · שישי';
      const linked = (t.exercises || []).find(e => e.runLinked || e.id === 'fr1');
      t.exercises = linked
        ? [Object.assign(linked, { check: true, runLinked: true })]
        : [{ id:'fr1', muscle:'אירובי קבוע', name:'30 דקות ריצה קלה (קצב התאוששות)', sets:1, reps:'30 דק׳', check:true, runLinked:true }];
    }
    v = 5;
  }
  if (v < 6) {
    /* v6: nutrition dashboard — seed the default daily meal plan and recomp
       targets. Old checklist data (state.meals + logs[wk].nutrition) is kept
       untouched and still renders for historical days. */
    if (!s.mealPlan || !s.mealPlan.length) s.mealPlan = clone(DEFAULT_MEAL_PLAN);
    if (!s.foods) s.foods = [];
    if (!s.deletedFoods) s.deletedFoods = [];
    if (!s.settings.nutri) s.settings.nutri = clone(DEFAULT_NUTRI_TARGETS);
    v = 6;
  }
  s.routineVersion = v;
  s.stamps.templates = Date.now();
  return normalizeLogKeys(s);
}
function load(){
  try {

      const wasV = s.routineVersion || 1;
      const m = migrateRoutine(normalize(s));

}

function unionById(a, b, dead){
  const byId = {};
  b.concat(a).forEach(r => {
    if (!r || dead.has(r.id)) return;
    const prev = byId[r.id];
    if (!prev || (r.updatedAt || 0) > (prev.updatedAt || 0)) byId[r.id] = r;
  });
  return Object.values(byId);
}

function mergeStates(local, remote){
  const out = clone(local);
  remote = normalize(clone(remote));
  if ((remote.stamps.templates || 0) > (out.stamps.templates || 0)) { out.templates = remote.templates; out.stamps.templates = remote.stamps.templates; }
  if ((remote.stamps.meals || 0) > (out.stamps.meals || 0)) { out.meals = remote.meals; out.mealPlan = remote.mealPlan || out.mealPlan; out.stamps.meals = remote.stamps.meals; }
  if ((remote.stamps.settings || 0) > (out.stamps.settings || 0)) {
    const gid = out.settings.gistId;
    out.settings = remote.settings;
    out.settings.gistId = gid || remote.settings.gistId || '';
    out.stamps.settings = remote.stamps.settings;
  } else {
    out.settings.gistId = out.settings.gistId || remote.settings.gistId || '';
  }
  const weeks = new Set(Object.keys(out.logs).concat(Object.keys(remote.logs)));
  weeks.forEach(k => {
    const lt = out.stamps.weeks[k] || 0, rt = remote.stamps.weeks[k] || 0;
    if (rt > lt || (!out.logs[k] && remote.logs[k])) { out.logs[k] = remote.logs[k]; out.stamps.weeks[k] = rt; }
  });
  const deadRuns = new Set((out.deletedRuns || []).concat(remote.deletedRuns || []));
  out.runs = unionById(out.runs || [], remote.runs || [], deadRuns).sort((a, b) => a.date < b.date ? 1 : -1);
  out.deletedRuns = Array.from(deadRuns).slice(-500);
  const deadW = new Set((out.deletedWeights || []).concat(remote.deletedWeights || []));
  out.weights = unionById(out.weights || [], remote.weights || [], deadW).sort((a, b) => a.date < b.date ? 1 : -1);
  out.deletedWeights = Array.from(deadW).slice(-300);
  const deadP = new Set((out.deletedPhotos || []).concat(remote.deletedPhotos || []));
  out.photos = unionById(out.photos || [], remote.photos || [], deadP).sort((a, b) => a.date < b.date ? 1 : -1);
  out.deletedPhotos = Array.from(deadP).slice(-300);
  const deadFd = new Set((out.deletedFoods || []).concat(remote.deletedFoods || []));
  out.foods = unionById(out.foods || [], remote.foods || [], deadFd);
  out.deletedFoods = Array.from(deadFd).slice(-300);
  return normalizeLogKeys(out);
}

/* ============================== log getters ============================== */
function exKey(ex, variant){
  return (ex.variants && ex.variants.length) ? ex.id + '::' + (variant || ex.variants[0]) : ex.id;
}
/* Active equipment variant for an exercise in a given week:
   explicit choice this week → variant that already has data this week →
   most recently chosen in a past week → the exercise's default (first). */
function getActiveVariant(state, week, tplId, ex){
  if (!ex.variants || !ex.variants.length) return null;
  const vk = tplId + '|' + ex.id;
  const cur = ((state.logs[week] || {}).variants || {})[vk];
  if (cur && ex.variants.indexOf(cur) !== -1) return cur;
  const m = ((state.logs[week] || {}).workouts || {})[tplId] || {};
  for (let i = 0; i < ex.variants.length; i++) {
    const a = m[ex.id + '::' + ex.variants[i]];
    if (a && a.some(s => s && (s.done || (s.w !== '' && s.w != null) || (s.r !== '' && s.r != null)))) return ex.variants[i];
  }
  const weeks = Object.keys(state.logs).filter(w => w < week).sort();
  for (let i = weeks.length - 1; i >= 0; i--) {
    const v = ((state.logs[weeks[i]] || {}).variants || {})[vk];
    if (v && ex.variants.indexOf(v) !== -1) return v;
  }
  return ex.variants[0];
}
function getSetsByKey(state, week, tplId, key, minLen){
  const arr = (((state.logs[week] || {}).workouts || {})[tplId] || {})[key] || [];
  const n = Math.max(minLen || 0, arr.length);
  return Array.from({ length: n }, (_, i) => arr[i] || { w:'', r:'', done:false });
}
function prevSetsByKey(state, week, tplId, key){
  const weeks = Object.keys(state.logs).filter(k => k < week).sort();
  for (let i = weeks.length - 1; i >= 0; i--) {
    const a = (((state.logs[weeks[i]] || {}).workouts || {})[tplId] || {})[key];
    if (a && a.some(s => (s.w !== '' && s.w != null) || (s.r !== '' && s.r != null))) return { week: weeks[i], sets: a };
  }
  return null;
}
/* every logged array belonging to an exercise, across all its variants */
function exAllArrs(state, week, tplId, ex){
  const m = ((state.logs[week] || {}).workouts || {})[tplId] || {};
  return Object.keys(m).filter(k => k === ex.id || k.indexOf(ex.id + '::') === 0).map(k => m[k] || []);
}
/* the run logged on this week's Friday (or Saturday — weekend slack), if any —
   run-linked check items (ריצת שישי) complete themselves from the run log,
   current AND past weeks, purely by derivation */
function fridayRunOf(state, week){
  const fri = addDays(week, 5), sat = addDays(week, 6);
  return state.runs.find(r => r.date === fri) || state.runs.find(r => r.date === sat) || null;
}
function isCheckExDone(state, week, tplId, ex){
  if (ex.runLinked && fridayRunOf(state, week)) return true;
  const arr = (((state.logs[week] || {}).workouts || {})[tplId] || {})[ex.id] || [];
  return !!(arr[0] && arr[0].done);
}
function tplProgress(state, week, tpl){
  let done = 0, total = 0;
  tpl.exercises.forEach(ex => {
    if (ex.check) {
      total += 1;
      if (isCheckExDone(state, week, tpl.id, ex)) done += 1;
      return;
    }
    const act = getSetsByKey(state, week, tpl.id, exKey(ex, getActiveVariant(state, week, tpl.id, ex)), ex.sets);
    total += act.length;
    exAllArrs(state, week, tpl.id, ex).forEach(arr => { done += arr.filter(s => s && s.done).length; });
  });
  return { done, total };
}
function tonnage(state, week, tpl){
  let t = 0;
  tpl.exercises.forEach(ex => {
    exAllArrs(state, week, tpl.id, ex).forEach(arr => { arr.forEach(s => { if (s) t += numOr0(s.w) * numOr0(s.r); }); });
  });
  return Math.round(t);
}

/* ---------- analytics ---------- */
function todayStats(state){
  const today = toISO(new Date());
  const week = weekStartISO(new Date());
  const wk = state.logs[week] || {};
  let sets = 0, ton = 0;
  const perTpl = [];
  state.templates.forEach(tpl => {
    let s = 0, t = 0;
    const exMap = (wk.workouts || {})[tpl.id] || {};
    Object.keys(exMap).forEach(k => {
      (exMap[k] || []).forEach(x => { if (x && x.done && x.t === today) { s++; t += numOr0(x.w) * numOr0(x.r); } });
    });
    if (s > 0) perTpl.push({ tpl, sets: s, ton: Math.round(t) });
    sets += s; ton += t;
  });
  const runs = state.runs.filter(r => r.date === today);
  const km = runs.reduce((a, r) => a + r.km, 0);
  const dayIdx = new Date().getDay();
  const ns = dayNutriSummary(state, week, dayIdx);
  return { sets, ton: Math.round(ton), perTpl, runs, km, meals: ns.done, mealsTotal: ns.total, kcal: ns.kcal };
}
function dayActive(state, iso){
  const wkk = weekStartISO(fromISO(iso));
  const wk = state.logs[wkk] || {};
  const dayIdx = fromISO(iso).getDay();
  const wo = wk.workouts || {};
  const hasSet = Object.keys(wo).some(tplId => Object.keys(wo[tplId] || {}).some(k =>
    (wo[tplId][k] || []).some(x => x && x.done && x.t === iso)));
  if (hasSet) return true;
  if (state.runs.some(r => r.date === iso)) return true;
  const d2 = (wk.nutri2 || {})[dayIdx];
  if (d2 && d2.meals && d2.meals.some(m => (m.items || []).some(it => it.eaten))) return true;
  const n = (wk.nutrition || {})[dayIdx] || {};
  return Object.keys(n).some(k => n[k]);
}
function streak(state){
  const today = toISO(new Date());
  let s = 0;
  for (let i = 0; i < 180; i++) {
    const d = addDays(today, -i);
    if (dayActive(state, d)) s++;
    else { if (i === 0) continue; break; }
  }
  return s;
}
function exerciseHistory(state, tplId, key){
  return Object.keys(state.logs).sort().map(wk => {
    const arr = (((state.logs[wk] || {}).workouts || {})[tplId] || {})[key] || [];
    let maxW = 0, vol = 0;
    arr.forEach(s => { const w = numOr0(s.w); if (w > maxW) maxW = w; vol += numOr0(s.w) * numOr0(s.r); });
    return { week: wk, maxW, vol: Math.round(vol) };
  }).filter(p => p.maxW > 0 || p.vol > 0);
}
function exOptions(ex){
  return (ex.variants && ex.variants.length)
    ? ex.variants.map(v => ({ key: ex.id + '::' + v, label: ex.name + ' · ' + v }))
    : [{ key: ex.id, label: ex.name }];
}
function findPRs(state){
  const out = [];
  state.templates.forEach(tpl => tpl.exercises.forEach(ex => {
    if (ex.check) return;
    exOptions(ex).forEach(o => {
      const h = exerciseHistory(state, tpl.id, o.key);
      if (h.length >= 2) {
        const last = h[h.length - 1];
        const bestPrev = Math.max.apply(null, h.slice(0, -1).map(p => p.maxW));
        if (last.maxW > bestPrev && bestPrev > 0) out.push({ icon:'🏋️', text: o.label, from: bestPrev + ' ק"ג', to: last.maxW + ' ק"ג', week: last.week });
      }
    });
  }));
  return out.sort((a, b) => a.week < b.week ? 1 : -1).slice(0, 8);
}
function runningInsights(state){
  const runs = state.runs.slice().sort((a, b) => a.date < b.date ? -1 : 1);
  const withPace = runs.filter(r => r.km > 0 && r.sec > 0);
  const today = toISO(new Date());
  const cur = weekStartISO(new Date());
  const weeks = [];
  for (let i = 7; i >= 0; i--) {
    const ws = addDays(cur, -7 * i), end = addDays(ws, 6);
    const km = runs.filter(r => r.date >= ws && r.date <= end).reduce((a, r) => a + r.km, 0);
    weeks.push({ label: 'ש' + weekNum(ws), v: Math.round(km * 10) / 10 });
  }
  if (!withPace.length) return { weeks, fastest:null, longest:null, paceDelta:null, recentPace:0, total: runs.reduce((a, r) => a + r.km, 0) };
  const fastest = withPace.reduce((b, r) => (r.sec / r.km) < (b.sec / b.km) ? r : b);
  const longest = runs.reduce((b, r) => r.km > b.km ? r : b);
  const d14 = addDays(today, -14), d28 = addDays(today, -28);
  const avg = a => { const km = a.reduce((x, r) => x + r.km, 0); return km > 0 ? a.reduce((x, r) => x + r.sec, 0) / km : 0; };
  const recentPace = avg(withPace.filter(r => r.date > d14));
  const prevPace = avg(withPace.filter(r => r.date > d28 && r.date <= d14));
  const paceDelta = (recentPace && prevPace) ? Math.round(prevPace - recentPace) : null;
  return { weeks, fastest, longest, paceDelta, recentPace, total: runs.reduce((a, r) => a + r.km, 0) };
}

/* ---------- nutrition engine ---------- */
function nutriTargets(state){
  return Object.assign({}, DEFAULT_NUTRI_TARGETS, (state.settings || {}).nutri || {});
}
function foodCatalog(state){
  return FOOD_DB.concat(state.foods || []);

/* unified per-day nutrition summary — reads the new macro log (nutri2) when it
   exists, falls back to the legacy checklist so history keeps rendering */
function dayNutriSummary(state, week, dayIdx){
  const wk = state.logs[week] || {};
  const d2 = (wk.nutri2 || {})[dayIdx];
  if (d2 && d2.meals) {
    let kcal = 0, p = 0, c = 0, f = 0, done = 0;
    const icons = [];
    d2.meals.forEach(m => {
      const items = m.items || [];
      const all = items.length > 0 && items.every(it => it.eaten);
      if (all) done++;
      icons.push({ icon: m.icon, done: all });
      items.forEach(it => { if (it.eaten) { kcal += numOr0(it.kcal); p += numOr0(it.p); c += numOr0(it.c); f += numOr0(it.f); } });
    });
    const total = d2.meals.length;
    return { v2: true, done, total, full: total > 0 && done === total,
             kcal: Math.round(kcal), p: Math.round(p), c: Math.round(c), f: Math.round(f),
             water: numOr0(d2.water), sleep: d2.sleep || '', icons };
  }
  const checks = (wk.nutrition || {})[dayIdx] || {};
  const done = state.meals.filter(m => checks[m.id]).length;
  return { v2: false, done, total: state.meals.length, full: done > 0 && done === state.meals.length,
           kcal: 0, p: 0, c: 0, f: 0, water: 0, sleep: '',
           icons: state.meals.map(m => ({ icon: m.icon, done: !!checks[m.id] })) };
}
/* estimated training burn for a calendar day: strength session flat rate +
   run kcal derived from distance × body weight (latest weigh-in, fallback 74) */
function dayBurn(state, dateISO){
  const wkk = weekStartISO(fromISO(dateISO));
  const wk = state.logs[wkk] || {};
  let strength = false;
  const wo = wk.workouts || {};
  outer:
  for (const tplId in wo) for (const k in wo[tplId]) {
    if ((wo[tplId][k] || []).some(x => x && x.done && x.t === dateISO)) { strength = true; break outer; }
  }
  const weightKg = (state.weights && state.weights.length) ? numOr0(state.weights[0].kg) || 74 : 74;
  let runKcal = 0;
  (state.runs || []).forEach(r => { if (r.date === dateISO) runKcal += Math.round(numOr0(r.km) * weightKg); });
  const strengthKcal = strength ? (nutriTargets(state).strengthBurn || 300) : 0;
  return { strengthKcal, runKcal, total: strengthKcal + runKcal };
}

/* total strength volume per week — the zero-click progress headline */
function weeklyVolumes(state, n){
  const cur = weekStartISO(new Date());
  const out = [];
  for (let i = n - 1; i >= 0; i--) {
    const ws = addDays(cur, -7 * i);
    let vol = 0;
    const wk = state.logs[ws];
    if (wk && wk.workouts) Object.keys(wk.workouts).forEach(tplId => {
      const m = wk.workouts[tplId] || {};
      Object.keys(m).forEach(k => (m[k] || []).forEach(s => { if (s) vol += numOr0(s.w) * numOr0(s.r); }));
    });
    out.push({ week: ws, label: 'ש' + weekNum(ws), a: Math.round(vol) });
  }
  return out;
}
/* auto status per exercise (latest max weight, delta vs previous week, mini history)
   — the whole picture without clicking anything */
function exerciseStatus(state){
  const rows = [];
  state.templates.forEach(tpl => tpl.exercises.forEach(ex => {
    if (ex.check) return;
    exOptions(ex).forEach(o => {
      const h = exerciseHistory(state, tpl.id, o.key);
      if (!h.length) return;
      const last = h[h.length - 1];
      if (!(last.maxW > 0)) return;
      const prev = h.length > 1 ? h[h.length - 2] : null;
      rows.push({
        key: tpl.id + '|' + o.key, label: o.label, tplName: tpl.name, week: last.week, maxW: last.maxW,
        delta: (prev && prev.maxW > 0) ? Math.round((last.maxW - prev.maxW) * 10) / 10 : null,
        hist: h.map(p => p.maxW).slice(-8)
      });
    });
  }));
  rows.sort((a, b) => a.week < b.week ? 1 : a.week > b.week ? -1 : 0);
  return rows;
}

/* generic dual-series line chart (A = solid volt w/ area, B = dashed ember, optional) */
function TrendChart({ data, fmtA, fmtB, unitA, unitB }){
  const [sel, setSel] = useState(data.length ? data.length - 1 : null);
  useEffect(() => { setSel(data.length ? data.length - 1 : null); }, [data.length, data.map(d => d.a).join(',')]);
  if (!data.length) return <div className="text-center py-8 text-white/25 text-sm">אין עדיין נתונים — תתחיל לרשום 💪</div>;
  const W = 640, H = 220, L = 42, R = 46, T = 14, B = 26;
  const fa = fmtA || (v => String(Math.round(v * 10) / 10));
  const fb = fmtB || (v => String(Math.round(v)));
  const amax = Math.max.apply(null, data.map(d => d.a).concat([1])) * 1.2;
  const hasB = data.some(d => d.b != null && d.b > 0);
  let bmin = 0, bmax = 1;
  if (hasB) {
    const bs = data.filter(d => d.b > 0).map(d => d.b);
    bmin = Math.min.apply(null, bs); bmax = Math.max.apply(null, bs);
    const p = Math.max((bmax - bmin) * .25, 1); bmin -= p; bmax += p;
  }
  const X = i => data.length === 1 ? (L + (W - L - R) / 2) : L + i * (W - L - R) / (data.length - 1);
  const Ya = v => H - B - (v / amax) * (H - T - B);
  const Yb = v => H - B - ((v - bmin) / (bmax - bmin)) * (H - T - B);
  const aPts = data.map((d, i) => X(i) + ',' + Ya(d.a)).join(' ');
  const bPts = hasB ? data.filter(d => d.b > 0).map((d) => X(data.indexOf(d)) + ',' + Yb(d.b)).join(' ') : '';
  const area = data.length > 1
    ? 'M' + X(0) + ',' + (H - B) + ' L' + data.map((d, i) => X(i) + ',' + Ya(d.a)).join(' L') + ' L' + X(data.length - 1) + ',' + (H - B) + ' Z'
    : '';
  const step = Math.max(1, Math.ceil(data.length / 6));
  const s = sel != null ? data[sel] : null;
  return (
    <div dir="ltr">
      <svg viewBox={'0 0 ' + W + ' ' + H} className="w-full select-none">
        <defs>
          <linearGradient id="gta" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stopColor="#CCFF00" stopOpacity=".24"/>
            <stop offset="100%" stopColor="#CCFF00" stopOpacity="0"/>
          </linearGradient>
        </defs>
        {[.33, .66, 1].map(f => {
          const v = amax * f, y = Ya(v);
          return (
            <g key={f}>
              <line x1={L} x2={W - R} y1={y} y2={y} stroke="rgba(255,255,255,.05)"/>
              <text x={L - 7} y={y + 3} textAnchor="end" fontSize="9" fill="rgba(204,255,0,.45)">{fa(v)}</text>
            </g>
          );
        })}
        {hasB && [.2, .8].map(f => {
          const v = bmin + (bmax - bmin) * f;
          return <text key={f} x={W - R + 7} y={Yb(v) + 3} fontSize="9" fill="rgba(255,90,31,.6)">{fb(v)}</text>;
        })}
        {area && <path d={area} fill="url(#gta)"/>}
        {hasB && data.filter(d => d.b > 0).length > 1 && <polyline points={bPts} fill="none" stroke="#FF5A1F" strokeWidth="2" strokeDasharray="5 4" strokeLinejoin="round" opacity=".85"/>}
        {data.length > 1 && <polyline points={aPts} fill="none" stroke="#CCFF00" strokeWidth="2.5" strokeLinejoin="round" style={{ filter:'drop-shadow(0 0 6px rgba(204,255,0,.5))' }}/>}
        {data.map((d, i) => (
          <g key={i}>
            {sel === i && <line x1={X(i)} x2={X(i)} y1={T} y2={H - B} stroke="rgba(255,255,255,.15)" strokeDasharray="3 3"/>}
            <circle cx={X(i)} cy={Ya(d.a)} r={sel === i ? 5 : 3.5} fill={sel === i ? '#CCFF00' : '#0B0B0C'} stroke="#CCFF00" strokeWidth="2"/>
            {hasB && d.b > 0 && <circle cx={X(i)} cy={Yb(d.b)} r={sel === i ? 4 : 3} fill={sel === i ? '#FF5A1F' : '#0B0B0C'} stroke="#FF5A1F" strokeWidth="1.5"/>}
            <rect x={X(i) - 14} y={T} width="28" height={H - T - B} fill="transparent" onClick={() => setSel(i)} style={{ cursor:'pointer' }}/>
          </g>
        ))}
        {data.map((d, i) => ((i % step === 0 || i === data.length - 1)
          ? <text key={'x' + i} x={X(i)} y={H - 8} textAnchor="middle" fontSize="9" fill="rgba(255,255,255,.35)">{d.label}</text>
          : null))}
      </svg>
      {s && (
        <div dir="rtl" className="mt-2 bg-black/30 rounded-2xl px-4 py-2 flex items-center justify-between gap-2 border border-white/5">
          <span className="text-xs font-bold text-white/50">{s.label}</span>
          <div className="flex gap-4 text-center">
            <div><span className="font-black text-volt">{fa(s.a)}</span><span className="text-[9px] text-white/40 ms-1">{unitA || ''}</span></div>
            {hasB && s.b > 0 && <div><span className="font-black text-ember">{fb(s.b)}</span><span className="text-[9px] text-white/40 ms-1">{unitB || ''}</span></div>}
          </div>
        </div>
      )}
    </div>
  );
}

            <span className="text-[10px] font-black text-ember w-14 text-center shrink-0">{pace}</span>

          </div>

      })}
      <div className="flex gap-2">
        <button type="button" onClick={add} className="flex-1 py-1.5 rounded-xl bg-white/5 border border-white/10 text-volt text-xs font-bold flex items-center justify-center gap-1 active:scale-95 transition">
          <Icon d={I.plus} className="w-3.5 h-3.5"/> הוסף קטע

  );
}

/* ============================== rest timer ============================== */
function RestTimer(){
  const [total, setTotal] = useState(0);
  const [left, setLeft] = useState(0);
  const [flash, setFlash] = useState(false);
  const ctxRef = useRef(null);
  const flashTimer = useRef(null);

  /* iOS requires the AudioContext to be created/resumed inside a user gesture —
     we unlock it when a preset is tapped so the finish alarm is guaranteed to play */
  function unlockAudio(){
    try {
      if (!ctxRef.current) ctxRef.current = new (window.AudioContext || window.webkitAudioContext)();
      const ctx = ctxRef.current;
      if (ctx.state === 'suspended') ctx.resume();
      const o = ctx.createOscillator(), g = ctx.createGain();
      g.gain.value = 0.0001; o.connect(g); g.connect(ctx.destination);
      o.start(); o.stop(ctx.currentTime + 0.01);
    } catch (e) {}
  }
  const start = s => {
    unlockAudio();
    clearTimeout(flashTimer.current);
    setFlash(false); setTotal(s); setLeft(s);
  };
  useEffect(() => {
    if (left <= 0) return;
    const t = setTimeout(() => {
      const nl = left - 1;
      setLeft(nl);
      if (nl === 0) finish();
    }, 1000);
    return () => clearTimeout(t);
  }, [left]);
  function alarm(){
    try {
      if (!ctxRef.current) ctxRef.current = new (window.AudioContext || window.webkitAudioContext)();
      const ctx = ctxRef.current;
      if (ctx.state === 'suspended') ctx.resume();
      const ding = (t, f, vol) => {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = 'square';
        o.connect(g); g.connect(ctx.destination);
        o.frequency.value = f;
        g.gain.setValueAtTime(0.0001, ctx.currentTime + t);
        g.gain.exponentialRampToValueAtTime(vol, ctx.currentTime + t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + t + 0.22);
        o.start(ctx.currentTime + t); o.stop(ctx.currentTime + t + 0.3);
      };
      /* boxing-bell style: ding-ding-DING, twice */
      [0, .22, .44].forEach((t, i) => ding(t, i === 2 ? 1568 : 1046, .5));
      [1.1, 1.32, 1.54].forEach((t, i) => ding(t, i === 2 ? 1568 : 1046, .5));
    } catch (e) {}
  }
  function finish(){
    if (navigator.vibrate) { try { navigator.vibrate([300, 120, 300, 120, 600]); } catch (e) {} }
    alarm();
    setFlash(true);
    clearTimeout(flashTimer.current);
    flashTimer.current = setTimeout(() => setFlash(false), 6000);
  }
  return (
    <React.Fragment>
      <div className="glass rounded-2xl p-2.5 flex items-center gap-2">
        <span className="text-[11px] font-bold text-white/40 flex items-center gap-1 ps-1 shrink-0">
          <Icon d={I.timer} className="w-4 h-4 text-ember"/> מנוחה
        </span>
        {[60, 90, 120, 180].map(s => (
          <button key={s} onClick={() => start(s)}
                  className="flex-1 py-1.5 rounded-xl bg-white/5 text-sm font-bold active:scale-95 transition select-none">
            {fmtDur(s)}
          </button>
        ))}
      </div>
      {left > 0 && (
        <div className="fixed bottom-24 inset-x-0 z-50 flex justify-center pointer-events-none">
          <div className="pointer-events-auto flex items-center gap-3 rounded-full ps-5 pe-3 py-2.5 bg-gradient-to-l from-ember to-orange-600 shadow-2xl shadow-ember/40 fadein">
            <span className="font-black text-2xl text-white" style={{ fontVariantNumeric:'tabular-nums' }}>{fmtDur(left)}</span>
            <div className="w-24 h-1.5 bg-black/30 rounded-full overflow-hidden" dir="ltr">
              <div className="h-full bg-white rounded-full" style={{ width:(left / total * 100) + '%', transition:'width 1s linear' }}/>
            </div>
            <button onClick={() => setLeft(0)} className="w-7 h-7 rounded-full bg-black/25 flex items-center justify-center text-white">
              <Icon d={I.x} className="w-4 h-4"/>
            </button>
          </div>
        </div>
      )}
      {flash && left === 0 && (
        <div className="fixed bottom-24 inset-x-0 z-50 flex justify-center pointer-events-none">
          <button onClick={() => { clearTimeout(flashTimer.current); setFlash(false); }}
                  className="pointer-events-auto flex items-center gap-2 rounded-full px-6 py-3 bg-volt text-obsidian shadow-2xl glow-volt fadein font-black text-lg animate-pulse">
            ⏰ הזמן נגמר — סט חדש! 💪
          </button>
        </div>
      )}
    </React.Fragment>
  );
}

/* ============================== workouts ============================== */
function SetRow({ s, i, prev, onField, onToggle }){
  const ph = f => (prev && prev.sets[i] && prev.sets[i][f] !== '' && prev.sets[i][f] != null) ? String(prev.sets[i][f]) : (f === 'w' ? 'ק"ג' : 'חזרות');
  return (
    <div className={'flex items-center gap-2 rounded-2xl ps-2 pe-1.5 py-1.5 border transition ' + (s.done ? 'bg-volt/10 border-volt/25' : 'bg-black/25 border-white/5')}>
      <span className={'w-6 h-6 rounded-lg text-[11px] font-bold flex items-center justify-center shrink-0 ' + (s.done ? 'bg-volt text-obsidian' : 'bg-white/10 text-white/50')}>{i + 1}</span>
      <input className="setinp" inputMode="decimal" placeholder={ph('w')} value={s.w}
             onChange={e => onField(i, 'w', e.target.value)}/>
      <span className="text-white/25 text-xs shrink-0">×</span>
      <input className="setinp" inputMode="numeric" placeholder={ph('r')} value={s.r}
             onChange={e => onField(i, 'r', e.target.value)}/>
      <button onClick={() => onToggle(i)}
              className={'w-9 h-8 rounded-xl flex items-center justify-center transition active:scale-90 shrink-0 ' + (s.done ? 'bg-volt text-obsidian glow-volt' : 'bg-white/5 text-white/30')}>
        <Icon d={I.check} className="w-4 h-4"/>
      </button>
    </div>
  );
}

function ExerciseCard({ state, week, tpl, ex, edit, updEx, delEx, setSetField, setVariant, moveEx, idx, count }){
  const active = getActiveVariant(state, week, tpl.id, ex);
  const key = exKey(ex, active);
  const sets = getSetsByKey(state, week, tpl.id, key, ex.sets);
  const prev = prevSetsByKey(state, week, tpl.id, key);
  const prevSumm = useMemo(() => {
    if (!prev) return null;
    const best = prev.sets.reduce((b, s) => numOr0(s.w) > numOr0(b.w) ? s : b, prev.sets[0]);
    if (!best || (best.w === '' && best.r === '')) return null;
    return (best.w || '?') + ' ק"ג × ' + (best.r || '?');
  }, [prev]);
  if (edit) return (
    <div className="glass rounded-3xl p-4 space-y-2.5 fadein">
      <div className="flex gap-1.5">
        <input className="inp flex-1 min-w-0 font-bold" value={ex.name} onChange={e => updEx(ex.id, { name: e.target.value })}/>
        <button onClick={() => moveEx(ex.id, -1)} disabled={idx === 0}
                className="w-10 rounded-xl bg-white/5 border border-white/10 text-white/60 flex items-center justify-center shrink-0 active:scale-90 transition disabled:opacity-15">
          <Icon d={I.chevUp} className="w-4 h-4"/>
        </button>
        <button onClick={() => moveEx(ex.id, 1)} disabled={idx === count - 1}
                className="w-10 rounded-xl bg-white/5 border border-white/10 text-white/60 flex items-center justify-center shrink-0 active:scale-90 transition disabled:opacity-15">
          <Icon d={I.chevDown} className="w-4 h-4"/>
        </button>
        <button onClick={() => delEx(ex.id)} className="w-10 rounded-xl bg-ember/15 text-ember flex items-center justify-center shrink-0 active:scale-90 transition">
          <Icon d={I.trash} className="w-4 h-4"/>
        </button>
      </div>
      <input className="inp text-xs" value={ex.muscle} placeholder="קבוצת שריר / קטגוריה" onChange={e => updEx(ex.id, { muscle: e.target.value })}/>
      <input className="inp text-xs" value={(ex.variants || []).join(', ')} placeholder="וריאציות ציוד מופרדות בפסיק (למשל: מוט, מכונה) — ריק = ללא"
             onChange={e => updEx(ex.id, { variants: e.target.value.split(',').map(x => x.trim()).filter(Boolean) })}/>
      <div className="flex items-center gap-3 flex-wrap">
        <div className="flex items-center gap-1 bg-black/30 rounded-xl p-1 border border-white/10">
          <button onClick={() => updEx(ex.id, { sets: Math.max(1, ex.sets - 1) })} className="w-9 h-9 rounded-lg bg-white/5 font-black text-lg active:scale-90 transition">−</button>
          <span className="w-9 text-center font-black text-lg">{ex.sets}</span>
          <button onClick={() => updEx(ex.id, { sets: Math.min(12, ex.sets + 1) })} className="w-9 h-9 rounded-lg bg-white/5 font-black text-lg active:scale-90 transition">+</button>
        </div>
        <span className="text-white/40 text-xs font-semibold">סטים</span>
        <input className="inp flex-1 min-w-[90px] text-center font-bold" value={ex.reps} placeholder="6-8" onChange={e => updEx(ex.id, { reps: e.target.value })}/>
        <span className="text-white/40 text-xs font-semibold">חזרות</span>
      </div>
    </div>
  );
  if (ex.check) {
    const run = ex.runLinked ? fridayRunOf(state, week) : null;
    const manualArr = (((state.logs[week] || {}).workouts || {})[tpl.id] || {})[ex.id] || [];
    const manualDone = !!(manualArr[0] && manualArr[0].done);
    const done = !!run || manualDone;
    return (
      <div className={'rounded-3xl p-4 border transition ' + (done ? 'bg-volt/10 border-volt/25' : 'glass border-transparent')}>
        <div className="flex items-start justify-between gap-3">
          <div className="min-w-0">
            <span className="inline-block text-[10px] font-bold text-volt bg-volt/10 border border-volt/20 rounded-full px-2 py-0.5">{ex.muscle}</span>
            <h3 className="font-bold mt-1.5 leading-snug">{ex.name}</h3>
          </div>
          <div className="text-end shrink-0 font-black text-lg leading-none whitespace-nowrap">{ex.reps}</div>
        </div>
        {run ? (
          <div className="mt-3 flex items-center gap-3 bg-black/25 border border-volt/20 rounded-2xl p-3">
            <span className="text-2xl">🏃</span>
            <div className="flex-1 min-w-0">
              <div className="font-bold text-sm truncate">{run.title}</div>
              <div className="text-[10px] text-white/40">{run.km} ק"מ · {fmtDur(run.sec)} · {fmtPace(run.sec / Math.max(run.km, .01))} דק'/ק"מ</div>
            </div>
            <span className="text-[9px] font-black text-obsidian bg-volt rounded-full px-2 py-1 glow-volt shrink-0">הושלם אוטומטית ✓</span>
          </div>
        ) : (
          <React.Fragment>
            <button onClick={() => setSetField(ex.id, 0, 'done')}
                    className={'mt-3 w-full py-3 rounded-2xl font-black text-base flex items-center justify-center gap-2 transition active:scale-[.98] ' +
                      (manualDone ? 'bg-volt text-obsidian glow-volt' : 'bg-white/5 border border-white/10 text-white/60')}>
              <Icon d={I.check} className="w-5 h-5"/>{manualDone ? 'בוצע! 🔥' : 'סמן כבוצע'}
            </button>
            <div className="mt-2 text-[10px] text-white/30 text-center">טיפ: רשום את הריצה בטאב «ריצה» ביום שישי — והיא תסומן כאן אוטומטית</div>
          </React.Fragment>
        )}
      </div>
    );
  }
  return (
    <div className="glass rounded-3xl p-4">
      <div className="flex items-start justify-between gap-3">
        <div className="min-w-0">
          <span className="inline-block text-[10px] font-bold text-volt bg-volt/10 border border-volt/20 rounded-full px-2 py-0.5">{ex.muscle}</span>
          <h3 className="font-bold mt-1.5 leading-snug">{ex.name}</h3>
        </div>
        <div className="text-end shrink-0">
          <div className="font-black text-lg leading-none whitespace-nowrap">{ex.sets}<span className="text-white/30 mx-0.5">×</span>{ex.reps}</div>
          {prevSumm && <div className="text-[10px] text-white/35 mt-1.5 whitespace-nowrap">שבוע קודם · {prevSumm}</div>}
        </div>
      </div>
      {ex.variants && ex.variants.length > 1 && (
        <div className="flex gap-1.5 mt-2.5 flex-wrap">
          {ex.variants.map(v => (
            <button key={v} onClick={() => setVariant(ex, v)}
                    className={'px-3 py-1 rounded-full text-[11px] font-bold border transition active:scale-95 ' +
                      (v === active ? 'bg-volt/15 text-volt border-volt/40 glow-volt' : 'bg-white/5 text-white/40 border-white/10')}>
              {v}
            </button>
          ))}
        </div>
      )}
      <div className="mt-3 space-y-1.5">
        {sets.map((s, i) => (
          <SetRow key={key + i} s={s} i={i} prev={prev}
                  onField={(idx, f, v) => setSetField(key, idx, f, v)}
                  onToggle={idx => setSetField(key, idx, 'done')}/>
        ))}
      </div>
    </div>
  );
}

/* cardio-native view for the Friday run day: no lifting stats, no rest timer —
   a real run form that writes straight into the global run log, or the linked
   run once one exists for that week's Friday/Saturday */
function FridayRunBlock({ state, week, tpl, mutate }){
  const run = fridayRunOf(state, week);
  const fri = addDays(week, 5);
  const blank = { title:'', km:'', dur:'', date: fri, type:'', splits:[] };
  const [mode, setMode] = useState(null); // null = view, 'add' | 'edit' = form
  const [f, setF] = useState(blank);
  const [goalEdit, setGoalEdit] = useState(null); // { id, name } while editing a goal line
  useEffect(() => { setMode(null); setGoalEdit(null); setF(Object.assign({}, blank, { date: addDays(week, 5) })); }, [week]);
  const eff = (numOr0(f.km) > 0 || parseDur(f.dur) > 0) ? { km: numOr0(f.km), sec: parseDur(f.dur) } : sumSplits(f.splits);
  const goals = tpl.exercises.filter(e => e.check);

  const startEdit = () => { setF({ title: run.title, km: String(run.km), dur: fmtDur(run.sec), date: run.date, type: run.type || '', splits: (run.splits || []).map(s => ({ km: String(s.km), dur: fmtDur(s.sec) })) }); setMode('edit'); };
  const pickStyle = st => setF(x => {
    const isDefaultTitle = !x.title || RUN_STYLES.some(s => s.title === x.title);
    return Object.assign({}, x, { type: st.id, title: isDefaultTitle ? st.title : x.title });
  });
  const validSplits = () => (f.splits || []).map(s => ({ km: numOr0(s.km), sec: parseDur(s.dur) })).filter(s => s.km > 0 && s.sec > 0);
  const save = () => {
    if (!(eff.km > 0)) { alert('הכנס מרחק בק"מ (או הוסף ספליטים)'); return; }
    if (!(eff.sec > 0)) { alert('הכנס זמן ריצה (או הוסף ספליטים)'); return; }
    const sp = validSplits();
    const patch = { title: (f.title.trim() || (styleOf(f.type) || {}).title || 'ריצת שישי'), km: eff.km, sec: eff.sec, date: f.date || fri, type: f.type || '', splits: sp };
    if (mode === 'edit' && run) {
      mutate(d => { const r = d.runs.find(x => x.id === run.id); if (r) { Object.assign(r, patch, { updatedAt: Date.now() }); } });
    } else {
      mutate(d => { d.runs.unshift(Object.assign({ id: uid() }, patch, { updatedAt: Date.now() })); });
    }
    setMode(null);
  };
  const reset = () => setF(Object.assign({}, blank, { date: addDays(week, 5) }));
  const del = () => {
    if (!run) return;
    if (!confirm('למחוק את ריצת שישי (' + run.km + ' ק"מ)? תוכל לרשום חדשה מיד.')) return;
    mutate(d => { d.runs = d.runs.filter(x => x.id !== run.id); if (d.deletedRuns.indexOf(run.id) < 0) d.deletedRuns.push(run.id); });
    reset(); setMode(null);
  };
  const saveGoal = () => {
    const g = goalEdit; if (!g) return;
    mutate(d => { const t = d.templates.find(x => x.id === tpl.id); const ex = t && t.exercises.find(e => e.id === g.id); if (ex) ex.name = g.name.trim() || ex.name; }, 'templates');
    setGoalEdit(null);
  };

  const form = (
    <div className="glass rounded-3xl p-4 space-y-2.5 fadein">
      <div className="flex items-center justify-between">
        <div className="font-bold flex items-center gap-2">
          <span className={'w-7 h-7 rounded-xl flex items-center justify-center ' + (mode === 'edit' ? 'bg-volt/20 text-volt' : 'bg-ember/20 text-ember')}>
            <Icon d={mode === 'edit' ? I.pencil : I.plus} className="w-4 h-4"/>
          </span>
          {mode === 'edit' ? 'עריכת ריצת שישי' : 'רשום את ריצת שישי'}
        </div>
        {run && <button onClick={() => { reset(); setMode(null); }} className="text-[10px] font-bold text-white/50 bg-white/5 border border-white/10 rounded-full px-2.5 py-1 active:scale-95 transition">בטל ✕</button>}
      </div>
      <div><label className="lbl">סגנון ריצה</label><StylePills value={f.type} onPick={pickStyle}/></div>
      <input className="inp" placeholder="שם הריצה (למשל: ריצת בוקר קלה)" value={f.title} onChange={e => setF({ ...f, title: e.target.value })}/>
      <div className="grid grid-cols-3 gap-2">
        <div><label className="lbl">מרחק (ק"מ)</label>
          <input className="inp text-center font-bold" inputMode="decimal" placeholder="5.0" value={f.km} onChange={e => setF({ ...f, km: e.target.value })}/></div>
        <div><label className="lbl">זמן (דק:שנ)</label>
          <input className="inp text-center font-bold" inputMode="numeric" placeholder="30:00" value={f.dur} onChange={e => setF({ ...f, dur: fmtTimeInput(e.target.value) })}/></div>
        <div><label className="lbl">תאריך</label>
          <input type="date" className="inp text-center" value={f.date} onChange={e => setF({ ...f, date: e.target.value })}/></div>
      </div>
      <SplitsEditor splits={f.splits} setSplits={sp => setF(x => Object.assign({}, x, { splits: sp }))}
                    onApplySum={sum => setF(x => Object.assign({}, x, { km: sum.km ? String(sum.km) : x.km, dur: sum.sec ? fmtDur(sum.sec) : x.dur }))}/>
      <div className="flex items-center justify-between bg-black/25 rounded-2xl px-4 py-2.5 border border-white/5">
        <span className="text-xs text-white/40">קצב מחושב</span>
        <span className="font-black text-xl text-volt text-glow">{(eff.km > 0 && eff.sec > 0) ? fmtPace(eff.sec / eff.km) : '—'}<span className="text-[10px] text-white/40 font-normal ms-1">דק' / ק"מ</span></span>
      </div>
      <button onClick={save} className="w-full py-3 rounded-2xl bg-volt text-obsidian font-black text-lg active:scale-[.98] transition glow-volt">{mode === 'edit' ? 'עדכן ריצה 💾' : 'שמור ריצה ⚡'}</button>
      {mode !== 'edit' && <div className="text-[10px] text-white/30 text-center">נשמר ישירות ליומן הריצות — והשבוע מסומן כהושלם אוטומטית</div>}
    </div>
  );

  const st = styleOf(run && run.type);
  return (
    <React.Fragment>
      {goals.length > 0 && (
        <div className="glass rounded-3xl p-4">
          <div className="text-[10px] font-bold text-white/40 mb-1">היעד הקבוע</div>
          {goals.map(g => (
            goalEdit && goalEdit.id === g.id ? (
              <div key={g.id} className="flex gap-2 py-1">

function WorkoutDetail({ state, week, tpl, mutate, onBack }){
  const [edit, setEdit] = useState(false);
  const prog = tplProgress(state, week, tpl);
  const ton = tonnage(state, week, tpl);
  const pct = prog.total ? prog.done / prog.total : 0;
  const isRunDay = !!tpl.runDay || (tpl.exercises.length > 0 && tpl.exercises.every(e => e.check));
  const runDayDone = isRunDay && tpl.exercises.some(ex => isCheckExDone(state, week, tpl.id, ex));

  const setSetField = (key, idx, field, val) => mutate(d => {
    const wk = (d.logs[week] = d.logs[week] || {});
    const wo = (wk.workouts = wk.workouts || {});
    const t = (wo[tpl.id] = wo[tpl.id] || {});
    const arr = (t[key] = t[key] || []);
    while (arr.length <= idx) arr.push({ w:'', r:'', done:false });
    if (field === 'done') {
      arr[idx].done = !arr[idx].done;
      if (arr[idx].done) arr[idx].t = toISO(new Date());
      else delete arr[idx].t;
    } else arr[idx][field] = val;
  }, ['week', week]);

  const setVariant = (ex, v) => mutate(d => {
    const wk = (d.logs[week] = d.logs[week] || {});
    const vm = (wk.variants = wk.variants || {});
    vm[tpl.id + '|' + ex.id] = v;
  }, ['week', week]);

  const updTpl = patch => mutate(d => { Object.assign(d.templates.find(x => x.id === tpl.id), patch); }, 'templates');
  const updEx = (exId, patch) => mutate(d => {
    const t = d.templates.find(x => x.id === tpl.id);
    Object.assign(t.exercises.find(e => e.id === exId), patch);
  }, 'templates');
  const delEx = exId => {
    const ex = tpl.exercises.find(e => e.id === exId);
    if (!confirm('למחוק את התרגיל "' + (ex ? ex.name : '') + '"?')) return;
    mutate(d => { const t = d.templates.find(x => x.id === tpl.id); t.exercises = t.exercises.filter(e => e.id !== exId); }, 'templates');
  };
  const addEx = () => mutate(d => {
    d.templates.find(x => x.id === tpl.id).exercises.push({ id: uid(), muscle:'קבוצת שריר', name:'תרגיל חדש', sets:3, reps:'8-10' });
  }, 'templates');
  const moveEx = (exId, dir) => mutate(d => {
    const t = d.templates.find(x => x.id === tpl.id);
    const i = t.exercises.findIndex(e => e.id === exId), j = i + dir;
    if (i < 0 || j < 0 || j >= t.exercises.length) return;
    const tmp = t.exercises[i]; t.exercises[i] = t.exercises[j]; t.exercises[j] = tmp;
  }, 'templates');
  const moveTpl = dir => mutate(d => {
    const i = d.templates.findIndex(x => x.id === tpl.id), j = i + dir;
    if (i < 0 || j < 0 || j >= d.templates.length) return;
    const tmp = d.templates[i]; d.templates[i] = d.templates[j]; d.templates[j] = tmp;
  }, 'templates');
  const delWorkout = () => {
    if (!confirm('למחוק את האימון "' + tpl.name + '" לגמרי?')) return;
    mutate(d => { d.templates = d.templates.filter(x => x.id !== tpl.id); }, 'templates');
    onBack();
  };

  return (
    <div className="fadein space-y-3">
      <div className="flex items-center justify-between">
        <button onClick={onBack} className="flex items-center gap-1 text-white/60 text-sm font-bold active:scale-95 transition">
          <Icon d={I.chevR} className="w-5 h-5"/> חזרה
        </button>
        <div className="flex gap-2">
          {edit && (
            <React.Fragment>
              <button onClick={() => moveTpl(-1)} title="הזז למעלה ברשימת האימונים"
                      className="w-10 h-10 rounded-2xl bg-white/5 border border-white/10 text-white/60 flex items-center justify-center active:scale-90 transition">
                <Icon d={I.chevUp} className="w-4 h-4"/>
              </button>
              <button onClick={() => moveTpl(1)} title="הזז למטה ברשימת האימונים"
                      className="w-10 h-10 rounded-2xl bg-white/5 border border-white/10 text-white/60 flex items-center justify-center active:scale-90 transition">
                <Icon d={I.chevDown} className="w-4 h-4"/>
              </button>
              <button onClick={delWorkout} className="w-10 h-10 rounded-2xl bg-ember/15 text-ember flex items-center justify-center active:scale-90 transition">
                <Icon d={I.trash} className="w-4 h-4"/>
              </button>
            </React.Fragment>
          )}
          <button onClick={() => setEdit(!edit)}
                  className={'h-10 px-4 rounded-2xl flex items-center gap-2 text-sm font-bold active:scale-95 transition ' + (edit ? 'bg-volt text-obsidian glow-volt' : 'bg-white/5 text-white/70 border border-white/10')}>
            <Icon d={edit ? I.check : I.pencil} className="w-4 h-4"/>{edit ? 'סיום עריכה' : 'עריכה'}
          </button>

      <div className="glass rounded-3xl p-5">
        {edit ? (
          <div className="space-y-2">
            <div className="flex gap-2">
              <input className="inp w-16 text-center text-2xl" value={tpl.icon} onChange={e => updTpl({ icon: e.target.value })}/>

            <input className="inp text-xs" value={tpl.sub} onChange={e => updTpl({ sub: e.target.value })} placeholder="תיאור (למשל: סבב א׳ · יום 1)"/>

              <h2 className="text-2xl font-black italic leading-none">{tpl.name}</h2>
              <div className="text-white/40 text-xs mt-1">{tpl.sub}</div>

            {isRunDay && (runDayDone
              ? <span className="text-[10px] font-black text-obsidian bg-volt rounded-full px-2.5 py-1 glow-volt shrink-0">הושלם השבוע ✓</span>
              : <span className="text-[10px] font-bold text-white/40 bg-white/5 border border-white/10 rounded-full px-2.5 py-1 shrink-0">ממתין לריצה 🏃</span>)}
          </div>
        )}
        {!isRunDay && (
          <React.Fragment>
            <div className="grid grid-cols-3 gap-2 mt-4 text-center">
              <div className="bg-black/30 rounded-2xl py-2.5">
                <div className="font-black text-xl text-volt">{prog.done}<span className="text-white/30 text-sm font-bold">/{prog.total}</span></div>
                <div className="text-[10px] text-white/40 mt-0.5">סטים הושלמו</div>
              </div>
              <div className="bg-black/30 rounded-2xl py-2.5">
                <div className="font-black text-xl">{ton.toLocaleString()}</div>
                <div className="text-[10px] text-white/40 mt-0.5">ק"ג נפח שבועי</div>
              </div>
              <div className="bg-black/30 rounded-2xl py-2.5">
                <div className="font-black text-xl">{tpl.exercises.length}</div>
                <div className="text-[10px] text-white/40 mt-0.5">תרגילים</div>
              </div>
            </div>
            <div className="mt-3 h-1.5 bg-white/5 rounded-full overflow-hidden">
              <div className="h-full rounded-full bg-gradient-to-l from-volt to-lime-300 transition-all duration-500" style={{ width:(pct * 100) + '%' }}/>
            </div>

      {!edit && !isRunDay && <RestTimer/>}

      {isRunDay ? (
        <React.Fragment>
          <FridayRunBlock state={state} week={week} tpl={tpl} mutate={mutate}/>
          {edit && (
            <div className="glass rounded-3xl p-4 space-y-2 fadein">
              <div className="text-[10px] font-bold text-white/40">היעד הקבוע (טקסט בלבד — הריצה נרשמת מלמעלה)</div>
              {tpl.exercises.filter(e => e.check).map(g => (
                <div key={g.id} className="flex gap-2">
                  <input className="inp flex-1 min-w-0" value={g.name} onChange={e => updEx(g.id, { name: e.target.value })}/>
                  <input className="inp w-24 text-center" value={g.reps} onChange={e => updEx(g.id, { reps: e.target.value })}/>
                </div>
              ))}
            </div>
          )}
        </React.Fragment>
      ) : (
        <React.Fragment>
          {tpl.exercises.map((ex, i) => (
            <ExerciseCard key={ex.id} state={state} week={week} tpl={tpl} ex={ex} edit={edit}
                          updEx={updEx} delEx={delEx} setSetField={setSetField} setVariant={setVariant}
                          moveEx={moveEx} idx={i} count={tpl.exercises.length}/>

          {edit && (
            <button onClick={addEx} className="w-full glass rounded-3xl py-4 text-volt font-bold flex items-center justify-center gap-2 active:scale-[.98] transition">

function RunChart({ runs }){
  const data = useMemo(() => runs.slice().sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0).slice(-24), [runs]);
  const [sel, setSel] = useState(null);
  useEffect(() => { setSel(data.length ? data.length - 1 : null); }, [data.length]);
  if (data.length === 0) return (
    <div className="text-center py-10 text-white/30 text-sm">אין ריצות עדיין — רשום את הריצה הראשונה שלך 🏃</div>
  );
  const W = 640, H = 250, L = 40, R = 46, T = 16, B = 30;
  const kmMax = Math.max.apply(null, data.map(r => r.km).concat([1])) * 1.2;
  const paceOf = r => r.sec / Math.max(r.km, .01);
  const paces = data.map(paceOf);
  let pMin = Math.min.apply(null, paces), pMax = Math.max.apply(null, paces);
  const padP = Math.max((pMax - pMin) * .25, 20); pMin -= padP; pMax += padP;
  const X = i => data.length === 1 ? (L + (W - L - R) / 2) : L + i * (W - L - R) / (data.length - 1);
  const Ykm = v => H - B - (v / kmMax) * (H - T - B);
  const Yp = v => T + ((v - pMin) / (pMax - pMin)) * (H - T - B);
  const kmPts = data.map((r, i) => X(i) + ',' + Ykm(r.km)).join(' ');
  const pPts = data.map((r, i) => X(i) + ',' + Yp(paceOf(r))).join(' ');
  const area = data.length > 1
    ? 'M' + X(0) + ',' + (H - B) + ' L' + data.map((r, i) => X(i) + ',' + Ykm(r.km)).join(' L') + ' L' + X(data.length - 1) + ',' + (H - B) + ' Z'
    : '';
  const xLabelStep = Math.max(1, Math.ceil(data.length / 6));
  const selRun = sel != null ? data[sel] : null;
  return (
    <div dir="ltr">
      <svg viewBox={'0 0 ' + W + ' ' + H} className="w-full select-none">
        <defs>
          <linearGradient id="gkm" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stopColor="#CCFF00" stopOpacity=".26"/>
            <stop offset="100%" stopColor="#CCFF00" stopOpacity="0"/>
          </linearGradient>
        </defs>
        {[.25, .5, .75, 1].map(f => {
          const v = kmMax * f, y = Ykm(v);
          return (
            <g key={f}>
              <line x1={L} x2={W - R} y1={y} y2={y} stroke="rgba(255,255,255,.05)"/>
              <text x={L - 7} y={y + 3} textAnchor="end" fontSize="9" fill="rgba(204,255,0,.45)">{v.toFixed(1)}</text>
            </g>
          );
        })}
        {[.15, .5, .85].map(f => {
          const v = pMin + (pMax - pMin) * f;
          return <text key={f} x={W - R + 7} y={Yp(v) + 3} fontSize="9" fill="rgba(255,90,31,.6)">{fmtPace(v)}</text>;
        })}
        {area && <path d={area} fill="url(#gkm)"/>}
        {data.length > 1 && <polyline points={pPts} fill="none" stroke="#FF5A1F" strokeWidth="2" strokeDasharray="5 4" strokeLinejoin="round" opacity=".85"/>}
        {data.length > 1 && <polyline points={kmPts} fill="none" stroke="#CCFF00" strokeWidth="2.5" strokeLinejoin="round" style={{ filter:'drop-shadow(0 0 6px rgba(204,255,0,.5))' }}/>}
        {data.map((r, i) => (
          <g key={r.id}>
            {sel === i && <line x1={X(i)} x2={X(i)} y1={T} y2={H - B} stroke="rgba(255,255,255,.15)" strokeDasharray="3 3"/>}
            <circle cx={X(i)} cy={Ykm(r.km)} r={sel === i ? 5 : 3.5} fill={sel === i ? '#CCFF00' : '#0B0B0C'} stroke="#CCFF00" strokeWidth="2"/>
            <circle cx={X(i)} cy={Yp(paceOf(r))} r={sel === i ? 4 : 3} fill={sel === i ? '#FF5A1F' : '#0B0B0C'} stroke="#FF5A1F" strokeWidth="1.5"/>
            <rect x={X(i) - 14} y={T} width="28" height={H - T - B} fill="transparent" onClick={() => setSel(i)} style={{ cursor:'pointer' }}/>
          </g>
        ))}
        {data.map((r, i) => ((i % xLabelStep === 0 || i === data.length - 1)
          ? <text key={'x' + r.id} x={X(i)} y={H - 8} textAnchor="middle" fontSize="9" fill="rgba(255,255,255,.35)">
              {fromISO(r.date).getDate() + '.' + (fromISO(r.date).getMonth() + 1)}
            </text>
          : null))}
      </svg>
      {selRun && (
        <div dir="rtl" className="mt-2 bg-black/30 rounded-2xl px-4 py-2.5 flex items-center justify-between gap-2 fadein border border-white/5">
          <div className="min-w-0">
            <div className="font-bold text-sm truncate">{selRun.title}</div>
            <div className="text-[10px] text-white/40">{heDate(selRun.date)}</div>
          </div>
          <div className="flex gap-4 text-center shrink-0">
            <div><div className="font-black text-volt">{selRun.km}</div><div className="text-[9px] text-white/40">ק"מ</div></div>
            <div><div className="font-black text-ember">{fmtPace(paceOf(selRun))}</div><div className="text-[9px] text-white/40">קצב</div></div>
            <div><div className="font-black">{fmtDur(selRun.sec)}</div><div className="text-[9px] text-white/40">זמן</div></div>
          </div>
        </div>
      )}
    </div>
  );
}

function RunsTab({ state, week, mutate, stravaConnected, onOpenSettings }){
  const todayISO = toISO(new Date());
  const inWeek = todayISO >= week && todayISO <= addDays(week, 6);
  const [f, setF] = useState({ title:'', km:'', dur:'', date: inWeek ? todayISO : week, type:'', splits:[] });
  const [showAll, setShowAll] = useState(false);
  const [editing, setEditing] = useState(null);
  const [openSplits, setOpenSplits] = useState(null);
  useEffect(() => { if (!editing) setF(x => Object.assign({}, x, { date: (todayISO >= week && todayISO <= addDays(week, 6)) ? todayISO : week })); }, [week]);

  const all = useMemo(() => state.runs.slice().sort((a, b) => a.date < b.date ? 1 : -1), [state.runs]);
  const weekRuns = all.filter(r => r.date >= week && r.date <= addDays(week, 6));
  const totKm = weekRuns.reduce((a, r) => a + r.km, 0);
  const totSec = weekRuns.reduce((a, r) => a + r.sec, 0);
  const avgPace = totKm > 0 ? totSec / totKm : 0;
  const bestPace = state.runs.length ? Math.min.apply(null, state.runs.map(r => r.sec / Math.max(r.km, .01))) : 0;

  const eff = (numOr0(f.km) > 0 || parseDur(f.dur) > 0) ? { km: numOr0(f.km), sec: parseDur(f.dur) } : sumSplits(f.splits);
  const pickStyle = st => setF(x => {
    const isDefaultTitle = !x.title || RUN_STYLES.some(s => s.title === x.title);
    return Object.assign({}, x, { type: st.id, title: isDefaultTitle ? st.title : x.title });
  });
  const resetForm = () => setF({ title:'', km:'', dur:'', date: (todayISO >= week && todayISO <= addDays(week, 6)) ? todayISO : week, type:'', splits:[] });
  const saveRun = () => {
    if (!(eff.km > 0)) { alert('הכנס מרחק בק"מ (או הוסף ספליטים)'); return; }
    if (!(eff.sec > 0)) { alert('הכנס זמן ריצה (או הוסף ספליטים)'); return; }
    if (!f.date) { alert('בחר תאריך'); return; }
    const sp = (f.splits || []).map(s => ({ km: numOr0(s.km), sec: parseDur(s.dur) })).filter(s => s.km > 0 && s.sec > 0);
    const patch = { title: (f.title.trim() || (styleOf(f.type) || {}).title || 'ריצה'), km: eff.km, sec: eff.sec, date: f.date, type: f.type || '', splits: sp };
    if (editing) {
      mutate(d => { const r = d.runs.find(x => x.id === editing); if (r) Object.assign(r, patch, { updatedAt: Date.now() }); });
      setEditing(null);
    } else {
      mutate(d => { d.runs.unshift(Object.assign({ id: uid() }, patch, { updatedAt: Date.now() })); });
    }
    resetForm();
  };
  const startEdit = r => {
    setEditing(r.id);
    setF({ title: r.title, km: String(r.km), dur: fmtDur(r.sec), date: r.date, type: r.type || '', splits: (r.splits || []).map(s => ({ km: String(s.km), dur: fmtDur(s.sec) })) });
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };
  const cancelEdit = () => { setEditing(null); resetForm(); };
  const delRun = r => {
    if (!confirm('למחוק את "' + r.title + '" (' + r.km + ' ק"מ)? אפשר גם לערוך במקום למחוק — כפתור העיפרון.')) return;
    if (editing === r.id) cancelEdit();
    mutate(d => { d.runs = d.runs.filter(x => x.id !== r.id); if (d.deletedRuns.indexOf(r.id) < 0) d.deletedRuns.push(r.id); });
  };

  const Stat = ({ v, l, accent }) => (
    <div className="glass rounded-2xl py-2.5 text-center">
      <div className={'font-black text-lg leading-none ' + (accent || '')}>{v}</div>
      <div className="text-[9px] text-white/40 mt-1">{l}</div>
    </div>
  );

  const RunRow = ({ r }) => {
    const st = styleOf(r.type);
    const hasSplits = r.splits && r.splits.length > 0;
    const isOpen = openSplits === r.id;
    return (
      <div className="glass rounded-2xl p-3">
        <div className="flex items-center gap-3">
          <div className={'w-9 h-9 rounded-xl flex items-center justify-center shrink-0 text-base ' + (r.src === 'strava' ? 'bg-strava/15 text-strava' : 'bg-ember/15 text-ember')}>
            {st ? st.emoji : <Icon d={I.activity} className="w-4 h-4"/>}
          </div>
          <div className="flex-1 min-w-0">
            <div className="flex items-center gap-1.5 min-w-0">
              <span className="font-bold text-sm truncate">{r.title}</span>
              {r.src === 'strava' && <span className="text-[8px] font-black text-strava bg-strava/10 border border-strava/25 rounded-full px-1.5 py-0.5 shrink-0">STRAVA</span>}
            </div>
            <div className="text-[10px] text-white/40 flex items-center gap-1.5">
              {heDate(r.date)}
              {hasSplits && (
                <button onClick={() => setOpenSplits(isOpen ? null : r.id)} className="text-volt font-bold inline-flex items-center gap-0.5 active:scale-95 transition">
                  · ⏱️ {r.splits.length} ספליטים <Icon d={isOpen ? I.chevUp : I.chevDown} className="w-3 h-3"/>
                </button>
              )}
            </div>
          </div>
          <div className="flex gap-3 text-center shrink-0">
            <div><div className="font-black text-volt text-sm">{r.km}</div><div className="text-[8px] text-white/40">ק"מ</div></div>
            <div><div className="font-black text-ember text-sm">{fmtPace(r.sec / Math.max(r.km, .01))}</div><div className="text-[8px] text-white/40">קצב</div></div>
            <div><div className="font-black text-sm">{fmtDur(r.sec)}</div><div className="text-[8px] text-white/40">זמן</div></div>
          </div>
          <div className="flex flex-col gap-1 shrink-0">
            <button onClick={() => startEdit(r)} className="w-8 h-7 rounded-lg text-volt/60 bg-volt/5 flex items-center justify-center active:scale-90 transition">
              <Icon d={I.pencil} className="w-3.5 h-3.5"/>
            </button>
            <button onClick={() => delRun(r)} className="w-8 h-7 rounded-lg text-white/25 flex items-center justify-center active:scale-90 transition">
              <Icon d={I.trash} className="w-3.5 h-3.5"/>
            </button>
          </div>
        </div>
        {hasSplits && isOpen && <SplitsList splits={r.splits}/>}
      </div>
    );
  };

  return (
    <div className="fadein space-y-3">
      <div className="glass rounded-3xl p-4 space-y-2.5">
        <div className="flex items-center justify-between">
          <div className="font-bold flex items-center gap-2">
            <span className={'w-7 h-7 rounded-xl flex items-center justify-center ' + (editing ? 'bg-volt/20 text-volt' : 'bg-ember/20 text-ember')}>
              <Icon d={editing ? I.pencil : I.plus} className="w-4 h-4"/>
            </span>
            {editing ? 'עריכת ריצה' : 'ריצה חדשה'}
            {!editing && <span className="text-[10px] text-white/30 font-normal">אין הגבלה — כמה שבא לך 🔥</span>}
          </div>
          {editing ? (
            <button onClick={cancelEdit} className="text-[10px] font-bold text-white/50 bg-white/5 border border-white/10 rounded-full px-2.5 py-1 active:scale-95 transition">בטל עריכה ✕</button>
          ) : (!stravaConnected && (
            <button onClick={onOpenSettings} className="text-[10px] font-black text-strava bg-strava/10 border border-strava/25 rounded-full px-2.5 py-1 active:scale-95 transition">חבר STRAVA</button>
          ))}
        </div>
        <div><label className="lbl">סגנון ריצה</label><StylePills value={f.type} onPick={pickStyle}/></div>
        <input className="inp" placeholder="שם הריצה (למשל: ריצת בוקר קלה)" value={f.title} onChange={e => setF({ ...f, title: e.target.value })}/>
        <div className="grid grid-cols-3 gap-2">
          <div><label className="lbl">מרחק (ק"מ)</label>
            <input className="inp text-center font-bold" inputMode="decimal" placeholder="5.0" value={f.km} onChange={e => setF({ ...f, km: e.target.value })}/></div>
          <div><label className="lbl">זמן (דק:שנ)</label>
            <input className="inp text-center font-bold" inputMode="numeric" placeholder="30:00" value={f.dur} onChange={e => setF({ ...f, dur: fmtTimeInput(e.target.value) })}/></div>
          <div><label className="lbl">תאריך</label>
            <input type="date" className="inp text-center" value={f.date} onChange={e => setF({ ...f, date: e.target.value })}/></div>
        </div>
        <SplitsEditor splits={f.splits} setSplits={sp => setF(x => Object.assign({}, x, { splits: sp }))}
                      onApplySum={sum => setF(x => Object.assign({}, x, { km: sum.km ? String(sum.km) : x.km, dur: sum.sec ? fmtDur(sum.sec) : x.dur }))}/>
        <div className="flex items-center justify-between bg-black/25 rounded-2xl px-4 py-2.5 border border-white/5">
          <span className="text-xs text-white/40">קצב מחושב</span>
          <span className="font-black text-xl text-volt text-glow">{(eff.km > 0 && eff.sec > 0) ? fmtPace(eff.sec / eff.km) : '—'}<span className="text-[10px] text-white/40 font-normal ms-1">דק' / ק"מ</span></span>
        </div>
        <button onClick={saveRun}
                className="w-full py-3 rounded-2xl bg-volt text-obsidian font-black text-lg active:scale-[.98] transition glow-volt">
          {editing ? 'עדכן ריצה 💾' : 'הוסף ריצה ⚡'}
        </button>
      </div>

      <div className="grid grid-cols-4 gap-2">
        <Stat v={totKm ? totKm.toFixed(1) : '0'} l={'ק"מ השבוע'} accent="text-volt"/>
        <Stat v={weekRuns.length} l="ריצות השבוע"/>
        <Stat v={fmtPace(avgPace)} l="קצב ממוצע" accent="text-ember"/>
        <Stat v={fmtPace(bestPace)} l="שיא קצב"/>
      </div>

      <div className="glass rounded-3xl p-4">
        <div className="flex items-center justify-between mb-1">
          <div className="font-black italic">מגמות ביצועים</div>
          <div className="flex gap-3 text-[10px] font-bold">
            <span className="flex items-center gap-1 text-volt"><span className="w-2.5 h-0.5 bg-volt inline-block rounded-full"></span> מרחק</span>
            <span className="flex items-center gap-1 text-ember"><span className="w-2.5 h-0.5 bg-ember inline-block rounded-full"></span> קצב</span>
          </div>
        </div>
        <RunChart runs={state.runs}/>
      </div>

      <div className="flex items-center justify-between px-1 pt-1">
        <span className="text-white/40 text-xs font-bold">{showAll ? 'כל ההיסטוריה (' + all.length + ')' : 'ריצות השבוע (' + weekRuns.length + ')'}</span>
        <button onClick={() => setShowAll(!showAll)} className="text-volt text-xs font-bold active:scale-95 transition">{showAll ? 'הצג שבוע נוכחי' : 'הצג הכל'}</button>
      </div>
      {(showAll ? all : weekRuns).map(r => <RunRow key={r.id} r={r}/>)}
      {(showAll ? all : weekRuns).length === 0 && (
        <div className="text-center py-6 text-white/25 text-sm">אין ריצות בשבוע הזה</div>
      )}
    </div>
  );
}
